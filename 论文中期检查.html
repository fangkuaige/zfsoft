<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>研究生论文中期检查 · 完整CRUD+预览</title>
    <!-- Inter 字体 + 图标库 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #eef3f8;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .full-screen {
            width: 100%;
            padding: 1.5rem 1.8rem;
            flex: 1;
        }
        @media (max-width: 640px) {
            .full-screen { padding: 1rem 1rem; }
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,20,40,0.08);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e9eef4;
            width: 100%;
        }
        @media (max-width: 640px) {
            .card { padding: 1.5rem 1.2rem; }
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 1.5rem;
        }
        .section-title i { color: #2f6e9e; font-size: 1.4rem; }

        /* 筛选栏 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 160px;
            flex: 1 1 150px;
        }
        .filter-item label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
        }
        .filter-input, .filter-select {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.65rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn {
            border: none;
            background: transparent;
            font-weight: 500;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .btn-primary {
            background: #1e4a6f;
            color: white;
            box-shadow: 0 4px 10px rgba(0,60,110,0.2);
        }
        .btn-primary:hover { background: #123a58; transform: translateY(-2px); }
        .btn-outline {
            background: white;
            border-color: #cbd5e1;
            color: #2c455d;
        }
        .btn-outline:hover { background: #f1f7fd; border-color: #9bb0c5; }
        .btn-sm { padding: 0.45rem 1.2rem; font-size: 0.8rem; }

        /* 表格区域 */
        .table-wrapper {
            border-radius: 20px;
            background: #ffffff;
            border: 1px solid #e2eaf3;
            overflow-x: auto;
            margin-top: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }
        th {
            text-align: left;
            padding: 1.2rem 1rem;
            background: #eaf1f9;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1d4b6e;
            text-transform: uppercase;
        }
        td {
            padding: 1rem 1rem;
            border-bottom: 1px solid #e3eaf2;
            vertical-align: middle;
        }
        .student-name { font-weight: 600; color: #0b2b40; }
        .badge-opinion {
            background: #e3f0fa;
            color: #11517c;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .class-badge {
            background: #e6f0f9;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.75rem;
            display: inline-block;
        }
        .action-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .icon-btn {
            background: none; border: none; font-size: 0.8rem; padding: 0.4rem 1rem;
            border-radius: 40px; cursor: pointer; color: #2a577b; background: #f2f8ff;
            display: inline-flex; align-items: center; gap: 0.4rem; border: 1px solid transparent;
        }
        .icon-btn:hover { background: #dae9f8; }
        .delete-btn:hover { background: #ffeae9; color: #b13e3e; }
        .preview-btn:hover { background: #e0effa; color: #0f4b75; }

        /* 分页 */
        .pagination-bar {
            display: flex; justify-content: flex-end; align-items: center;
            gap: 0.5rem; margin-top: 1.8rem; flex-wrap: wrap;
        }
        .pagination-btn {
            background: white; border: 1px solid #c9d9eb; color: #1d4a6b;
            width: 38px; height: 38px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 500; cursor: pointer; transition: 0.1s;
        }
        .pagination-btn.active { background: #1e4a6f; border-color: #1e4a6f; color: white; }
        .pagination-btn:hover:not(.active) { background: #e5f0fb; }
        .page-info { color: #466585; margin-right: 0.8rem; font-size: 0.9rem; }

        /* 弹窗 (复用风格) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,20,40,0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-card {
            background: white; border-radius: 32px; width: 90%; max-width: 750px;
            padding: 2rem 2.2rem; box-shadow: 0 40px 70px rgba(0,20,50,0.4);
            transform: scale(0.95); transition: transform 0.2s ease;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.show .modal-card { transform: scale(1); }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-header h3 { font-size: 1.6rem; font-weight: 600; color: #0c2b48; }
        .modal-close {
            background: none; border: none; font-size: 2.2rem; cursor: pointer;
            color: #8ba5c2; line-height: 1;
        }
        .modal-close:hover { color: #1e3a5f; }

        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem 1.8rem;
        }
        .full-width { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .input-group label {
            font-weight: 600; font-size: 0.75rem; color: #4e6f8c; text-transform: uppercase;
            display: flex; align-items: center; gap: 4px;
        }
        .input-field {
            background: #f8fafd; border: 1px solid #dde3ea; border-radius: 16px;
            padding: 0.75rem 1.2rem; font-size: 0.95rem; font-family: 'Inter', sans-serif;
        }
        .input-field:focus {
            outline: none; border-color: #2f6e9e;
            box-shadow: 0 0 0 3px rgba(47,110,158,0.15); background: white;
        }
        .readonly-field {
            background: #ecf2f9; color: #2a4e6e; font-weight: 500;
        }
        .modal-actions {
            display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2.2rem;
        }

        /* 预览弹窗专属样式 - 更静态展示 */
        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 1.2rem 1rem;
            background: #f8fbfe;
            border-radius: 24px;
            padding: 1.8rem;
        }
        .preview-label {
            font-weight: 600;
            color: #1d4b6e;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .preview-value {
            background: white;
            border-radius: 20px;
            padding: 0.65rem 1.2rem;
            border: 1px solid #dde3ea;
            font-size: 0.95rem;
            word-break: break-word;
        }
        .preview-comment {
            grid-column: span 2;
            background: white;
            border-radius: 20px;
            padding: 1rem 1.2rem;
            border: 1px solid #dde3ea;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* Toast */
        .toast-message {
            background: #1e4a6f; color: white; padding: 0.8rem 2rem;
            border-radius: 60px; font-weight: 500; box-shadow: 0 15px 30px rgba(0,40,70,0.4);
            position: fixed; bottom: 30px; right: 30px; z-index: 1100;
            opacity: 0; transform: translateY(10px); transition: 0.2s; pointer-events: none;
        }
        .toast-message.show { opacity: 1; transform: translateY(0); }

        .operation-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px dashed #cfdbe9;
            padding-bottom: 1.2rem;
        }
    </style>
</head>
<body>
<div class="full-screen">
    <!-- 卡片：查询 + 增删改导入导出 -->
    <div class="card">
        <div class="filter-bar">
            <div class="filter-item">
                <label><i class="fas fa-user-graduate"></i> 姓名</label>
                <input type="text" class="filter-input" id="filterName" placeholder="姓名">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-id-card"></i> 学号</label>
                <input type="text" class="filter-input" id="filterStudentNo" placeholder="学号">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-users"></i> 班级</label>
                <input type="text" class="filter-input" id="filterClass" placeholder="班级">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-chalkboard-teacher"></i> 导师</label>
                <input type="text" class="filter-input" id="filterSupervisor" placeholder="导师">
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                <button class="btn btn-outline" id="resetFilterBtn"><i class="fas fa-undo"></i> 重置</button>
                <button class="btn btn-primary" id="openAddModalBtn"><i class="fas fa-plus-circle"></i> 新增</button>
            </div>
        </div>

        <!-- 导入导出专用行 -->
        <div class="operation-row">
            <button class="btn btn-outline" id="importExcelBtn"><i class="fas fa-file-import"></i> 导入Excel</button>
            <button class="btn btn-outline" id="exportZipBtn"><i class="fas fa-file-export"></i> 导出ZIP</button>
            <span style="font-size:0.8rem; color:#5f7d9c;"><i class="far fa-question-circle"></i> 导出为ZIP内含Excel</span>
            <input type="file" id="excelFileInput" accept=".xlsx,.xls,.csv" style="display: none;">
        </div>
    </div>

    <!-- 论文中期检查列表卡片 -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-clipboard-check"></i> 论文中期检查记录
        </div>
        <div class="table-wrapper">
            <table id="thesisTable">
                <thead>
                    <tr>
                        <th>姓名</th><th>学号</th><th>班级</th><th>导师</th><th>评审意见</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <!-- 分页 -->
        <div class="pagination-bar" id="paginationContainer"></div>
    </div>
</div>

<!-- 新增/编辑 弹窗 (与之前相同) -->
<div class="modal-overlay" id="thesisModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle"><i class="fas fa-pen"></i> 中期检查</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <form id="thesisForm" onsubmit="return false;">
            <div class="form-grid">
                <div class="input-group">
                    <label><i class="fas fa-user"></i> 姓名 *</label>
                    <input type="text" class="input-field" id="modalName" required placeholder="研究生姓名">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-id-card"></i> 学号 *</label>
                    <input type="text" class="input-field" id="modalStudentNo" required placeholder="2024001">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-users"></i> 班级 *</label>
                    <input type="text" class="input-field" id="modalClass" required placeholder="硕1班">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-chalkboard-teacher"></i> 导师 *</label>
                    <input type="text" class="input-field" id="modalSupervisor" required placeholder="李教授">
                </div>
                <div class="input-group full-width">
                    <label><i class="fas fa-comment-dots"></i> 评审意见</label>
                    <textarea class="input-field" id="modalComment" rows="3" placeholder="详细评审意见……"></textarea>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="modalCancelBtn"><i class="fas fa-times"></i> 取消</button>
                <button type="submit" class="btn btn-primary" id="modalSaveBtn"><i class="fas fa-save"></i> 保存记录</button>
            </div>
        </form>
    </div>
</div>

<!-- 预览专用弹窗 (全新) -->
<div class="modal-overlay" id="previewModal">
    <div class="modal-card" style="max-width: 700px;">
        <div class="modal-header">
            <h3><i class="fas fa-eye"></i> 中期检查详情预览</h3>
            <button class="modal-close" id="closePreviewBtn">&times;</button>
        </div>
        <div class="preview-grid" id="previewContent">
            <!-- 动态填充 -->
        </div>
        <div class="modal-actions" style="margin-top:1.5rem;">
            <button type="button" class="btn btn-outline" id="closePreviewFooterBtn"><i class="fas fa-times"></i> 关闭</button>
        </div>
    </div>
</div>

<div id="toast" class="toast-message">操作成功</div>

<script>
    (function() {
        // ---------- 模拟初始数据 (论文中期检查) ----------
        let allRecords = [
            { id: 't1', name: '欧阳雪', studentNo: 'G202401', className: '硕2101', supervisor: '李建明', comment: '进度正常，文献综述较好，建议完善实验设计' },
            { id: 't2', name: '王博文', studentNo: 'G202402', className: '博2102', supervisor: '王淑慧', comment: '论文框架合理，创新点明确，同意通过' },
            { id: 't3', name: '李思睿', studentNo: 'G202403', className: '硕2103', supervisor: '陈志远', comment: '理论推导需加强，仿真部分进度滞后' },
            { id: 't4', name: '赵一凡', studentNo: 'G202404', className: '硕2101', supervisor: '刘敏', comment: '已收集足够数据，但分析不够深入' },
            { id: 't5', name: '陈果', studentNo: 'G202405', className: '博2102', supervisor: '周明华', comment: '中期报告撰写认真，已发表小论文' },
            { id: 't6', name: '周明', studentNo: 'G202406', className: '硕2104', supervisor: '李建明', comment: '实验设备问题导致进度稍慢，建议调整方案' },
            { id: 't7', name: '郑青', studentNo: 'G202407', className: '硕2103', supervisor: '王淑慧', comment: '综述全面，但研究方向需进一步聚焦' },
            { id: 't8', name: '林溪', studentNo: 'G202408', className: '博2101', supervisor: '陈志远', comment: '已完成三章内容，质量较高' },
            { id: 't9', name: '徐远', studentNo: 'G202409', className: '硕2102', supervisor: '刘敏', comment: '换题后进度紧张，需加紧实验' },
            { id: 't10', name: '沈梦', studentNo: 'G202410', className: '硕2101', supervisor: '周明华', comment: '评审意见：可按期进行正式答辩' }
        ];

        // 分页配置
        const pageSize = 5;
        let currentPage = 1;
        // 筛选条件
        let filters = { name: '', studentNo: '', className: '', supervisor: '' };

        // DOM 元素
        const tbody = document.getElementById('tableBody');
        const toast = document.getElementById('toast');
        const paginationContainer = document.getElementById('paginationContainer');
        const filterName = document.getElementById('filterName');
        const filterStudentNo = document.getElementById('filterStudentNo');
        const filterClass = document.getElementById('filterClass');
        const filterSupervisor = document.getElementById('filterSupervisor');
        const resetFilterBtn = document.getElementById('resetFilterBtn');
        const openAddModalBtn = document.getElementById('openAddModalBtn');

        // 导入导出
        const importBtn = document.getElementById('importExcelBtn');
        const exportBtn = document.getElementById('exportZipBtn');
        const fileInput = document.getElementById('excelFileInput');

        // 弹窗元素 (编辑/新增)
        const modal = document.getElementById('thesisModal');
        const modalTitle = document.getElementById('modalTitle');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalSaveBtn = document.getElementById('modalSaveBtn');
        const modalForm = document.getElementById('thesisForm');
        const modalName = document.getElementById('modalName');
        const modalStudentNo = document.getElementById('modalStudentNo');
        const modalClass = document.getElementById('modalClass');
        const modalSupervisor = document.getElementById('modalSupervisor');
        const modalComment = document.getElementById('modalComment');

        // 预览弹窗
        const previewModal = document.getElementById('previewModal');
        const closePreviewBtn = document.getElementById('closePreviewBtn');
        const closePreviewFooterBtn = document.getElementById('closePreviewFooterBtn');
        const previewContent = document.getElementById('previewContent');

        // 当前编辑ID
        let editingId = null;

        // 辅助函数
        function showToast(text, duration = 2000) {
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }
        function generateId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 8); }
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // 筛选逻辑
        function filterList() {
            return allRecords.filter(item => {
                if (filters.name && !item.name.toLowerCase().includes(filters.name.toLowerCase())) return false;
                if (filters.studentNo && !item.studentNo.includes(filters.studentNo)) return false;
                if (filters.className && !item.className.toLowerCase().includes(filters.className.toLowerCase())) return false;
                if (filters.supervisor && !item.supervisor.toLowerCase().includes(filters.supervisor.toLowerCase())) return false;
                return true;
            });
        }

        function getFiltered() { return filterList(); }

        function getPaginated() {
            const filtered = getFiltered();
            const start = (currentPage - 1) * pageSize;
            return filtered.slice(start, start + pageSize);
        }

        function totalPages() {
            return Math.ceil(getFiltered().length / pageSize);
        }

        function goToPage(page) {
            const total = totalPages();
            if (page < 1) page = 1;
            if (total > 0 && page > total) page = total;
            if (page === currentPage) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }
        window.pageGo = goToPage;

        // 渲染分页
        function renderPagination() {
            const total = totalPages();
            if (total <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }
            let html = `<span class="page-info"><i class="fas fa-layer-group"></i> 第 ${currentPage} / ${total} 页</span>`;
            html += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.pageGo(${currentPage-1})"><i class="fas fa-chevron-left"></i></button>`;
            for (let i = 1; i <= total; i++) {
                if (i === currentPage) html += `<span class="pagination-btn active">${i}</span>`;
                else html += `<button class="pagination-btn" onclick="window.pageGo(${i})">${i}</button>`;
            }
            html += `<button class="pagination-btn" ${currentPage === total ? 'disabled' : ''} onclick="window.pageGo(${currentPage+1})"><i class="fas fa-chevron-right"></i></button>`;
            paginationContainer.innerHTML = html;
        }

        // 删除记录
        function deleteRecord(id) {
            allRecords = allRecords.filter(r => r.id !== id);
            const filtered = getFiltered();
            if (filtered.length === 0 && currentPage > 1) currentPage--;
            showToast('记录已删除');
            renderTable();
            renderPagination();
        }

        // 预览记录 (新增功能)
        function previewRecord(id) {
            const item = allRecords.find(r => r.id === id);
            if (!item) return;
            // 构造预览内容
            const html = `
                <div class="preview-label"><i class="fas fa-user"></i> 姓名</div>
                <div class="preview-value">${escapeHtml(item.name)}</div>
                <div class="preview-label"><i class="fas fa-id-card"></i> 学号</div>
                <div class="preview-value">${escapeHtml(item.studentNo)}</div>
                <div class="preview-label"><i class="fas fa-users"></i> 班级</div>
                <div class="preview-value">${escapeHtml(item.className)}</div>
                <div class="preview-label"><i class="fas fa-chalkboard-teacher"></i> 导师</div>
                <div class="preview-value">${escapeHtml(item.supervisor)}</div>
                <div class="preview-label" style="grid-column: span 2;"><i class="fas fa-comment-dots"></i> 评审意见</div>
                <div class="preview-comment">${escapeHtml(item.comment) || '—'}</div>
            `;
            previewContent.innerHTML = html;
            previewModal.classList.add('show');
        }

        // 关闭预览
        function closePreview() {
            previewModal.classList.remove('show');
        }

        // 打开新增弹窗
        function openAddModal() {
            editingId = null;
            modalTitle.innerHTML = '<i class="fas fa-plus-circle"></i> 新增中期检查';
            modalName.value = '';
            modalStudentNo.value = '';
            modalClass.value = '';
            modalSupervisor.value = '';
            modalComment.value = '';
            modal.classList.add('show');
        }

        // 打开编辑弹窗
        function openEditModal(id) {
            const item = allRecords.find(r => r.id === id);
            if (!item) return;
            editingId = id;
            modalTitle.innerHTML = '<i class="fas fa-edit"></i> 编辑记录';
            modalName.value = item.name || '';
            modalStudentNo.value = item.studentNo || '';
            modalClass.value = item.className || '';
            modalSupervisor.value = item.supervisor || '';
            modalComment.value = item.comment || '';
            modal.classList.add('show');
        }

        function closeModal() {
            modal.classList.remove('show');
            editingId = null;
        }

        // 保存记录
        function saveRecord() {
            const name = modalName.value.trim();
            const studentNo = modalStudentNo.value.trim();
            const className = modalClass.value.trim();
            const supervisor = modalSupervisor.value.trim();
            const comment = modalComment.value.trim();

            if (!name || !studentNo || !className || !supervisor) {
                showToast('请填写必填项（姓名、学号、班级、导师）', 1500);
                return;
            }

            const data = { name, studentNo, className, supervisor, comment };

            if (editingId) {
                const index = allRecords.findIndex(r => r.id === editingId);
                if (index !== -1) { allRecords[index] = { ...allRecords[index], ...data }; }
                showToast('记录已更新');
            } else {
                const newItem = { id: generateId(), ...data };
                allRecords.push(newItem);
                showToast('记录已添加');
                const filtered = getFiltered();
                currentPage = Math.ceil(filtered.length / pageSize);
            }
            closeModal();
            renderTable();
            renderPagination();
        }

        // 渲染表格 (新增预览按钮)
        function renderTable() {
            const paginated = getPaginated();
            let html = '';
            if (paginated.length === 0) {
                html = `<tr><td colspan="6" style="text-align:center; padding:3rem; color:#8899bb;"><i class="fas fa-edit" style="font-size:2rem; opacity:0.5;"></i><br>暂无中期检查记录</td></tr>`;
            } else {
                paginated.forEach(item => {
                    html += `<tr>`;
                    html += `<td class="student-name">${escapeHtml(item.name)}</td>`;
                    html += `<td>${escapeHtml(item.studentNo)}</td>`;
                    html += `<td><span class="class-badge">${escapeHtml(item.className)}</span></td>`;
                    html += `<td>${escapeHtml(item.supervisor)}</td>`;
                    html += `<td><span class="badge-opinion" title="${escapeHtml(item.comment)}">${escapeHtml(item.comment) || '—'}</span></td>`;
                    html += `<td><div class="action-btns">`;
                    // 预览按钮 (新增)
                    html += `<button class="icon-btn preview-btn" onclick="window.previewHandler('${item.id}')"><i class="fas fa-eye"></i> 预览</button>`;
                    html += `<button class="icon-btn" onclick="window.editHandler('${item.id}')"><i class="fas fa-pen"></i> 编辑</button>`;
                    html += `<button class="icon-btn delete-btn" onclick="window.deleteHandler('${item.id}')"><i class="fas fa-trash"></i> 删除</button>`;
                    html += `</div></td></tr>`;
                });
            }
            tbody.innerHTML = html;
        }

        // 收集筛选并应用
        function applyFilters() {
            filters.name = filterName.value;
            filters.studentNo = filterStudentNo.value;
            filters.className = filterClass.value;
            filters.supervisor = filterSupervisor.value;
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        function resetFilters() {
            filterName.value = '';
            filterStudentNo.value = '';
            filterClass.value = '';
            filterSupervisor.value = '';
            filters = { name: '', studentNo: '', className: '', supervisor: '' };
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        // 模拟导入Excel
        function simulateImport() {
            const mockImported = [
                { id: generateId(), name: '导入张三', studentNo: 'I2024001', className: '硕2105', supervisor: '导入导师1', comment: '导入评审意见1' },
                { id: generateId(), name: '导入李四', studentNo: 'I2024002', className: '博2103', supervisor: '导入导师2', comment: '导入评审意见2' }
            ];
            allRecords = [...allRecords, ...mockImported];
            showToast('已模拟导入2条记录');
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        // 模拟导出ZIP
        function simulateExportZip() {
            const headers = ['姓名','学号','班级','导师','评审意见'];
            const dataRows = allRecords.map(r => [r.name, r.studentNo, r.className, r.supervisor, r.comment]);
            let csvContent = headers.join(',') + '\n';
            dataRows.forEach(row => {
                csvContent += row.map(cell => `"${cell.replace(/"/g,'""')}"`).join(',') + '\n';
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `论文中期检查_${new Date().toISOString().slice(0,10)}.xlsx`;
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('已导出ZIP(演示为直接下载Excel)');
        }

        // 挂载全局方法
        window.deleteHandler = deleteRecord;
        window.editHandler = openEditModal;
        window.previewHandler = previewRecord;  // 预览

        // 事件监听
        filterName.addEventListener('input', applyFilters);
        filterStudentNo.addEventListener('input', applyFilters);
        filterClass.addEventListener('input', applyFilters);
        filterSupervisor.addEventListener('input', applyFilters);
        resetFilterBtn.addEventListener('click', resetFilters);
        openAddModalBtn.addEventListener('click', openAddModal);

        closeModalBtn.addEventListener('click', closeModal);
        modalCancelBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        modalForm.addEventListener('submit', (e) => { e.preventDefault(); saveRecord(); });

        // 预览弹窗关闭
        closePreviewBtn.addEventListener('click', closePreview);
        closePreviewFooterBtn.addEventListener('click', closePreview);
        previewModal.addEventListener('click', (e) => { if (e.target === previewModal) closePreview(); });

        // 导入导出
        importBtn.addEventListener('click', simulateImport);
        exportBtn.addEventListener('click', simulateExportZip);

        // 初始化
        renderTable();
        renderPagination();
    })();
</script>
</body>
</html>
