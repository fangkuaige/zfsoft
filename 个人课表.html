<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>管理员课表 · 按学生筛选 + 分页</title>
    <!-- Inter 字体 + 图标库 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 完全沿用参考风格，适配管理员课表场景 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #eef3f8;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .full-screen {
            width: 100%;
            padding: 1.5rem 1.8rem;
            flex: 1;
        }
        @media (max-width: 640px) {
            .full-screen { padding: 1rem 1rem; }
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,20,40,0.08);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e9eef4;
            width: 100%;
        }
        @media (max-width: 640px) {
            .card { padding: 1.5rem 1.2rem; }
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 1.5rem;
        }
        .section-title i { color: #2f6e9e; font-size: 1.4rem; }

        /* 筛选栏：学生姓名 + 学号 + 重置按钮 (去除仅查看按钮) */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 170px;
            flex: 1 1 160px;
        }
        .filter-item label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
        }
        .filter-input, .filter-select {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.65rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn {
            border: none;
            background: transparent;
            font-weight: 500;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .btn-primary {
            background: #1e4a6f;
            color: white;
            box-shadow: 0 4px 10px rgba(0,60,110,0.2);
        }
        .btn-primary:hover { background: #123a58; transform: translateY(-2px); }
        .btn-outline {
            background: white;
            border-color: #cbd5e1;
            color: #2c455d;
        }
        .btn-outline:hover { background: #f1f7fd; border-color: #9bb0c5; }

        /* 学生列表下拉卡片 (或用作选中学生后展示) */
        .student-picker {
            display: flex;
            align-items: center;
            gap: 2rem;
            background: #f3f9ff;
            border-radius: 40px;
            padding: 0.6rem 1.8rem;
            margin-bottom: 1.5rem;
            border: 1px solid #cbddec;
            flex-wrap: wrap;
        }
        .picker-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .student-select {
            min-width: 260px;
            background: white;
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            border: 1px solid #b9cfec;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
        }

        /* 表格 */
        .table-wrapper {
            border-radius: 20px;
            background: #ffffff;
            border: 1px solid #e2eaf3;
            overflow-x: auto;
            margin-top: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }
        th {
            text-align: left;
            padding: 1.2rem 1rem;
            background: #eaf1f9;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1d4b6e;
            text-transform: uppercase;
        }
        td {
            padding: 1rem 1rem;
            border-bottom: 1px solid #e3eaf2;
            vertical-align: middle;
        }
        .student-name { font-weight: 600; color: #0b2b40; }
        .badge-term {
            background: #e3f0fa;
            color: #11517c;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
            white-space: nowrap;
        }
        .time-slot {
            background: #e6f0f9;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.8rem;
            display: inline-block;
        }

        /* 分页 */
        .pagination-bar {
            display: flex; justify-content: flex-end; align-items: center;
            gap: 0.5rem; margin-top: 1.8rem; flex-wrap: wrap;
        }
        .pagination-btn {
            background: white; border: 1px solid #c9d9eb; color: #1d4a6b;
            width: 38px; height: 38px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 500; cursor: pointer; transition: 0.1s;
        }
        .pagination-btn.active { background: #1e4a6f; border-color: #1e4a6f; color: white; }
        .pagination-btn:hover:not(.active) { background: #e5f0fb; }
        .page-info { color: #466585; margin-right: 0.8rem; font-size: 0.9rem; }
        .pagination-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* 提示toast */
        .toast-message {
            background: #1e4a6f; color: white; padding: 0.8rem 2rem;
            border-radius: 60px; font-weight: 500; box-shadow: 0 15px 30px rgba(0,40,70,0.4);
            position: fixed; bottom: 30px; right: 30px; z-index: 1100;
            opacity: 0; transform: translateY(10px); transition: 0.2s; pointer-events: none;
        }
        .toast-message.show { opacity: 1; transform: translateY(0); }

        /* 管理员标记 */
        .admin-badge {
            background: #1e3a5f; color: white; border-radius: 40px;
            padding: 0.2rem 1.2rem; font-size: 0.7rem; font-weight: 600;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
<div class="full-screen">
    <!-- 管理员身份卡片 + 学生选择器 (核心) -->
    <div class="card" style="padding: 1.2rem 2rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <div class="admin-badge"><i class="fas fa-user-cog"></i> 管理员 · 课表查询</div>
                <div><i class="fas fa-id-card" style="color:#2f6e9e;"></i> 工号: AD2026</div>
            </div>
            <div class="student-picker" style="margin-bottom:0; padding:0; background:transparent; border:none;">
                <div class="picker-item">
                    <i class="fas fa-user-graduate" style="color:#1e4a6f;"></i>
                    <span style="font-weight:500;">选择学生:</span>
                    <select id="studentSelect" class="student-select">
                        <option value="">—— 请选择学生 ——</option>
                    </select>
                </div>
                <div class="picker-item">
                    <span style="color:#4e6f8c;" id="selectedStudentHint">未选中任何学生</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 课表筛选卡片 (按学期、课程名称、课号) 去除仅查看按钮，保留重置 -->
    <div class="card">
        <div class="filter-bar">
            <div class="filter-item">
                <label><i class="fas fa-layer-group"></i> 学期</label>
                <select class="filter-select" id="filterSemester">
                    <option value="">全部学期</option>
                    <option value="2025-2026 春">2025-2026 春</option>
                    <option value="2025-2026 秋">2025-2026 秋</option>
                    <option value="2024-2025 春">2024-2025 春</option>
                    <option value="2024-2025 秋">2024-2025 秋</option>
                </select>
            </div>
            <div class="filter-item">
                <label><i class="fas fa-book"></i> 课程名称</label>
                <input type="text" class="filter-input" id="filterCourseName" placeholder="例如：高等数值分析">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-hashtag"></i> 课号</label>
                <input type="text" class="filter-input" id="filterCourseCode" placeholder="课号">
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                <button class="btn btn-outline" id="resetFilterBtn"><i class="fas fa-undo"></i> 重置</button>
                <!-- 仅查看按钮已移除 -->
            </div>
        </div>
    </div>

    <!-- 课表列表卡片 -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-table"></i> 学生课程表
            <span style="margin-left: auto; font-size:0.8rem; font-weight: normal;" id="courseCount"></span>
        </div>
        <div class="table-wrapper">
            <table id="scheduleTable">
                <thead>
                    <tr>
                        <th>姓名</th><th>上课班级</th><th>课程名称</th><th>课号</th><th>开始时间</th><th>结束时间</th><th>学期</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <!-- 分页 (完善功能) -->
        <div class="pagination-bar" id="paginationContainer"></div>
    </div>
</div>

<!-- 轻提示 -->
<div id="toast" class="toast-message">操作成功</div>

<script>
    (function(){
        // ---------- 模拟多个学生的课表数据 (研究生) ----------
        // 每个学生对象包含姓名、学号、以及个人课表数组
        const studentsDB = [
            { 
                studentName: '欧阳雪', studentId: 'G202401',
                courses: [
                    { className: '硕计001班', courseName: '高级机器学习', courseCode: 'CS7701', startTime: '08:20', endTime: '09:55', semester: '2025-2026 春' },
                    { className: '硕应002班', courseName: '应用随机过程', courseCode: 'STAT5203', startTime: '10:10', endTime: '11:45', semester: '2025-2026 春' },
                    { className: '硕数003班', courseName: '高等数值分析', courseCode: 'MATH6012', startTime: '14:00', endTime: '15:35', semester: '2025-2026 春' },
                    { className: '硕物005班', courseName: '量子力学', courseCode: 'PHY4012', startTime: '15:50', endTime: '17:25', semester: '2024-2025 秋' },
                ]
            },
            { 
                studentName: '王博文', studentId: 'G202402',
                courses: [
                    { className: '硕计003班', courseName: '自然语言处理', courseCode: 'CS5509', startTime: '08:20', endTime: '09:55', semester: '2025-2026 秋' },
                    { className: '硕计005班', courseName: '深度学习', courseCode: 'CS6601', startTime: '10:10', endTime: '11:45', semester: '2025-2026 春' },
                    { className: '硕应008班', courseName: '最优化方法', courseCode: 'MATH6302', startTime: '14:00', endTime: '15:35', semester: '2025-2026 春' },
                ]
            },
            { 
                studentName: '李思睿', studentId: 'G202403',
                courses: [
                    { className: '硕数001班', courseName: '偏微分方程', courseCode: 'MATH6405', startTime: '08:20', endTime: '09:55', semester: '2025-2026 春' },
                    { className: '硕计011班', courseName: '计算机视觉', courseCode: 'CS6612', startTime: '10:10', endTime: '11:45', semester: '2025-2026 春' },
                    { className: '硕物012班', courseName: '固体物理', courseCode: 'PHY5021', startTime: '14:00', endTime: '15:35', semester: '2024-2025 春' },
                    { className: '硕应015班', courseName: '微分几何', courseCode: 'MATH6803', startTime: '15:50', endTime: '17:25', semester: '2024-2025 秋' },
                    { className: '硕数020班', courseName: '算法设计', courseCode: 'CS5401', startTime: '18:30', endTime: '20:05', semester: '2025-2026 春' },
                ]
            },
            { 
                studentName: '赵一凡', studentId: 'G202404',
                courses: [
                    { className: '硕计021班', courseName: '数据可视化', courseCode: 'CS6702', startTime: '08:20', endTime: '09:55', semester: '2025-2026 春' },
                    { className: '硕应022班', courseName: '实验设计', courseCode: 'STAT5104', startTime: '10:10', endTime: '11:45', semester: '2025-2026 春' },
                ]
            },
            { 
                studentName: '陈果', studentId: 'G202405',
                courses: [
                    { className: '硕数025班', courseName: '数值分析', courseCode: 'MATH6015', startTime: '14:00', endTime: '15:35', semester: '2025-2026 春' },
                    { className: '硕计028班', courseName: '机器学习理论', courseCode: 'CS5401', startTime: '15:50', endTime: '17:25', semester: '2025-2026 秋' },
                    { className: '硕物030班', courseName: '量子场论', courseCode: 'PHY6010', startTime: '08:20', endTime: '09:55', semester: '2024-2025 春' },
                ]
            }
        ];

        // 当前选中的学生 (存储完整对象，默认为null)
        let currentStudent = null;

        // 筛选条件 + 分页
        const pageSize = 5;
        let currentPage = 1;
        let filters = { semester: '', courseName: '', courseCode: '' };

        // DOM 元素
        const tbody = document.getElementById('tableBody');
        const paginationContainer = document.getElementById('paginationContainer');
        const filterSemester = document.getElementById('filterSemester');
        const filterCourseName = document.getElementById('filterCourseName');
        const filterCourseCode = document.getElementById('filterCourseCode');
        const resetFilterBtn = document.getElementById('resetFilterBtn');
        const studentSelect = document.getElementById('studentSelect');
        const selectedStudentHint = document.getElementById('selectedStudentHint');
        const courseCountSpan = document.getElementById('courseCount');
        const toast = document.getElementById('toast');

        // 辅助函数
        function showToast(text, duration = 1500) {
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // 填充学生下拉框
        function populateStudentSelect() {
            let options = '<option value="">—— 请选择学生 ——</option>';
            studentsDB.forEach(s => {
                options += `<option value="${s.studentId}">${escapeHtml(s.studentName)} (${s.studentId})</option>`;
            });
            studentSelect.innerHTML = options;
        }

        // 根据学号查找学生对象
        function findStudentById(id) {
            return studentsDB.find(s => s.studentId === id) || null;
        }

        // 获取当前展示的课程列表 (基于选中的学生)
        function getCurrentCourses() {
            if (!currentStudent) return [];
            return currentStudent.courses || [];
        }

        // 筛选课程 (基于filters)
        function filterCourses(courses) {
            if (!courses) return [];
            return courses.filter(c => {
                if (filters.semester && c.semester !== filters.semester) return false;
                if (filters.courseName && !c.courseName.toLowerCase().includes(filters.courseName.toLowerCase())) return false;
                if (filters.courseCode && !c.courseCode.toLowerCase().includes(filters.courseCode.toLowerCase())) return false;
                return true;
            });
        }

        // 获取筛选后的列表
        function getFilteredCourses() {
            const courses = getCurrentCourses();
            return filterCourses(courses);
        }

        // 分页相关
        function getPaginated() {
            const filtered = getFilteredCourses();
            const start = (currentPage - 1) * pageSize;
            return filtered.slice(start, start + pageSize);
        }

        function totalPages() {
            const totalItems = getFilteredCourses().length;
            return Math.ceil(totalItems / pageSize);
        }

        function goToPage(page) {
            const total = totalPages();
            if (page < 1) page = 1;
            if (total > 0 && page > total) page = total;
            if (page === currentPage) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }
        window.pageGo = goToPage;

        // 渲染表格
        function renderTable() {
            if (!currentStudent) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:3rem; color:#8899bb;"><i class="fas fa-user-slash" style="font-size:2rem; opacity:0.5;"></i><br>请先从上方选择一名学生</td></tr>`;
                courseCountSpan.innerText = '';
                return;
            }

            const paginated = getPaginated();
            const filteredTotal = getFilteredCourses().length;
            courseCountSpan.innerText = `共 ${filteredTotal} 门课`;

            if (paginated.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:3rem; color:#8899bb;"><i class="fas fa-calendar-times" style="font-size:2rem; opacity:0.5;"></i><br>该学生暂无课程或筛选无结果</td></tr>`;
            } else {
                let html = '';
                paginated.forEach(c => {
                    html += `<tr>`;
                    html += `<td class="student-name">${escapeHtml(currentStudent.studentName)}</td>`;
                    html += `<td>${escapeHtml(c.className)}</td>`;
                    html += `<td>${escapeHtml(c.courseName)}</td>`;
                    html += `<td><span class="badge-term" style="background:#e0ebf5;">${escapeHtml(c.courseCode)}</span></td>`;
                    html += `<td><span class="time-slot"><i class="far fa-clock"></i> ${escapeHtml(c.startTime)}</span></td>`;
                    html += `<td><span class="time-slot"><i class="far fa-clock"></i> ${escapeHtml(c.endTime)}</span></td>`;
                    html += `<td><span class="badge-term">${escapeHtml(c.semester)}</span></td>`;
                    html += `</tr>`;
                });
                tbody.innerHTML = html;
            }
        }

        // 渲染分页 (完善)
        function renderPagination() {
            if (!currentStudent) {
                paginationContainer.innerHTML = '';
                return;
            }

            const total = totalPages();
            if (total <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let html = `<span class="page-info"><i class="fas fa-layer-group"></i> 第 ${currentPage} / ${total} 页</span>`;
            html += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.pageGo(${currentPage-1})"><i class="fas fa-chevron-left"></i></button>`;

            for (let i = 1; i <= total; i++) {
                if (i === currentPage) {
                    html += `<span class="pagination-btn active">${i}</span>`;
                } else {
                    html += `<button class="pagination-btn" onclick="window.pageGo(${i})">${i}</button>`;
                }
            }

            html += `<button class="pagination-btn" ${currentPage === total ? 'disabled' : ''} onclick="window.pageGo(${currentPage+1})"><i class="fas fa-chevron-right"></i></button>`;
            paginationContainer.innerHTML = html;
        }

        // 重置筛选条件
        function resetFilters() {
            filterSemester.value = '';
            filterCourseName.value = '';
            filterCourseCode.value = '';
            filters = { semester: '', courseName: '', courseCode: '' };
            if (currentStudent) {
                currentPage = 1;
                renderTable();
                renderPagination();
                showToast('筛选已重置');
            } else {
                renderTable();  // 显示提示选择学生
            }
        }

        // 应用筛选 (来自输入)
        function applyFilters() {
            filters.semester = filterSemester.value;
            filters.courseName = filterCourseName.value;
            filters.courseCode = filterCourseCode.value;
            if (currentStudent) {
                currentPage = 1;   // 筛选后回到第一页
                renderTable();
                renderPagination();
            } else {
                // 如果没有选中学生，仍然刷新表格，但会显示提示
                renderTable();
            }
        }

        // 学生切换处理
        function onStudentChange() {
            const selectedId = studentSelect.value;
            if (!selectedId) {
                currentStudent = null;
                selectedStudentHint.innerText = '未选中任何学生';
                currentPage = 1;
                renderTable();
                renderPagination();
                return;
            }

            const student = findStudentById(selectedId);
            if (student) {
                currentStudent = student;
                selectedStudentHint.innerText = `已显示 ${student.studentName} 的课表`;
                // 重置筛选条件和页码
                filterSemester.value = '';
                filterCourseName.value = '';
                filterCourseCode.value = '';
                filters = { semester: '', courseName: '', courseCode: '' };
                currentPage = 1;
                renderTable();
                renderPagination();
                showToast(`已加载 ${student.studentName} 的课程`, 1200);
            } else {
                currentStudent = null;
                selectedStudentHint.innerText = '未选中任何学生';
                renderTable();
                renderPagination();
            }
        }

        // 初始化事件
        filterSemester.addEventListener('change', applyFilters);
        filterCourseName.addEventListener('input', applyFilters);
        filterCourseCode.addEventListener('input', applyFilters);
        resetFilterBtn.addEventListener('click', resetFilters);
        studentSelect.addEventListener('change', onStudentChange);

        // 初始化下拉框
        populateStudentSelect();
        // 初始无学生，渲染空状态
        renderTable();
        renderPagination();
    })();
</script>
</body>
</html>
