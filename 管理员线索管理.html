<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>线索管理 · 真实功能还原版</title>
    <!-- Inter 字体 + Font Awesome 6 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ========== 完全沿用“学生分数变动记录”的风格 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #eef3f8;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .full-screen {
            width: 100%;
            padding: 1.5rem 1.8rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 640px) {
            .full-screen { padding: 1rem 1rem; }
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,20,40,0.08);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e9eef4;
            width: 100%;
        }
        @media (max-width: 640px) {
            .card { padding: 1.5rem 1.2rem; }
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 1.5rem;
        }
        .section-title i { color: #2f6e9e; font-size: 1.4rem; }

        /* 筛选栏 — 沿用filter-bar风格 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
            margin-bottom: 0;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 170px;
            flex: 1 1 160px;
        }
        .filter-item label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .filter-input, .filter-select {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.65rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn {
            border: none;
            background: transparent;
            font-weight: 500;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .btn-primary {
            background: #1e4a6f;
            color: white;
            box-shadow: 0 4px 10px rgba(0,60,110,0.2);
        }
        .btn-primary:hover { background: #123a58; transform: translateY(-2px); }
        .btn-outline {
            background: white;
            border-color: #cbd5e1;
            color: #2c455d;
        }
        .btn-outline:hover { background: #f1f7fd; border-color: #9bb0c5; }
        .btn-sm { padding: 0.45rem 1.2rem; font-size: 0.8rem; }

        /* 操作栏 */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 1.5rem 0;
            gap: 16px;
        }
        .left-actions, .right-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .batch-group {
            background: #f0f5fc;
            padding: 0.2rem 1rem;
            border-radius: 48px;
            display: flex;
            gap: 8px;
            align-items: center;
            border: 1px solid #dde3ea;
        }
        .batch-group span {
            font-size: 0.8rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-right: 0.2rem;
        }

        /* 表格区域 (内部滚动) */
        .table-wrapper {
            border-radius: 20px;
            background: #ffffff;
            border: 1px solid #e2eaf3;
            overflow-x: auto;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
            margin-top: 0.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1300px;
        }
        th {
            text-align: left;
            padding: 1.2rem 1rem;
            background: #eaf1f9;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1d4b6e;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 2;
            background-color: #eaf1f9;
        }
        td {
            padding: 1rem 1rem;
            border-bottom: 1px solid #e3eaf2;
            vertical-align: middle;
        }
        .checkbox-col { width: 30px; text-align: center; }
        .status-badge {
            background: #e3f0fa;
            color: #11517c;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .status-closed { background: #ecf1f5; color: #5e6f88; }
        .status-converted { background: #dff0df; color: #1f7030; }

        .owner-tag {
            background: #e6edf6;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
        }
        .action-cell {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .icon-btn {
            background: none; border: none; font-size: 0.8rem; padding: 0.4rem 1rem;
            border-radius: 40px; cursor: pointer; color: #2a577b; background: #f2f8ff;
            display: inline-flex; align-items: center; gap: 0.4rem; border: 1px solid transparent;
        }
        .icon-btn:hover { background: #dae9f8; }

        /* 分页栏 */
        .pagination-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 1.5rem;
            margin-top: 1.8rem;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .page-size-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .page-size-selector select {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 30px;
            padding: 0.45rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }
        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .pagination-btn {
            background: white; border: 1px solid #c9d9eb; color: #1d4a6b;
            width: 38px; height: 38px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 500; cursor: pointer; transition: 0.1s;
        }
        .pagination-btn:disabled {
            opacity: 0.4; cursor: not-allowed; pointer-events: none;
        }
        .pagination-btn:hover:not(:disabled) { background: #e5f0fb; }
        .page-info {
            color: #466585; margin-right: 0.8rem; font-size: 0.9rem;
        }

        /* ========== 弹窗样式 (分数变动记录风格) ========== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,20,40,0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-card {
            background: white; border-radius: 32px; width: 90%; max-width: 750px;
            padding: 2rem 2.2rem; box-shadow: 0 40px 70px rgba(0,20,50,0.4);
            transform: scale(0.95); transition: transform 0.2s ease;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.show .modal-card { transform: scale(1); }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-header h3 { font-size: 1.6rem; font-weight: 600; color: #0c2b48; display: flex; align-items: center; gap: 0.5rem; }
        .modal-close {
            background: none; border: none; font-size: 2.2rem; cursor: pointer;
            color: #8ba5c2; line-height: 1;
        }
        .modal-close:hover { color: #1e3a5f; }

        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem 1.8rem;
        }
        .full-width { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .input-group label {
            font-weight: 600; font-size: 0.75rem; color: #4e6f8c; text-transform: uppercase;
            display: flex; align-items: center; gap: 4px;
        }
        .input-field {
            background: #f8fafd; border: 1px solid #dde3ea; border-radius: 16px;
            padding: 0.75rem 1.2rem; font-size: 0.95rem; font-family: 'Inter', sans-serif;
        }
        .input-field:focus {
            outline: none; border-color: #2f6e9e;
            box-shadow: 0 0 0 3px rgba(47,110,158,0.15); background: white;
        }
        .modal-actions {
            display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2.2rem;
        }
        .modal-card.wide { max-width: 800px; }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .small-note { font-size: 0.8rem; color: #7890aa; }

        /* Toast */
        .toast-message {
            background: #1e4a6f; color: white; padding: 0.8rem 2rem;
            border-radius: 60px; font-weight: 500; box-shadow: 0 15px 30px rgba(0,40,70,0.4);
            position: fixed; bottom: 30px; right: 30px; z-index: 1100;
            opacity: 0; transform: translateY(10px); transition: 0.2s; pointer-events: none;
        }
        .toast-message.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
<div class="full-screen">
    <!-- 查询卡片 -->
    <div class="card">
        <div class="filter-bar">
            <div class="filter-item">
                <label><i class="fas fa-tag"></i> 线索名称</label>
                <input type="text" class="filter-input" id="filterName" placeholder="输入">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-flag"></i> 状态</label>
                <select class="filter-select" id="filterStatus">
                    <option value="all">全部</option><option value="新线索">新线索</option><option value="联系中">联系中</option><option value="已转化">已转化</option><option value="已关闭">已关闭</option>
                </select>
            </div>
            <div class="filter-item">
                <label><i class="fas fa-database"></i> 来源</label>
                <select class="filter-select" id="filterSource">
                    <option value="all">全部</option><option value="官网">官网</option><option value="广告">广告</option><option value="朋友介绍">朋友介绍</option><option value="展会">展会</option>
                </select>
            </div>
            <div class="filter-item">
                <label><i class="fas fa-calendar"></i> 创建起始</label>
                <input type="date" class="filter-input" id="filterDateStart">
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                <button class="btn btn-outline" id="resetFilterBtn"><i class="fas fa-undo"></i> 重置</button>
                <button class="btn btn-primary" id="searchBtn"><i class="fas fa-search"></i> 查询</button>
                <button class="btn btn-outline" id="exportBtn"><i class="fas fa-download"></i> 导出</button>
                <button class="btn btn-outline" id="customFilterBtn"><i class="fas fa-sliders-h"></i> 自定义</button>
            </div>
        </div>
    </div>

    <!-- 操作栏 -->
    <div class="action-bar">
        <div class="left-actions">
            <button class="btn btn-primary" id="singleAddBtn"><i class="fas fa-plus"></i> 单个录入</button>
            <button class="btn btn-outline" id="batchImportBtn"><i class="fas fa-upload"></i> 批量导入</button>
            <div class="batch-group">
                <span><i class="fas fa-check-double"></i> 批量:</span>
                <button class="btn btn-sm" id="batchMailBtn"><i class="fas fa-envelope"></i> 邮件</button>
                <button class="btn btn-sm" id="batchAssignBtn"><i class="fas fa-user-plus"></i> 分配</button>
                <button class="btn btn-sm" id="batchCloseBtn"><i class="fas fa-ban"></i> 关闭</button>
                <button class="btn btn-sm" id="batchQuickBtn"><i class="fas fa-bolt"></i> 快速处理</button>
            </div>
        </div>
        <div class="right-actions">
            <button class="btn btn-outline" id="autoAssignBtn"><i class="fas fa-robot"></i> 自动分配(未分配)</button>
            <button class="btn btn-outline" id="quickGlobalBtn"><i class="fas fa-gavel"></i> 快速处理(全局)</button>
        </div>
    </div>

    <!-- 表格区域 -->
    <div class="table-wrapper" id="tableWrapper">
        <table id="leadTable">
            <thead>
                <tr>
                    <th class="checkbox-col"><input type="checkbox" id="selectAll"></th>
                    <th>ID</th><th>线索名称</th><th>联系人</th><th>电话</th><th>状态</th><th>来源</th><th>所有者</th><th>创建时间</th><th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- 分页栏 -->
    <div class="pagination-bar">
        <div class="page-size-selector">
            <span style="color:#466585; font-size:0.9rem;"><i class="fas fa-list"></i> 每页</span>
            <select id="pageSizeSelect">
                <option value="5">5条</option><option value="10" selected>10条</option><option value="20">20条</option><option value="50">50条</option>
            </select>
        </div>
        <div class="pagination-controls">
            <button class="pagination-btn" id="firstPageBtn" title="首页"><i class="fas fa-angle-double-left"></i></button>
            <button class="pagination-btn" id="prevPageBtn" title="上一页"><i class="fas fa-chevron-left"></i></button>
            <span class="page-info" id="pageInfo">第 1 / 1 页 (0 条)</span>
            <button class="pagination-btn" id="nextPageBtn" title="下一页"><i class="fas fa-chevron-right"></i></button>
            <button class="pagination-btn" id="lastPageBtn" title="末页"><i class="fas fa-angle-double-right"></i></button>
        </div>
    </div>
</div>

<!-- ========== 所有功能对应的弹窗 (完全还原真实操作) ========== -->
<!-- 线索编辑/新增模态框 -->
<div class="modal-overlay" id="modalLead">
    <div class="modal-card">
        <div class="modal-header"><h3 id="modalLeadTitle"><i class="fas fa-pen"></i> 新建线索</h3><button class="modal-close" id="closeLeadModal">&times;</button></div>
        <form id="leadForm" onsubmit="return false;">
            <input type="hidden" id="leadEditId">
            <div class="form-grid">
                <div class="input-group full-width"><label>线索名称 *</label><input type="text" class="input-field" id="leadName" required></div>
                <div class="input-group"><label>联系人</label><input type="text" class="input-field" id="leadContact"></div>
                <div class="input-group"><label>电话</label><input type="text" class="input-field" id="leadPhone"></div>
                <div class="input-group"><label>状态</label><select class="input-field" id="leadStatus"><option value="新线索">新线索</option><option value="联系中">联系中</option><option value="已转化">已转化</option><option value="已关闭">已关闭</option></select></div>
                <div class="input-group"><label>来源</label><select class="input-field" id="leadSource"><option value="官网">官网</option><option value="广告">广告</option><option value="朋友介绍">朋友介绍</option><option value="展会">展会</option></select></div>
                <div class="input-group full-width"><label>所有者</label><input type="text" class="input-field" id="leadOwner" placeholder="可选"></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" id="cancelLead"><i class="fas fa-times"></i> 取消</button>
                <button class="btn btn-primary" id="saveLead"><i class="fas fa-save"></i> 保存</button>
            </div>
        </form>
    </div>
</div>

<!-- 拜访记录模态框 -->
<div class="modal-overlay" id="modalVisit">
    <div class="modal-card">
        <div class="modal-header"><h3><i class="fas fa-phone-alt"></i> 记录拜访</h3><button class="modal-close" id="closeVisitModal">&times;</button></div>
        <input type="hidden" id="visitLeadId">
        <p id="visitLeadName" style="font-weight:500; margin-bottom:10px;"></p>
        <div class="input-group"><label>拜访记录</label><textarea id="visitNote" rows="3" class="input-field" placeholder="输入拜访记录..."></textarea></div>
        <div class="input-group"><label>日期</label><input type="date" id="visitDate" class="input-field"></div>
        <div class="modal-actions"><button class="btn btn-outline" id="cancelVisit">取消</button><button class="btn btn-primary" id="saveVisit">保存记录</button></div>
    </div>
</div>

<!-- 分配所有者模态框 -->
<div class="modal-overlay" id="modalAssign">
    <div class="modal-card">
        <div class="modal-header"><h3 id="assignTitle"><i class="fas fa-user-tag"></i> 分配所有者</h3><button class="modal-close" id="closeAssignModal">&times;</button></div>
        <p id="assignHint"></p>
        <div class="input-group"><label>选择所有者</label><select id="assignOwnerSelect" class="input-field"><option value="张明">张明</option><option value="李华">李华</option><option value="王欣">王欣</option><option value="陈涛">陈涛</option><option value="赵琳">赵琳</option></select></div>
        <div class="modal-actions"><button class="btn btn-outline" id="cancelAssign">取消</button><button class="btn btn-primary" id="saveAssign">分配</button></div>
    </div>
</div>

<!-- 快速处理模态框 -->
<div class="modal-overlay" id="modalQuick">
    <div class="modal-card">
        <div class="modal-header"><h3><i class="fas fa-bolt"></i> 快速处理线索</h3><button class="modal-close" id="closeQuickModal">&times;</button></div>
        <p id="quickHint"></p>
        <div class="input-group"><label>更新状态</label><select id="quickStatusSelect" class="input-field"><option value="联系中">联系中</option><option value="已转化">已转化</option><option value="已关闭">已关闭</option></select></div>
        <div class="input-group"><label>备注(可选)</label><textarea id="quickNote" rows="2" class="input-field" placeholder="处理备注"></textarea></div>
        <div class="modal-actions"><button class="btn btn-outline" id="cancelQuick">取消</button><button class="btn btn-primary" id="saveQuick">确认处理</button></div>
    </div>
</div>

<!-- 批量邮件模态框 -->
<div class="modal-overlay" id="modalMail">
    <div class="modal-card wide">
        <div class="modal-header"><h3><i class="fas fa-envelope"></i> 批量发送邮件</h3><button class="modal-close" id="closeMailModal">&times;</button></div>
        <p id="mailHint"></p>
        <div class="input-group"><label>主题</label><input type="text" id="mailSubject" class="input-field"></div>
        <div class="input-group"><label>内容</label><textarea id="mailContent" rows="4" class="input-field"></textarea></div>
        <div class="modal-actions"><button class="btn btn-outline" id="cancelMail">取消</button><button class="btn btn-primary" id="sendMail">发送</button></div>
    </div>
</div>

<!-- 批量导入模态框 -->
<div class="modal-overlay" id="modalImport">
    <div class="modal-card wide">
        <div class="modal-header"><h3><i class="fas fa-file-import"></i> 批量导入线索</h3><button class="modal-close" id="closeImportModal">&times;</button></div>
        <p style="margin-bottom:12px;">粘贴CSV格式 (名称,联系人,电话,状态,来源,所有者) 或上传文件</p>
        <textarea id="importData" rows="5" class="input-field" placeholder="示例：&#10;云创科技,李浩,13912340011,新线索,官网,张明&#10;智远咨询,王雅,13822334455,联系中,广告,"></textarea>
        <div class="flex-row">
            <input type="file" id="importFile" accept=".csv,.txt" style="display:none;">
            <button class="btn btn-outline" id="chooseFileBtn"><i class="fas fa-folder-open"></i> 选择文件</button>
            <span id="fileNameDisplay" class="small-note"></span>
        </div>
        <div class="modal-actions"><button class="btn btn-outline" id="cancelImport">取消</button><button class="btn btn-primary" id="saveImport">导入</button></div>
    </div>
</div>

<!-- 自定义查询模态框 -->
<div class="modal-overlay" id="modalCustom">
    <div class="modal-card">
        <div class="modal-header"><h3>自定义查询</h3><button class="modal-close" id="closeCustomModal">&times;</button></div>
        <p>添加更多筛选条件 (演示)</p>
        <div class="input-group"><label>字段</label><select id="customField" class="input-field"><option value="等级">线索等级</option><option value="行业">行业</option></select></div>
        <div class="input-group"><label>值</label><input type="text" id="customValue" class="input-field"></div>
        <div class="modal-actions"><button class="btn btn-outline" id="cancelCustom">取消</button><button class="btn btn-primary" id="applyCustom">应用</button></div>
    </div>
</div>

<!-- 确认弹窗 -->
<div class="modal-overlay" id="modalConfirm">
    <div class="modal-card" style="max-width:400px;">
        <div class="modal-header"><h3 id="confirmTitle">确认操作</h3><button class="modal-close" id="closeConfirmModal">&times;</button></div>
        <p id="confirmMessage"></p>
        <div class="modal-actions"><button class="btn btn-outline" id="confirmNo">取消</button><button class="btn btn-primary" id="confirmYes">确定</button></div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast-message">操作成功</div>

<script>
    (function(){
        // ---------- 数据 ----------
        let leads = [
            { id: 1001, name: '云创科技', contact: '李浩', phone: '13912340011', status: '新线索', source: '官网', owner: '张明', createTime: '2025-02-10' },
            { id: 1002, name: '智远咨询', contact: '王雅', phone: '13822334455', status: '联系中', source: '广告', owner: '陈涛', createTime: '2025-02-14' },
            { id: 1003, name: '蓝海贸易', contact: '赵岩', phone: '15933221100', status: '已转化', source: '朋友介绍', owner: '李华', createTime: '2025-01-22' },
            { id: 1004, name: '先锋制造', contact: '周楷', phone: '17766558899', status: '新线索', source: '展会', owner: '', createTime: '2025-03-01' },
            { id: 1005, name: '数达软件', contact: '吴迪', phone: '16677778899', status: '已关闭', source: '官网', owner: '陈涛', createTime: '2025-02-05' },
            { id: 1006, name: '格林文化', contact: '郑欣', phone: '13599887766', status: '联系中', source: '广告', owner: '', createTime: '2025-03-07' },
            { id: 1007, name: '新潮传媒', contact: '刘阳', phone: '15011112222', status: '新线索', source: '朋友介绍', owner: '王欣', createTime: '2025-03-10' },
            { id: 1008, name: '新锐科技', contact: '陈晨', phone: '15122223333', status: '联系中', source: '展会', owner: '李华', createTime: '2025-03-12' },
            { id: 1009, name: '明源云', contact: '张立', phone: '15233334444', status: '已转化', source: '官网', owner: '张明', createTime: '2025-02-28' },
            { id: 1010, name: '智云数据', contact: '王磊', phone: '15344445555', status: '新线索', source: '广告', owner: '', createTime: '2025-03-15' },
        ];
        let filteredLeads = [...leads];
        let currentPage = 1;
        let pageSize = 10;

        // DOM 元素
        const tbody = document.getElementById('tableBody');
        const filterName = document.getElementById('filterName');
        const filterStatus = document.getElementById('filterStatus');
        const filterSource = document.getElementById('filterSource');
        const filterDateStart = document.getElementById('filterDateStart');
        const searchBtn = document.getElementById('searchBtn');
        const resetFilterBtn = document.getElementById('resetFilterBtn');
        const exportBtn = document.getElementById('exportBtn');
        const selectAll = document.getElementById('selectAll');
        const singleAddBtn = document.getElementById('singleAddBtn');
        const batchImportBtn = document.getElementById('batchImportBtn');
        const batchMailBtn = document.getElementById('batchMailBtn');
        const batchAssignBtn = document.getElementById('batchAssignBtn');
        const batchCloseBtn = document.getElementById('batchCloseBtn');
        const batchQuickBtn = document.getElementById('batchQuickBtn');
        const autoAssignBtn = document.getElementById('autoAssignBtn');
        const quickGlobalBtn = document.getElementById('quickGlobalBtn');
        const customFilterBtn = document.getElementById('customFilterBtn');
        const pageSizeSelect = document.getElementById('pageSizeSelect');
        const firstPageBtn = document.getElementById('firstPageBtn');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const lastPageBtn = document.getElementById('lastPageBtn');
        const pageInfo = document.getElementById('pageInfo');

        // 模态框
        const modalLead = document.getElementById('modalLead');
        const modalVisit = document.getElementById('modalVisit');
        const modalAssign = document.getElementById('modalAssign');
        const modalQuick = document.getElementById('modalQuick');
        const modalMail = document.getElementById('modalMail');
        const modalImport = document.getElementById('modalImport');
        const modalCustom = document.getElementById('modalCustom');
        const modalConfirm = document.getElementById('modalConfirm');
        const toast = document.getElementById('toast');

        // 关闭按钮映射
        const closeButtons = {
            closeLeadModal: modalLead, closeVisitModal: modalVisit, closeAssignModal: modalAssign,
            closeQuickModal: modalQuick, closeMailModal: modalMail, closeImportModal: modalImport,
            closeCustomModal: modalCustom, closeConfirmModal: modalConfirm
        };
        for (let [id, modal] of Object.entries(closeButtons)) {
            const btn = document.getElementById(id);
            if (btn) btn.addEventListener('click', () => modal.classList.remove('show'));
        }
        // 取消按钮
        document.querySelectorAll('#cancelLead, #cancelVisit, #cancelAssign, #cancelQuick, #cancelMail, #cancelImport, #cancelCustom, #confirmNo')
            .forEach(btn => btn.addEventListener('click', (e) => {
                const m = e.target.closest('.modal-overlay');
                if(m) m.classList.remove('show');
        }));

        function showToast(text) {
            toast.textContent = text; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 过滤
        function filterLeads(resetPage = true) {
            const name = filterName.value.trim().toLowerCase();
            const status = filterStatus.value;
            const source = filterSource.value;
            const startDate = filterDateStart.value;
            filteredLeads = leads.filter(l => {
                if (name && !l.name.toLowerCase().includes(name)) return false;
                if (status !== 'all' && l.status !== status) return false;
                if (source !== 'all' && l.source !== source) return false;
                if (startDate && l.createTime < startDate) return false;
                return true;
            });
            if (resetPage) currentPage = 1;
            renderTable();
        }

        function getPaginated() {
            const start = (currentPage-1)*pageSize;
            return filteredLeads.slice(start, start+pageSize);
        }

        function renderTable() {
            const data = getPaginated();
            let html = '';
            data.forEach(l => {
                const ownerDisplay = l.owner ? `<span class="owner-tag">${l.owner}</span>` : '<span class="owner-tag" style="background:#eef2f6;color:#6f8aaa;">未分配</span>';
                let statusClass = 'status-badge';
                if (l.status === '已关闭') statusClass += ' status-closed';
                else if (l.status === '已转化') statusClass += ' status-converted';
                html += `<tr data-id="${l.id}">
                    <td class="checkbox-col"><input type="checkbox" class="rowCheckbox" value="${l.id}"></td>
                    <td>${l.id}</td><td><strong>${l.name}</strong></td><td>${l.contact || '--'}</td><td>${l.phone || '--'}</td>
                    <td><span class="${statusClass}">${l.status}</span></td><td>${l.source || '--'}</td><td>${ownerDisplay}</td><td>${l.createTime}</td>
                    <td class="action-cell">
                        <button class="icon-btn editBtn" data-id="${l.id}"><i class="fas fa-edit"></i> 编辑</button>
                        <button class="icon-btn visitBtn" data-id="${l.id}"><i class="fas fa-phone-alt"></i> 拜访</button>
                        <button class="icon-btn assignBtn" data-id="${l.id}"><i class="fas fa-user-tag"></i> 分配</button>
                        <button class="icon-btn quickBtn" data-id="${l.id}"><i class="fas fa-bolt"></i> 快速</button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html || '<tr><td colspan="10" style="text-align:center;padding:2rem;">暂无线索</td></tr>';
            updatePaginationInfo();
            selectAll.checked = false;
        }

        function updatePaginationInfo() {
            const total = filteredLeads.length;
            const totalPages = Math.ceil(total/pageSize) || 1;
            if(currentPage>totalPages) currentPage=totalPages;
            if(currentPage<1) currentPage=1;
            const start = total===0?0:(currentPage-1)*pageSize+1;
            const end = Math.min(start+pageSize-1,total);
            pageInfo.innerText = `第 ${currentPage} / ${totalPages} 页 (${total} 条，显示 ${start}-${end})`;
            firstPageBtn.disabled = currentPage===1||total===0;
            prevPageBtn.disabled = currentPage===1||total===0;
            nextPageBtn.disabled = currentPage===totalPages||total===0;
            lastPageBtn.disabled = currentPage===totalPages||total===0;
        }

        function goToPage(page) {
            const totalPages = Math.ceil(filteredLeads.length/pageSize)||1;
            if(page<1) page=1; if(page>totalPages) page=totalPages;
            if(page===currentPage) return;
            currentPage = page; renderTable();
        }

        // 全选
        selectAll.addEventListener('change', (e) => {
            document.querySelectorAll('.rowCheckbox').forEach(cb => cb.checked = e.target.checked);
        });
        tbody.addEventListener('change', (e) => {
            if(e.target.classList.contains('rowCheckbox')) {
                const all = document.querySelectorAll('.rowCheckbox');
                const checked = document.querySelectorAll('.rowCheckbox:checked');
                selectAll.checked = all.length === checked.length && all.length>0;
            }
        });

        function getSelectedIds() {
            return Array.from(document.querySelectorAll('.rowCheckbox:checked')).map(cb=>parseInt(cb.value));
        }

        // 重置筛选
        resetFilterBtn.addEventListener('click', ()=>{
            filterName.value=''; filterStatus.value='all'; filterSource.value='all'; filterDateStart.value='';
            filterLeads(true);
            showToast('筛选条件已重置');
        });

        searchBtn.addEventListener('click', ()=>filterLeads(true));

        // 导出功能（真实导出CSV）
        exportBtn.addEventListener('click', ()=>{
            if(filteredLeads.length===0) return alert('无数据导出');
            const headers = ['ID','名称','联系人','电话','状态','来源','所有者','创建时间'];
            const rows = filteredLeads.map(l=>[l.id, l.name, l.contact, l.phone, l.status, l.source, l.owner||'', l.createTime]);
            let csv = headers.join(',') + '\n' + rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
            const blob = new Blob(["\uFEFF"+csv], {type:'text/csv'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '线索导出.csv'; a.click();
            showToast('导出成功');
        });

        // 分页事件
        pageSizeSelect.addEventListener('change', (e)=>{ pageSize = parseInt(e.target.value); currentPage=1; renderTable(); showToast(`每页显示 ${pageSize} 条`); });
        firstPageBtn.addEventListener('click', ()=>{ currentPage=1; renderTable(); });
        prevPageBtn.addEventListener('click', ()=>{ if(currentPage>1) currentPage--; renderTable(); });
        nextPageBtn.addEventListener('click', ()=>{ const tp = Math.ceil(filteredLeads.length/pageSize); if(currentPage<tp) currentPage++; renderTable(); });
        lastPageBtn.addEventListener('click', ()=>{ currentPage = Math.ceil(filteredLeads.length/pageSize)||1; renderTable(); });

        // ========== 单个录入 ==========
        singleAddBtn.addEventListener('click', ()=>{
            document.getElementById('modalLeadTitle').innerHTML = '<i class="fas fa-plus"></i> 新建线索';
            document.getElementById('leadEditId').value = '';
            document.getElementById('leadName').value = ''; document.getElementById('leadContact').value = ''; document.getElementById('leadPhone').value = '';
            document.getElementById('leadStatus').value = '新线索'; document.getElementById('leadSource').value = '官网'; document.getElementById('leadOwner').value = '';
            modalLead.classList.add('show');
        });

        document.getElementById('saveLead').addEventListener('click', ()=>{
            const id = document.getElementById('leadEditId').value;
            const name = document.getElementById('leadName').value.trim();
            if(!name) return alert('线索名称必填');
            const newLead = {
                id: id ? parseInt(id) : Date.now()+Math.floor(Math.random()*1000),
                name, contact: document.getElementById('leadContact').value.trim(), phone: document.getElementById('leadPhone').value.trim(),
                status: document.getElementById('leadStatus').value, source: document.getElementById('leadSource').value,
                owner: document.getElementById('leadOwner').value.trim(), createTime: new Date().toISOString().slice(0,10)
            };
            if(id) {
                const idx = leads.findIndex(l=>l.id==id); if(idx!==-1) leads[idx] = {...leads[idx], ...newLead, id: leads[idx].id};
                showToast('线索已更新');
            } else {
                leads.push(newLead);
                showToast('线索已添加');
            }
            filterLeads(true);
            modalLead.classList.remove('show');
        });

        // ========== 批量导入 ==========
        batchImportBtn.addEventListener('click', ()=>{ 
            document.getElementById('importData').value = ''; 
            document.getElementById('fileNameDisplay').innerText = ''; 
            modalImport.classList.add('show'); 
        });
        document.getElementById('chooseFileBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
        document.getElementById('importFile').addEventListener('change', (e)=>{
            const file = e.target.files[0]; if(!file) return;
            document.getElementById('fileNameDisplay').innerText = file.name;
            const reader = new FileReader(); reader.onload = (ev)=> document.getElementById('importData').value = ev.target.result;
            reader.readAsText(file);
        });
        document.getElementById('saveImport').addEventListener('click', ()=>{
            const raw = document.getElementById('importData').value.trim(); if(!raw) return alert('请输入数据');
            const lines = raw.split('\n'); const newLeads = [];
            lines.forEach(line=>{
                const parts = line.split(',').map(s=>s.trim()); if(parts.length>=2 && parts[0]) {
                    newLeads.push({ 
                        id: Date.now()+Math.floor(Math.random()*10000)+newLeads.length, 
                        name: parts[0], contact: parts[1]||'', phone: parts[2]||'', 
                        status: parts[3]||'新线索', source: parts[4]||'官网', owner: parts[5]||'', 
                        createTime: new Date().toISOString().slice(0,10) 
                    });
                }
            });
            if(newLeads.length) { 
                leads = [...leads, ...newLeads]; 
                filterLeads(true); 
                modalImport.classList.remove('show'); 
                showToast(`成功导入 ${newLeads.length} 条线索`); 
            } else alert('无有效数据');
        });

        // ========== 批量邮件 (演示，但保留弹窗) ==========
        batchMailBtn.addEventListener('click', ()=>{
            const ids = getSelectedIds(); if(!ids.length) return alert('请先选择线索');
            document.getElementById('mailHint').innerText = `已选 ${ids.length} 条线索`; 
            document.getElementById('mailSubject').value = ''; document.getElementById('mailContent').value = '';
            modalMail.classList.add('show');
        });
        document.getElementById('sendMail').addEventListener('click', ()=>{ 
            showToast('邮件已发送(模拟)'); 
            modalMail.classList.remove('show'); 
        });

        // ========== 批量分配 ==========
        batchAssignBtn.addEventListener('click', ()=>{
            const ids = getSelectedIds(); if(!ids.length) return alert('请选择线索');
            document.getElementById('assignTitle').innerHTML = '<i class="fas fa-user-tag"></i> 批量分配所有者';
            document.getElementById('assignHint').innerText = `为 ${ids.length} 条线索分配所有者`;
            modalAssign.classList.add('show'); 
            document.getElementById('saveAssign')._ids = ids;
        });

        document.getElementById('saveAssign').addEventListener('click', (e)=>{
            const ids = e.target._ids || []; 
            const owner = document.getElementById('assignOwnerSelect').value;
            leads = leads.map(l => ids.includes(l.id) ? {...l, owner} : l);
            filterLeads(false); 
            modalAssign.classList.remove('show'); 
            showToast(`已分配 ${ids.length} 条线索给 ${owner}`);
        });

        // ========== 批量关闭 ==========
        batchCloseBtn.addEventListener('click', ()=>{
            const ids = getSelectedIds(); if(!ids.length) return alert('请选择线索');
            document.getElementById('confirmTitle').innerText = '批量关闭'; 
            document.getElementById('confirmMessage').innerText = `确定关闭 ${ids.length} 条线索？`;
            modalConfirm.classList.add('show');
            document.getElementById('confirmYes')._ids = ids;
        });

        // ========== 批量快速处理 ==========
        batchQuickBtn.addEventListener('click', ()=>{
            const ids = getSelectedIds(); if(!ids.length) return alert('请选择线索');
            document.getElementById('quickHint').innerText = `批量处理 ${ids.length} 条线索`;
            document.getElementById('quickStatusSelect').value = '联系中';
            document.getElementById('quickNote').value = '';
            modalQuick.classList.add('show'); 
            document.getElementById('saveQuick')._ids = ids;
        });

        // ========== 自动分配 ==========
        autoAssignBtn.addEventListener('click', ()=>{
            const unassigned = leads.filter(l=>!l.owner); 
            if(!unassigned.length) return alert('没有未分配线索');
            const sales = ['张明','李华','王欣','陈涛','赵琳'];
            leads = leads.map(l=>!l.owner ? {...l, owner: sales[Math.floor(Math.random()*sales.length)]} : l);
            filterLeads(false); 
            showToast(`自动分配完成，共处理 ${unassigned.length} 条`);
        });

        // ========== 全局快速处理 ==========
        quickGlobalBtn.addEventListener('click', ()=>{
            document.getElementById('confirmTitle').innerText = '全局快速处理'; 
            document.getElementById('confirmMessage').innerText = '将所有“新线索”转为“联系中”？';
            modalConfirm.classList.add('show'); 
            document.getElementById('confirmYes')._global = true;
        });

        // ========== 自定义查询 ==========
        customFilterBtn.addEventListener('click', ()=> modalCustom.classList.add('show'));
        document.getElementById('applyCustom').addEventListener('click', ()=>{ 
            showToast('自定义条件已应用(演示)'); 
            modalCustom.classList.remove('show'); 
        });

        // ========== 行内按钮 ==========
        tbody.addEventListener('click', (e)=>{
            const btn = e.target.closest('button'); if(!btn) return;
            const row = btn.closest('tr'); if(!row) return;
            const id = parseInt(row.dataset.id); const lead = leads.find(l=>l.id===id); if(!lead) return;

            if(btn.classList.contains('editBtn')) {
                document.getElementById('modalLeadTitle').innerHTML = '<i class="fas fa-pen"></i> 编辑线索';
                document.getElementById('leadEditId').value = lead.id;
                document.getElementById('leadName').value = lead.name;
                document.getElementById('leadContact').value = lead.contact||'';
                document.getElementById('leadPhone').value = lead.phone||'';
                document.getElementById('leadStatus').value = lead.status;
                document.getElementById('leadSource').value = lead.source;
                document.getElementById('leadOwner').value = lead.owner||'';
                modalLead.classList.add('show');
            }
            else if(btn.classList.contains('visitBtn')) {
                document.getElementById('visitLeadId').value = lead.id;
                document.getElementById('visitLeadName').innerText = `线索：${lead.name}`;
                document.getElementById('visitNote').value = '';
                document.getElementById('visitDate').value = new Date().toISOString().slice(0,10);
                modalVisit.classList.add('show');
            }
            else if(btn.classList.contains('assignBtn')) {
                document.getElementById('assignTitle').innerHTML = '<i class="fas fa-user-tag"></i> 手动分配';
                document.getElementById('assignHint').innerText = `为 “${lead.name}” 选择所有者`;
                modalAssign.classList.add('show'); 
                document.getElementById('saveAssign')._ids = [lead.id];
            }
            else if(btn.classList.contains('quickBtn')) {
                document.getElementById('quickHint').innerText = `快速处理：${lead.name}`; 
                document.getElementById('quickStatusSelect').value = '联系中';
                document.getElementById('quickNote').value = '';
                modalQuick.classList.add('show');
                document.getElementById('saveQuick')._ids = [lead.id];
            }
        });

        // 保存拜访
        document.getElementById('saveVisit').addEventListener('click', ()=>{
            const note = document.getElementById('visitNote').value.trim(); 
            if(!note) return alert('请输入记录');
            showToast(`拜访记录已保存: ${note}`);
            modalVisit.classList.remove('show');
        });

        // 快速处理保存
        document.getElementById('saveQuick').addEventListener('click', (e)=>{
            const ids = e.target._ids || []; 
            const newStatus = document.getElementById('quickStatusSelect').value;
            const note = document.getElementById('quickNote').value.trim();
            leads = leads.map(l=> ids.includes(l.id) ? {...l, status: newStatus} : l);
            filterLeads(false); 
            modalQuick.classList.remove('show'); 
            showToast(`状态已更新${note?' 备注:'+note:''}`);
        });

        // 确认通用
        document.getElementById('confirmYes').addEventListener('click', (e)=>{
            if (e.target._ids) {
                const ids = e.target._ids; 
                leads = leads.map(l => ids.includes(l.id) ? {...l, status: '已关闭'} : l);
                filterLeads(false); 
                showToast(`已关闭 ${ids.length} 条线索`);
            } else if (e.target._global) {
                leads = leads.map(l => l.status === '新线索' ? {...l, status: '联系中'} : l);
                filterLeads(false); 
                showToast('全局状态更新完成');
            }
            modalConfirm.classList.remove('show');
        });

        // 初始化渲染
        filterLeads(true);

        // 点击模态背景关闭
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.classList.remove('show'); });
        });
    })();
</script>
</body>
</html>
