<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>线索管理 · 全屏分页版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
        }
        html, body {
            height: 100%;
            background: #f0f4fa;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        /* 全屏主容器 — 采用flex列，防止溢出滚动 */
        .app {
            flex: 1;
            width: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            padding: 1.8rem 2rem 1.5rem 2rem;
            overflow: hidden;  /* 禁止整个容器滚动，内部区域各自处理 */
        }

        /* 查询卡片 — 不滚动 */
        .filter-card {
            background: #f8fafd;
            border-radius: 28px;
            padding: 1.5rem 2rem;
            margin-bottom: 1.5rem;
            border: 1px solid #dde5f0;
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem 2rem;
            align-items: flex-end;
            flex-shrink: 0;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            min-width: 150px;
        }
        .filter-item label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #46688a;
            margin-bottom: 4px;
        }
        .filter-item input, .filter-item select {
            border: 1px solid #c8d6e8;
            border-radius: 16px;
            padding: 10px 16px;
            font-size: 0.95rem;
            background: white;
        }
        .filter-actions {
            display: flex;
            gap: 12px;
            margin-left: auto;
        }
        .btn {
            padding: 10px 22px;
            border-radius: 40px;
            border: 1px solid #c0cee2;
            background: white;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.15s;
        }
        .btn-primary {
            background: #1f5faa;
            border-color: #1f5faa;
            color: white;
            box-shadow: 0 8px 14px -8px #1f5faa80;
        }
        .btn-primary:hover { background: #154585; }
        .btn-outline:hover { background: #e5effa; }
        .btn-sm { padding: 6px 16px; font-size: 0.85rem; }

        /* 操作栏 — 不滚动 */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 1rem 0;
            gap: 16px;
            flex-shrink: 0;
        }
        .left-actions, .right-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .batch-group {
            background: #f0f5fc;
            padding: 5px 15px;
            border-radius: 48px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* 表格区域 — 弹性占据剩余高度，内部滚动 */
        .table-wrapper {
            overflow-x: auto;
            overflow-y: auto;      /* 垂直滚动条 */
            border: 1px solid #d9e4f0;
            border-radius: 24px;
            background: white;
            flex: 1;               /* 撑满剩余高度 */
            min-height: 0;         /* flex限制溢出 */
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1300px;
        }
        th {
            background: #f2f8ff;
            padding: 1rem 0.8rem;
            font-weight: 600;
            color: #1a3b5e;
            border-bottom: 1px solid #cbd8ea;
            position: sticky;
            top: 0;
            background-color: #f2f8ff; /* 粘性定位需要背景色 */
            z-index: 2;
        }
        td {
            padding: 1rem 0.8rem;
            border-bottom: 1px solid #e2ecf7;
        }
        .checkbox-col { width: 30px; text-align: center; }
        .status-badge {
            background: #e3edfe;
            color: #1d4a89;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            display: inline-block;
        }
        .status-closed { background: #ecf1f5; color: #5e6f88; }
        .status-converted { background: #dff0df; color: #1f7030; }
        .action-cell {
            display: flex;
            gap: 6px;
        }
        .action-btn {
            background: none;
            border: none;
            font-size: 1rem;
            padding: 6px 8px;
            border-radius: 30px;
            color: #3e6191;
            cursor: pointer;
        }
        .action-btn:hover { background: #dde9fc; }
        .owner-tag {
            background: #e6edf6;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            display: inline-block;
        }

        /* 分页控件 — 固定在底部 */
        .pagination-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 20px;
            margin-top: 1rem;
            padding: 0.5rem 0;
            background: white;
            border-top: 1px solid #e2ecf7;
        }
        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pagination-controls button {
            background: white;
            border: 1px solid #cbd6e8;
            border-radius: 30px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .pagination-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .pagination-info {
            font-size: 0.9rem;
            color: #1f3f64;
        }
        .page-size-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .page-size-selector select {
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid #c4d3e8;
            background: white;
        }

        /* 模态框样式保持不变 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,20,40,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal.active {
            display: flex;
        }
        .modal-card {
            background: white;
            border-radius: 36px;
            width: 460px;
            max-width: 94%;
            padding: 2rem 2rem;
            box-shadow: 0 40px 70px rgba(0,10,30,0.4);
        }
        .modal-card.wide {
            width: 600px;
        }
        .modal-card h3 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #132e48;
            margin-bottom: 1.8rem;
        }
        .modal-card input, .modal-card select, .modal-card textarea {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid #c4d3e8;
            border-radius: 30px;
            margin-bottom: 1.2rem;
            font-size: 1rem;
            background: #fafcff;
        }
        .modal-card textarea {
            border-radius: 24px;
            resize: vertical;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            margin-top: 1.8rem;
        }
        .file-input-hidden { display: none; }
        .small-note { font-size: 0.8rem; color: #7890aa; margin-top: -0.5rem; margin-bottom: 1rem; }
        .flex-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .footer-note {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #9aafc9;
            text-align: center;
            border-top: 1px dashed #d3e0f0;
            padding-top: 1rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- 查询卡片 -->
    <div class="filter-card">
        <div class="filter-item"><label>线索名称</label><input type="text" id="filterName" placeholder="输入"></div>
        <div class="filter-item"><label>状态</label><select id="filterStatus"><option value="all">全部</option><option value="新线索">新线索</option><option value="联系中">联系中</option><option value="已转化">已转化</option><option value="已关闭">已关闭</option></select></div>
        <div class="filter-item"><label>来源</label><select id="filterSource"><option value="all">全部</option><option value="官网">官网</option><option value="广告">广告</option><option value="朋友介绍">朋友介绍</option><option value="展会">展会</option></select></div>
        <div class="filter-item"><label>创建起始</label><input type="date" id="filterDateStart"></div>
        <div class="filter-actions">
            <button class="btn btn-primary" id="searchBtn"><i class="fas fa-search"></i> 查询</button>
            <button class="btn btn-outline" id="exportBtn"><i class="fas fa-download"></i> 导出</button>
            <button class="btn btn-outline" id="customFilterBtn"><i class="fas fa-sliders-h"></i> 自定义</button>
        </div>
    </div>

    <!-- 操作栏 -->
    <div class="action-bar">
        <div class="left-actions">
            <button class="btn btn-primary" id="singleAddBtn"><i class="fas fa-plus"></i> 单个录入</button>
            <button class="btn btn-outline" id="batchImportBtn"><i class="fas fa-upload"></i> 批量导入</button>
            <div class="batch-group">
                <span><i class="fas fa-check-double"></i> 批量:</span>
                <button class="btn btn-sm" id="batchMailBtn"><i class="fas fa-envelope"></i> 邮件</button>
                <button class="btn btn-sm" id="batchAssignBtn"><i class="fas fa-user-plus"></i> 分配</button>
                <button class="btn btn-sm" id="batchCloseBtn"><i class="fas fa-ban"></i> 关闭</button>
                <button class="btn btn-sm" id="batchQuickBtn"><i class="fas fa-bolt"></i> 快速处理</button>
            </div>
        </div>
        <div class="right-actions">
            <button class="btn btn-outline" id="autoAssignBtn"><i class="fas fa-robot"></i> 自动分配(未分配)</button>
            <button class="btn btn-outline" id="quickGlobalBtn"><i class="fas fa-gavel"></i> 快速处理(全局)</button>
        </div>
    </div>

    <!-- 表格区域（内部滚动） -->
    <div class="table-wrapper" id="tableWrapper">
        <table id="leadTable">
            <thead><tr><th class="checkbox-col"><input type="checkbox" id="selectAll"></th><th>ID</th><th>线索名称</th><th>联系人</th><th>电话</th><th>状态</th><th>来源</th><th>所有者</th><th>创建时间</th><th>操作</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- 分页栏 -->
    <div class="pagination-bar">
        <div class="page-size-selector">
            <span>每页显示:</span>
            <select id="pageSizeSelect">
                <option value="5">5条</option>
                <option value="10" selected>10条</option>
                <option value="20">20条</option>
                <option value="50">50条</option>
            </select>
        </div>
        <div class="pagination-controls">
            <button id="firstPageBtn" title="首页"><i class="fas fa-angle-double-left"></i></button>
            <button id="prevPageBtn" title="上一页"><i class="fas fa-chevron-left"></i> 上一页</button>
            <span class="pagination-info" id="pageInfo">第 1 页 / 共 1 页 (0 条)</span>
            <button id="nextPageBtn" title="下一页">下一页 <i class="fas fa-chevron-right"></i></button>
            <button id="lastPageBtn" title="末页"><i class="fas fa-angle-double-right"></i></button>
        </div>
    </div>

    <!-- 底部简约提示 -->
    <!-- <div class="footer-note"><i class="far fa-window-maximize"></i> 表格内部滚动 · 分页功能已启用 · 所有操作均通过弹窗完成</div> -->

    <!-- 模态框区域（与之前完全一致） -->
    <div class="modal" id="modalLead"><div class="modal-card"><h3 id="modalLeadTitle">新建线索</h3><input type="hidden" id="leadEditId"><input type="text" id="leadName" placeholder="线索名称 *"><input type="text" id="leadContact" placeholder="联系人"><input type="text" id="leadPhone" placeholder="电话"><select id="leadStatus"><option value="新线索">新线索</option><option value="联系中">联系中</option><option value="已转化">已转化</option><option value="已关闭">已关闭</option></select><select id="leadSource"><option value="官网">官网</option><option value="广告">广告</option><option value="朋友介绍">朋友介绍</option><option value="展会">展会</option></select><input type="text" id="leadOwner" placeholder="所有者 (可选)"><div class="modal-actions"><button class="btn btn-outline" id="cancelLead">取消</button><button class="btn btn-primary" id="saveLead">保存</button></div></div></div>
    <div class="modal" id="modalVisit"><div class="modal-card"><h3><i class="fas fa-phone-alt"></i> 记录拜访</h3><input type="hidden" id="visitLeadId"><p id="visitLeadName" style="font-weight:500; margin-bottom:10px;"></p><textarea id="visitNote" rows="3" placeholder="输入拜访记录..."></textarea><input type="date" id="visitDate" value=""><div class="modal-actions"><button class="btn btn-outline" id="cancelVisit">取消</button><button class="btn btn-primary" id="saveVisit">保存记录</button></div></div></div>
    <div class="modal" id="modalAssign"><div class="modal-card"><h3 id="assignTitle">分配所有者</h3><p id="assignHint"></p><select id="assignOwnerSelect"><option value="张明">张明</option><option value="李华">李华</option><option value="王欣">王欣</option><option value="陈涛">陈涛</option><option value="赵琳">赵琳</option></select><div class="modal-actions"><button class="btn btn-outline" id="cancelAssign">取消</button><button class="btn btn-primary" id="saveAssign">分配</button></div></div></div>
    <div class="modal" id="modalQuick"><div class="modal-card"><h3>⚡ 快速处理线索</h3><p id="quickHint"></p><select id="quickStatusSelect"><option value="联系中">联系中</option><option value="已转化">已转化</option><option value="已关闭">已关闭</option></select><textarea id="quickNote" rows="2" placeholder="处理备注 (可选)"></textarea><div class="modal-actions"><button class="btn btn-outline" id="cancelQuick">取消</button><button class="btn btn-primary" id="saveQuick">确认处理</button></div></div></div>
    <div class="modal" id="modalMail"><div class="modal-card wide"><h3><i class="fas fa-envelope"></i> 批量发送邮件</h3><p id="mailHint"></p><input type="text" id="mailSubject" placeholder="邮件主题"><textarea id="mailContent" rows="4" placeholder="邮件内容..."></textarea><div class="modal-actions"><button class="btn btn-outline" id="cancelMail">取消</button><button class="btn btn-primary" id="sendMail">发送</button></div></div></div>
    <div class="modal" id="modalImport"><div class="modal-card wide"><h3><i class="fas fa-file-import"></i> 批量导入线索</h3><p style="margin-bottom:12px;">粘贴CSV格式 (名称,联系人,电话,状态,来源,所有者) 或上传文件</p><textarea id="importData" rows="5" placeholder="示例：&#10;云创科技,李浩,13912340011,新线索,官网,张明&#10;智远咨询,王雅,13822334455,联系中,广告,"></textarea><div class="flex-row"><input type="file" id="importFile" accept=".csv,.txt" style="display:none;"><button class="btn btn-outline" id="chooseFileBtn"><i class="fas fa-folder-open"></i> 选择文件</button><span id="fileNameDisplay" class="small-note" style="margin-left:10px;"></span></div><div class="modal-actions"><button class="btn btn-outline" id="cancelImport">取消</button><button class="btn btn-primary" id="saveImport">导入预览</button></div></div></div>
    <div class="modal" id="modalCustom"><div class="modal-card"><h3>自定义查询</h3><p>添加更多筛选条件 (演示)</p><select id="customField"><option value="等级">线索等级</option><option value="行业">行业</option></select><input type="text" id="customValue" placeholder="值"><div class="modal-actions"><button class="btn btn-outline" id="cancelCustom">取消</button><button class="btn btn-primary" id="applyCustom">应用</button></div></div></div>
    <div class="modal" id="modalConfirm"><div class="modal-card" style="width:380px;"><h3 id="confirmTitle">确认操作</h3><p id="confirmMessage"></p><div class="modal-actions"><button class="btn btn-outline" id="confirmNo">取消</button><button class="btn btn-primary" id="confirmYes">确定</button></div></div></div>
</div>

<script>
    (function() {
        // ---------- 初始数据 ----------
        let leads = [
            { id: 1001, name: '云创科技', contact: '李浩', phone: '13912340011', status: '新线索', source: '官网', owner: '张明', createTime: '2025-02-10' },
            { id: 1002, name: '智远咨询', contact: '王雅', phone: '13822334455', status: '联系中', source: '广告', owner: '陈涛', createTime: '2025-02-14' },
            { id: 1003, name: '蓝海贸易', contact: '赵岩', phone: '15933221100', status: '已转化', source: '朋友介绍', owner: '李华', createTime: '2025-01-22' },
            { id: 1004, name: '先锋制造', contact: '周楷', phone: '17766558899', status: '新线索', source: '展会', owner: '', createTime: '2025-03-01' },
            { id: 1005, name: '数达软件', contact: '吴迪', phone: '16677778899', status: '已关闭', source: '官网', owner: '陈涛', createTime: '2025-02-05' },
            { id: 1006, name: '格林文化', contact: '郑欣', phone: '13599887766', status: '联系中', source: '广告', owner: '', createTime: '2025-03-07' },
            // 增加几条数据便于观察分页
            { id: 1007, name: '新潮传媒', contact: '刘阳', phone: '15011112222', status: '新线索', source: '朋友介绍', owner: '王欣', createTime: '2025-03-10' },
            { id: 1008, name: '新锐科技', contact: '陈晨', phone: '15122223333', status: '联系中', source: '展会', owner: '李华', createTime: '2025-03-12' },
            { id: 1009, name: '明源云', contact: '张立', phone: '15233334444', status: '已转化', source: '官网', owner: '张明', createTime: '2025-02-28' },
            { id: 1010, name: '智云数据', contact: '王磊', phone: '15344445555', status: '新线索', source: '广告', owner: '', createTime: '2025-03-15' },
        ];
        let filteredLeads = [...leads];  // 过滤后的总数据集

        // 分页状态
        let currentPage = 1;
        let pageSize = 10;  // 默认每页10条

        // DOM 元素
        const tbody = document.getElementById('tableBody');
        const filterName = document.getElementById('filterName');
        const filterStatus = document.getElementById('filterStatus');
        const filterSource = document.getElementById('filterSource');
        const filterDateStart = document.getElementById('filterDateStart');
        const searchBtn = document.getElementById('searchBtn');
        const exportBtn = document.getElementById('exportBtn');
        const selectAll = document.getElementById('selectAll');
        const singleAddBtn = document.getElementById('singleAddBtn');
        const batchImportBtn = document.getElementById('batchImportBtn');
        const batchMailBtn = document.getElementById('batchMailBtn');
        const batchAssignBtn = document.getElementById('batchAssignBtn');
        const batchCloseBtn = document.getElementById('batchCloseBtn');
        const batchQuickBtn = document.getElementById('batchQuickBtn');
        const autoAssignBtn = document.getElementById('autoAssignBtn');
        const quickGlobalBtn = document.getElementById('quickGlobalBtn');
        const customFilterBtn = document.getElementById('customFilterBtn');

        // 分页控件
        const pageSizeSelect = document.getElementById('pageSizeSelect');
        const firstPageBtn = document.getElementById('firstPageBtn');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const lastPageBtn = document.getElementById('lastPageBtn');
        const pageInfo = document.getElementById('pageInfo');

        // 模态框
        const modalLead = document.getElementById('modalLead');
        const modalVisit = document.getElementById('modalVisit');
        const modalAssign = document.getElementById('modalAssign');
        const modalQuick = document.getElementById('modalQuick');
        const modalMail = document.getElementById('modalMail');
        const modalImport = document.getElementById('modalImport');
        const modalCustom = document.getElementById('modalCustom');
        const modalConfirm = document.getElementById('modalConfirm');

        // 关闭模态框的通用监听
        document.querySelectorAll('.modal .btn-outline').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const modal = e.target.closest('.modal');
                if (modal) modal.classList.remove('active');
            });
        });

        // ---------- 分页核心逻辑 ----------
        function getPaginatedData() {
            const total = filteredLeads.length;
            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, total);
            return filteredLeads.slice(start, end);
        }

        function updatePaginationInfo() {
            const total = filteredLeads.length;
            const totalPages = Math.ceil(total / pageSize) || 1;
            // 确保当前页不超过总页数
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = total === 0 ? 0 : (currentPage - 1) * pageSize + 1;
            const end = Math.min(start + pageSize - 1, total);

            pageInfo.innerText = `第 ${currentPage} 页 / 共 ${totalPages} 页 (${total} 条，显示 ${start}-${end})`;

            // 按钮禁用状态
            firstPageBtn.disabled = currentPage === 1 || total === 0;
            prevPageBtn.disabled = currentPage === 1 || total === 0;
            nextPageBtn.disabled = currentPage === totalPages || total === 0;
            lastPageBtn.disabled = currentPage === totalPages || total === 0;
        }

        // 渲染表格（使用分页数据）
        function renderTable() {
            const data = getPaginatedData();
            let html = '';
            data.forEach((lead) => {
                const ownerDisplay = lead.owner ? `<span class="owner-tag">${lead.owner}</span>` : '<span class="owner-tag" style="background:#eef2f6;color:#6f8aaa;">未分配</span>';
                let statusClass = 'status-badge';
                if (lead.status === '已关闭') statusClass += ' status-closed';
                else if (lead.status === '已转化') statusClass += ' status-converted';
                html += `<tr data-id="${lead.id}">
                    <td class="checkbox-col"><input type="checkbox" class="rowCheckbox" value="${lead.id}"></td>
                    <td>${lead.id}</td>
                    <td><strong>${lead.name}</strong></td>
                    <td>${lead.contact || '--'}</td>
                    <td>${lead.phone || '--'}</td>
                    <td><span class="${statusClass}">${lead.status}</span></td>
                    <td>${lead.source || '--'}</td>
                    <td>${ownerDisplay}</td>
                    <td>${lead.createTime}</td>
                    <td class="action-cell">
                        <button class="action-btn editBtn" title="日常维护" data-id="${lead.id}"><i class="fas fa-edit"></i></button>
                        <button class="action-btn visitBtn" title="记录拜访" data-id="${lead.id}"><i class="fas fa-phone-alt"></i></button>
                        <button class="action-btn assignBtn" title="手动分配" data-id="${lead.id}"><i class="fas fa-user-tag"></i></button>
                        <button class="action-btn quickBtn" title="快速处理" data-id="${lead.id}"><i class="fas fa-bolt"></i></button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html || '<tr><td colspan="10" style="text-align:center;padding:2rem;">暂无线索</td></tr>';
            updatePaginationInfo();
            // 更新全选状态（如果有新数据，全选取消）
            selectAll.checked = false;
        }

        // 过滤数据（重新计算 filteredLeads 并重置到第一页）
        function filterLeads(resetPage = true) {
            const name = filterName.value.trim().toLowerCase();
            const status = filterStatus.value;
            const source = filterSource.value;
            const startDate = filterDateStart.value;

            filteredLeads = leads.filter(l => {
                if (name && !l.name.toLowerCase().includes(name)) return false;
                if (status !== 'all' && l.status !== status) return false;
                if (source !== 'all' && l.source !== source) return false;
                if (startDate && l.createTime < startDate) return false;
                return true;
            });

            if (resetPage) currentPage = 1;
            renderTable();
        }

        // 刷新表格（保持当前页，用于数据变更后重新渲染）
        function refreshTable() {
            renderTable();
        }

        // 初始化
        filterLeads();

        // 事件绑定
        searchBtn.addEventListener('click', () => filterLeads(true));
        // 当分页大小改变时
        pageSizeSelect.addEventListener('change', (e) => {
            pageSize = parseInt(e.target.value);
            currentPage = 1;
            renderTable();
        });

        // 分页按钮
        firstPageBtn.addEventListener('click', () => {
            currentPage = 1;
            renderTable();
        });
        prevPageBtn.addEventListener('click', () => {
            if (currentPage > 1) currentPage--;
            renderTable();
        });
        nextPageBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(filteredLeads.length / pageSize);
            if (currentPage < totalPages) currentPage++;
            renderTable();
        });
        lastPageBtn.addEventListener('click', () => {
            currentPage = Math.ceil(filteredLeads.length / pageSize) || 1;
            renderTable();
        });

        // 导出
        exportBtn.addEventListener('click', () => {
            if (filteredLeads.length === 0) return alert('无数据导出');
            const headers = ['ID','名称','联系人','电话','状态','来源','所有者','创建时间'];
            const rows = filteredLeads.map(l => [l.id, l.name, l.contact, l.phone, l.status, l.source, l.owner||'', l.createTime]);
            let csv = headers.join(',') + '\n' + rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
            const blob = new Blob(["\uFEFF"+csv], {type:'text/csv'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '线索导出.csv';
            a.click();
        });

        // 全选逻辑
        selectAll.addEventListener('change', (e) => {
            document.querySelectorAll('.rowCheckbox').forEach(cb => cb.checked = e.target.checked);
        });

        // 表格内复选框联动全选
        tbody.addEventListener('change', (e) => {
            if (e.target.classList.contains('rowCheckbox')) {
                const all = document.querySelectorAll('.rowCheckbox');
                const checked = document.querySelectorAll('.rowCheckbox:checked');
                selectAll.checked = all.length === checked.length && all.length > 0;
            }
        });

        // 获取选中的ID (基于当前页面，但批量操作一般针对所有选中，这里沿用之前逻辑)
        function getSelectedIds() {
            return Array.from(document.querySelectorAll('.rowCheckbox:checked')).map(cb => parseInt(cb.value));
        }

        // 显示确认框
        function showConfirm(title, msg, onConfirm) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerText = msg;
            modalConfirm.classList.add('active');
            const yesHandler = () => {
                onConfirm();
                modalConfirm.classList.remove('active');
                document.getElementById('confirmYes').removeEventListener('click', yesHandler);
            };
            document.getElementById('confirmYes').addEventListener('click', yesHandler, { once: true });
        }

        // ---------- 单个录入 ----------
        singleAddBtn.addEventListener('click', () => {
            document.getElementById('modalLeadTitle').innerText = '新建线索';
            document.getElementById('leadEditId').value = '';
            document.getElementById('leadName').value = '';
            document.getElementById('leadContact').value = '';
            document.getElementById('leadPhone').value = '';
            document.getElementById('leadStatus').value = '新线索';
            document.getElementById('leadSource').value = '官网';
            document.getElementById('leadOwner').value = '';
            modalLead.classList.add('active');
        });

        document.getElementById('saveLead').addEventListener('click', () => {
            const id = document.getElementById('leadEditId').value;
            const name = document.getElementById('leadName').value.trim();
            if (!name) return alert('线索名称必填');
            const newLead = {
                id: id ? parseInt(id) : Date.now() + Math.floor(Math.random()*1000),
                name: name,
                contact: document.getElementById('leadContact').value.trim(),
                phone: document.getElementById('leadPhone').value.trim(),
                status: document.getElementById('leadStatus').value,
                source: document.getElementById('leadSource').value,
                owner: document.getElementById('leadOwner').value.trim(),
                createTime: new Date().toISOString().slice(0,10)
            };
            if (id) {
                const index = leads.findIndex(l => l.id == id);
                if (index !== -1) leads[index] = { ...leads[index], ...newLead, id: leads[index].id };
            } else {
                leads.push(newLead);
            }
            filterLeads(true); // 重置到第一页并刷新
            modalLead.classList.remove('active');
        });

        // 批量导入
        batchImportBtn.addEventListener('click', () => {
            document.getElementById('importData').value = '';
            document.getElementById('fileNameDisplay').innerText = '';
            modalImport.classList.add('active');
        });
        document.getElementById('chooseFileBtn').addEventListener('click', () => {
            document.getElementById('importFile').click();
        });
        document.getElementById('importFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileNameDisplay').innerText = file.name;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    document.getElementById('importData').value = ev.target.result;
                };
                reader.readAsText(file);
            }
        });
        document.getElementById('saveImport').addEventListener('click', () => {
            const raw = document.getElementById('importData').value.trim();
            if (!raw) return alert('请输入数据');
            const lines = raw.split('\n');
            const newLeads = [];
            lines.forEach(line => {
                const parts = line.split(',').map(s => s.trim());
                if (parts.length >= 2) {
                    const name = parts[0];
                    if (!name) return;
                    newLeads.push({
                        id: Date.now() + Math.floor(Math.random()*10000) + newLeads.length,
                        name: name,
                        contact: parts[1] || '',
                        phone: parts[2] || '',
                        status: parts[3] || '新线索',
                        source: parts[4] || '官网',
                        owner: parts[5] || '',
                        createTime: new Date().toISOString().slice(0,10)
                    });
                }
            });
            if (newLeads.length) {
                leads = [...leads, ...newLeads];
                filterLeads(true);
                modalImport.classList.remove('active');
                alert(`成功导入 ${newLeads.length} 条线索`);
            } else {
                alert('未解析到有效数据');
            }
        });

        // 批量邮件
        batchMailBtn.addEventListener('click', () => {
            const ids = getSelectedIds();
            if (ids.length === 0) return alert('请先选择线索');
            document.getElementById('mailHint').innerText = `已选 ${ids.length} 条线索`;
            document.getElementById('mailSubject').value = '';
            document.getElementById('mailContent').value = '';
            modalMail.classList.add('active');
        });
        document.getElementById('sendMail').addEventListener('click', () => {
            alert('演示：邮件已发送 (模拟)');
            modalMail.classList.remove('active');
        });

        // 批量分配
        batchAssignBtn.addEventListener('click', () => {
            const ids = getSelectedIds();
            if (ids.length === 0) return alert('请选择线索');
            document.getElementById('assignTitle').innerText = '批量分配所有者';
            document.getElementById('assignHint').innerText = `为 ${ids.length} 条线索分配所有者`;
            modalAssign.classList.add('active');
            document.getElementById('saveAssign')._ids = ids;
        });
        document.getElementById('saveAssign').addEventListener('click', (e) => {
            const ids = e.target._ids || [];
            const owner = document.getElementById('assignOwnerSelect').value;
            leads = leads.map(l => ids.includes(l.id) ? {...l, owner: owner} : l);
            filterLeads(false); // 保持当前页刷新
            modalAssign.classList.remove('active');
            alert(`已分配 ${ids.length} 条线索给 ${owner}`);
        });

        // 批量关闭
        batchCloseBtn.addEventListener('click', () => {
            const ids = getSelectedIds();
            if (ids.length === 0) return alert('请选择线索');
            showConfirm('批量关闭', `确定关闭 ${ids.length} 条线索吗？`, () => {
                leads = leads.map(l => ids.includes(l.id) ? {...l, status: '已关闭'} : l);
                filterLeads(false);
            });
        });

        // 批量快速处理
        batchQuickBtn.addEventListener('click', () => {
            const ids = getSelectedIds();
            if (ids.length === 0) return alert('请选择线索');
            document.getElementById('quickHint').innerText = `批量处理 ${ids.length} 条线索 (将状态更新为所选)`;
            modalQuick.classList.add('active');
            document.getElementById('saveQuick')._ids = ids;
        });

        // 自动分配
        autoAssignBtn.addEventListener('click', () => {
            const unassigned = leads.filter(l => !l.owner);
            if (unassigned.length === 0) return alert('没有未分配线索');
            const sales = ['张明','李华','王欣','陈涛','赵琳'];
            leads = leads.map(l => {
                if (!l.owner) {
                    return {...l, owner: sales[Math.floor(Math.random() * sales.length)]};
                }
                return l;
            });
            filterLeads(false);
            alert(`自动分配完成，共处理 ${unassigned.length} 条`);
        });

        // 全局快速处理
        quickGlobalBtn.addEventListener('click', () => {
            showConfirm('全局快速处理', '将所有“新线索”转为“联系中”？', () => {
                leads = leads.map(l => l.status === '新线索' ? {...l, status: '联系中'} : l);
                filterLeads(false);
            });
        });

        // 自定义查询弹窗
        customFilterBtn.addEventListener('click', () => {
            modalCustom.classList.add('active');
        });
        document.getElementById('applyCustom').addEventListener('click', () => {
            alert('自定义条件已模拟应用 (可扩展)');
            modalCustom.classList.remove('active');
        });

        // 行内按钮事件代理 (编辑、拜访、分配、快速)
        tbody.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const row = btn.closest('tr');
            if (!row) return;
            const leadId = parseInt(row.dataset.id);
            const lead = leads.find(l => l.id === leadId);
            if (!lead) return;

            if (btn.classList.contains('editBtn')) {
                document.getElementById('modalLeadTitle').innerText = '维护线索';
                document.getElementById('leadEditId').value = lead.id;
                document.getElementById('leadName').value = lead.name;
                document.getElementById('leadContact').value = lead.contact || '';
                document.getElementById('leadPhone').value = lead.phone || '';
                document.getElementById('leadStatus').value = lead.status;
                document.getElementById('leadSource').value = lead.source;
                document.getElementById('leadOwner').value = lead.owner || '';
                modalLead.classList.add('active');
            }
            else if (btn.classList.contains('visitBtn')) {
                document.getElementById('visitLeadId').value = lead.id;
                document.getElementById('visitLeadName').innerText = `线索：${lead.name}`;
                document.getElementById('visitNote').value = '';
                document.getElementById('visitDate').value = new Date().toISOString().slice(0,10);
                modalVisit.classList.add('active');
            }
            else if (btn.classList.contains('assignBtn')) {
                document.getElementById('assignTitle').innerText = '手动分配';
                document.getElementById('assignHint').innerText = `为 “${lead.name}” 选择所有者`;
                modalAssign.classList.add('active');
                document.getElementById('saveAssign')._ids = [lead.id];
            }
            else if (btn.classList.contains('quickBtn')) {
                document.getElementById('quickHint').innerText = `快速处理：${lead.name}`;
                modalQuick.classList.add('active');
                document.getElementById('saveQuick')._ids = [lead.id];
            }
        });

        // 保存拜访
        document.getElementById('saveVisit').addEventListener('click', () => {
            const id = parseInt(document.getElementById('visitLeadId').value);
            const note = document.getElementById('visitNote').value.trim();
            const date = document.getElementById('visitDate').value;
            if (!note) return alert('请输入拜访记录');
            alert(`拜访记录已保存: "${note}" 日期:${date} (演示)`);
            modalVisit.classList.remove('active');
        });

        // 快速处理保存
        document.getElementById('saveQuick').addEventListener('click', (e) => {
            const ids = e.target._ids || [];
            const newStatus = document.getElementById('quickStatusSelect').value;
            const note = document.getElementById('quickNote').value.trim();
            leads = leads.map(l => ids.includes(l.id) ? {...l, status: newStatus} : l);
            filterLeads(false);
            modalQuick.classList.remove('active');
            if (note) alert(`处理备注: ${note}`);
        });
    })();
</script>
</body>
</html>
