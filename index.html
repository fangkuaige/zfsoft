<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研究生管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background-color: #EDF2FF; /* 全局浅蓝背景 */
        }

        /* 整体布局容器 */
        .container {
            display: flex;
            height: 100%;
            flex-direction: column;
        }

        /* 顶部导航栏 - 深蓝色主基调 */
        .top-header {
            height: 60px;
            background-color: #1565C0; /* 深海蓝主色 */
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            box-shadow: 0 2px 12px rgba(21, 101, 192, 0.18);
            z-index: 10;
            border-bottom: 1px solid #2176D2;
        }

        .system-title {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .system-title::before {
            content: "";
            width: 4px;
            height: 20px;
            background-color: #64B5F6;
            border-radius: 2px;
        }

        /* 用户信息区域 - 右上角 */
        .user-menu {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .role-switch {
            position: relative;
        }

        .role-btn {
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .role-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .role-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
            min-width: 140px;
            display: none;
            z-index: 99;
            overflow: hidden;
            border: 1px solid #E3F2FD;
        }

        .role-dropdown.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .role-option {
            padding: 10px 16px;
            color: #263238;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .role-option:hover {
            background-color: #E3F2FD;
            color: #1565C0;
            padding-left: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64B5F6, #1565C0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: white;
            box-shadow: 0 2px 8px rgba(21, 101, 192, 0.2);
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
        }

        .logout-btn {
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background-color: rgba(244, 67, 54, 0.2);
            border-color: rgba(244, 67, 54, 0.3);
            color: #FFEBEE;
        }

        /* 主体内容容器 */
        .content-wrapper {
            display: flex;
            flex: 1;
            height: calc(100% - 60px);
        }

        /* 左侧导航栏 - 深蓝系 */
        .sidebar {
            width: 220px;
            background-color: #0D47A1;
            color: #E3F2FD;
            height: 100%;
            transition: all 0.3s ease;
            overflow-y: auto;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.08);
        }

        .menu-group {
            margin-bottom: 16px;
        }

        .menu-group-title {
            padding: 16px 24px 8px;
            font-size: 12px;
            color: #90CAF9;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* 一级菜单 */
        .menu-item {
            padding: 14px 24px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid transparent;
            position: relative;
        }

        .menu-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #BBDEFB;
            padding-left: 28px;
        }

        .menu-item.active {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border-left-color: #64B5F6;
        }

        .menu-arrow {
            font-size: 12px;
            transition: transform 0.2s ease;
            color: #90CAF9;
        }

        .menu-arrow.expanded {
            transform: rotate(90deg);
            color: #64B5F6;
        }

        /* 二级菜单 */
        .submenu {
            background-color: rgba(0, 0, 0, 0.1);
            display: none;
        }

        .submenu.show {
            display: block;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to { opacity: 1; max-height: 500px; }
        }

        .submenu-item {
            padding: 12px 24px 12px 40px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: #BBDEFB;
        }

        .submenu-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            padding-left: 44px;
        }

        .submenu-item.active {
            color: #64B5F6;
            font-weight: 500;
            background-color: rgba(100, 181, 246, 0.1);
        }

        /* 右侧主内容区 - 蓝色渐变基调 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: linear-gradient(to bottom, #F5F9FF, #EDF2FF);
        }

        /* 页签区域 - 浅蓝系 */
        .tabs-header {
            display: flex;
            align-items: center;
            background-color: white;
            border-bottom: 1px solid #E3F2FD;
            padding: 0 16px;
            height: 48px;
            box-shadow: 0 1px 3px rgba(21, 101, 192, 0.05);
        }

        .tab-item {
            display: flex;
            align-items: center;
            padding: 0 20px;
            height: 47px;
            line-height: 47px;
            background-color: #F5F9FF;
            border: 1px solid #E3F2FD;
            border-bottom: none;
            margin-right: 8px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            position: relative;
            font-size: 14px;
            color: #5C6BC0;
            transition: all 0.2s;
        }

        .tab-item:hover {
            background-color: #E3F2FD;
            color: #1565C0;
        }

        .tab-item.active {
            background-color: #EDF2FF;
            color: #1565C0;
            font-weight: 600;
            border-color: #64B5F6;
            border-bottom: 1px solid #EDF2FF;
        }

        .tab-close {
            margin-left: 10px;
            font-size: 12px;
            color: #90CAF9;
            cursor: pointer;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .tab-close:hover {
            color: white;
            background-color: #EF5350;
            transform: rotate(90deg);
        }

        /* iframe 容器 */
        .iframe-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: white;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* 欢迎/空内容提示 - 增强版 */
        .welcome-tip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #F5F9FF 0%, #EDF2FF 100%);
            padding: 40px;
            text-align: center;
        }

        .welcome-card {
            max-width: 600px;
            background-color: white;
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 8px 24px rgba(21, 101, 192, 0.08);
            border: 1px solid #E3F2FD;
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .welcome-icon {
            font-size: 80px;
            color: #64B5F6;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #64B5F6, #1565C0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-title {
            font-size: 28px;
            color: #1565C0;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .welcome-desc {
            font-size: 16px;
            color: #5C6BC0;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .welcome-tips {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-top: 32px;
        }

        .welcome-tip-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            max-width: 120px;
        }

        .tip-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #E3F2FD;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1565C0;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .tip-text {
            font-size: 14px;
            color: #5C6BC0;
        }

        .version-info {
            margin-top: 32px;
            font-size: 12px;
            color: #90CAF9;
        }
    </style>
</head>

    <script>
        // 全局变量
        let tabs = [];
        let activeTabId = null;
        let currentRole = "系统管理员";
        let currentUserName = "正方";

        // DOM元素
        const menuItems = document.querySelectorAll('.menu-item');
        const submenuItems = document.querySelectorAll('.submenu-item');
        const tabsHeader = document.getElementById('tabsHeader');
        const mainIframe = document.getElementById('mainIframe');
        const welcomeTip = document.getElementById('welcomeTip');
        const logoutBtn = document.getElementById('logoutBtn');
        const roleBtn = document.getElementById('roleBtn');
        const roleDropdown = document.getElementById('roleDropdown');
        const currentRoleEl = document.getElementById('currentRole');
        const roleOptions = document.querySelectorAll('.role-option');
        const welcomeUserName = document.getElementById('welcomeUserName');
        const welcomeRole = document.getElementById('welcomeRole');

        // 初始化欢迎信息
        welcomeUserName.textContent = currentUserName;
        welcomeRole.textContent = currentRole;

        // 初始化一级菜单展开/收起
        menuItems.forEach(menu => {
            menu.addEventListener('click', function() {
                const menuId = this.id;
                const submenuId = 'sub' + menuId;
                const submenu = document.getElementById(submenuId);
                const arrow = this.querySelector('.menu-arrow');
                
                // 切换展开/收起状态
                submenu.classList.toggle('show');
                arrow.classList.toggle('expanded');
                
                // 高亮当前一级菜单
                menuItems.forEach(m => m.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 初始化二级菜单点击事件
        submenuItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.stopPropagation(); // 阻止事件冒泡到一级菜单
                
                const url = this.getAttribute('data-url');
                const title = this.getAttribute('data-title');
                addOrActivateTab(url, title);
                
                // 高亮当前二级菜单，取消其他二级菜单高亮
                submenuItems.forEach(si => si.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // 角色切换功能
        roleBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            roleDropdown.classList.toggle('show');
        });

        roleOptions.forEach(option => {
            option.addEventListener('click', function() {
                currentRole = this.getAttribute('data-role');
                currentRoleEl.textContent = currentRole;
                welcomeRole.textContent = currentRole;
                roleDropdown.classList.remove('show');
                
                // 角色切换提示
                alert(`✅ 已成功切换为【${currentRole}】角色！\n系统将根据角色权限调整功能可见性。`);
                // 实际项目中可在这里添加权限控制逻辑
                // window.location.reload();
            });
        });

        // 点击页面其他区域关闭角色下拉菜单
        document.addEventListener('click', function() {
            roleDropdown.classList.remove('show');
        });

        // 退出登录事件
        logoutBtn.addEventListener('click', function() {
            if (confirm('🚪 确定要退出登录吗？')) {
                alert('👋 已成功退出登录，感谢使用研究生管理系统！');
                // window.location.href = 'login.html';
            }
        });

        /**
         * 添加或激活页签
         * @param {string} url - 页面URL
         * @param {string} title - 页签标题
         */
        function addOrActivateTab(url, title) {
            // 检查是否已存在该页签
            const existingTab = tabs.find(tab => tab.url === url);
            
            if (existingTab) {
                // 激活已有页签
                activateTab(existingTab.id);
            } else {
                // 创建新页签
                const tabId = 'tab_' + Date.now();
                const newTab = {
                    id: tabId,
                    url: url,
                    title: title
                };
                tabs.push(newTab);
                
                // 创建页签DOM
                const tabElement = document.createElement('div');
                tabElement.className = 'tab-item';
                tabElement.id = tabId;
                tabElement.innerHTML = `
                    ${title}
                    <span class="tab-close" data-id="${tabId}">×</span>
                `;
                tabsHeader.appendChild(tabElement);
                
                // 绑定页签点击事件
                tabElement.addEventListener('click', function() {
                    activateTab(tabId);
                });
                
                // 绑定关闭按钮事件
                tabElement.querySelector('.tab-close').addEventListener('click', function(e) {
                    e.stopPropagation(); // 阻止事件冒泡
                    closeTab(tabId);
                });
                
                // 激活新页签
                activateTab(tabId);
            }
            
            // 隐藏欢迎界面，显示iframe
            welcomeTip.style.display = 'none';
            mainIframe.style.display = 'block';
        }

        /**
         * 激活指定页签
         * @param {string} tabId - 页签ID
         */
        function activateTab(tabId) {
            // 更新激活状态
            tabs.forEach(tab => {
                const tabElement = document.getElementById(tab.id);
                if (tab.id === tabId) {
                    tabElement.classList.add('active');
                    mainIframe.src = tab.url;
                    activeTabId = tabId;
                    
                    // 高亮对应的二级菜单
                    submenuItems.forEach(si => {
                        if (si.getAttribute('data-url') === tab.url) {
                            si.classList.add('active');
                            // 展开对应的一级菜单
                            const menuItem = si.closest('.submenu').previousElementSibling;
                            menuItem.classList.add('active');
                            menuItem.querySelector('.menu-arrow').classList.add('expanded');
                            si.closest('.submenu').classList.add('show');
                        } else {
                            si.classList.remove('active');
                        }
                    });
                } else {
                    tabElement.classList.remove('active');
                }
            });
        }

        /**
         * 关闭指定页签
         * @param {string} tabId - 页签ID
         */
        function closeTab(tabId) {
            // 如果关闭的是激活的页签，需要激活其他页签
            const isActiveTab = tabId === activeTabId;
            
            // 从数组中移除
            tabs = tabs.filter(tab => tab.id !== tabId);
            
            // 移除DOM元素
            const tabElement = document.getElementById(tabId);
            tabElement.remove();
            
            // 如果关闭的是激活页签，激活第一个存在的页签
            if (isActiveTab && tabs.length > 0) {
                activateTab(tabs[0].id);
            } else if (tabs.length === 0) {
                // 没有页签时显示欢迎界面
                mainIframe.style.display = 'none';
                welcomeTip.style.display = 'flex';
                // 取消所有菜单高亮
                menuItems.forEach(mi => {
                    mi.classList.remove('active');
                    const arrow = mi.querySelector('.menu-arrow');
                    if (arrow) arrow.classList.remove('expanded');
                });
                submenuItems.forEach(si => si.classList.remove('active'));
                document.querySelectorAll('.submenu').forEach(sm => sm.classList.remove('show'));
                activeTabId = null;
            }
        }
    </script>
</body>
</html>
