<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>研究生邮件模板 · 分数变动风格卡片</title>
    <!-- 完全移植第二页的字体、图标库、整体视觉 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== 完全采用第二个页面的样式体系，保留其所有颜色、圆角、阴影、弹窗 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #eef3f8;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .full-screen {
            width: 100%;
            padding: 1.5rem 1.8rem; 
            flex: 1;
        }
        @media (max-width: 640px) {
            .full-screen { padding: 1rem 1rem; }
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,20,40,0.08);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e9eef4;
            width: 100%;
        }
        @media (max-width: 640px) {
            .card { padding: 1.5rem 1.2rem; }
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 1.5rem;
        }
        .section-title i { color: #2f6e9e; font-size: 1.4rem; }

        /* 筛选栏 —— 完全使用第二页的 filter-bar 设计 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
            margin-bottom: 0.5rem;  /* 内部间距微调 */
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 170px;
            flex: 1 1 160px;
        }
        .filter-item label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
        }
        .filter-input, .filter-select {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.65rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn {
            border: none;
            background: transparent;
            font-weight: 500;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .btn-primary {
            background: #1e4a6f;
            color: white;
            box-shadow: 0 4px 10px rgba(0,60,110,0.2);
        }
        .btn-primary:hover { background: #123a58; transform: translateY(-2px); }
        .btn-outline {
            background: white;
            border-color: #cbd5e1;
            color: #2c455d;
        }
        .btn-outline:hover { background: #f1f7fd; border-color: #9bb0c5; }
        .btn-sm { padding: 0.45rem 1.2rem; font-size: 0.8rem; }

        /* 卡片工具栏 (替代原.card-toolbar) 融入卡片风格 */
        .toolbar-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .select-all-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: #1e3b5c;
            font-size: 0.9rem;
            background: #f8fafd;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #dde3ea;
        }
        .select-all-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #1e4a6f;
        }

        /* 卡片列表容器 (分数变动版卡片列表) */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 0.5rem;
        }

        /* 卡片设计 —— 融合第二页的卡片细节 + 第一页的内容布局 */
        .card-item {
            background: #ffffff;
            border-radius: 28px;
            padding: 1.5rem 1.8rem;
            box-shadow: 0 6px 14px rgba(0,20,40,0.04);
            border: 1px solid #e9eef4;
            transition: box-shadow 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
        }
        .card-item:hover {
            box-shadow: 0 15px 30px rgba(0,30,60,0.08);
            border-color: #c0d2e8;
        }

        /* 复选框沿用分数变动风格 */
        .card-check {
            width: 20px;
            height: 20px;
            accent-color: #1e4a6f;
            cursor: pointer;
            flex-shrink: 0;
        }

        .card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        .card-row-1 {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .template-name {
            font-weight: 650;
            font-size: 1.1rem;
            color: #0b2b40;
        }
        .badge {
            background: #e3f0fa;
            color: #11517c;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }
        .badge.active {
            background: #1e4a6f;
            color: white;
        }

        .card-row-2 {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            color: #4e6f8c;
            font-size: 0.85rem;
        }
        .card-row-2 i {
            width: 16px;
            color: #6f8faf;
            margin-right: 4px;
        }
        .card-row-2 span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* 操作按钮组 — 改用分数变动版的 icon-btn 风格 */
        .card-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            margin-left: auto;
        }
        .icon-btn {
            background: #f2f8ff;
            border: none;
            font-size: 0.8rem;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            color: #2a577b;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid transparent;
            transition: 0.1s;
        }
        .icon-btn:hover { background: #dae9f8; }
        .icon-btn.delete-btn:hover { background: #ffeae9; color: #b13e3e; }

        /* 分页栏 — 完全复用分数变动版 */
        .pagination-bar {
            display: flex; 
            justify-content: flex-end; 
            align-items: center;
            gap: 0.5rem; 
            margin-top: 1.8rem; 
            flex-wrap: wrap;
        }
        .pagination-btn {
            background: white; 
            border: 1px solid #c9d9eb; 
            color: #1d4a6b;
            width: 38px; 
            height: 38px; 
            border-radius: 12px;
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            font-weight: 500; 
            cursor: pointer; 
            transition: 0.1s;
        }
        .pagination-btn.active { 
            background: #1e4a6f; 
            border-color: #1e4a6f; 
            color: white; 
        }
        .pagination-btn:hover:not(.active) { background: #e5f0fb; }
        .page-info { 
            color: #466585; 
            margin-right: 0.8rem; 
            font-size: 0.9rem; 
        }

        /* ===== 弹窗 (分数变动版Modal，完全复制) ===== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,20,40,0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-card {
            background: white; border-radius: 32px; width: 90%; max-width: 900px;
            padding: 2rem 2.2rem; box-shadow: 0 40px 70px rgba(0,20,50,0.4);
            transform: scale(0.95); transition: transform 0.2s ease;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.show .modal-card { transform: scale(1); }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-header h3 { font-size: 1.6rem; font-weight: 600; color: #0c2b48; }
        .modal-close {
            background: none; border: none; font-size: 2.2rem; cursor: pointer;
            color: #8ba5c2; line-height: 1;
        }
        .modal-close:hover { color: #1e3a5f; }

        /* 弹窗内表单网格 (左: 编辑区; 右: 变量面板) 用grid搭配 */
        .modal-body-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 1.5rem;
        }
        .edit-form { display: flex; flex-direction: column; gap: 0.8rem; }
        .variable-panel {
            background: #f8fcff;
            border-radius: 24px;
            padding: 1.2rem 1.2rem;
            border: 1px solid #dbe7f3;
            height: fit-content;
        }
        .variable-panel h4 {
            font-size: 0.9rem;
            color: #1f4e7a;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .var-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
        .var-tag {
            background: white;
            border: 1px solid #c6daf2;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-family: 'SF Mono', monospace;
            cursor: pointer;
            transition: 0.15s;
            color: #1c5b9c;
            font-weight: 500;
        }
        .var-tag:hover { background: #1e4a6f; border-color: #1e4a6f; color: white; }

        .form-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .form-label {
            width: 80px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #4e6f8c;
            text-transform: uppercase;
        }
        .form-control {
            flex: 1;
            min-width: 200px;
            padding: 0.65rem 1.2rem;
            border: 1px solid #dde3ea;
            border-radius: 20px;
            font-size: 0.9rem;
            background: #f8fafd;
            transition: border 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .form-control:focus {
            border-color: #2f6e9e;
            outline: none;
            box-shadow: 0 0 0 3px rgba(47,110,158,0.15);
            background: white;
        }
        .form-control:disabled, .form-control[readonly] {
            background: #ecf2f9;
            color: #2a4e6e;
            border-color: #cbd9ec;
        }

        /* 富文本区域保持原来干净风格，融入新边框 */
        .rich-toolbar {
            border: 1px solid #dde3ea;
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            background: #f8fcff;
            padding: 6px 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .rich-toolbar i {
            color: #4f73a3;
            padding: 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .rich-toolbar i:hover { background: #e2efff; }
        .rich-content {
            border: 1px solid #dde3ea;
            border-top: none;
            border-radius: 0 0 20px 20px;
            min-height: 100px;
            padding: 12px;
            background: white;
            resize: vertical;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #1b2f44;
        }
        .rich-content[contenteditable="false"] { background: #f2f6fc; }

        .toggle-switch { display: inline-flex; align-items: center; gap: 10px; }
        .toggle-switch input {
            width: 40px; height: 20px;
            appearance: none;
            background: #c7d9ee;
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }
        .toggle-switch input:checked { background: #1e4a6f; }
        .toggle-switch input::before {
            content: '';
            position: absolute;
            width: 18px; height: 18px;
            background: white;
            border-radius: 50%;
            top: 1px; left: 1px;
            transition: 0.2s;
        }
        .toggle-switch input:checked::before { left: 21px; }
        .toggle-switch span { font-weight: 500; color: #2b5580; font-size: 0.9rem; }

        .modal-actions {
            display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;
        }

        /* toast */
        .toast-message {
            background: #1e4a6f; color: white; padding: 0.8rem 2rem;
            border-radius: 60px; font-weight: 500; box-shadow: 0 15px 30px rgba(0,40,70,0.4);
            position: fixed; bottom: 30px; right: 30px; z-index: 1100;
            opacity: 0; transform: translateY(10px); transition: 0.2s; pointer-events: none;
        }
        .toast-message.show { opacity: 1; transform: translateY(0); }

        /* confirm 沿用原简洁风格，融入新背景 */
        .confirm-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,20,40,0.6); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center;
            z-index: 2000;
        }
        .confirm-box {
            background: white; border-radius: 32px; padding: 28px 32px;
            width: 380px; max-width: 90%; box-shadow: 0 20px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .confirm-box i { font-size: 3rem; color: #1e4a6f; }
        .confirm-box p { margin: 20px 0 24px; font-size: 1.1rem; color: #1e3448; font-weight: 500; }
        .confirm-actions button {
            padding: 12px 32px; border-radius: 40px; font-weight: 600; border: none; cursor: pointer;
            font-size: 1rem; transition: 0.2s;
        }
        .btn-confirm { background: #1e4a6f; color: white; }
        .btn-confirm:hover { background: #123a58; }
        .btn-cancel { background: #f0f5fd; color: #2d5580; }
        .btn-cancel:hover { background: #e2ecf9; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="full-screen">
    <!-- 卡片：搜索栏 + 操作按钮 (完全采用第二页的 filter-bar 布局) -->
    <div class="card">
        <div class="filter-bar">
            <div class="filter-item">
                <label><i class="fas fa-search"></i> 模板名称</label>
                <input type="text" class="filter-input" id="searchName" placeholder="模板名称">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-tags"></i> 分类</label>
                <select class="filter-select" id="searchCategory">
                    <option value="">全部分类</option>
                    <option value="招生">招生/录取</option>
                    <option value="教学">教学/答辩</option>
                    <option value="奖助">奖助/勤工</option>
                    <option value="日常">日常通知</option>
                </select>
            </div>
            <div class="filter-item">
                <label><i class="fas fa-circle"></i> 状态</label>
                <select class="filter-select" id="searchStatus">
                    <option value="">全部状态</option>
                    <option value="1">启用</option>
                    <option value="0">禁用</option>
                </select>
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                <button class="btn btn-outline" id="searchBtn"><i class="fas fa-sliders-h"></i> 筛选</button>
                <button class="btn btn-primary" id="newTemplateBtn"><i class="fas fa-plus-circle"></i> 新建模板</button>
                <button class="btn btn-outline delete-btn" id="batchDeleteBtn" style="color:#b13e3e;"><i class="fas fa-trash-alt"></i> 批量删除</button>
            </div>
        </div>
    </div>

    <!-- 邮件模板列表卡片 -->
    <div class="card">
        <div class="toolbar-card">
            <div class="select-all-wrapper">
                <input type="checkbox" id="selectAll">
                <label for="selectAll">全选模板</label>
            </div>
            <!-- 占位，无其他 -->
        </div>
        <div class="card-list" id="cardList"></div>

        <!-- 分页 (第二版样式) -->
        <div class="pagination-bar" id="paginationBar">
            <span class="page-info" id="pageInfo">第 1 页 / 共 1 页</span>
            <div class="pagination-controls" id="pageControls"></div>
        </div>
    </div>
</div>

<!-- 弹窗 (完全融合分数变动版样式，但内部结构与原邮件模板一致) -->
<div class="modal-overlay" id="templateModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle"><i class="fas fa-pen"></i> 新建模板</h3>
            <button class="modal-close" id="modalCloseIcon">&times;</button>
        </div>
        <div class="modal-body-grid">
            <!-- 左边编辑表单 -->
            <div class="edit-form">
                <div class="form-row"><span class="form-label">模板名称</span><input type="text" class="form-control" id="templateName" placeholder="例如：2024博士录取通知"></div>
                <div class="form-row"><span class="form-label">分类</span>
                    <select class="form-control" id="templateCategory">
                        <option value="招生">招生/录取</option><option value="教学">教学/答辩</option><option value="奖助">奖助/勤工</option><option value="日常">日常通知</option>
                    </select>
                </div>
                <div class="form-row"><span class="form-label">邮件主题</span><input type="text" class="form-control" id="templateSubject" value="【研究生院】关于{姓名}同学的通知"></div>
                <div class="form-row"><span class="form-label">发件人</span>
                    <select class="form-control" id="templateSender">
                        <option>研究生院 < graduate@school.edu ></option>
                        <option>学生处 < student@school.edu ></option>
                        <option>学位办 < degree@school.edu ></option>
                    </select>
                </div>
                <div class="form-row" style="align-items:flex-start;">
                    <span class="form-label">正文</span>
                    <div style="flex:1; min-width:0;">
                        <div class="rich-toolbar">
                            <i class="fas fa-bold" title="加粗"></i><i class="fas fa-italic" title="斜体"></i><i class="fas fa-underline" title="下划线"></i>
                            <i class="fas fa-list-ul" title="列表"></i><i class="fas fa-link" title="插入链接"></i><i class="fas fa-table" title="表格"></i><i class="fas fa-image" title="图片"></i>
                        </div>
                        <div id="templateBody" class="rich-content" contenteditable="true">尊敬的 {导师姓名} 老师，您好！<br>您的学生 {姓名} 的答辩安排在 {答辩时间}，地点 {答辩地点}。</div>
                    </div>
                </div>
                <div class="form-row"><span class="form-label">附件配置</span><select class="form-control" style="flex:0.3;" id="templateAttachment"><option>无附件</option><option>固定附件(答辩须知.pdf)</option><option>动态(根据成绩单)</option></select></div>
                <div class="form-row"><span class="form-label">状态</span><div class="toggle-switch"><input type="checkbox" id="templateStatus" checked><span>启用</span></div></div>
            </div>
            <!-- 右边变量面板 -->
            <div class="variable-panel" id="modalVarPanel">
                <h4><i class="fas fa-code"></i> 可用变量</h4>
                <div class="var-buttons" id="variableList">
                    <span class="var-tag" data-var="{姓名}">{姓名}</span><span class="var-tag" data-var="{学号}">{学号}</span>
                    <span class="var-tag" data-var="{导师姓名}">{导师姓名}</span><span class="var-tag" data-var="{学院}">{学院}</span>
                    <span class="var-tag" data-var="{答辩时间}">{答辩时间}</span><span class="var-tag" data-var="{事项名称}">{事项名称}</span>
                    <span class="var-tag" data-var="{当前日期}">{当前日期}</span><span class="var-tag" data-var="{奖学金金额}">{奖学金金额}</span>
                    <span class="var-tag" data-var="{论文题目}">{论文题目}</span>
                </div>
                <hr style="margin:16px 0; border-color:#dbe7f3;">
                <p style="font-size:0.75rem; color:#4679b3;"><i class="fas fa-magic"></i> 点击变量插入光标位置</p>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="modalTestBtn"><i class="fas fa-paper-plane"></i> 测试发送</button>
            <button class="btn btn-primary" id="modalSaveBtn"><i class="fas fa-save"></i> 保存模板</button>
            <button class="btn btn-outline" id="modalCloseBtn">关闭</button>
        </div>
    </div>
</div>

<!-- toast & confirm 复用 -->
<div id="toast" class="toast-message">操作成功</div>
<div class="confirm-overlay" id="confirmOverlay"><div class="confirm-box"><i class="fas fa-question-circle"></i><p id="confirmMessage">确定要执行此操作吗？</p><div class="confirm-actions"><button class="btn-cancel" id="confirmCancel">取消</button><button class="btn-confirm" id="confirmOk">确认</button></div></div></div>

<script>
    (function() {
        // ---------- 原邮件模板数据与逻辑，完全保留，仅调整UI绑定 ----------
        let templates = [
            { id: 1, name: '2024博士录取通知', category: '招生', scene: '博士录取', modifier: '张老师', modifyTime: '2024-03-10 14:23', status: true },
            { id: 2, name: '论文答辩安排模板', category: '教学', scene: '答辩告知', modifier: '李教授', modifyTime: '2024-03-09 09:12', status: true },
            { id: 3, name: '国家奖学金公示', category: '奖助', scene: '奖学金通知', modifier: '王老师', modifyTime: '2024-03-08 16:40', status: false },
            { id: 4, name: '开学注册提醒', category: '日常', scene: '注册通知', modifier: '赵秘书', modifyTime: '2024-03-07 11:05', status: true },
            { id: 5, name: '硕士录取确认书', category: '招生', scene: '录取确认', modifier: '张老师', modifyTime: '2024-03-06 10:30', status: true },
            { id: 6, name: '答辩委员会邀请', category: '教学', scene: '专家邀请', modifier: '刘教授', modifyTime: '2024-03-05 16:20', status: true },
            { id: 7, name: '学业预警通知', category: '日常', scene: '预警', modifier: '周老师', modifyTime: '2024-03-04 09:45', status: false },
        ];

        let currentEditId = null;      
        let currentMode = 'add';        
        let currentPage = 1;
        const pageSize = 5;

        // DOM 重新获取
        const cardList = document.getElementById('cardList');
        const selectAllCheck = document.getElementById('selectAll');
        const searchName = document.getElementById('searchName');
        const searchCategory = document.getElementById('searchCategory');
        const searchStatus = document.getElementById('searchStatus');
        const searchBtn = document.getElementById('searchBtn');
        const newBtn = document.getElementById('newTemplateBtn');
        const batchDeleteBtn = document.getElementById('batchDeleteBtn');
        const pageControls = document.getElementById('pageControls');
        const pageInfo = document.getElementById('pageInfo');

        // 弹窗元素
        const modalOverlay = document.getElementById('templateModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalCloseIcon = document.getElementById('modalCloseIcon');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalTestBtn = document.getElementById('modalTestBtn');
        const modalSaveBtn = document.getElementById('modalSaveBtn');
        const modalVarPanel = document.getElementById('modalVarPanel');
        const templateName = document.getElementById('templateName');
        const templateCategory = document.getElementById('templateCategory');
        const templateSubject = document.getElementById('templateSubject');
        const templateSender = document.getElementById('templateSender');
        const templateBody = document.getElementById('templateBody');
        const templateAttachment = document.getElementById('templateAttachment');
        const templateStatus = document.getElementById('templateStatus');

        // toast 函数 (使用新的toast)
        const toastEl = document.getElementById('toast');
        function showToast(message, type = 'success', duration = 2000) {
            toastEl.textContent = message;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), duration);
        }

        function showConfirm(message) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('confirmOverlay');
                const msgEl = document.getElementById('confirmMessage');
                const cancelBtn = document.getElementById('confirmCancel');
                const okBtn = document.getElementById('confirmOk');
                msgEl.innerText = message;
                overlay.style.display = 'flex';
                const close = (result) => { overlay.style.display = 'none'; resolve(result); };
                cancelBtn.onclick = () => close(false);
                okBtn.onclick = () => close(true);
                overlay.onclick = (e) => { if (e.target === overlay) close(false); };
            });
        }

        // 变量插入逻辑
        document.addEventListener('click', function(e) {
            const varTag = e.target.closest('.var-tag');
            if (!varTag) return;
            if (modalOverlay.style.visibility !== 'visible') return;
            if (templateBody.contentEditable !== 'true') { showToast('预览模式下无法插入变量', 'info'); return; }
            const varText = varTag.getAttribute('data-var');
            templateBody.focus();
            document.execCommand('insertText', false, varText);
        });

        function getFilteredTemplates() {
            const nameVal = searchName.value.toLowerCase();
            const catVal = searchCategory.value;
            const statVal = searchStatus.value;
            return templates.filter(t => {
                const matchName = t.name.toLowerCase().includes(nameVal);
                const matchCat = catVal ? t.category === catVal : true;
                const matchStatus = statVal !== '' ? (statVal === '1' ? t.status : !t.status) : true;
                return matchName && matchCat && matchStatus;
            });
        }

        function renderTable() {
            const filtered = getFilteredTemplates();
            const total = filtered.length;
            const totalPages = Math.ceil(total / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * pageSize;
            const pageData = filtered.slice(start, start + pageSize);

            let html = '';
            pageData.forEach(t => {
                const statusClass = t.status ? 'active' : '';
                const statusText = t.status ? '启用' : '禁用';
                html += `
                    <div class="card-item">
                        <input type="checkbox" class="card-check row-check" data-id="${t.id}">
                        <div class="card-info">
                            <div class="card-row-1">
                                <span class="template-name">${t.name}</span>
                                <span class="badge">${t.category}</span>
                                <span class="badge ${statusClass}">${statusText}</span>
                            </div>
                            <div class="card-row-2">
                                <span><i class="fas fa-tag"></i> 场景: ${t.scene}</span>
                                <span><i class="fas fa-user-edit"></i> ${t.modifier}</span>
                                <span><i class="fas fa-calendar-alt"></i> ${t.modifyTime}</span>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="icon-btn" data-action="edit" data-id="${t.id}"><i class="fas fa-edit"></i> 编辑</button>
                            <button class="icon-btn delete-btn" data-action="delete" data-id="${t.id}"><i class="fas fa-trash-alt"></i> 删除</button>
                            <button class="icon-btn" data-action="view" data-id="${t.id}"><i class="fas fa-eye"></i> 预览</button>
                            <button class="icon-btn" data-action="test" data-id="${t.id}"><i class="fas fa-paper-plane"></i> 测试</button>
                            <button class="icon-btn" data-action="copy" data-id="${t.id}"><i class="fas fa-copy"></i> 复制</button>
                        </div>
                    </div>
                `;
            });
            cardList.innerHTML = html || '<div style="padding: 40px; text-align: center; color: #7e99b9;">暂无匹配模板</div>';
            selectAllCheck.checked = false;
            updatePagination(totalPages);
            pageInfo.innerText = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
        }

        function updatePagination(totalPages) {
            let btns = '';
            for (let i = 1; i <= totalPages; i++) {
                btns += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }
            pageControls.innerHTML = btns;
            const prev = document.createElement('button');
            prev.className = `pagination-btn ${currentPage === 1 ? 'disabled' : ''}`;
            prev.innerHTML = '<i class="fas fa-chevron-left"></i>';
            prev.onclick = () => { if (currentPage > 1) { currentPage--; renderTable(); } };
            const next = document.createElement('button');
            next.className = `pagination-btn ${currentPage === totalPages ? 'disabled' : ''}`;
            next.innerHTML = '<i class="fas fa-chevron-right"></i>';
            next.onclick = () => { if (currentPage < totalPages) { currentPage++; renderTable(); } };
            pageControls.prepend(prev);
            pageControls.appendChild(next);
            document.querySelectorAll('.pagination-btn[data-page]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const page = parseInt(e.target.dataset.page);
                    if (page !== currentPage) { currentPage = page; renderTable(); }
                });
            });
        }

        function findTemplateById(id) { return templates.find(t => t.id === id); }

        function clearForm() {
            templateName.value = '';
            templateCategory.value = '招生';
            templateSubject.value = '【研究生院】关于{姓名}同学的通知';
            templateSender.value = '研究生院 < graduate@school.edu >';
            templateBody.innerHTML = '尊敬的 {导师姓名} 老师，您好！<br>您的学生 {姓名} 的答辩安排在 {答辩时间}，地点 {答辩地点}。';
            templateAttachment.value = '无附件';
            templateStatus.checked = true;
        }

        function fillForm(t) {
            templateName.value = t.name || '';
            templateCategory.value = t.category || '招生';
            templateSubject.value = '【研究生院】关于{姓名}同学的通知';
            templateSender.value = '研究生院 < graduate@school.edu >';
            templateBody.innerHTML = '尊敬的 {导师姓名} 老师，您好！<br>您的学生 {姓名} 的答辩安排在 {答辩时间}，地点 {答辩地点}。';
            templateAttachment.value = '无附件';
            templateStatus.checked = t.status;
        }

        function setModalMode(mode, templateId = null) {
            currentMode = mode;
            if (mode === 'add') {
                modalTitle.innerHTML = '<i class="fas fa-plus-circle"></i> 新建模板';
                clearForm(); currentEditId = null;
                setFormEditable(true); modalVarPanel.classList.remove('hidden');
                modalTestBtn.style.display = 'inline-flex'; modalSaveBtn.style.display = 'inline-flex';
            } else if (mode === 'edit') {
                modalTitle.innerHTML = '<i class="fas fa-edit"></i> 编辑模板';
                const t = findTemplateById(templateId); if (t) { fillForm(t); currentEditId = templateId; }
                setFormEditable(true); modalVarPanel.classList.remove('hidden');
                modalTestBtn.style.display = 'inline-flex'; modalSaveBtn.style.display = 'inline-flex';
            } else if (mode === 'view') {
                modalTitle.innerHTML = '<i class="fas fa-eye"></i> 查看模板';
                const t = findTemplateById(templateId); if (t) { fillForm(t); currentEditId = templateId; }
                setFormEditable(false); modalVarPanel.classList.add('hidden');
                modalTestBtn.style.display = 'none'; modalSaveBtn.style.display = 'none';
            }
        }

        function setFormEditable(editable) {
            [templateName, templateCategory, templateSubject, templateSender, templateAttachment].forEach(f => {
                if (editable) { f.removeAttribute('disabled'); f.removeAttribute('readonly'); } else { f.setAttribute('disabled', true); }
            });
            if (editable) { templateBody.setAttribute('contenteditable', 'true'); templateStatus.removeAttribute('disabled'); } 
            else { templateBody.setAttribute('contenteditable', 'false'); templateStatus.setAttribute('disabled', true); }
        }

        function openModal() { modalOverlay.style.visibility = 'visible'; modalOverlay.classList.add('show'); }
        function closeModal() { modalOverlay.classList.remove('show'); modalOverlay.style.visibility = 'hidden'; setFormEditable(true); }

        function saveTemplate() {
            const name = templateName.value.trim();
            if (!name) { showToast('模板名称不能为空', 'error'); return; }
            const category = templateCategory.value;
            const status = templateStatus.checked;
            const now = new Date().toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-');
            if (currentEditId) {
                const index = templates.findIndex(t => t.id === currentEditId);
                if (index !== -1) { templates[index] = { ...templates[index], name, category, status, modifier: '当前用户', modifyTime: now }; showToast('模板更新成功'); }
            } else {
                const newId = Math.max(...templates.map(t => t.id), 0) + 1;
                templates.push({ id: newId, name, category, scene: '新建场景', modifier: '当前用户', modifyTime: now, status });
                showToast('新模板创建成功');
            }
            renderTable();
            closeModal();
        }

        function testSendFromModal() { const name = templateName.value.trim() || '未命名模板'; showToast(`测试邮件“${name}”已发送至 test@school.edu (模拟)`); }
        async function deleteTemplate(id) { const confirmed = await showConfirm('确定要删除这个模板吗？'); if (confirmed) { templates = templates.filter(t => t.id !== id); if (currentEditId === id) closeModal(); renderTable(); showToast('模板已删除'); } }
        function copyTemplate(id) { const source = findTemplateById(id); if (source) { const newId = Math.max(...templates.map(t => t.id), 0) + 1; templates.push({ ...source, id: newId, name: source.name + ' - 复制', modifier: '当前用户', modifyTime: new Date().toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-') }); renderTable(); showToast('模板已复制'); } }
        function previewTemplate(id) { setModalMode('view', id); openModal(); }
        function testSendFromRow(id) { const t = findTemplateById(id); showToast(`测试邮件“${t.name}”已发送至 test@school.edu (模拟)`); }

        // 卡片操作监听
        document.addEventListener('click', async (e) => {
            const btn = e.target.closest('.icon-btn');
            if (!btn) return;
            const action = btn.getAttribute('data-action');
            const id = Number(btn.getAttribute('data-id'));
            if (!action || !id) return;
            e.preventDefault();
            if (action === 'edit') { setModalMode('edit', id); openModal(); }
            else if (action === 'delete') { await deleteTemplate(id); }
            else if (action === 'copy') { copyTemplate(id); }
            else if (action === 'view') { previewTemplate(id); }
            else if (action === 'test') { testSendFromRow(id); }
        });

        // 全选 / 批量删除
        selectAllCheck.addEventListener('change', (e) => { document.querySelectorAll('.row-check').forEach(cb => cb.checked = e.target.checked); });
        batchDeleteBtn.addEventListener('click', async () => {
            const checkboxes = document.querySelectorAll('.row-check:checked');
            if (checkboxes.length === 0) { showToast('请先勾选要删除的模板', 'error'); return; }
            const confirmed = await showConfirm(`确定删除选中的 ${checkboxes.length} 个模板吗？`);
            if (confirmed) {
                const idsToDelete = Array.from(checkboxes).map(cb => Number(cb.dataset.id));
                templates = templates.filter(t => !idsToDelete.includes(t.id));
                if (currentEditId && idsToDelete.includes(currentEditId)) closeModal();
                renderTable(); showToast('批量删除完成');
            }
        });

        newBtn.addEventListener('click', () => { setModalMode('add'); openModal(); });
        modalSaveBtn.addEventListener('click', saveTemplate);
        modalTestBtn.addEventListener('click', testSendFromModal);
        modalCloseIcon.addEventListener('click', closeModal);
        modalCloseBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
        searchBtn.addEventListener('click', () => { currentPage = 1; renderTable(); });

        renderTable();
    })();
</script>
</body>
</html>
