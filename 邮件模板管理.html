<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研究生邮件模板 · 卡片式列表</title>
    <!-- Font Awesome 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Inter 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background-color: #f5f9ff;
            display: flex;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: #1e2f3f;
        }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f5f9ff;
            overflow: hidden;
            width: 100%;
        }

        /* 搜索栏 (与原风格一致) */
        .search-section {
            background: #ffffff;
            padding: 8px 20px;
            border-bottom: 1px solid #e2eaf2;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .search-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f5f9ff;
            padding: 4px 12px;
            border-radius: 40px;
            border: 1px solid #d7e2ee;
            transition: 0.2s;
        }
        .search-item:focus-within {
            border-color: #2d7fc1;
            background: #ffffff;
        }
        .search-item i {
            color: #6d89a8;
            font-size: 0.9rem;
        }
        .search-item input, .search-item select {
            border: none;
            background: transparent;
            padding: 6px 4px 6px 0;
            font-size: 0.9rem;
            outline: none;
            min-width: 130px;
            color: #1e3b5c;
            font-weight: 500;
        }

        .btn-primary {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
            box-shadow: 0 2px 6px rgba(26,115,232,0.2);
            letter-spacing: 0.3px;
        }
        .btn-primary:hover {
            background: #0e5fc7;
            box-shadow: 0 4px 10px rgba(26,115,232,0.3);
        }

        .btn-secondary {
            background: #ffffff;
            border: 1px solid #c6d6e8;
            color: #1f4b7a;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn-secondary:hover {
            background: #f1f7ff;
            border-color: #9bb9db;
        }

        .btn-danger {
            background: #ffffff;
            border: 1px solid #f3c1c1;
            color: #b54a4a;
        }
        .btn-danger:hover {
            background: #fff5f5;
            border-color: #e19797;
        }

        /* 卡片列表区域 */
        .content-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: transparent;
            overflow: hidden;
        }

        /* 卡片工具栏 (全选 + 额外信息) */
        .card-toolbar {
            background: #ffffff;
            padding: 10px 24px;
            border-bottom: 1px solid #e7eef6;
            display: flex;
            align-items: center;
            gap: 24px;
            flex-shrink: 0;
        }
        .select-all-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: #1e3b5c;
            font-size: 0.9rem;
        }
        .select-all-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #1a73e8;
        }

        /* 卡片容器 (滚动) */
        .card-list {
            padding: 20px 24px;
            background: #f5f9ff;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 卡片设计 */
        .card-item {
            background: white;
            border-radius: 24px;
            padding: 18px 22px;
            box-shadow: 0 4px 12px rgba(0, 20, 40, 0.04);
            border: 1px solid #e2eaf2;
            transition: box-shadow 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            gap: 18px;
            width: 100%;
        }
        .card-item:hover {
            box-shadow: 0 10px 22px rgba(0,30,60,0.08);
            border-color: #c0d2e8;
        }

        /* 复选框样式 */
        .card-check {
            width: 20px;
            height: 20px;
            accent-color: #1a73e8;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* 卡片主体：所有信息区域 */
        .card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0; /* 防止溢出 */
        }

        /* 第一行：名称 + 徽章 */
        .card-row-1 {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .template-name {
            font-weight: 650;
            font-size: 1.05rem;
            color: #0d2742;
        }
        .badge {
            background: #e2efff;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #1a5c9e;
            letter-spacing: 0.3px;
            display: inline-block;
            white-space: nowrap;
        }
        .badge.active {
            background: #1a73e8;
            color: white;
        }

        /* 第二行：场景、修改人、时间 */
        .card-row-2 {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            color: #4f658d;
            font-size: 0.85rem;
        }
        .card-row-2 i {
            width: 16px;
            color: #7e99b9;
            margin-right: 4px;
        }
        .card-row-2 span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* 操作图标区 */
        .card-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            margin-left: auto; /* 靠右 */
        }
        .card-actions i {
            color: #7e99b9;
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.15s;
        }
        .card-actions i:hover {
            color: #1a73e8;
        }
        .card-actions .fa-trash-alt:hover {
            color: #d14545;
        }

        /* 分页栏 */
        .pagination-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
            padding: 8px 20px;
            background: #ffffff;
            border-top: 1px solid #e7eef6;
            flex-shrink: 0;
        }
        .page-info {
            color: #5f7995;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .pagination-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .page-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: white;
            border: 1px solid #cddef0;
            color: #1e4b7c;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .page-btn.active {
            background: #1a73e8;
            border-color: #1a73e8;
            color: white;
        }
        .page-btn:not(.active):hover {
            background: #ecf5ff;
            border-color: #9bb9db;
        }
        .page-btn.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* ---------- 弹窗 (完全不变) ---------- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20000;
        }
        .modal-container {
            background: white;
            border-radius: 32px;
            width: 1100px;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid #e2eaf2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { font-weight: 600; color: #1e3b5c; font-size: 1.2rem; }
        .modal-close { cursor: pointer; font-size: 1.3rem; color: #7e99b9; transition: color 0.2s; }
        .modal-close:hover { color: #1a73e8; }
        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            gap: 24px;
        }
        .edit-form { flex: 3; min-width: 0; }
        .variable-panel {
            flex: 1;
            background: #f8fcff;
            border-radius: 20px;
            padding: 16px 14px;
            border: 1px solid #dbe7f3;
            height: fit-content;
        }
        .variable-panel h4 {
            font-size: 0.9rem;
            color: #1f4e7a;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .var-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
        .var-tag {
            background: white;
            border: 1px solid #c6daf2;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.7rem;
            font-family: 'SF Mono', monospace;
            cursor: pointer;
            transition: 0.15s;
            color: #1c5b9c;
            font-weight: 500;
        }
        .var-tag:hover { background: #1a73e8; border-color: #1a73e8; color: white; }
        .form-row {
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        .form-label {
            width: 80px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #2b5580;
        }
        .form-control {
            flex: 1;
            min-width: 200px;
            padding: 8px 14px;
            border: 1px solid #d4e2f2;
            border-radius: 20px;
            font-size: 0.9rem;
            background: #ffffff;
            transition: border 0.2s;
            color: #1b3046;
        }
        .form-control:focus {
            border-color: #1a73e8;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
        }
        .form-control:disabled, .form-control[readonly] {
            background: #f2f6fc;
            color: #3a5670;
            border-color: #cbd9ec;
        }
        .rich-toolbar {
            border: 1px solid #d4e2f2;
            border-bottom: none;
            border-radius: 16px 16px 0 0;
            background: #f8fcff;
            padding: 6px 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .rich-toolbar i {
            color: #4f73a3;
            padding: 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .rich-toolbar i:hover { background: #e2efff; }
        .rich-content {
            border: 1px solid #d4e2f2;
            border-top: none;
            border-radius: 0 0 16px 16px;
            min-height: 70px;
            padding: 12px;
            background: white;
            resize: vertical;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #1b2f44;
        }
        .rich-content[contenteditable="false"] { background: #f2f6fc; color: #2a405b; }
        .toggle-switch { display: inline-flex; align-items: center; gap: 10px; }
        .toggle-switch input {
            width: 40px; height: 20px;
            appearance: none;
            background: #c7d9ee;
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }
        .toggle-switch input:checked { background: #1a73e8; }
        .toggle-switch input::before {
            content: '';
            position: absolute;
            width: 18px; height: 18px;
            background: white;
            border-radius: 50%;
            top: 1px; left: 1px;
            transition: 0.2s;
        }
        .toggle-switch input:checked::before { left: 21px; }
        .toggle-switch span { font-weight: 500; color: #2b5580; font-size: 0.9rem; }
        .toggle-switch input:disabled { background: #d2def0; cursor: not-allowed; }
        .toggle-switch input:disabled::before { background: #eaeef5; }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid #e2eaf2;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .toast-container {
            position: fixed;
            top: 28px; right: 28px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }
        .toast {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            border-left: 6px solid #1a73e8;
            border-radius: 20px;
            padding: 14px 22px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 280px;
            max-width: 360px;
            pointer-events: auto;
            animation: slideIn 0.2s ease;
            font-size: 0.95rem;
            color: #1e2f40;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .toast.success { border-left-color: #2e9c5e; }
        .toast.error { border-left-color: #d14545; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .confirm-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .confirm-box {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 28px 32px;
            width: 380px;
            max-width: 90%;
            box-shadow: 0 20px 30px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .confirm-box i { font-size: 3rem; color: #1a73e8; }
        .confirm-box p { margin: 20px 0 24px; font-size: 1.1rem; color: #1e3448; font-weight: 500; }
        .confirm-actions button {
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn-confirm { background: #1a73e8; color: white; }
        .btn-confirm:hover { background: #0e5fc7; }
        .btn-cancel { background: #f0f5fd; color: #2d5580; }
        .btn-cancel:hover { background: #e2ecf9; }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="main-panel">
        <!-- 搜索栏 (完全不变) -->
        <div class="search-section">
            <div class="search-item">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="模板名称" id="searchName">
            </div>
            <div class="search-item">
                <i class="fas fa-tags"></i>
                <select id="searchCategory">
                    <option value="">全部分类</option>
                    <option value="招生">招生/录取</option>
                    <option value="教学">教学/答辩</option>
                    <option value="奖助">奖助/勤工</option>
                    <option value="日常">日常通知</option>
                </select>
            </div>
            <div class="search-item">
                <i class="fas fa-circle"></i>
                <select id="searchStatus">
                    <option value="">全部状态</option>
                    <option value="1">启用</option>
                    <option value="0">禁用</option>
                </select>
            </div>
            <button class="btn-secondary" id="searchBtn"><i class="fas fa-sliders-h"></i> 筛选</button>
            <button class="btn-primary" id="newTemplateBtn"><i class="fas fa-plus-circle"></i> 新建模板</button>
            <button class="btn-secondary btn-danger" id="batchDeleteBtn"><i class="fas fa-trash-alt"></i> 批量删除</button>
        </div>

        <!-- 卡片列表区域 (替换原表格) -->
        <div class="content-card">
            <!-- 全选工具栏 -->
            <div class="card-toolbar">
                <div class="select-all-wrapper">
                    <input type="checkbox" id="selectAll">
                    <label for="selectAll">全选模板</label>
                </div>
                <!-- 可预留一个选中计数，但不影响功能 -->
            </div>

            <!-- 卡片容器 -->
            <div class="card-list" id="cardList"></div>

            <!-- 分页栏 (与原位置相同) -->
            <div class="pagination-bar" id="paginationBar">
                <span class="page-info" id="pageInfo">第 1 页 / 共 1 页</span>
                <div class="pagination-controls" id="pageControls"></div>
            </div>
        </div>
    </div>

    <!-- 弹窗 (结构不变) -->
    <div class="modal-overlay" id="templateModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">新建模板</h3>
                <i class="fas fa-times modal-close" id="modalCloseIcon"></i>
            </div>
            <div class="modal-body">
                <div class="edit-form">
                    <div class="form-row"><span class="form-label">模板名称</span><input type="text" class="form-control" id="templateName" placeholder="例如：2024博士录取通知"></div>
                    <div class="form-row"><span class="form-label">分类</span><select class="form-control" id="templateCategory"><option value="招生">招生/录取</option><option value="教学">教学/答辩</option><option value="奖助">奖助/勤工</option><option value="日常">日常通知</option></select></div>
                    <div class="form-row"><span class="form-label">邮件主题</span><input type="text" class="form-control" id="templateSubject" value="【研究生院】关于{姓名}同学的通知"></div>
                    <div class="form-row"><span class="form-label">发件人</span><select class="form-control" id="templateSender"><option>研究生院 < graduate@school.edu ></option><option>学生处 < student@school.edu ></option><option>学位办 < degree@school.edu ></option></select></div>
                    <div class="form-row" style="align-items:flex-start;">
                        <span class="form-label">正文</span>
                        <div style="flex:1; min-width:0;">
                            <div class="rich-toolbar"><i class="fas fa-bold" title="加粗"></i><i class="fas fa-italic" title="斜体"></i><i class="fas fa-underline" title="下划线"></i><i class="fas fa-list-ul" title="列表"></i><i class="fas fa-link" title="插入链接"></i><i class="fas fa-table" title="表格"></i><i class="fas fa-image" title="图片"></i></div>
                            <div id="templateBody" class="rich-content" contenteditable="true">尊敬的 {导师姓名} 老师，您好！<br>您的学生 {姓名} 的答辩安排在 {答辩时间}，地点 {答辩地点}。</div>
                        </div>
                    </div>
                    <div class="form-row"><span class="form-label">附件配置</span><select class="form-control" style="flex:0.3;" id="templateAttachment"><option>无附件</option><option>固定附件(答辩须知.pdf)</option><option>动态(根据成绩单)</option></select></div>
                    <div class="form-row"><span class="form-label">状态</span><div class="toggle-switch"><input type="checkbox" id="templateStatus" checked><span>启用</span></div></div>
                </div>
                <div class="variable-panel" id="modalVarPanel"><h4><i class="fas fa-code"></i> 可用变量</h4><div class="var-buttons" id="variableList"><span class="var-tag" data-var="{姓名}">{姓名}</span><span class="var-tag" data-var="{学号}">{学号}</span><span class="var-tag" data-var="{导师姓名}">{导师姓名}</span><span class="var-tag" data-var="{学院}">{学院}</span><span class="var-tag" data-var="{答辩时间}">{答辩时间}</span><span class="var-tag" data-var="{事项名称}">{事项名称}</span><span class="var-tag" data-var="{当前日期}">{当前日期}</span><span class="var-tag" data-var="{奖学金金额}">{奖学金金额}</span><span class="var-tag" data-var="{论文题目}">{论文题目}</span></div><hr style="margin:16px 0; border-color:#dbe7f3;"><p style="font-size:0.75rem; color:#4679b3;"><i class="fas fa-magic"></i> 点击变量插入光标位置</p></div>
            </div>
            <div class="modal-footer" id="modalFooter"><button class="btn-secondary" id="modalTestBtn"><i class="fas fa-paper-plane"></i> 测试发送</button><button class="btn-primary" id="modalSaveBtn"><i class="fas fa-save"></i> 保存模板</button><button class="btn-secondary" id="modalCloseBtn">关闭</button></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <div class="confirm-overlay" id="confirmOverlay"><div class="confirm-box"><i class="fas fa-question-circle"></i><p id="confirmMessage">确定要执行此操作吗？</p><div class="confirm-actions"><button class="btn-cancel" id="confirmCancel">取消</button><button class="btn-confirm" id="confirmOk">确认</button></div></div></div>

    <script>
        (function() {
            // 模拟数据 (与原一致)
            let templates = [
                { id: 1, name: '2024博士录取通知', category: '招生', scene: '博士录取', modifier: '张老师', modifyTime: '2024-03-10 14:23', status: true },
                { id: 2, name: '论文答辩安排模板', category: '教学', scene: '答辩告知', modifier: '李教授', modifyTime: '2024-03-09 09:12', status: true },
                { id: 3, name: '国家奖学金公示', category: '奖助', scene: '奖学金通知', modifier: '王老师', modifyTime: '2024-03-08 16:40', status: false },
                { id: 4, name: '开学注册提醒', category: '日常', scene: '注册通知', modifier: '赵秘书', modifyTime: '2024-03-07 11:05', status: true },
                { id: 5, name: '硕士录取确认书', category: '招生', scene: '录取确认', modifier: '张老师', modifyTime: '2024-03-06 10:30', status: true },
                { id: 6, name: '答辩委员会邀请', category: '教学', scene: '专家邀请', modifier: '刘教授', modifyTime: '2024-03-05 16:20', status: true },
                { id: 7, name: '学业预警通知', category: '日常', scene: '预警', modifier: '周老师', modifyTime: '2024-03-04 09:45', status: false },
            ];

            let currentEditId = null;      
            let currentMode = 'add';        
            let currentPage = 1;
            const pageSize = 5;

            // DOM 元素 (重新获取, 注意selectAll现在在卡片工具栏)
            const cardList = document.getElementById('cardList');
            const selectAllCheck = document.getElementById('selectAll');
            const searchName = document.getElementById('searchName');
            const searchCategory = document.getElementById('searchCategory');
            const searchStatus = document.getElementById('searchStatus');
            const searchBtn = document.getElementById('searchBtn');
            const newBtn = document.getElementById('newTemplateBtn');
            const batchDeleteBtn = document.getElementById('batchDeleteBtn');
            const pageControls = document.getElementById('pageControls');
            const pageInfo = document.getElementById('pageInfo');

            // 弹窗相关
            const modalOverlay = document.getElementById('templateModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalCloseIcon = document.getElementById('modalCloseIcon');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalTestBtn = document.getElementById('modalTestBtn');
            const modalSaveBtn = document.getElementById('modalSaveBtn');
            const modalVarPanel = document.getElementById('modalVarPanel');

            const templateName = document.getElementById('templateName');
            const templateCategory = document.getElementById('templateCategory');
            const templateSubject = document.getElementById('templateSubject');
            const templateSender = document.getElementById('templateSender');
            const templateBody = document.getElementById('templateBody');
            const templateAttachment = document.getElementById('templateAttachment');
            const templateStatus = document.getElementById('templateStatus');

            // 轻量弹窗
            const toastContainer = document.getElementById('toastContainer');
            function showToast(message, type = 'info', duration = 3000) {
                const toast = document.createElement('div');
                toast.className = `toast ${type === 'success' ? 'success' : (type === 'error' ? 'error' : '')}`;
                let icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle');
                toast.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
                toastContainer.appendChild(toast);
                setTimeout(() => toast.remove(), duration);
            }

            function showConfirm(message) {
                return new Promise((resolve) => {
                    const overlay = document.getElementById('confirmOverlay');
                    const msgEl = document.getElementById('confirmMessage');
                    const cancelBtn = document.getElementById('confirmCancel');
                    const okBtn = document.getElementById('confirmOk');

                    msgEl.innerText = message;
                    overlay.style.display = 'flex';

                    const close = (result) => {
                        overlay.style.display = 'none';
                        resolve(result);
                    };

                    cancelBtn.onclick = () => close(false);
                    okBtn.onclick = () => close(true);
                    overlay.onclick = (e) => {
                        if (e.target === overlay) close(false);
                    };
                });
            }

            // 变量插入逻辑 (不变)
            document.addEventListener('click', function(e) {
                const varTag = e.target.closest('.var-tag');
                if (!varTag) return;
                if (modalOverlay.style.display !== 'flex') return;
                if (templateBody.contentEditable !== 'true') {
                    showToast('预览模式下无法插入变量', 'info');
                    return;
                }
                const varText = varTag.getAttribute('data-var');
                templateBody.focus();
                document.execCommand('insertText', false, varText);
            });

            // 过滤数据
            function getFilteredTemplates() {
                const nameVal = searchName.value.toLowerCase();
                const catVal = searchCategory.value;
                const statVal = searchStatus.value;
                return templates.filter(t => {
                    const matchName = t.name.toLowerCase().includes(nameVal);
                    const matchCat = catVal ? t.category === catVal : true;
                    const matchStatus = statVal !== '' ? (statVal === '1' ? t.status : !t.status) : true;
                    return matchName && matchCat && matchStatus;
                });
            }

            // 渲染卡片 (代替原表格)
            function renderTable() {
                const filtered = getFilteredTemplates();
                const total = filtered.length;
                const totalPages = Math.ceil(total / pageSize) || 1;
                if (currentPage > totalPages) currentPage = totalPages;
                const start = (currentPage - 1) * pageSize;
                const pageData = filtered.slice(start, start + pageSize);

                let html = '';
                pageData.forEach(t => {
                    const statusClass = t.status ? 'active' : '';
                    const statusText = t.status ? '启用' : '禁用';
                    html += `
                        <div class="card-item">
                            <input type="checkbox" class="card-check row-check" data-id="${t.id}">
                            <div class="card-info">
                                <div class="card-row-1">
                                    <span class="template-name">${t.name}</span>
                                    <span class="badge">${t.category}</span>
                                    <span class="badge ${statusClass}">${statusText}</span>
                                </div>
                                <div class="card-row-2">
                                    <span><i class="fas fa-tag"></i> 场景: ${t.scene}</span>
                                    <span><i class="fas fa-user-edit"></i> ${t.modifier}</span>
                                    <span><i class="fas fa-calendar-alt"></i> ${t.modifyTime}</span>
                                </div>
                            </div>
                            <div class="card-actions">
                                <i class="fas fa-edit" title="编辑" data-id="${t.id}"></i>
                                <i class="fas fa-trash-alt" title="删除" data-id="${t.id}"></i>
                                <i class="fas fa-eye" title="预览" data-id="${t.id}"></i>
                                <i class="fas fa-paper-plane" title="测试发送" data-id="${t.id}"></i>
                                <i class="fas fa-copy" title="复制" data-id="${t.id}"></i>
                            </div>
                        </div>
                    `;
                });

                cardList.innerHTML = html || '<div style="padding: 40px; text-align: center; color: #7e99b9;">暂无匹配模板</div>';
                // 重置全选状态
                selectAllCheck.checked = false;

                // 更新分页
                updatePagination(totalPages);
                pageInfo.innerText = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
            }

            function updatePagination(totalPages) {
                let btns = '';
                for (let i = 1; i <= totalPages; i++) {
                    btns += `<span class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</span>`;
                }
                pageControls.innerHTML = btns;

                const prev = document.createElement('span');
                prev.className = `page-btn ${currentPage === 1 ? 'disabled' : ''}`;
                prev.innerHTML = '<i class="fas fa-chevron-left"></i>';
                prev.onclick = () => {
                    if (currentPage > 1) {
                        currentPage--;
                        renderTable();
                    }
                };
                const next = document.createElement('span');
                next.className = `page-btn ${currentPage === totalPages ? 'disabled' : ''}`;
                next.innerHTML = '<i class="fas fa-chevron-right"></i>';
                next.onclick = () => {
                    if (currentPage < totalPages) {
                        currentPage++;
                        renderTable();
                    }
                };
                pageControls.prepend(prev);
                pageControls.appendChild(next);

                document.querySelectorAll('.page-btn[data-page]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const page = parseInt(e.target.dataset.page);
                        if (page !== currentPage) {
                            currentPage = page;
                            renderTable();
                        }
                    });
                });
            }

            function findTemplateById(id) { return templates.find(t => t.id === id); }

            function clearForm() {
                templateName.value = '';
                templateCategory.value = '招生';
                templateSubject.value = '【研究生院】关于{姓名}同学的通知';
                templateSender.value = '研究生院 < graduate@school.edu >';
                templateBody.innerHTML = '尊敬的 {导师姓名} 老师，您好！<br>您的学生 {姓名} 的答辩安排在 {答辩时间}，地点 {答辩地点}。';
                templateAttachment.value = '无附件';
                templateStatus.checked = true;
            }

            function fillForm(t) {
                templateName.value = t.name || '';
                templateCategory.value = t.category || '招生';
                templateSubject.value = '【研究生院】关于{姓名}同学的通知';
                templateSender.value = '研究生院 < graduate@school.edu >';
                templateBody.innerHTML = '尊敬的 {导师姓名} 老师，您好！<br>您的学生 {姓名} 的答辩安排在 {答辩时间}，地点 {答辩地点}。';
                templateAttachment.value = '无附件';
                templateStatus.checked = t.status;
            }

            function setModalMode(mode, templateId = null) {
                currentMode = mode;
                if (mode === 'add') {
                    modalTitle.innerText = '新建模板';
                    clearForm();
                    currentEditId = null;
                    setFormEditable(true);
                    modalVarPanel.classList.remove('hidden');
                    modalTestBtn.style.display = 'inline-flex';
                    modalSaveBtn.style.display = 'inline-flex';
                    modalCloseBtn.innerText = '取消';
                } else if (mode === 'edit') {
                    modalTitle.innerText = '编辑模板';
                    const t = findTemplateById(templateId);
                    if (t) { fillForm(t); currentEditId = templateId; }
                    setFormEditable(true);
                    modalVarPanel.classList.remove('hidden');
                    modalTestBtn.style.display = 'inline-flex';
                    modalSaveBtn.style.display = 'inline-flex';
                    modalCloseBtn.innerText = '取消';
                } else if (mode === 'view') {
                    modalTitle.innerText = '查看模板';
                    const t = findTemplateById(templateId);
                    if (t) { fillForm(t); currentEditId = templateId; }
                    setFormEditable(false);
                    modalVarPanel.classList.add('hidden');
                    modalTestBtn.style.display = 'none';
                    modalSaveBtn.style.display = 'none';
                    modalCloseBtn.innerText = '关闭';
                }
            }

            function setFormEditable(editable) {
                const fields = [templateName, templateCategory, templateSubject, templateSender, templateAttachment];
                fields.forEach(f => {
                    if (editable) { f.removeAttribute('disabled'); f.removeAttribute('readonly'); } 
                    else { f.setAttribute('disabled', true); }
                });
                if (editable) {
                    templateBody.setAttribute('contenteditable', 'true');
                    templateStatus.removeAttribute('disabled');
                } else {
                    templateBody.setAttribute('contenteditable', 'false');
                    templateStatus.setAttribute('disabled', true);
                }
            }

            function openModal() { modalOverlay.style.display = 'flex'; }
            function closeModal() { modalOverlay.style.display = 'none'; setFormEditable(true); }

            function saveTemplate() {
                const name = templateName.value.trim();
                if (!name) { showToast('模板名称不能为空', 'error'); return; }
                const category = templateCategory.value;
                const status = templateStatus.checked;
                const now = new Date().toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-');
                
                if (currentEditId) {
                    const index = templates.findIndex(t => t.id === currentEditId);
                    if (index !== -1) {
                        templates[index] = { ...templates[index], name, category, status, modifier: '当前用户', modifyTime: now };
                        showToast('模板更新成功', 'success');
                    }
                } else {
                    const newId = Math.max(...templates.map(t => t.id), 0) + 1;
                    templates.push({ id: newId, name, category, scene: '新建场景', modifier: '当前用户', modifyTime: now, status });
                    showToast('新模板创建成功', 'success');
                }
                renderTable();
                closeModal();
            }

            function testSendFromModal() {
                const name = templateName.value.trim() || '未命名模板';
                showToast(`测试邮件“${name}”已发送至 test@school.edu (模拟)`, 'success');
            }

            async function deleteTemplate(id) {
                const confirmed = await showConfirm('确定要删除这个模板吗？');
                if (confirmed) {
                    templates = templates.filter(t => t.id !== id);
                    renderTable();
                    if (currentEditId === id) closeModal();
                    showToast('模板已删除', 'success');
                }
            }

            function copyTemplate(id) {
                const source = findTemplateById(id);
                if (source) {
                    const newId = Math.max(...templates.map(t => t.id), 0) + 1;
                    templates.push({ ...source, id: newId, name: source.name + ' - 复制', modifier: '当前用户', modifyTime: new Date().toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-') });
                    renderTable();
                    showToast('模板已复制', 'success');
                }
            }

            function previewTemplate(id) { setModalMode('view', id); openModal(); }
            function testSendFromRow(id) { const t = findTemplateById(id); showToast(`测试邮件“${t.name}”已发送至 test@school.edu (模拟)`, 'success'); }

            // 事件绑定 (和原来一致，只是现在卡片上的图标具有相同class)
            document.addEventListener('click', async (e) => {
                if (e.target.classList.contains('fa-edit')) { const id = Number(e.target.dataset.id); setModalMode('edit', id); openModal(); }
                else if (e.target.classList.contains('fa-trash-alt')) { const id = Number(e.target.dataset.id); await deleteTemplate(id); }
                else if (e.target.classList.contains('fa-copy')) { const id = Number(e.target.dataset.id); copyTemplate(id); }
                else if (e.target.classList.contains('fa-eye')) { const id = Number(e.target.dataset.id); previewTemplate(id); }
                else if (e.target.classList.contains('fa-paper-plane') && e.target.closest('.card-actions')) { const id = Number(e.target.dataset.id); testSendFromRow(id); }
            });

            newBtn.addEventListener('click', () => { setModalMode('add'); openModal(); });
            modalSaveBtn.addEventListener('click', saveTemplate);
            modalTestBtn.addEventListener('click', testSendFromModal);
            modalCloseIcon.addEventListener('click', closeModal);
            modalCloseBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
            searchBtn.addEventListener('click', () => { currentPage = 1; renderTable(); });

            // 全选逻辑 (针对卡片上的 .row-check)
            selectAllCheck.addEventListener('change', (e) => {
                document.querySelectorAll('.row-check').forEach(cb => cb.checked = e.target.checked);
            });

            // 批量删除
            batchDeleteBtn.addEventListener('click', async () => {
                const checkboxes = document.querySelectorAll('.row-check:checked');
                if (checkboxes.length === 0) { showToast('请先勾选要删除的模板', 'error'); return; }
                const confirmed = await showConfirm(`确定删除选中的 ${checkboxes.length} 个模板吗？`);
                if (confirmed) {
                    const idsToDelete = Array.from(checkboxes).map(cb => Number(cb.dataset.id));
                    templates = templates.filter(t => !idsToDelete.includes(t.id));
                    if (currentEditId && idsToDelete.includes(currentEditId)) closeModal();
                    renderTable();
                    showToast('批量删除完成', 'success');
                }
            });

            // 初始化渲染
            renderTable();
        })();
    </script>
</body>
</html>
