<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>材料评审 · 面试预约管理（纯管理）</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f3f6fc;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .app-container {
            max-width: 1400px;
            width: 100%;
        }
        .header {
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #0b2942;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .header h1 span {
            background: #d4e2f0;
            color: #1e4a76;
            font-size: 1rem;
            padding: 0.25rem 1rem;
            border-radius: 30px;
            font-weight: 500;
            margin-left: 1rem;
        }
        .badge-important {
            background: #f3b229;
            color: #1e3a5f;
            font-size: 0.8rem;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-weight: 600;
            margin-left: 1rem;
        }
        .control-panel {
            display: grid;
            grid-template-columns: 1.2fr 2fr 1.5fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,20,50,0.06);
            padding: 1.5rem 1.2rem;
            transition: all 0.1s ease;
            border: 1px solid rgba(0,53,102,0.08);
        }
        .card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a3b5c;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            border-bottom: 1px dashed #bdd3e8;
            padding-bottom: 0.7rem;
        }
        .card h3 i {
            font-style: normal;
            background: #eef3fc;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #256bb0;
        }
        .datetime-row {
            margin-bottom: 1rem;
        }
        .datetime-row label {
            display: block;
            font-size: 0.85rem;
            color: #446688;
            margin-bottom: 0.3rem;
            font-weight: 500;
        }
        .datetime-row input {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid #b9d1e9;
            border-radius: 14px;
            font-size: 0.9rem;
            background: #f9fcff;
            transition: 0.15s;
        }
        .datetime-row input:focus {
            outline: none;
            border-color: #1e6ec7;
            box-shadow: 0 0 0 3px rgba(30,110,199,0.15);
        }
        .period-list {
            margin-top: 1.5rem;
        }
        .period-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f0f7ff;
            border-radius: 16px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.7rem;
        }
        .period-name {
            font-weight: 600;
            color: #154872;
            min-width: 110px;
        }
        .capacity-control {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .capacity-control button {
            width: 32px;
            height: 32px;
            border-radius: 30px;
            border: none;
            background: white;
            color: #1e6ec7;
            font-size: 1.4rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,50,100,0.1);
            border: 1px solid #c8dbf0;
            transition: 0.1s;
        }
        .capacity-control button:hover {
            background: #e3efff;
            border-color: #7fabdf;
        }
        .capacity-control span {
            font-weight: 700;
            font-size: 1.2rem;
            min-width: 30px;
            text-align: center;
            color: #0b2942;
        }
        .candidate-list {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .candidate-item {
            display: flex;
            align-items: center;
            padding: 0.5rem 0.3rem;
            border-bottom: 1px solid #e1edfb;
        }
        .candidate-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 0.8rem;
            accent-color: #1f6dc7;
            cursor: pointer;
        }
        .candidate-info {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .candidate-name {
            font-weight: 500;
            color: #1d3f62;
        }
        .status-tag {
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            background: #deecfc;
            color: #1f5b9e;
        }
        .status-tag.booked {
            background: #c9e3c0;
            color: #1f6533;
        }
        .status-tag.waiting {
            background: #fff0cf;
            color: #aa7130;
        }
        .period-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0 1.5rem;
        }
        .time-card {
            background: white;
            border-radius: 24px;
            padding: 1.5rem 1.2rem;
            box-shadow: 0 6px 16px rgba(0,30,70,0.05);
            border: 1px solid #dae8f5;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .card-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1d3f62;
        }
        .capacity-badge {
            background: #e1f0fa;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-weight: 600;
            color: #154872;
        }
        .list-section {
            margin: 1rem 0;
        }
        .sub-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #547c9e;
            margin-bottom: 0.4rem;
        }
        .name-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
            min-height: 40px;
            background: #f8fcff;
            border-radius: 20px;
            padding: 0.8rem;
        }
        .name-tag {
            background: white;
            border-radius: 30px;
            padding: 0.2rem 1rem 0.2rem 1.2rem;
            font-size: 0.9rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            border: 1px solid #c1daf5;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .name-tag .cancel {
            background: none;
            border: none;
            font-size: 1rem;
            color: #9aabbc;
            cursor: pointer;
            padding: 0 2px;
            font-weight: 600;
        }
        .name-tag .cancel:hover {
            color: #c43e3e;
        }
        .waitlist-name {
            background: #fff7e5;
            border-color: #fad998;
        }
        .action-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .btn-sm {
            background: white;
            border: 1px solid #b7d3f0;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1f568b;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
        }
        .btn-sm:hover {
            background: #e3efff;
            border-color: #6d9fd1;
        }
        .btn-sm.primary {
            background: #1f6dc7;
            border-color: #1f6dc7;
            color: white;
        }
        .btn-sm.primary:hover {
            background: #195bb3;
        }
        .export-area {
            display: flex;
            justify-content: flex-end;
            margin: 1rem 0 0.5rem;
        }
        .btn-export {
            background: #1e3a5f;
            color: white;
            border: none;
            padding: 0.7rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,60,130,0.2);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-export:hover {
            background: #14324e;
        }
        .footer-note {
            color: #6682a0;
            font-size: 0.85rem;
            border-top: 1px solid #cfdff0;
            padding-top: 1rem;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="app-container" style="max-width:100%">
    <!-- <div class="header">
        <h1>
            📋 材料评审与面试管理
            <span class="badge-important">重点功能 ▲</span>
        </h1>
        <p style="color:#38658f; margin-top:0.3rem;">面试预约管理 · 实时看板（候补机制演示，已移除模拟预约）</p>
    </div> -->

    <!-- 三块控制面板 -->
    <div class="control-panel">
        <!-- 时间安排卡 -->
        <div class="card">
            <h3>⏰ 时间安排 <i>批次设置</i></h3>
            <div class="datetime-row">
                <label>面试日期</label>
                <input type="date" id="interviewDate" value="2025-06-15">
            </div>
            <div class="period-list">
                <div style="margin-bottom:0.8rem; color:#31679e; font-weight:500;">每日时间段 & 人数上限</div>
                <div id="periodCapacities"></div>
            </div>
        </div>

        <!-- 开放控制卡 -->
        <div class="card">
            <h3>🔓 开放控制 <i>预约窗口</i></h3>
            <div class="datetime-row">
                <label>预约开放时间</label>
                <input type="datetime-local" id="openTime" value="2025-06-01T08:00">
            </div>
            <div class="datetime-row">
                <label>预约关闭时间</label>
                <input type="datetime-local" id="closeTime" value="2025-06-14T20:00">
            </div>
            <div style="background:#ecf5fe; border-radius:16px; padding:0.8rem; margin-top:0.8rem;">
                ⏱️ 当前状态: <span style="font-weight:600; color:#1b5a9c;">开放预约中 (模拟)</span>
            </div>
        </div>

        <!-- 考生关联卡 -->
        <div class="card">
            <h3>👥 考生关联 <i>可选范围</i></h3>
            <div style="margin-bottom:0.8rem; color:#2b6190; font-size:0.9rem;">勾选即可参与本批次面试</div>
            <div id="candidateCheckboxList" class="candidate-list">
                <!-- 动态生成候选人列表 -->
            </div>
        </div>
    </div>

    <!-- 时间段预约卡片 (由js动态渲染，已无模拟预约按钮) -->
    <div id="periodCardsContainer" class="period-cards"></div>

    <!-- 导出及全局操作 -->
    <div class="export-area">
        <button class="btn-export" id="exportBtn">📎 导出预约名单 (CSV)</button>
    </div>
    <!-- <div class="footer-note">
        * 点击预约/候补名单旁的“✕”可取消；释放名额后自动从候补按序递补 (仅限选中考生)
    </div> -->
</div>

<script>
    (function() {
        // --- 初始化数据模型 ---
        const CANDIDATE_NAMES = [
            "张明轩", "陈思睿", "王宛宜", "李泽言", "赵子琪",
            "周晓阳", "林思怡", "吴俊豪", "郑秋怡", "唐雅静",
            "许恒睿", "何思雅", "宋佳音", "韩东君", "彭博文",
            "曾欣然", "廖静怡", "方文山", "魏志强", "高以宁"
        ];
        let candidates = CANDIDATE_NAMES.map((name, index) => ({
            id: `c${index}`,
            name: name,
            selected: true,          // 默认全选
            status: 'free',           // 'free', 'booked-period0', 'waiting-period0' ...
            periodId: null
        }));

        // 时间段定义 (固定3个)
        const periods = [
            { id: 0, name: '09:00 - 10:00', capacity: 2, booked: [], waitlist: [] },
            { id: 1, name: '10:00 - 11:00', capacity: 2, booked: [], waitlist: [] },
            { id: 2, name: '11:00 - 12:00', capacity: 2, booked: [], waitlist: [] }
        ];

        // 重建periods数据与candidates状态同步
        function rebuildPeriodsFromCandidates() {
            periods.forEach(p => { p.booked = []; p.waitlist = []; });
            candidates.forEach(c => {
                if (c.status.startsWith('booked')) {
                    const pId = parseInt(c.status.split('-')[1]);
                    if (!isNaN(pId) && periods[pId]) periods[pId].booked.push(c.id);
                } else if (c.status.startsWith('waiting')) {
                    const pId = parseInt(c.status.split('-')[1]);
                    if (!isNaN(pId) && periods[pId]) periods[pId].waitlist.push(c.id);
                }
            });
        }

        // 初始化演示数据 (包含预约与候补)
        function initMockData() {
            candidates.forEach(c => { c.status = 'free'; c.periodId = null; });
            // 时段0: 已预约张明轩(c0), 陈思睿(c1) -> 满；候补: 王宛宜(c2)
            setCandidateStatus('c0', 'booked', 0);
            setCandidateStatus('c1', 'booked', 0);
            setCandidateStatus('c2', 'waiting', 0);
            // 时段1: 已预约李泽言(c3) ; 候补: 赵子琪(c4), 周晓阳(c5)
            setCandidateStatus('c3', 'booked', 1);
            setCandidateStatus('c4', 'waiting', 1);
            setCandidateStatus('c5', 'waiting', 1);
            // 时段2: 无预约, 候补: 林思怡(c6), 吴俊豪(c7)
            setCandidateStatus('c6', 'waiting', 2);
            setCandidateStatus('c7', 'waiting', 2);
            // 其余都是free
            rebuildPeriodsFromCandidates();
        }
        function setCandidateStatus(cId, type, periodId) {
            const c = candidates.find(c => c.id === cId);
            if (c) {
                c.status = type === 'booked' ? `booked-${periodId}` : `waiting-${periodId}`;
                c.periodId = periodId;
            }
        }
        initMockData();

        // 从periods同步回candidates (确保一致)
        function syncCandidatesFromPeriods() {
            candidates.forEach(c => { if (c.status !== 'free') { c.status = 'free'; c.periodId = null; } });
            periods.forEach(p => {
                p.booked.forEach(cId => {
                    const c = candidates.find(c => c.id === cId);
                    if (c) { c.status = `booked-${p.id}`; c.periodId = p.id; }
                });
                p.waitlist.forEach(cId => {
                    const c = candidates.find(c => c.id === cId);
                    if (c) { c.status = `waiting-${p.id}`; c.periodId = p.id; }
                });
            });
        }

        // ---- 核心候补递补逻辑 ----
        function promoteFromWaitlist(periodId) {
            const period = periods[periodId];
            if (!period) return false;
            let changed = false;
            while (period.booked.length < period.capacity && period.waitlist.length > 0) {
                const nextId = period.waitlist[0];
                const candidate = candidates.find(c => c.id === nextId);
                if (!candidate) {
                    period.waitlist.shift();
                    changed = true;
                    continue;
                }
                if (!candidate.selected) {
                    period.waitlist.shift();
                    candidate.status = 'free';
                    candidate.periodId = null;
                    changed = true;
                    continue;
                }
                period.waitlist.shift();
                period.booked.push(nextId);
                candidate.status = `booked-${periodId}`;
                candidate.periodId = periodId;
                changed = true;
            }
            return changed;
        }

        function trimOvershoot(periodId) {
            const period = periods[periodId];
            if (!period) return;
            while (period.booked.length > period.capacity) {
                const removedId = period.booked.pop();
                const c = candidates.find(c => c.id === removedId);
                if (c) {
                    c.status = `waiting-${periodId}`;
                    c.periodId = periodId;
                    period.waitlist.unshift(removedId);
                }
            }
        }

        function rebalancePeriod(periodId) {
            const period = periods[periodId];
            if (!period) return;
            trimOvershoot(periodId);
            promoteFromWaitlist(periodId);
        }

        // ---- 操作函数 ----
        function increaseCapacity(periodId) {
            periods[periodId].capacity++;
            rebalancePeriod(periodId);
            syncCandidatesFromPeriods();
            render();
        }
        function decreaseCapacity(periodId) {
            if (periods[periodId].capacity <= 0) return;
            periods[periodId].capacity--;
            rebalancePeriod(periodId);
            syncCandidatesFromPeriods();
            render();
        }

        // 取消预约 (从booked移除)
        function cancelBooking(periodId, candidateId) {
            const period = periods[periodId];
            const idx = period.booked.indexOf(candidateId);
            if (idx !== -1) {
                period.booked.splice(idx, 1);
                const c = candidates.find(c => c.id === candidateId);
                if (c) { c.status = 'free'; c.periodId = null; }
                promoteFromWaitlist(periodId);
                syncCandidatesFromPeriods();
                render();
            }
        }

        // 取消候补 (从waitlist移除)
        function cancelWait(periodId, candidateId) {
            const period = periods[periodId];
            const idx = period.waitlist.indexOf(candidateId);
            if (idx !== -1) {
                period.waitlist.splice(idx, 1);
                const c = candidates.find(c => c.id === candidateId);
                if (c) { c.status = 'free'; c.periodId = null; }
                syncCandidatesFromPeriods();
                render();
            }
        }

        // 切换考生选中状态 (候补中未选中的立即移除)
        function toggleCandidateSelection(candidateId, checked) {
            const candidate = candidates.find(c => c.id === candidateId);
            if (!candidate) return;
            candidate.selected = checked;
            if (!checked && candidate.status.startsWith('waiting')) {
                const periodId = candidate.periodId;
                if (periodId !== null) {
                    const period = periods[periodId];
                    const idx = period.waitlist.indexOf(candidateId);
                    if (idx !== -1) {
                        period.waitlist.splice(idx, 1);
                        candidate.status = 'free';
                        candidate.periodId = null;
                    }
                }
            }
            syncCandidatesFromPeriods();
            render();
        }

        // 导出预约名单CSV
        function exportToCsv() {
            let csv = "考生姓名,面试时间段,状态\n";
            candidates.forEach(c => {
                let periodName = '';
                if (c.periodId !== null) {
                    periodName = periods[c.periodId].name;
                }
                let statusText = '未预约';
                if (c.status.startsWith('booked')) statusText = '已预约';
                else if (c.status.startsWith('waiting')) statusText = '候补中';
                csv += `${c.name},${periodName},${statusText}\n`;
            });
            const blob = new Blob(["\uFEFF" + csv], {type: 'text/csv;charset=utf-8;'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '面试预约名单.csv';
            link.click();
        }

        // ------- 渲染函数 -------
        function render() {
            // 容量控件
            const capDiv = document.getElementById('periodCapacities');
            capDiv.innerHTML = periods.map(p => `
                <div class="period-item">
                    <span class="period-name">${p.name}</span>
                    <div class="capacity-control">
                        <button class="cap-dec" data-period-id="${p.id}">−</button>
                        <span>${p.capacity}</span>
                        <button class="cap-inc" data-period-id="${p.id}">+</button>
                    </div>
                </div>
            `).join('');

            // 考生复选框
            const candidateDiv = document.getElementById('candidateCheckboxList');
            candidateDiv.innerHTML = candidates.map(c => {
                let statusText = '空闲';
                if (c.status.startsWith('booked')) statusText = '已预约';
                else if (c.status.startsWith('waiting')) statusText = '候补';
                return `
                <div class="candidate-item">
                    <input type="checkbox" data-candidate-id="${c.id}" ${c.selected ? 'checked' : ''} id="chk_${c.id}">
                    <div class="candidate-info">
                        <span class="candidate-name">${c.name}</span>
                        <span class="status-tag ${c.status.startsWith('booked') ? 'booked' : (c.status.startsWith('waiting') ? 'waiting' : '')}">${statusText}</span>
                    </div>
                </div>
            `}).join('');

            // 时间段卡片（已移除“模拟预约”按钮，仅保留“尝试递补”）
            const container = document.getElementById('periodCardsContainer');
            container.innerHTML = periods.map(p => {
                const bookedNames = p.booked.map(id => candidates.find(c => c.id === id)?.name || '?');
                const waitlistNames = p.waitlist.map(id => candidates.find(c => c.id === id)?.name || '?');
                return `
                <div class="time-card" data-period-id="${p.id}">
                    <div class="card-header">
                        <h2>${p.name}</h2>
                        <div class="capacity-badge">👥 ${p.booked.length}/${p.capacity}  · 候补 ${p.waitlist.length}</div>
                    </div>
                    <div class="list-section">
                        <div class="sub-title">✅ 已预约</div>
                        <div class="name-list" id="booked-list-${p.id}">
                            ${bookedNames.map((name, idx) => `
                                <span class="name-tag">${name} <button class="cancel" data-action="cancelBook" data-period="${p.id}" data-cand="${p.booked[idx]}">✕</button></span>
                            `).join('')}
                            ${bookedNames.length === 0 ? '<span style="color:#9ab2cf;">暂无</span>' : ''}
                        </div>
                    </div>
                    <div class="list-section">
                        <div class="sub-title">⏳ 候补队列</div>
                        <div class="name-list">
                            ${waitlistNames.map((name, idx) => `
                                <span class="name-tag waitlist-name">${name} <button class="cancel" data-action="cancelWait" data-period="${p.id}" data-cand="${p.waitlist[idx]}">✕</button></span>
                            `).join('')}
                            ${waitlistNames.length === 0 ? '<span style="color:#9ab2cf;">空</span>' : ''}
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-sm" data-action="forcePromote" data-period="${p.id}">⏫ 尝试递补</button>
                    </div>
                </div>
            `}).join('');

            bindEvents();
        }

        // 事件绑定
        function bindEvents() {
            // 容量增减
            document.querySelectorAll('.cap-inc').forEach(btn => {
                btn.removeEventListener('click', incHandler);
                btn.addEventListener('click', incHandler);
            });
            document.querySelectorAll('.cap-dec').forEach(btn => {
                btn.removeEventListener('click', decHandler);
                btn.addEventListener('click', decHandler);
            });

            // 候选人复选框
            document.querySelectorAll('#candidateCheckboxList input[type=checkbox]').forEach(chk => {
                chk.removeEventListener('change', checkHandler);
                chk.addEventListener('change', checkHandler);
            });

            // 尝试递补按钮
            document.querySelectorAll('[data-action="forcePromote"]').forEach(btn => {
                btn.removeEventListener('click', promoteHandler);
                btn.addEventListener('click', promoteHandler);
            });

            // 取消预约/候补
            document.querySelectorAll('[data-action="cancelBook"]').forEach(btn => {
                btn.removeEventListener('click', cancelBookHandler);
                btn.addEventListener('click', cancelBookHandler);
            });
            document.querySelectorAll('[data-action="cancelWait"]').forEach(btn => {
                btn.removeEventListener('click', cancelWaitHandler);
                btn.addEventListener('click', cancelWaitHandler);
            });

            // 导出
            document.getElementById('exportBtn').removeEventListener('click', exportToCsv);
            document.getElementById('exportBtn').addEventListener('click', exportToCsv);
        }

        // handlers
        function incHandler(e) {
            const periodId = e.target.dataset.periodId;
            if (periodId !== undefined) increaseCapacity(parseInt(periodId));
        }
        function decHandler(e) {
            const periodId = e.target.dataset.periodId;
            if (periodId !== undefined) decreaseCapacity(parseInt(periodId));
        }
        function checkHandler(e) {
            const candidateId = e.target.dataset.candidateId;
            toggleCandidateSelection(candidateId, e.target.checked);
        }
        function promoteHandler(e) {
            const periodId = parseInt(e.target.dataset.period);
            promoteFromWaitlist(periodId);
            syncCandidatesFromPeriods();
            render();
        }
        function cancelBookHandler(e) {
            const periodId = e.target.dataset.period;
            const candId = e.target.dataset.cand;
            cancelBooking(parseInt(periodId), candId);
        }
        function cancelWaitHandler(e) {
            const periodId = e.target.dataset.period;
            const candId = e.target.dataset.cand;
            cancelWait(parseInt(periodId), candId);
        }

        // 启动渲染
        render();
    })();
</script>
</body>
</html>
