<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>研究生日常 · 提问管理</title>
    <!-- Inter 字体 + 图标库 (完全沿用风格) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 完全复用参考风格的样式体系，并针对提问管理微调 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #eef3f8;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .full-screen {
            width: 100%;
            padding: 1.5rem 1.8rem;
            flex: 1;
        }
        @media (max-width: 640px) {
            .full-screen { padding: 1rem 1rem; }
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,20,40,0.08);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e9eef4;
            width: 100%;
        }
        @media (max-width: 640px) {
            .card { padding: 1.5rem 1.2rem; }
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 1.5rem;
        }
        .section-title i { color: #2f6e9e; font-size: 1.4rem; }

        /* 筛选栏 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
            margin-bottom: 1rem;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 170px;
            flex: 1 1 160px;
        }
        .filter-item label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
        }
        .filter-input, .filter-select {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.65rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn {
            border: none;
            background: transparent;
            font-weight: 500;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .btn-primary {
            background: #1e4a6f;
            color: white;
            box-shadow: 0 4px 10px rgba(0,60,110,0.2);
        }
        .btn-primary:hover { background: #123a58; transform: translateY(-2px); }
        .btn-outline {
            background: white;
            border-color: #cbd5e1;
            color: #2c455d;
        }
        .btn-outline:hover { background: #f1f7fd; border-color: #9bb0c5; }
        .btn-sm { padding: 0.45rem 1.2rem; font-size: 0.8rem; }

        /* 表格区域 — 字段适配提问管理 */
        .table-wrapper {
            border-radius: 20px;
            background: #ffffff;
            border: 1px solid #e2eaf3;
            overflow-x: auto;
            margin-top: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;  /* 保证9列完整显示 */
        }
        th {
            text-align: left;
            padding: 1.2rem 1rem;
            background: #eaf1f9;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1d4b6e;
            text-transform: uppercase;
        }
        td {
            padding: 1rem 1rem;
            border-bottom: 1px solid #e3eaf2;
            vertical-align: middle;
        }
        .student-name { font-weight: 600; color: #0b2b40; }
        .question-preview {
            background: #eef4fa;
            color: #11517c;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .email-style {
            color: #1e4a6f;
            text-decoration: none;
            border-bottom: 1px dashed #9ab3d1;
        }
        .status-badge {
            background: #e3f0fa;
            color: #11517c;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
        }
        .status-badge.resolved { background: #dff0e0; color: #1f6d2f; }
        .action-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .icon-btn {
            background: none; border: none; font-size: 0.8rem; padding: 0.4rem 1rem;
            border-radius: 40px; cursor: pointer; color: #2a577b; background: #f2f8ff;
            display: inline-flex; align-items: center; gap: 0.4rem; border: 1px solid transparent;
        }
        .icon-btn:hover { background: #dae9f8; }
        .delete-btn:hover { background: #ffeae9; color: #b13e3e; }

        /* 分页 */
        .pagination-bar {
            display: flex; justify-content: flex-end; align-items: center;
            gap: 0.5rem; margin-top: 1.8rem; flex-wrap: wrap;
        }
        .pagination-btn {
            background: white; border: 1px solid #c9d9eb; color: #1d4a6b;
            width: 38px; height: 38px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 500; cursor: pointer; transition: 0.1s;
        }
        .pagination-btn.active { background: #1e4a6f; border-color: #1e4a6f; color: white; }
        .pagination-btn:hover:not(.active) { background: #e5f0fb; }
        .page-info { color: #466585; margin-right: 0.8rem; font-size: 0.9rem; }

        /* 弹窗 (提问表单) 完全复用风格，调整字段 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,20,40,0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-card {
            background: white; border-radius: 32px; width: 90%; max-width: 700px;
            padding: 2rem 2.2rem; box-shadow: 0 40px 70px rgba(0,20,50,0.4);
            transform: scale(0.95); transition: transform 0.2s ease;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.show .modal-card { transform: scale(1); }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-header h3 { font-size: 1.6rem; font-weight: 600; color: #0c2b48; }
        .modal-close {
            background: none; border: none; font-size: 2.2rem; cursor: pointer;
            color: #8ba5c2; line-height: 1;
        }
        .modal-close:hover { color: #1e3a5f; }

        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem 1.8rem;
        }
        .full-width { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .input-group label {
            font-weight: 600; font-size: 0.75rem; color: #4e6f8c; text-transform: uppercase;
            display: flex; align-items: center; gap: 4px;
        }
        .input-field {
            background: #f8fafd; border: 1px solid #dde3ea; border-radius: 16px;
            padding: 0.75rem 1.2rem; font-size: 0.95rem; font-family: 'Inter', sans-serif;
        }
        .input-field:focus {
            outline: none; border-color: #2f6e9e;
            box-shadow: 0 0 0 3px rgba(47,110,158,0.15); background: white;
        }
        .readonly-field {
            background: #ecf2f9; color: #2a4e6e; font-weight: 500;
        }
        textarea.input-field { min-height: 100px; resize: vertical; }
        .modal-actions {
            display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2.2rem;
        }

        /* Toast */
        .toast-message {
            background: #1e4a6f; color: white; padding: 0.8rem 2rem;
            border-radius: 60px; font-weight: 500; box-shadow: 0 15px 30px rgba(0,40,70,0.4);
            position: fixed; bottom: 30px; right: 30px; z-index: 1100;
            opacity: 0; transform: translateY(10px); transition: 0.2s; pointer-events: none;
        }
        .toast-message.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
<div class="full-screen">
    <!-- 卡片：提问筛选 + 学生提问入口 (与分数变动类似，但改为提问相关) -->
    <div class="card">
        <div class="filter-bar">
            <div class="filter-item">
                <label><i class="fas fa-user"></i> 学生姓名</label>
                <input type="text" class="filter-input" id="filterName" placeholder="姓名">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-id-card"></i> 学号</label>
                <input type="text" class="filter-input" id="filterStudentId" placeholder="学号">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-envelope"></i> 邮箱</label>
                <input type="text" class="filter-input" id="filterEmail" placeholder="邮箱">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-calendar"></i> 起始日期</label>
                <input type="date" class="filter-input" id="filterDateFrom">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-calendar"></i> 结束日期</label>
                <input type="date" class="filter-input" id="filterDateTo">
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                <button class="btn btn-outline" id="resetFilterBtn"><i class="fas fa-undo"></i> 重置</button>
                <button class="btn btn-primary" id="openAddModalBtn"><i class="fas fa-plus-circle"></i> 我要提问</button>
            </div>
        </div>
    </div>

    <!-- 提问列表卡片 (学生提问管理) -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-comment-dots"></i> 研究生提问记录
        </div>
        <div class="table-wrapper">
            <table id="questionTable">
                <thead>
                    <tr>
                        <th>姓名</th><th>学号</th><th>邮箱</th><th>问题内容</th><th>分类</th><th>状态</th><th>提问时间</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <!-- 分页 -->
        <div class="pagination-bar" id="paginationContainer"></div>
    </div>
</div>

<!-- 新增/编辑提问弹窗 (完全符合添加需求：用户、姓名、邮箱、内容、分类等) -->
<div class="modal-overlay" id="questionModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle"><i class="fas fa-pen"></i> 提交提问</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <form id="questionForm" onsubmit="return false;">
            <div class="form-grid">
                <!-- 学生姓名 + 学号 + 邮箱 + 内容(跨列) + 分类 + 可选时间(登记人简化) -->
                <div class="input-group">
                    <label><i class="fas fa-user"></i> 姓名 *</label>
                    <input type="text" class="input-field" id="modalName" required placeholder="例如：张明">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-id-card"></i> 学号 *</label>
                    <input type="text" class="input-field" id="modalStudentId" required placeholder="G2024001">
                </div>
                <div class="input-group full-width">
                    <label><i class="fas fa-envelope"></i> 邮箱 *</label>
                    <input type="email" class="input-field" id="modalEmail" required placeholder="student@univ.edu">
                </div>
                <div class="input-group full-width">
                    <label><i class="fas fa-tag"></i> 分类 (可选)</label>
                    <select class="filter-select" id="modalCategory">
                        <option value="培养方案">培养方案</option>
                        <option value="毕业答辩">毕业答辩</option>
                        <option value="课程学习">课程学习</option>
                        <option value="系统使用">系统使用</option>
                        <option value="日常事务">日常事务</option>
                    </select>
                </div>
                <div class="input-group full-width">
                    <label><i class="fas fa-comment"></i> 提问内容 *</label>
                    <textarea class="input-field" id="modalContent" required placeholder="请详细描述您的问题……"></textarea>
                </div>
                <!-- 提问时间默认为当前，允许微调，但一般不填则自动 -->
                <div class="input-group">
                    <label>提问时间</label>
                    <input type="datetime-local" class="input-field" id="modalAskedAt">
                </div>
                <div class="input-group">
                    <label>登记人(学工)</label>
                    <input type="text" class="input-field readonly-field" id="modalRegisteredBy" readonly value="研究生办">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="modalCancelBtn"><i class="fas fa-times"></i> 取消</button>
                <button type="submit" class="btn btn-primary" id="modalSaveBtn"><i class="fas fa-save"></i> 提交问题</button>
            </div>
        </form>
    </div>
</div>

<!-- 全局toast -->
<div id="toast" class="toast-message">操作成功</div>

<script>
    (function(){
        // ---------- 模拟初始数据：研究生提问 (包含用户、姓名、邮箱、内容、分类、状态等) ----------
        let allQuestions = [
            { id: 'q1', studentName: '欧阳雪', studentId: 'G202401', email: 'ouyangx@graduate.edu', content: '请问毕业论文盲审的流程是怎样的？需要提前多久提交？', category: '毕业答辩', status: '待处理', askedAt: '2026-03-12T10:30', registeredBy: '研究生办' },
            { id: 'q2', studentName: '王博文', studentId: 'G202402', email: 'wangbw@graduate.edu', content: '培养计划中选修课学分不够，可以用跨专业课代替吗？', category: '培养方案', status: '已回复', askedAt: '2026-03-11T09:15', registeredBy: '教务李' },
            { id: 'q3', studentName: '李思睿', studentId: 'G202403', email: 'lisr@graduate.edu', content: '系统里查不到本学期“高级机器学习”的成绩，请问是什么原因？', category: '系统使用', status: '待处理', askedAt: '2026-03-10T16:20', registeredBy: '研究生办' },
            { id: 'q4', studentName: '赵一凡', studentId: 'G202404', email: 'zhaoyf@graduate.edu', content: '中期考核的具体时间什么时候公布？需要准备什么材料？', category: '日常事务', status: '待处理', askedAt: '2026-03-09T11:05', registeredBy: '研究生办' },
            { id: 'q5', studentName: '陈果', studentId: 'G202405', email: 'chenguo@graduate.edu', content: '请问学位论文的查重率要求是多少？以及在哪里提交查重？', category: '毕业答辩', status: '已回复', askedAt: '2026-03-08T14:30', registeredBy: '教务王' },
            { id: 'q6', studentName: '周明', studentId: 'G202406', email: 'zhouming@graduate.edu', content: '数值分析课程申请补考的截止日期是哪天？', category: '课程学习', status: '待处理', askedAt: '2026-03-07T08:45', registeredBy: '研究生办' },
            { id: 'q7', studentName: '郑青', studentId: 'G202407', email: 'zhengq@graduate.edu', content: '如何申请更换指导老师？需要哪些手续？', category: '日常事务', status: '已回复', askedAt: '2026-03-06T13:30', registeredBy: '学工赵' },
            { id: 'q8', studentName: '林溪', studentId: 'G202408', email: 'linxi@graduate.edu', content: '学术英语课程的成绩单什么时候可以打印？', category: '课程学习', status: '待处理', askedAt: '2026-03-05T09:00', registeredBy: '研究生办' },
            { id: 'q9', studentName: '徐远', studentId: 'G202409', email: 'xuyuan@graduate.edu', content: '奖学金评定中，科研成果的加分项需要提交什么证明材料？', category: '培养方案', status: '待处理', askedAt: '2026-03-04T14:20', registeredBy: '研究生办' },
            { id: 'q10', studentName: '沈梦', studentId: 'G202410', email: 'shenm@graduate.edu', content: '论文送审前，是不是必须通过预答辩？预答辩什么时候组织？', category: '毕业答辩', status: '已回复', askedAt: '2026-03-03T10:00', registeredBy: '教务李' },
            { id: 'q11', studentName: '高天阳', studentId: 'G202411', email: 'gaoty@graduate.edu', content: '校园网无法访问知网，请问怎么解决？', category: '系统使用', status: '待处理', askedAt: '2026-03-02T15:40', registeredBy: '研究生办' }
        ];

        // 分页配置
        const pageSize = 5;
        let currentPage = 1;
        // 筛选条件
        let filters = { name: '', studentId: '', email: '', dateFrom: '', dateTo: '' };

        // DOM 元素
        const tbody = document.getElementById('tableBody');
        const toast = document.getElementById('toast');
        const paginationContainer = document.getElementById('paginationContainer');
        const filterName = document.getElementById('filterName');
        const filterStudentId = document.getElementById('filterStudentId');
        const filterEmail = document.getElementById('filterEmail');
        const filterDateFrom = document.getElementById('filterDateFrom');
        const filterDateTo = document.getElementById('filterDateTo');
        const resetFilterBtn = document.getElementById('resetFilterBtn');
        const openAddModalBtn = document.getElementById('openAddModalBtn');

        // 弹窗元素
        const modal = document.getElementById('questionModal');
        const modalTitle = document.getElementById('modalTitle');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalSaveBtn = document.getElementById('modalSaveBtn');
        const modalForm = document.getElementById('questionForm');
        const modalName = document.getElementById('modalName');
        const modalStudentId = document.getElementById('modalStudentId');
        const modalEmail = document.getElementById('modalEmail');
        const modalCategory = document.getElementById('modalCategory');
        const modalContent = document.getElementById('modalContent');
        const modalAskedAt = document.getElementById('modalAskedAt');
        const modalRegisteredBy = document.getElementById('modalRegisteredBy');

        // 当前编辑ID
        let editingId = null;

        // 辅助函数
        function showToast(text, duration = 2000) {
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }
        function generateId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 8); }
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
        function formatDateTime(datetimeStr) {
            if (!datetimeStr) return '—';
            const d = new Date(datetimeStr);
            if (isNaN(d.getTime())) return datetimeStr;
            return d.toLocaleString('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}).replace(/\//g,'-');
        }

        // 筛选逻辑
        function filterList() {
            return allQuestions.filter(item => {
                if (filters.name && !item.studentName.toLowerCase().includes(filters.name.toLowerCase())) return false;
                if (filters.studentId && !item.studentId.toLowerCase().includes(filters.studentId.toLowerCase())) return false;
                if (filters.email && !item.email.toLowerCase().includes(filters.email.toLowerCase())) return false;
                if (filters.dateFrom) {
                    const itemDate = item.askedAt ? item.askedAt.slice(0,10) : '';
                    if (itemDate < filters.dateFrom) return false;
                }
                if (filters.dateTo) {
                    const itemDate = item.askedAt ? item.askedAt.slice(0,10) : '';
                    if (itemDate > filters.dateTo) return false;
                }
                return true;
            });
        }

        function getFiltered() { return filterList(); }

        function getPaginated() {
            const filtered = getFiltered();
            const start = (currentPage - 1) * pageSize;
            return filtered.slice(start, start + pageSize);
        }

        function totalPages() {
            return Math.ceil(getFiltered().length / pageSize);
        }

        function goToPage(page) {
            const total = totalPages();
            if (page < 1) page = 1;
            if (total > 0 && page > total) page = total;
            if (page === currentPage) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }
        window.pageGo = goToPage;

        // 渲染分页
        function renderPagination() {
            const total = totalPages();
            if (total <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }
            let html = `<span class="page-info"><i class="fas fa-layer-group"></i> 第 ${currentPage} / ${total} 页</span>`;
            html += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.pageGo(${currentPage-1})"><i class="fas fa-chevron-left"></i></button>`;
            for (let i = 1; i <= total; i++) {
                if (i === currentPage) html += `<span class="pagination-btn active">${i}</span>`;
                else html += `<button class="pagination-btn" onclick="window.pageGo(${i})">${i}</button>`;
            }
            html += `<button class="pagination-btn" ${currentPage === total ? 'disabled' : ''} onclick="window.pageGo(${currentPage+1})"><i class="fas fa-chevron-right"></i></button>`;
            paginationContainer.innerHTML = html;
        }

        // 删除提问
        function deleteQuestion(id) {
            allQuestions = allQuestions.filter(q => q.id !== id);
            const filtered = getFiltered();
            if (filtered.length === 0 && currentPage > 1) currentPage--;
            showToast('提问已删除');
            renderTable();
            renderPagination();
        }

        // 打开新增弹窗 (学生提问入口)
        function openAddModal() {
            editingId = null;
            modalTitle.innerHTML = '<i class="fas fa-plus-circle"></i> 新提问';
            modalName.value = '';
            modalStudentId.value = '';
            modalEmail.value = '';
            modalCategory.value = '课程学习'; // 默认
            modalContent.value = '';
            // 默认时间为当前
            const now = new Date();
            const tzOffset = now.getTimezoneOffset() * 60000;
            const localISOTime = new Date(now - tzOffset).toISOString().slice(0,16);
            modalAskedAt.value = localISOTime;
            modalRegisteredBy.value = '研究生办';
            modal.classList.add('show');
        }

        // 打开编辑弹窗 (管理员可编辑)
        function openEditModal(id) {
            const item = allQuestions.find(q => q.id === id);
            if (!item) return;
            editingId = id;
            modalTitle.innerHTML = '<i class="fas fa-edit"></i> 编辑提问';
            modalName.value = item.studentName || '';
            modalStudentId.value = item.studentId || '';
            modalEmail.value = item.email || '';
            modalCategory.value = item.category || '课程学习';
            modalContent.value = item.content || '';
            // 处理时间
            let askedAt = item.askedAt;
            if (askedAt && askedAt.length === 16) modalAskedAt.value = askedAt;
            else {
                const d = new Date(askedAt);
                if (!isNaN(d.getTime())) {
                    const tzOffset = d.getTimezoneOffset() * 60000;
                    const local = new Date(d - tzOffset).toISOString().slice(0,16);
                    modalAskedAt.value = local;
                } else {
                    modalAskedAt.value = '';
                }
            }
            modalRegisteredBy.value = item.registeredBy || '研究生办';
            modal.classList.add('show');
        }

        function closeModal() {
            modal.classList.remove('show');
            editingId = null;
        }

        // 保存提问 (添加/编辑)
        function saveQuestion() {
            const studentName = modalName.value.trim();
            const studentId = modalStudentId.value.trim();
            const email = modalEmail.value.trim();
            const content = modalContent.value.trim();
            const category = modalCategory.value;

            if (!studentName || !studentId || !email || !content) {
                showToast('请填写姓名、学号、邮箱、提问内容', 1500);
                return;
            }
            // 简单邮箱格式校验
            if (!email.includes('@') || !email.includes('.')) {
                showToast('邮箱格式似乎不正确', 1500);
                return;
            }

            const askedAt = modalAskedAt.value; 
            const registeredBy = modalRegisteredBy.value.trim() || '研究生办';

            const data = {
                studentName, studentId, email, content, category,
                askedAt: askedAt || new Date().toISOString().slice(0,16),
                registeredBy,
                status: '待处理',   // 新增默认为待处理
            };

            if (editingId) {
                const index = allQuestions.findIndex(q => q.id === editingId);
                if (index !== -1) { 
                    // 保留原状态不覆盖 (管理员编辑时可改状态，这里简化为保留原status)
                    const originalStatus = allQuestions[index].status;
                    allQuestions[index] = { ...allQuestions[index], ...data, status: originalStatus };
                }
                showToast('提问已更新');
            } else {
                const newItem = { id: generateId(), ...data, status: '待处理' };
                allQuestions.push(newItem);
                showToast('提问已提交');
                // 跳转到第一页以便看到新提问 (通常最新提问在最后，但分页往前)
                currentPage = 1; 
            }
            closeModal();
            renderTable();
            renderPagination();
        }

        // 渲染表格 (提问管理)
        function renderTable() {
            const paginated = getPaginated();
            let html = '';
            if (paginated.length === 0) {
                html = `<tr><td colspan="8" style="text-align:center; padding:3rem; color:#8899bb;"><i class="fas fa-comment-dots" style="font-size:2rem; opacity:0.5;"></i><br>暂无提问记录</td></tr>`;
            } else {
                paginated.forEach(item => {
                    const statusClass = item.status === '已回复' ? 'resolved' : '';
                    html += `<tr>`;
                    html += `<td class="student-name">${escapeHtml(item.studentName)}</td>`;
                    html += `<td>${escapeHtml(item.studentId)}</td>`;
                    html += `<td><span class="email-style" title="${escapeHtml(item.email)}">${escapeHtml(item.email)}</span></td>`;
                    html += `<td><span class="question-preview" title="${escapeHtml(item.content)}">${escapeHtml(item.content.substring(0,30))}${item.content.length>30?'…':''}</span></td>`;
                    html += `<td>${escapeHtml(item.category || '—')}</td>`;
                    html += `<td><span class="status-badge ${statusClass}">${item.status}</span></td>`;
                    html += `<td>${formatDateTime(item.askedAt)}</td>`;
                    html += `<td><div class="action-btns">`;
                    html += `<button class="icon-btn" onclick="window.editHandler('${item.id}')"><i class="fas fa-pen"></i> 编辑</button>`;
                    html += `<button class="icon-btn delete-btn" onclick="window.deleteHandler('${item.id}')"><i class="fas fa-trash"></i> 删除</button>`;
                    // 模拟快速切换状态（简化操作）
                    html += `<button class="icon-btn" onclick="window.toggleStatus('${item.id}')"><i class="fas fa-check-circle"></i> 切换状态</button>`;
                    html += `</div></td></tr>`;
                });
            }
            tbody.innerHTML = html;
        }

        // 快速切换待处理/已回复 (方便演示)
        window.toggleStatus = (id) => {
            const item = allQuestions.find(q => q.id === id);
            if (item) {
                item.status = item.status === '待处理' ? '已回复' : '待处理';
                renderTable();
                renderPagination();
                showToast(`状态已切换为 ${item.status}`);
            }
        };

        // 收集筛选并应用
        function applyFilters() {
            filters.name = filterName.value;
            filters.studentId = filterStudentId.value;
            filters.email = filterEmail.value;
            filters.dateFrom = filterDateFrom.value;
            filters.dateTo = filterDateTo.value;
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        function resetFilters() {
            filterName.value = '';
            filterStudentId.value = '';
            filterEmail.value = '';
            filterDateFrom.value = '';
            filterDateTo.value = '';
            filters = { name: '', studentId: '', email: '', dateFrom: '', dateTo: '' };
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        // 挂载全局方法
        window.deleteHandler = deleteQuestion;
        window.editHandler = openEditModal;

        // 事件监听
        filterName.addEventListener('input', applyFilters);
        filterStudentId.addEventListener('input', applyFilters);
        filterEmail.addEventListener('input', applyFilters);
        filterDateFrom.addEventListener('change', applyFilters);
        filterDateTo.addEventListener('change', applyFilters);
        resetFilterBtn.addEventListener('click', resetFilters);
        openAddModalBtn.addEventListener('click', openAddModal);

        closeModalBtn.addEventListener('click', closeModal);
        modalCancelBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        modalForm.addEventListener('submit', (e) => { e.preventDefault(); saveQuestion(); });

        // 初始化
        renderTable();
        renderPagination();
    })();
</script>
</body>
</html>
