<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>研究生班级 · 信用分学分 · 变动记录风格</title>
    <!-- 完全复用学生分数变动记录页面的字体与图标库 (Inter + Font Awesome) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 完全沿用学生分数变动记录.html的视觉风格，只保留班级信用分特有的表格列和逻辑 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #eef3f8;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .full-screen {
            width: 100%;
            padding: 1.5rem 1.8rem;
            flex: 1;
        }
        @media (max-width: 640px) {
            .full-screen { padding: 1rem 1rem; }
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,20,40,0.08);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e9eef4;
            width: 100%;
        }
        @media (max-width: 640px) {
            .card { padding: 1.5rem 1.2rem; }
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 1.5rem;
        }
        .section-title i { color: #2f6e9e; font-size: 1.4rem; }

        /* 筛选栏 (来自变动页面) */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 170px;
            flex: 1 1 160px;
        }
        .filter-item label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
        }
        .filter-input, .filter-select {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.65rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn {
            border: none;
            background: transparent;
            font-weight: 500;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .btn-primary {
            background: #1e4a6f;
            color: white;
            box-shadow: 0 4px 10px rgba(0,60,110,0.2);
        }
        .btn-primary:hover { background: #123a58; transform: translateY(-2px); }
        .btn-outline {
            background: white;
            border-color: #cbd5e1;
            color: #2c455d;
        }
        .btn-outline:hover { background: #f1f7fd; border-color: #9bb0c5; }
        .btn-sm { padding: 0.45rem 1.2rem; font-size: 0.8rem; }

        /* 表格区域 */
        .table-wrapper {
            border-radius: 20px;
            background: #ffffff;
            border: 1px solid #e2eaf3;
            overflow-x: auto;
            margin-top: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;  /* 班级信用分字段稍多 */
        }
        th {
            text-align: left;
            padding: 1.2rem 1rem;
            background: #eaf1f9;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1d4b6e;
            text-transform: uppercase;
        }
        td {
            padding: 1rem 1rem;
            border-bottom: 1px solid #e3eaf2;
            vertical-align: middle;
        }
        .badge-class {
            background: #e3f0fa;
            color: #11517c;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            white-space: nowrap;
        }
        .credit-score-badge {
            background: #e6f0f9;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.8rem;
            display: inline-block;
        }
        .level-A { background: #daf1e4; color: #0c6743; }
        .level-B { background: #fff2cf; color: #8e6100; }
        .level-C { background: #ffe2dd; color: #b13e2d; }

        .action-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .icon-btn {
            background: none; border: none; font-size: 0.8rem; padding: 0.4rem 1rem;
            border-radius: 40px; cursor: pointer; color: #2a577b; background: #f2f8ff;
            display: inline-flex; align-items: center; gap: 0.4rem; border: 1px solid transparent;
        }
        .icon-btn:hover { background: #dae9f8; }
        .delete-btn:hover { background: #ffeae9; color: #b13e3e; }

        /* 分页 */
        .pagination-bar {
            display: flex; justify-content: flex-end; align-items: center;
            gap: 0.5rem; margin-top: 1.8rem; flex-wrap: wrap;
        }
        .pagination-btn {
            background: white; border: 1px solid #c9d9eb; color: #1d4a6b;
            width: 38px; height: 38px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 500; cursor: pointer; transition: 0.1s;
        }
        .pagination-btn.active { background: #1e4a6f; border-color: #1e4a6f; color: white; }
        .pagination-btn:hover:not(.active) { background: #e5f0fb; }
        .page-info { color: #466585; margin-right: 0.8rem; font-size: 0.9rem; }

        /* 弹窗 (完全来自变动页面) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,20,40,0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-card {
            background: white; border-radius: 32px; width: 90%; max-width: 750px;
            padding: 2rem 2.2rem; box-shadow: 0 40px 70px rgba(0,20,50,0.4);
            transform: scale(0.95); transition: transform 0.2s ease;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.show .modal-card { transform: scale(1); }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-header h3 { font-size: 1.6rem; font-weight: 600; color: #0c2b48; }
        .modal-close {
            background: none; border: none; font-size: 2.2rem; cursor: pointer;
            color: #8ba5c2; line-height: 1;
        }
        .modal-close:hover { color: #1e3a5f; }

        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem 1.8rem;
        }
        .full-width { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .input-group label {
            font-weight: 600; font-size: 0.75rem; color: #4e6f8c; text-transform: uppercase;
            display: flex; align-items: center; gap: 4px;
        }
        .input-field {
            background: #f8fafd; border: 1px solid #dde3ea; border-radius: 16px;
            padding: 0.75rem 1.2rem; font-size: 0.95rem; font-family: 'Inter', sans-serif;
        }
        .input-field:focus {
            outline: none; border-color: #2f6e9e;
            box-shadow: 0 0 0 3px rgba(47,110,158,0.15); background: white;
        }
        .readonly-field {
            background: #ecf2f9; color: #2a4e6e; font-weight: 500;
        }
        .modal-actions {
            display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2.2rem;
        }

        /* Toast (保留但班级信用分可能用不到) */
        .toast-message {
            background: #1e4a6f; color: white; padding: 0.8rem 2rem;
            border-radius: 60px; font-weight: 500; box-shadow: 0 15px 30px rgba(0,40,70,0.4);
            position: fixed; bottom: 30px; right: 30px; z-index: 1100;
            opacity: 0; transform: translateY(10px); transition: 0.2s; pointer-events: none;
        }
        .toast-message.show { opacity: 1; transform: translateY(0); }

        /* 备注样式 */
        .remark-text {
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #4e6688;
        }
    </style>
</head>
<body>
<div class="full-screen">
    <!-- 卡片：筛选栏 + 新增按钮 (完全沿用变动页面的filter-bar结构，但控件换成班级相关) -->
    <div class="card">
        <div class="filter-bar">
            <div class="filter-item">
                <label><i class="fas fa-school"></i> 班级名称</label>
                <input type="text" class="filter-input" id="filterClassName" placeholder="例: 2023级计算机">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-chalkboard-teacher"></i> 主管老师</label>
                <select class="filter-select" id="filterSupervisor">
                    <option value="">全部主管</option>
                </select>
            </div>
            <div class="filter-item">
                <label><i class="fas fa-star"></i> 信用分范围</label>
                <select class="filter-select" id="filterCreditRange">
                    <option value="">全部</option>
                    <option value="81-100">A (81-100)</option>
                    <option value="61-80">B (61-80)</option>
                    <option value="0-60">C (0-60)</option>
                </select>
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                <button class="btn btn-outline" id="resetFilterBtn"><i class="fas fa-undo"></i> 重置</button>
                <button class="btn btn-primary" id="addClassBtn"><i class="fas fa-plus-circle"></i> 新增班级</button>
            </div>
        </div>
    </div>

    <!-- 班级列表卡片 -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-users-between-lines"></i> 研究生班级 · 信用分/学分
        </div>
        <div class="table-wrapper">
            <table id="classTable">
                <thead>
                    <tr>
                        <th>班级名称</th><th>主管</th><th>应修学分</th><th>已修学分</th><th>完成率</th><th>信用分/等级</th><th>备注</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <!-- 分页 (风格完全匹配变动页面) -->
        <div class="pagination-bar" id="paginationContainer"></div>
    </div>
</div>

<!-- 新增/编辑 弹窗 (班级专用) -->
<div class="modal-overlay" id="classModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle"><i class="fas fa-pen"></i> 班级信息</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <form id="classForm" onsubmit="return false;">
            <div class="form-grid">
                <div class="input-group full-width">
                    <label><i class="fas fa-school"></i> 班级名称 *</label>
                    <input type="text" class="input-field" id="className" required placeholder="2023级计算机硕士1班">
                </div>
                <div class="input-group full-width">
                    <label><i class="fas fa-chalkboard-teacher"></i> 主管老师 *</label>
                    <select class="input-field" id="classSupervisor" required>
                        <option value="">请选择主管</option>
                    </select>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-calculator"></i> 应修学分</label>
                    <input type="number" class="input-field" id="requiredCredit" value="32" min="0" step="1">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-check-circle"></i> 已修学分</label>
                    <input type="number" class="input-field" id="earnedCredit" value="0" min="0">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-gauge-high"></i> 信用分</label>
                    <input type="number" class="input-field" id="creditScore" value="100" min="0" max="200">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-tag"></i> 备注</label>
                    <input type="text" class="input-field" id="remark" placeholder="优秀班级 / 需关注">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="modalCancelBtn"><i class="fas fa-times"></i> 取消</button>
                <button type="submit" class="btn btn-primary" id="modalSaveBtn"><i class="fas fa-save"></i> 保存班级</button>
            </div>
        </form>
    </div>
</div>

<!-- 详情模态框 (复用变动页面风格，展示班级详情+变更历史) -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3><i class="fas fa-info-circle"></i> 班级详情</h3>
            <button class="modal-close" id="closeDetailModalBtn">&times;</button>
        </div>
        <div id="detailModalContent">
            <!-- 动态填充 -->
        </div>
        <div class="modal-actions" style="margin-top:1.5rem;">
            <button class="btn btn-outline" id="closeDetailBtn">关闭</button>
        </div>
    </div>
</div>

<div id="toast" class="toast-message">操作成功</div>

<script>
    (function() {
        // ---------- 模拟数据 (班级信用分，保留原20条) ----------
        let classes = [
            { id: 'c1', name: '2023级计算机硕士1班', supervisor: '张老师', supervisorId: 't01', required: 32, earned: 28, credit: 95, remark: '' },
            { id: 'c2', name: '2023级计算机硕士2班', supervisor: '李老师', supervisorId: 't02', required: 32, earned: 30, credit: 85, remark: '需关注' },
            { id: 'c3', name: '2023级控制硕士2班', supervisor: '王老师', supervisorId: 't03', required: 30, earned: 20, credit: 72, remark: '' },
            { id: 'c4', name: '2024级通信硕士1班', supervisor: '张老师', supervisorId: 't01', required: 34, earned: 12, credit: 100, remark: '新生' },
            { id: 'c5', name: '2022级软件工程博士', supervisor: '赵老师', supervisorId: 't04', required: 20, earned: 19, credit: 63, remark: '' },
            { id: 'c6', name: '2023级人工智能硕士班', supervisor: '刘老师', supervisorId: 't05', required: 32, earned: 24, credit: 88, remark: '优秀' },
            { id: 'c7', name: '2024级网络安全硕士班', supervisor: '张老师', supervisorId: 't01', required: 34, earned: 8, credit: 100, remark: '' },
            { id: 'c8', name: '2022级控制博士班', supervisor: '王老师', supervisorId: 't03', required: 18, earned: 15, credit: 79, remark: '' },
            { id: 'c9', name: '2023级通信工程硕士班', supervisor: '李老师', supervisorId: 't02', required: 32, earned: 26, credit: 82, remark: '' },
            { id: 'c10', name: '2024级软件工程硕士班', supervisor: '赵老师', supervisorId: 't04', required: 34, earned: 5, credit: 100, remark: '' },
            { id: 'c11', name: '2023级大数据硕士班', supervisor: '刘老师', supervisorId: 't05', required: 32, earned: 22, credit: 77, remark: '' },
            { id: 'c12', name: '2022级计算机博士班', supervisor: '张老师', supervisorId: 't01', required: 20, earned: 18, credit: 91, remark: '发表顶会' },
            { id: 'c13', name: '2024级控制硕士1班', supervisor: '王老师', supervisorId: 't03', required: 34, earned: 4, credit: 100, remark: '' },
            { id: 'c14', name: '2023级电子通信硕士班', supervisor: '李老师', supervisorId: 't02', required: 32, earned: 27, credit: 84, remark: '' },
            { id: 'c15', name: '2022级通信博士班', supervisor: '赵老师', supervisorId: 't04', required: 18, earned: 16, credit: 73, remark: '' },
            { id: 'c16', name: '2024级人工智能硕士班', supervisor: '刘老师', supervisorId: 't05', required: 34, earned: 3, credit: 100, remark: '' },
            { id: 'c17', name: '2023级软件理论硕士班', supervisor: '张老师', supervisorId: 't01', required: 32, earned: 25, credit: 86, remark: '' },
            { id: 'c18', name: '2022级人工智能博士班', supervisor: '王老师', supervisorId: 't03', required: 20, earned: 17, credit: 80, remark: '' },
            { id: 'c19', name: '2024级计算机博士班', supervisor: '李老师', supervisorId: 't02', required: 20, earned: 2, credit: 100, remark: '直博生' },
            { id: 'c20', name: '2023级网络空间安全硕士班', supervisor: '赵老师', supervisorId: 't04', required: 32, earned: 23, credit: 89, remark: '' }
        ];

        const supervisors = [
            { id: 't01', name: '张老师' },
            { id: 't02', name: '李老师' },
            { id: 't03', name: '王老师' },
            { id: 't04', name: '赵老师' },
            { id: 't05', name: '刘老师' },
        ];

        // 当前编辑ID
        let currentEditId = null;

        // 分页变量
        let currentPage = 1;
        const pageSize = 8;
        let filteredClasses = [];

        // DOM 元素
        const tbody = document.getElementById('tableBody');
        const filterClassName = document.getElementById('filterClassName');
        const filterSupervisor = document.getElementById('filterSupervisor');
        const filterCreditRange = document.getElementById('filterCreditRange');
        const resetFilterBtn = document.getElementById('resetFilterBtn');
        const addClassBtn = document.getElementById('addClassBtn');
        const paginationContainer = document.getElementById('paginationContainer');
        const toast = document.getElementById('toast');

        // 弹窗
        const classModal = document.getElementById('classModal');
        const modalTitle = document.getElementById('modalTitle');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalSaveBtn = document.getElementById('modalSaveBtn');
        const classNameInp = document.getElementById('className');
        const classSupervisor = document.getElementById('classSupervisor');
        const requiredCredit = document.getElementById('requiredCredit');
        const earnedCredit = document.getElementById('earnedCredit');
        const creditScore = document.getElementById('creditScore');
        const remark = document.getElementById('remark');

        const detailModal = document.getElementById('detailModal');
        const closeDetailModalBtn = document.getElementById('closeDetailModalBtn');
        const closeDetailBtn = document.getElementById('closeDetailBtn');
        const detailModalContent = document.getElementById('detailModalContent');

        // 辅助函数
        function showToast(text, duration=1500) {
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        // 渲染主管下拉
        function renderSupervisorOptions() {
            let filterHtml = '<option value="">全部主管</option>';
            supervisors.forEach(s => { filterHtml += `<option value="${s.name}">${s.name}</option>`; });
            filterSupervisor.innerHTML = filterHtml;

            let formHtml = '<option value="">请选择主管</option>';
            supervisors.forEach(s => { formHtml += `<option value="${s.name}">${s.name}</option>`; });
            classSupervisor.innerHTML = formHtml;
        }

        // 信用分等级
        function getCreditLevel(score) {
            if (score >= 81) return { level: 'A', class: 'level-A' };
            if (score >= 61) return { level: 'B', class: 'level-B' };
            return { level: 'C', class: 'level-C' };
        }

        // 筛选
        function applyFilter() {
            const nameFilter = filterClassName.value.trim().toLowerCase();
            const supFilter = filterSupervisor.value;
            const rangeFilter = filterCreditRange.value;
            return classes.filter(c => {
                if (nameFilter && !c.name.toLowerCase().includes(nameFilter)) return false;
                if (supFilter && c.supervisor !== supFilter) return false;
                if (rangeFilter) {
                    const [min, max] = rangeFilter.split('-').map(Number);
                    if (c.credit < min || c.credit > max) return false;
                }
                return true;
            });
        }

        // 分页渲染
        function renderPagination() {
            const totalCount = filteredClasses.length;
            const totalPages = Math.ceil(totalCount / pageSize) || 1;
            const start = totalCount === 0 ? 0 : (currentPage - 1) * pageSize + 1;
            const end = Math.min(currentPage * pageSize, totalCount);
            let infoHtml = totalCount === 0 ? '显示 0 条记录' : `显示 ${start} - ${end} 条，共 ${totalCount} 条记录`;

            // 构建分页控件 (仿变动页面风格)
            let controlsHtml = `<span class="page-info"><i class="fas fa-layer-group"></i> 第 ${currentPage} / ${totalPages} 页</span>`;
            controlsHtml += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.changePage(${currentPage-1})"><i class="fas fa-chevron-left"></i></button>`;
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) controlsHtml += `<span class="pagination-btn active">${i}</span>`;
                else controlsHtml += `<button class="pagination-btn" onclick="window.changePage(${i})">${i}</button>`;
            }
            controlsHtml += `<button class="pagination-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="window.changePage(${currentPage+1})"><i class="fas fa-chevron-right"></i></button>`;

            paginationContainer.innerHTML = `<span style="color:#4f5e74; margin-right:auto;">${infoHtml}</span> ${controlsHtml}`;
        }

        window.changePage = function(page) {
            const totalPages = Math.ceil(filteredClasses.length / pageSize) || 1;
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            if (page === currentPage) return;
            currentPage = page;
            renderTable();
        };

        // 渲染表格
        function renderTable() {
            filteredClasses = applyFilter();
            const totalPages = Math.ceil(filteredClasses.length / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * pageSize;
            const pageData = filteredClasses.slice(start, start + pageSize);

            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:3rem; color:#8899bb;"><i class="fas fa-school" style="font-size:2rem;"></i><br>暂无班级记录</td></tr>`;
                renderPagination();
                return;
            }

            let rows = '';
            pageData.forEach(c => {
                const rate = ((c.earned / c.required) * 100).toFixed(1);
                const level = getCreditLevel(c.credit);
                rows += `<tr>
                    <td><span class="badge-class">${c.name}</span></td>
                    <td>${c.supervisor}</td>
                    <td>${c.required}</td>
                    <td>${c.earned}</td>
                    <td><span class="credit-score-badge">${rate}%</span></td>
                    <td><span class="credit-score-badge ${level.class}" style="font-weight:600;">${c.credit} (${level.level})</span></td>
                    <td><div class="remark-text" title="${c.remark || ''}">${c.remark || '—'}</div></td>
                    <td><div class="action-btns">
                        <button class="icon-btn edit-btn" data-id="${c.id}"><i class="fas fa-pen"></i> 编辑</button>
                        <button class="icon-btn detail-view" data-id="${c.id}"><i class="fas fa-info-circle"></i> 详情</button>
                    </div></td>
                </tr>`;
            });
            tbody.innerHTML = rows;

            document.querySelectorAll('.edit-btn').forEach(b => b.addEventListener('click', (e) => openEditModal(e.currentTarget.dataset.id)));
            document.querySelectorAll('.detail-view').forEach(b => b.addEventListener('click', (e) => showDetailModal(e.currentTarget.dataset.id)));

            renderPagination();
        }

        // 弹窗控制
        function openAddModal() {
            currentEditId = null;
            modalTitle.innerHTML = '<i class="fas fa-plus-circle"></i> 新增班级';
            classNameInp.value = '';
            classSupervisor.value = '';
            requiredCredit.value = 32;
            earnedCredit.value = 0;
            creditScore.value = 100;
            remark.value = '';
            classModal.classList.add('show');
        }

        function openEditModal(id) {
            const cls = classes.find(c => c.id === id);
            if (!cls) return;
            currentEditId = id;
            modalTitle.innerHTML = '<i class="fas fa-edit"></i> 编辑班级';
            classNameInp.value = cls.name;
            classSupervisor.value = cls.supervisor;
            requiredCredit.value = cls.required;
            earnedCredit.value = cls.earned;
            creditScore.value = cls.credit;
            remark.value = cls.remark || '';
            classModal.classList.add('show');
        }

        function closeModal() {
            classModal.classList.remove('show');
        }

        function saveClass() {
            const name = classNameInp.value.trim();
            const sup = classSupervisor.value;
            const required = parseInt(requiredCredit.value, 10);
            const earned = parseInt(earnedCredit.value, 10);
            const credit = parseInt(creditScore.value, 10);
            const remarks = remark.value.trim();

            if (!name || !sup || isNaN(required) || isNaN(credit)) {
                showToast('请填写必填项：班级名称、主管、应修学分、信用分', 1500);
                return;
            }
            if (required < 0 || credit < 0) { showToast('学分/信用分不能为负数'); return; }

            if (currentEditId) {
                const index = classes.findIndex(c => c.id === currentEditId);
                if (index !== -1) {
                    classes[index] = { ...classes[index], name, supervisor: sup, required, earned, credit, remark: remarks };
                }
            } else {
                const newId = 'c' + Date.now() + Math.random().toString(36).substring(2,6);
                classes.push({ id: newId, name, supervisor: sup, supervisorId: 't' + Math.floor(Math.random()*10), required, earned, credit, remark: remarks });
            }
            closeModal();
            currentPage = 1;
            renderTable();
            showToast('班级已保存');
        }

        // 详情展示 (沿用班级原历史模拟)
        function showDetailModal(id) {
            const cls = classes.find(c => c.id === id);
            if (!cls) return;
            const level = getCreditLevel(cls.credit);
            const history = [
                { time: '2026-03-10 09:20', action: '信用分调整', from: cls.credit-3, to: cls.credit, operator: '李老师' },
                { time: '2026-03-01 14:15', action: '已修学分更新', from: cls.earned-2, to: cls.earned, operator: '系统同步' },
            ];
            const historyHtml = history.map(h => `<li><span>${h.time} ${h.action}</span> <span>${h.from} → ${h.to} (${h.operator})</span></li>`).join('');
            const content = `
                <div style="background:#f6f9ff; border-radius:20px; padding:1.4rem 1.5rem;">
                    <div style="display:flex; justify-content:space-between; border-bottom:1px dashed #d7e1ee; padding-bottom:0.6rem;"><span style="color:#496183;">班级名称</span><span style="font-weight:600;">${cls.name}</span></div>
                    <div style="display:flex; justify-content:space-between; border-bottom:1px dashed #d7e1ee; padding:0.6rem 0;"><span style="color:#496183;">主管</span><span>${cls.supervisor}</span></div>
                    <div style="display:flex; justify-content:space-between; border-bottom:1px dashed #d7e1ee; padding:0.6rem 0;"><span style="color:#496183;">应修/已修</span><span>${cls.required} / ${cls.earned} (${((cls.earned/cls.required)*100).toFixed(1)}%)</span></div>
                    <div style="display:flex; justify-content:space-between; border-bottom:1px dashed #d7e1ee; padding:0.6rem 0;"><span style="color:#496183;">信用分/等级</span><span>${cls.credit} (${level.level})</span></div>
                    <div style="display:flex; justify-content:space-between; padding-top:0.6rem;"><span style="color:#496183;">备注</span><span>${cls.remark || '无'}</span></div>
                </div>
                <div style="font-weight:600; font-size:1.1rem; margin:1rem 0 0.5rem;">📋 变更历史</div>
                <ul style="list-style:none; border-top:1px solid #eef3fc; padding-top:0.5rem;">
                    ${historyHtml}
                    <li style="display:flex; justify-content:space-between; padding:0.7rem 0; border-bottom:1px dashed #dde5f0;"><span>初始创建</span><span>系统记录</span></li>
                </ul>
            `;
            detailModalContent.innerHTML = content;
            detailModal.classList.add('show');
        }

        function closeDetailModal() {
            detailModal.classList.remove('show');
        }

        // 重置筛选
        function resetFilters() {
            filterClassName.value = '';
            filterSupervisor.value = '';
            filterCreditRange.value = '';
            currentPage = 1;
            renderTable();
        }

        // 事件绑定
        filterClassName.addEventListener('input', () => { currentPage = 1; renderTable(); });
        filterSupervisor.addEventListener('change', () => { currentPage = 1; renderTable(); });
        filterCreditRange.addEventListener('change', () => { currentPage = 1; renderTable(); });
        resetFilterBtn.addEventListener('click', resetFilters);
        addClassBtn.addEventListener('click', openAddModal);
        closeModalBtn.addEventListener('click', closeModal);
        modalCancelBtn.addEventListener('click', closeModal);
        modalSaveBtn.addEventListener('click', saveClass);
        classModal.addEventListener('click', (e) => { if (e.target === classModal) closeModal(); });
        closeDetailModalBtn.addEventListener('click', closeDetailModal);
        closeDetailBtn.addEventListener('click', closeDetailModal);
        detailModal.addEventListener('click', (e) => { if (e.target === detailModal) closeDetailModal(); });

        // 初始化
        renderSupervisorOptions();
        renderTable();
    })();
</script>
</body>
</html>
