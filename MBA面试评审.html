<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>MBA面试评审 · 正式提交确认</title>
    <!-- 引入目标风格的字体与图标库 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Chart.js 3 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <!-- JSZip 用于生成压缩包 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* 完全沿用第二个文件的风格基底 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #eef3f8;
            color: #1e293b;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #d9e2ec; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #2b5f8a; border-radius: 10px; }

        .dashboard {
            flex: 1;
            padding: 1.5rem 1.8rem;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 100%;
            margin: 0 auto;
            width: 100%;
        }
        @media (max-width: 640px) {
            .dashboard { padding: 1rem 1rem; }
        }

        .section {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,20,40,0.08);
            padding: 1.8rem 2rem;
            border: 1px solid #e9eef4;
            width: 100%;
        }
        @media (max-width: 640px) {
            .section { padding: 1.5rem 1.2rem; }
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 12px;
        }
        .section-header h2 {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a5f;
            margin: 0;
        }
        .section-header h2 i {
            color: #2f6e9e;
            font-size: 1.4rem;
            background: transparent;
            padding: 0;
        }
        .header-note {
            background: #f2f8ff;
            padding: 6px 20px;
            border-radius: 40px;
            color: #1f4b73;
            font-size: 0.9rem;
            border: 1px solid #d4e2f5;
        }

        .batch-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .batch-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px 22px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #e2eaf3;
            transition: all 0.1s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .batch-card.active-batch {
            border-left: 6px solid #1f6eaf;
            background: #f9fcff;
        }
        .batch-info {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            align-items: center;
        }
        .batch-info span {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #1e3a5f;
            font-weight: 500;
        }
        .batch-status {
            background: #e3f0fa;
            color: #11517c;
            padding: 5px 15px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
            white-space: nowrap;
        }
        .batch-actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            border: none;
            background: transparent;
            font-weight: 500;
            padding: 0.45rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
            background: white;
            border-color: #cbd5e1;
            color: #2c455d;
        }
        .btn-sm:hover { background: #f1f7fd; border-color: #9bb0c5; }
        .btn-primary {
            background: #1e4a6f;
            color: white;
            box-shadow: 0 4px 10px rgba(0,60,110,0.2);
            border: none;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-primary:hover { background: #123a58; transform: translateY(-2px); }
        .btn-outline {
            background: white;
            border: 1px solid #cbd5e1;
            color: #2c455d;
        }

        .search-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            background: #f8fafd;
            border-radius: 60px;
            padding: 8px 16px 8px 24px;
            margin-bottom: 24px;
            border: 1px solid #dde3ea;
        }
        .search-input-wrap {
            flex: 3 1 260px;
            display: flex;
            align-items: center;
            background: white;
            border-radius: 60px;
            border: 1px solid #dde3ea;
            padding: 0 8px 0 18px;
        }
        .search-input-wrap i { color: #5f7d9e; }
        .search-input-wrap input {
            border: none;
            padding: 12px 8px;
            width: 100%;
            outline: none;
            background: transparent;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
        }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 32px;
            background: #f8fafd;
            border-radius: 28px;
            padding: 18px 28px;
            margin-bottom: 16px;
            align-items: center;
            border: 1px solid #e2eaf3;
        }
        .stat-cell {
            display: flex;
            flex-direction: column;
        }
        .stat-cell .label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
        }
        .stat-cell .number {
            font-size: 2.2rem;
            font-weight: 700;
            color: #113355;
            line-height: 1.2;
        }

        .distrib-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: transparent;
            padding: 16px 0;
            margin: 8px 0;
        }
        .distrib-tag {
            background: #e3f0fa;
            color: #11517c;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            border: none;
            box-shadow: none;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }
        .chart-card {
            background: #f8fafd;
            border-radius: 24px;
            padding: 12px 12px 8px;
            border: 1px solid #e2edff;
        }
        .chart-container { height: 160px; width: 100%; }

        .candidate-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0 18px;
        }
        .candidate-tab {
            padding: 0.45rem 1.4rem;
            border-radius: 40px;
            background: #f8fafd;
            font-weight: 500;
            color: #1d3e62;
            cursor: pointer;
            border: 1px solid #dde3ea;
            transition: 0.1s;
            font-size: 0.9rem;
        }
        .candidate-tab.active-tab {
            background: #1e4a6f;
            color: white;
            border-color: #1e4a6f;
            box-shadow: 0 4px 8px rgba(0,60,110,0.2);
        }

        .material-panel {
            background: #f8fafd;
            border-radius: 28px;
            padding: 20px;
            margin: 10px 0 20px;
            border: 1px solid #e2eaf3;
        }

        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
        }

        .score-area {
            background: #f8fafd;
            border-radius: 40px;
            padding: 18px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
            border: 1px solid #e2eaf3;
        }
        .score-area label {
            font-weight: 600;
            font-size: 0.8rem;
            color: #4e6f8c;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .score-area input[type=number] {
            background: white;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.65rem 1.2rem;
            font-family: 'Inter', sans-serif;
            width: 110px;
        }

        /* 模态框 (完全套用第二个文件的模态框) */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,20,40,0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal.show { visibility: visible; opacity: 1; }
        .modal-card {
            background: white; border-radius: 32px; width: 90%; max-width: 600px;
            padding: 2rem 2.2rem; box-shadow: 0 40px 70px rgba(0,20,50,0.4);
            transform: scale(0.95); transition: transform 0.2s ease;
            max-height: 90vh; overflow-y: auto;
        }
        .modal.show .modal-card { transform: scale(1); }
        .modal-close {
            background: none; border: none; font-size: 2.2rem; cursor: pointer;
            color: #8ba5c2; line-height: 1; position: absolute; top: 20px; right: 24px;
        }
        .modal-close:hover { color: #1e3a5f; }

        .file-list {
            margin-top: 16px;
        }
        .file-item {
            padding: 10px 16px;
            background: #f4f9ff;
            border-radius: 40px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border: 1px solid #c7daf0;
        }
        .file-item i { color: #d54e4e; width: 24px; }
        .file-item span { flex:1; color: #1d3f5e; }
        .file-item:hover { background: #e3ecf7; }

        /* 确认弹窗特殊样式 */
        .confirm-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .toast-msg {
            background: #1e4a6f; color: white; padding: 0.8rem 2rem;
            border-radius: 60px; font-weight: 500; box-shadow: 0 15px 30px rgba(0,40,70,0.4);
            position: fixed; bottom: 30px; right: 30px; z-index: 1100;
            opacity: 0; transform: translateY(10px); transition: 0.2s; pointer-events: none;
        }
        .toast-msg.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 700px) {
            .dashboard { padding: 12px; }
            .chart-grid { grid-template-columns: 1fr; }
            .batch-card { flex-direction: column; align-items: start; gap: 10px; }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <!-- 评审批次列表区块 -->
    <div class="section">
        <div class="section-header">
            <h2><i class="fas fa-list-ul"></i> 当前评审批次</h2>
        </div>
        <div class="batch-grid" id="batchListContainer"></div>
    </div>

    <!-- 评审统计信息区块 -->
    <div class="section">
        <div class="section-header">
            <h2><i class="fas fa-chart-pie"></i> 评审统计信息</h2>
            <span class="header-note"><i class="fas fa-info-circle"></i> 综合材料+面试表现打分</span>
        </div>
        <!-- 搜索+评审入口 -->
        <div class="search-bar">
            <div class="search-input-wrap">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="面试申请号 / 姓名" id="searchInput" value="ZS2025043">
                <button class="btn-sm" id="searchBtn" style="border: none; background: transparent; color:#1e4a7a;"><i class="fas fa-arrow-right"></i></button>
            </div>
            <button class="btn-primary" id="reviewFromSearchBtn"><i class="fas fa-user-check"></i> 进行评审</button>
            <button class="btn-outline btn-sm" id="submitAllBtn"><i class="fas fa-upload"></i> 提交考生数据</button>
        </div>

        <!-- 动态统计区 -->
        <div id="statisticArea"></div>
        <div class="chart-grid" id="chartsGrid">
            <div class="chart-card"><p style="margin-left:6px;"><i class="fas fa-chart-bar"></i> 指标柱状图</p><div class="chart-container"><canvas id="barChart"></canvas></div></div>
            <div class="chart-card"><p style="margin-left:6px;"><i class="fas fa-chart-line"></i> 分数分布曲线</p><div class="chart-container"><canvas id="lineChart"></canvas></div></div>
        </div>
    </div>

    <!-- 考生材料评审区块 -->
    <div class="section">
        <div class="section-header">
            <h2><i class="fas fa-folder-open"></i> 考生材料评审 · <span id="currentBatchNameSpan">全日制MBA第二批</span></h2>
            <span class="header-note"><i class="fas fa-edit"></i> 可打分保存并提交</span>
        </div>
        <!-- 考生tabs -->
        <div class="candidate-tabs" id="candidateTabsContainer"></div>
        <!-- 考生详情 -->
        <div class="material-panel" id="candidateDetailPanel"></div>
        <!-- 打分区域 -->
        <div class="score-area" id="scorePanel"></div>
    </div>

    <!-- 通用模态框 (用于材料列表和确认提示) -->
    <div id="infoModal" class="modal">
        <div class="modal-card">
            <i class="fas fa-times modal-close" onclick="closeModal()"></i>
            <div id="modalContent" style="font-size:1rem; line-height:1.6; color:#1f3f5f;"></div>
        </div>
    </div>

    <!-- 轻提示toast -->
    <div id="toast" class="toast-msg">提示</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
    (function() {
        // 数据模型
        const batchData = [
            { id: 'b1', name: '全日制MBA', round: '第二批', date: '2025-04-15', status: '待评审', statusClass: '',
              candidates: [
                { id: 'c1', name: '张明扬', appId: 'ZS2025043', education: '复旦大学 金融学本科 (GPA 3.6)', work: '5年投行分析师', material: '学历证书、荣誉证书、2封推荐信、个人陈述', score: 86 },
                { id: 'c2', name: '李心怡', appId: 'ZS2025051', education: '南京大学 经济学硕士', work: '4年咨询公司高级顾问', material: '学位证、CFA二级、项目报告3份', score: 79 },
                { id: 'c3', name: '王启航', appId: 'ZS2025067', education: '浙江大学 计算机本科', work: '3年AI产品经理', material: '专利、创业计划书、推荐信', score: 91 }
              ] },
            { id: 'b2', name: '在职EMBA', round: '第一批', date: '2025-04-02', status: '已评审', statusClass: 'status-green',
              candidates: [
                { id: 'd1', name: '陈雅丽', appId: 'ZS2025088', education: '上海交大 工商管理本科 (GPA 3.8)', work: '4年互联网运营经理带8人团队', material: '绩效评定、雅思7.5、项目案例集', score: 91 },
                { id: 'd2', name: '刘东伟', appId: 'ZS2025093', education: '北大 光华MBA预修', work: '8年销售总监', material: '荣誉证书、团队奖、推荐信3封', score: 84 }
              ] },
            { id: 'b3', name: '国际MBA', round: '第一批', date: '2025-04-20', status: '待评审', statusClass: '',
              candidates: [
                { id: 'e1', name: '王峻', appId: 'ZS2025112', education: '清华硕士 计算机', work: '3年AI产品总监', material: '学历学位、专利证明、创业计划书', score: 79 },
                { id: 'e2', name: '欧阳雪', appId: 'ZS2025125', education: '香港大学 金融本科', work: '2年外资投行', material: 'GMAT 750、推荐信2封、论文', score: 88 }
              ] }
        ];

        let currentBatchId = 'b1';
        let currentCandidateId = 'c1';
        let barChart, lineChart;

        // 工具函数：下载文件
        function downloadFile(content, filename, mimeType = 'application/octet-stream') {
            const blob = (content instanceof Blob) ? content : new Blob([content], { type: mimeType });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
        }

        // 模拟生成文件内容（用于演示）
        function generateFileContent(candidate, fileType) {
            const base = `考生: ${candidate.name} (${candidate.appId})\n教育: ${candidate.education}\n工作: ${candidate.work}\n`;
            switch(fileType) {
                case '陈述': return base + `个人陈述：本人立志于MBA学习...`;
                case '学历': return base + `学历学位证：复旦大学本科毕业证、学位证`;
                case '推荐信': return base + `推荐信：来自XX总监和XX教授`;
                case '荣誉': return base + `荣誉证书：优秀员工奖、创新之星`;
                default: return base + `默认文件内容`;
            }
        }

        // ---------- 材料弹窗：显示文件列表，点击单个下载 ----------
        function showMaterialList(candidate) {
            const files = [
                { name: '个人陈述.pdf', type: '陈述', icon: 'fa-file-pdf' },
                { name: '学历学位证.pdf', type: '学历', icon: 'fa-file-pdf' },
                { name: '推荐信合集.pdf', type: '推荐信', icon: 'fa-file-pdf' },
                { name: '荣誉证书.jpg', type: '荣誉', icon: 'fa-file-image' }
            ];
            
            let fileListHtml = `
                <div class="file-list">
                    <h4><i class="fas fa-folder-open"></i> ${candidate.name} 的申请材料</h4>
                    <p style="color:#4e6f8c; margin-bottom:12px;">点击下方文件即可下载</p>
            `;
            
            files.forEach(f => {
                fileListHtml += `
                    <div class="file-item" onclick="window.downloadSingleFile('${candidate.id}', '${f.type}')">
                        <i class="fas ${f.icon}" style="color:#d54e4e;"></i>
                        <span>${f.name}</span>
                        <i class="fas fa-download" style="color:#1e4a7a;"></i>
                    </div>
                `;
            });
            
            fileListHtml += `</div>`;
            
            // 存储当前candidate到全局，供下载函数使用
            window.__currentCandidate = candidate;
            openModal(fileListHtml);
        }

        // 全局函数：下载单个文件（由文件列表点击调用）
        window.downloadSingleFile = (candidateId, fileType) => {
            const candidate = window.__currentCandidate;
            if (!candidate) return;
            
            let filename = `${candidate.name}_`;
            let content = generateFileContent(candidate, fileType);
            
            switch(fileType) {
                case '陈述': filename += '个人陈述.pdf'; break;
                case '学历': filename += '学历学位证.pdf'; break;
                case '推荐信': filename += '推荐信合集.pdf'; break;
                case '荣誉': filename += '荣誉证书.jpg'; content = `模拟JPG图片内容：` + content; break;
                default: filename += '文件.pdf';
            }
            
            downloadFile(content, filename, 'application/pdf');
            showToast(`开始下载: ${filename}`);
        };

        // 打印总表：先弹窗确认，确认后生成压缩包
        function handlePrintBatch(batchId) {
            const batch = batchData.find(b => b.id === batchId);
            if (!batch) return;
            
            const confirmHtml = `
                <div style="text-align:center;">
                    <i class="fas fa-print" style="font-size:3rem; color:#1e4a6f; margin-bottom:15px;"></i>
                    <h3>打印批次总表</h3>
                    <p>确认生成并下载 “${batch.name} ${batch.round}” 的总表压缩包吗？</p>
                    <p style="font-size:0.85rem; color:#6c8aa8;">包含所有考生的材料摘要和评分汇总</p>
                </div>
                <div class="confirm-buttons">
                    <button class="btn-sm" onclick="closeModal()"><i class="fas fa-times"></i> 取消</button>
                    <button class="btn-primary" onclick="window.confirmPrintBatch('${batch.id}')"><i class="fas fa-check"></i> 确认下载</button>
                </div>
            `;
            openModal(confirmHtml);
        }

        // 确认后生成压缩包
        window.confirmPrintBatch = (batchId) => {
            closeModal();
            const batch = batchData.find(b => b.id === batchId);
            if (!batch) return;
            
            showToast('⏳ 正在生成压缩包...', 1500);
            
            // 模拟异步生成zip
            setTimeout(async () => {
                const zip = new JSZip();
                
                // 添加一个总览文件
                let overview = `批次: ${batch.name} ${batch.round}\n日期: ${batch.date}\n考生人数: ${batch.candidates.length}\n\n`;
                batch.candidates.forEach((c, index) => {
                    overview += `${index+1}. ${c.name} (${c.appId}) 得分:${c.score}\n   教育:${c.education}\n   工作:${c.work}\n   材料:${c.material}\n\n`;
                });
                zip.file("批次总览.txt", overview);
                
                // 为每个考生添加一个材料摘要文件
                batch.candidates.forEach(c => {
                    const content = `姓名: ${c.name}\n申请号: ${c.appId}\n教育: ${c.education}\n工作: ${c.work}\n材料清单: ${c.material}\n当前得分: ${c.score}`;
                    zip.file(`${c.name}_材料摘要.txt`, content);
                });
                
                // 生成zip
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                downloadFile(zipBlob, `${batch.name}${batch.round}_总表.zip`, 'application/zip');
                showToast(`✅ 压缩包下载完成: ${batch.name}${batch.round}_总表.zip`);
            }, 300);
        };

        // 下载报名表：弹窗确认，确认后输出单个文件
        function handleDownloadAppForm(candidate) {
            const confirmHtml = `
                <div style="text-align:center;">
                    <i class="fas fa-file-alt" style="font-size:3rem; color:#1e4a6f; margin-bottom:15px;"></i>
                    <h3>下载报名表</h3>
                    <p>确认下载 “${candidate.name}” 的报名表吗？</p>
                </div>
                <div class="confirm-buttons">
                    <button class="btn-sm" onclick="closeModal()"><i class="fas fa-times"></i> 取消</button>
                    <button class="btn-primary" onclick="window.confirmDownloadForm('${candidate.id}')"><i class="fas fa-check"></i> 确认下载</button>
                </div>
            `;
            // 临时存储candidate
            window.__formCandidate = candidate;
            openModal(confirmHtml);
        }

        window.confirmDownloadForm = (candidateId) => {
            closeModal();
            const candidate = window.__formCandidate;
            if (!candidate) return;
            
            const formContent = `
报名表 - ${candidate.name} (${candidate.appId})
========================================
姓名: ${candidate.name}
申请号: ${candidate.appId}
教育背景: ${candidate.education}
工作经历: ${candidate.work}
提交材料清单: ${candidate.material}
报名时间: 2025-03-01
面试批次: ${batchData.find(b => b.id === currentBatchId)?.name} ${batchData.find(b => b.id === currentBatchId)?.round}
            `.trim();
            
            downloadFile(formContent, `${candidate.name}_报名表.pdf`, 'application/pdf');
            showToast(`📥 下载报名表: ${candidate.name}_报名表.pdf`);
        };

        // ---------- 提交考生数据：去除模拟字样，增加弹窗确认 ----------
        function handleSubmitAllData() {
            const batch = batchData.find(b => b.id === currentBatchId);
            if (!batch) return;
            
            // 计算统计数据用于展示
            const scores = batch.candidates.map(c => c.score);
            const avg = (scores.reduce((a,b) => a+b,0) / scores.length).toFixed(1);
            
            const confirmHtml = `
                <div style="text-align:center;">
                    <i class="fas fa-upload" style="font-size:3rem; color:#1e4a6f; margin-bottom:15px;"></i>
                    <h3>提交考生数据</h3>
                    <p>您确定要提交 “${batch.name} ${batch.round}” 的所有考生数据吗？</p>
                    <div style="background:#f0f7ff; border-radius:16px; padding:12px; margin:15px 0; text-align:left;">
                        <p><i class="fas fa-users"></i> 考生人数：${batch.candidates.length}</p>
                        <p><i class="fas fa-chart-line"></i> 平均得分：${avg}</p>
                        <p style="font-size:0.85rem; color:#6c8aa8;">提交后将无法撤回，请确认信息无误。</p>
                    </div>
                </div>
                <div class="confirm-buttons">
                    <button class="btn-sm" onclick="closeModal()"><i class="fas fa-times"></i> 取消</button>
                    <button class="btn-primary" onclick="window.confirmSubmitAllData()"><i class="fas fa-check"></i> 确认提交</button>
                </div>
            `;
            openModal(confirmHtml);
        }

        // 确认提交数据
        window.confirmSubmitAllData = () => {
            closeModal();
            const batch = batchData.find(b => b.id === currentBatchId);
            if (!batch) return;
            
            // 模拟提交到服务器的过程
            showToast('⏳ 正在提交数据...', 1500);
            
            setTimeout(() => {
                // 将当前批次状态改为"已评审"
                batch.status = '已评审';
                // 重新渲染批次列表以更新状态
                renderBatches();
                showToast(`✅ 成功提交 ${batch.name} ${batch.round} 的考生数据`, 3000);
            }, 800);
        };

        function showToast(msg, duration = 2000) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        // 模态框控制
        window.openModal = (content) => {
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('infoModal').classList.add('show');
        };
        window.closeModal = () => {
            document.getElementById('infoModal').classList.remove('show');
        };

        // 渲染批次列表
        function renderBatches() {
            const container = document.getElementById('batchListContainer');
            container.innerHTML = batchData.map(batch => {
                const isActive = batch.id === currentBatchId;
                let statusStyle = batch.status === '已评审' ? 'background:#deedd9; color:#1f704a;' : 'background:#e3f0fa; color:#11517c;';
                return `
                <div class="batch-card ${isActive ? 'active-batch' : ''}" data-batch-id="${batch.id}">
                    <div class="batch-info">
                        <span><i class="fas fa-graduation-cap"></i> ${batch.name}</span>
                        <span><i class="fas fa-layer-group"></i> ${batch.round} (${batch.date})</span>
                        <span class="batch-status" style="${statusStyle}"><i class="fas fa-${batch.status === '已评审' ? 'check-double' : 'hourglass-half'}"></i> ${batch.status}</span>
                    </div>
                    <div class="batch-actions">
                        <button class="btn-sm review-batch-btn" data-batch-id="${batch.id}"><i class="fas fa-pen"></i> 评审</button>
                        <button class="btn-sm print-batch-btn" data-batch-id="${batch.id}"><i class="fas fa-print"></i> 打印总表</button>
                    </div>
                </div>`;
            }).join('');

            document.querySelectorAll('.review-batch-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const batchId = btn.dataset.batchId;
                    if (batchId) {
                        currentBatchId = batchId;
                        renderBatches();
                        const batch = batchData.find(b => b.id === currentBatchId);
                        if (batch && batch.candidates.length) {
                            currentCandidateId = batch.candidates[0].id;
                        } else {
                            currentCandidateId = null;
                        }
                        updateCandidateSection();
                        updateStatisticAndCharts();
                        showToast(`已切换到批次: ${batch.name} ${batch.round}`);
                    }
                });
            });

            document.querySelectorAll('.print-batch-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const batchId = btn.dataset.batchId;
                    handlePrintBatch(batchId);
                });
            });
        }

        // 更新考生区域
        function updateCandidateSection() {
            const batch = batchData.find(b => b.id === currentBatchId);
            if (!batch) return;
            document.getElementById('currentBatchNameSpan').innerText = `${batch.name}${batch.round}`;

            const tabsContainer = document.getElementById('candidateTabsContainer');
            tabsContainer.innerHTML = batch.candidates.map(c => `
                <span class="candidate-tab ${c.id === currentCandidateId ? 'active-tab' : ''}" data-candidate-id="${c.id}">${c.name} (${c.appId})</span>
            `).join('');

            document.querySelectorAll('.candidate-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const cid = tab.dataset.candidateId;
                    if (cid) {
                        currentCandidateId = cid;
                        updateCandidateSection();
                    }
                });
            });

            const candidate = batch.candidates.find(c => c.id === currentCandidateId) || batch.candidates[0];
            if (!candidate) return;
            if (!batch.candidates.find(c => c.id === currentCandidateId)) {
                currentCandidateId = batch.candidates[0].id;
                return updateCandidateSection();
            }

            const detailPanel = document.getElementById('candidateDetailPanel');
            detailPanel.innerHTML = `
                <div class="flex-row">
                    <div style="flex:2">
                        <p><i class="fas fa-user-graduate" style="color:#1f5f8a;"></i> <strong>${candidate.name} (${candidate.appId})</strong></p>
                        <p><i class="fas fa-university"></i> 教育：${candidate.education}</p>
                        <p><i class="fas fa-briefcase"></i> 工作：${candidate.work}</p>
                    </div>
                    <div style="flex:1; background:#f0f7ff; border-radius:24px; padding:16px;">
                        <p><i class="fas fa-paperclip"></i> <strong>考生材料</strong></p>
                        <p style="font-size:0.9rem;">📄 ${candidate.material}</p>
                        <div style="display:flex; gap:8px; margin-top:12px;">
                            <button class="btn-sm" id="viewMaterialBtn"><i class="fas fa-folder-open"></i> 查看材料</button>
                            <button class="btn-sm" id="viewAppFormBtn"><i class="fas fa-file-alt"></i> 下载报名表</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('viewMaterialBtn')?.addEventListener('click', () => {
                showMaterialList(candidate);
            });

            document.getElementById('viewAppFormBtn')?.addEventListener('click', () => {
                handleDownloadAppForm(candidate);
            });

            const scorePanel = document.getElementById('scorePanel');
            scorePanel.innerHTML = `
                <label><i class="fas fa-star"></i> 面试得分:</label>
                <input type="number" id="candidateScore" value="${candidate.score}" min="0" max="100" step="0.5">
                <button class="btn-sm btn-outline" id="saveScoreBtn"><i class="fas fa-save"></i> 保存打分信息</button>
                <button class="btn-sm btn-primary" id="submitScoreBtn"><i class="fas fa-check-circle"></i> 提交打分信息</button>
                <span style="color:#36648b;"><i class="far fa-clock"></i> 草稿将保存</span>
            `;

            document.getElementById('saveScoreBtn')?.addEventListener('click', () => {
                const newScore = parseFloat(document.getElementById('candidateScore').value);
                if (!isNaN(newScore)) { candidate.score = newScore; }
                showToast(`得分已保存 (${candidate.name} : ${candidate.score} 分)`);
                updateStatisticAndCharts();
            });

            document.getElementById('submitScoreBtn')?.addEventListener('click', () => {
                const newScore = parseFloat(document.getElementById('candidateScore').value);
                if (!isNaN(newScore)) { candidate.score = newScore; }
                showToast(`✅ 考生 ${candidate.name} 最终得分 ${candidate.score} 已提交`);
            });
        }

        // 更新统计图表
        function updateStatisticAndCharts() {
            const batch = batchData.find(b => b.id === currentBatchId);
            if (!batch) return;
            const scores = batch.candidates.map(c => c.score);
            const avg = (scores.reduce((a,b) => a+b,0) / scores.length).toFixed(1);
            const max = Math.max(...scores);
            const min = Math.min(...scores);
            const count = scores.length;

            const excellent = scores.filter(s => s >= 90).length;
            const good = scores.filter(s => s >= 75 && s < 90).length;
            const medium = scores.filter(s => s >= 60 && s < 75).length;
            const poor = scores.filter(s => s < 60).length;

            document.getElementById('statisticArea').innerHTML = `
                <div class="stats-row">
                    <div class="stat-cell"><span class="label">已评审考生</span><span class="number">${count}</span></div>
                    <div class="stat-cell"><span class="label">平均分</span><span class="number">${avg}</span></div>
                    <div class="stat-cell"><span class="label">最高分</span><span class="number">${max}</span></div>
                    <div class="stat-cell"><span class="label">最低分</span><span class="number">${min}</span></div>
                </div>
                <div class="distrib-tags">
                    <span class="distrib-tag"><i class="far fa-star"></i> 优秀: ${excellent}</span>
                    <span class="distrib-tag"><i class="far fa-smile"></i> 良好: ${good}</span>
                    <span class="distrib-tag"><i class="far fa-meh"></i> 中等: ${medium}</span>
                    <span class="distrib-tag"><i class="far fa-frown"></i> 待提升: ${poor}</span>
                </div>
            `;

            if (barChart) barChart.destroy();
            if (lineChart) lineChart.destroy();

            const ctxBar = document.getElementById('barChart').getContext('2d');
            barChart = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: ['材料维度', '面试表达', '逻辑思维', '管理潜力'],
                    datasets: [{
                        label: '平均得分',
                        data: [avg*0.9, avg*1.02, avg*0.95, avg*1.05].map(v => Math.min(100, Math.max(0, v.toFixed(1)))),
                        backgroundColor: ['#1f5a8a', '#3579a8', '#5297c7', '#7db5da']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            const seg0 = scores.filter(s => s<60).length;
            const seg1 = scores.filter(s => s>=60 && s<70).length;
            const seg2 = scores.filter(s => s>=70 && s<80).length;
            const seg3 = scores.filter(s => s>=80 && s<90).length;
            const seg4 = scores.filter(s => s>=90).length;

            const ctxLine = document.getElementById('lineChart').getContext('2d');
            lineChart = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: ['<60', '60-69', '70-79', '80-89', '90-100'],
                    datasets: [{
                        label: '人数',
                        data: [seg0, seg1, seg2, seg3, seg4],
                        borderColor: '#c9453a',
                        backgroundColor: 'rgba(201,69,58,0.05)',
                        tension: 0.2,
                        fill: true,
                        pointBackgroundColor: '#b13e35'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        // 绑定全局操作
        function bindGlobalActions() {
            document.getElementById('searchBtn').addEventListener('click', () => {
                const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
                const batch = batchData.find(b => b.id === currentBatchId);
                if (!batch) return;
                const found = batch.candidates.find(c => c.name.toLowerCase().includes(keyword) || c.appId.toLowerCase().includes(keyword));
                if (found) {
                    currentCandidateId = found.id;
                    updateCandidateSection();
                    showToast(`找到考生: ${found.name}`);
                } else {
                    showToast('未找到匹配考生', 1500);
                }
            });

            document.getElementById('reviewFromSearchBtn').addEventListener('click', () => {
                const batch = batchData.find(b => b.id === currentBatchId);
                const candidate = batch?.candidates.find(c => c.id === currentCandidateId);
                if (candidate) {
                    showToast(`开始评审 ${candidate.name}，请参照材料`);
                } else {
                    showToast('请先选择考生');
                }
            });

            // 提交考生数据：去除模拟字样，增加弹窗确认
            document.getElementById('submitAllBtn').addEventListener('click', () => {
                handleSubmitAllData();  // 直接调用确认弹窗
            });
        }

        // 启动
        function init() {
            renderBatches();
            currentBatchId = 'b1';
            currentCandidateId = batchData[0].candidates[0].id;
            updateCandidateSection();
            updateStatisticAndCharts();
            bindGlobalActions();
        }

        init();
    })();
</script>
</body>
</html>
