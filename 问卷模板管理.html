<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>研究生问卷模板 · Font Awesome 图标版</title>
    <!-- Font Awesome 5 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #f3f6f9; color: #1e293b; height: 100vh; overflow: hidden; }
        .app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

        /* 左侧模板库 */
        .template-sidebar {
            width: 300px; background: #ffffff; border-right: 1px solid #e2e8f0;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .sidebar-header {
            padding: 20px 16px 12px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid #edf2f7;
        }
        .sidebar-header h2 { font-size: 1.2rem; font-weight: 600; color: #0f3b5e; }
        .btn-primary {
            background: #2563eb; color: white; border: none; border-radius: 30px;
            padding: 8px 14px; font-size: 0.85rem; font-weight: 500; cursor: pointer;
            transition: 0.15s; border: none; display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary:hover { background: #1d4ed8; }

        .search-filter { padding: 12px 16px 8px; }
        .search-box { position: relative; margin-bottom: 12px; }
        .search-box input {
            width: 100%; padding: 10px 10px 10px 12px; border: 1px solid #e2e8f0;
            border-radius: 30px; font-size: 0.9rem; background: #f8fafc; outline: none;
        }
        .search-box input:focus { border-color: #2563eb; background: #ffffff; }

        .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-tab {
            background: #f1f5f9; border: none; border-radius: 20px; padding: 6px 12px;
            font-size: 0.8rem; font-weight: 500; color: #475569; cursor: pointer;
        }
        .filter-tab.active { background: #2563eb; color: white; }

        .template-list { flex: 1; overflow-y: auto; padding: 8px 16px 20px; }
        .template-card {
            background: #f9fbfd; border: 1px solid #e9edf2; border-radius: 16px;
            padding: 16px; margin-bottom: 12px; transition: 0.15s; cursor: pointer;
        }
        .template-card:hover { background: #ffffff; border-color: #cbd5e1; }
        .template-card.selected { border-left: 4px solid #2563eb; background: #f0f7ff; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .template-name { font-weight: 600; font-size: 1rem; color: #0b2b44; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .status-badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 30px; background: #e6f0ff; color: #1e4f8a; }
        .status-badge.published { background: #dcfce7; color: #166534; }
        .status-badge.archived { background: #f1f5f9; color: #475569; }
        .template-meta { display: flex; gap: 16px; font-size: 0.75rem; color: #64748b; margin-bottom: 12px; }
        .card-actions {
            display: flex; justify-content: flex-end; gap: 12px; font-size: 0.9rem;
            color: #5e718d; border-top: 1px dashed #dce3ec; padding-top: 10px; margin-top: 6px;
        }
        .card-actions i { cursor: pointer; transition: 0.1s; }
        .card-actions i:hover { color: #2563eb; }
        .card-actions .fa-trash-alt:hover { color: #dc2626; }

        /* 右侧主编辑区 */
        .main-editor {
            flex: 1; background: #ffffff; overflow-y: auto; display: flex; flex-direction: column;
        }
        .editor-toolbar {
            padding: 16px 24px; border-bottom: 1px solid #eef2f6; display: flex;
            justify-content: space-between; flex-wrap: wrap; gap: 12px; background: #ffffff;
        }
        .template-title-section { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .template-title-section h1 { font-size: 1.5rem; font-weight: 600; color: #0b2b44; }
        .version-tag { background: #eef2ff; color: #384b6d; padding: 4px 12px; border-radius: 30px; font-size: 0.8rem; }
        .action-buttons { display: flex; gap: 10px; }

        .btn-outline {
            background: white; border: 1px solid #cbd5e1; border-radius: 30px; padding: 8px 16px;
            font-size: 0.85rem; font-weight: 500; color: #334155; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px; transition: 0.1s;
        }
        .btn-outline:hover { background: #f8fafc; border-color: #94a3b8; }

        .basic-info-panel {
            background: #fafcff; margin: 16px 24px; padding: 20px 24px; border-radius: 24px;
            border: 1px solid #e6edf5; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
            gap: 20px 32px;
        }
        .info-item { display: flex; flex-direction: column; gap: 4px; }
        .info-label { font-size: 0.75rem; font-weight: 500; text-transform: uppercase; color: #62748e; }
        .info-value { font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .edit-icon { color: #7c8ba5; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .edit-icon i { font-size: 0.9rem; }

        .question-bank { margin: 8px 24px 16px; }
        .bank-label { font-size: 0.8rem; font-weight: 600; color: #415a77; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .bank-items { display: flex; flex-wrap: wrap; gap: 12px; }
        .bank-item {
            background: #f1f5f9; border-radius: 40px; padding: 8px 18px; font-size: 0.85rem;
            color: #1f3a5f; cursor: pointer; border: 1px solid transparent;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .bank-item:hover { background: #e0e9f5; border-color: #2563eb; }

        .questions-container {
            flex: 1; padding: 8px 24px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
        }

        .question-card {
            background: white; border: 1px solid #e9edf4; border-radius: 20px; padding: 18px 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .q-type {
            background: #dbeafe; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem;
            font-weight: 600; color: #1e4e7a;
        }
        .q-actions { display: flex; gap: 12px; }
        .q-actions i { color: #6f7f9a; cursor: pointer; font-size: 0.9rem; }
        .q-actions i:hover { color: #2563eb; }

        .q-title {
            font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .required-star { color: #dc2626; font-size: 1.2rem; }
        .q-weight { background: #f1f4f9; padding: 2px 8px; border-radius: 20px; font-size: 0.7rem; }

        .options-container { margin: 12px 0; display: flex; flex-direction: column; gap: 8px; }
        .option-row {
            display: flex; align-items: center; gap: 12px; background: #f8fafc;
            padding: 8px 12px; border-radius: 40px; border: 1px solid #e2e8f0;
        }
        .option-row span { flex: 1; }
        .option-score { background: #e6f0ff; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; }

        .matrix-preview { background: #f8fafc; border-radius: 14px; padding: 12px; border: 1px solid #dee7f2; }
        .matrix-row { display: flex; gap: 16px; margin: 5px 0; font-size: 0.85rem; }
        .attach-demo { background: #f0f4fe; padding: 8px 14px; border-radius: 30px; display: inline-flex; gap: 10px; }
        .table-demo { border: 1px solid #dbe1ec; border-radius: 14px; overflow: hidden; }
        .table-demo td { padding: 8px 12px; border: 1px solid #e2e8f0; background: white; }
        .logic-tag {
            margin-top: 10px; background: #fef9e6; border-left: 3px solid #f5b042;
            padding: 6px 12px; font-size: 0.8rem; border-radius: 8px; color: #7b5e2e;
            display: flex; align-items: center; gap: 6px;
        }

        .footer-actions {
            padding: 20px 24px 28px; border-top: 1px solid #eef2f6; display: flex; gap: 16px;
            flex-wrap: wrap;
        }

        /* 模态框通用 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white; width: 90%; max-width: 600px; border-radius: 32px;
            padding: 28px; box-shadow: 0 20px 30px rgba(0,0,0,0.2); max-height: 80vh; overflow-y: auto;
        }
        .modal-header { font-size: 1.4rem; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .modal-field { margin-bottom: 16px; }
        .modal-field label { display: block; font-weight: 500; margin-bottom: 6px; }
        .modal-field input, .modal-field select, .modal-field textarea {
            width: 100%; padding: 10px 14px; border: 1px solid #ced8e6; border-radius: 30px; font-family: inherit;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }

        .option-list { border: 1px solid #e2e8f0; border-radius: 20px; padding: 16px; }
        .option-edit-item {
            display: flex; gap: 12px; align-items: center; margin-bottom: 12px;
        }
        .option-edit-item input[type="text"] { flex: 1; }
        .option-edit-item input[type="number"] { width: 80px; }
        .remove-opt { color: #dc2626; cursor: pointer; font-weight: bold; }

        .rule-item {
            background: #f8fafc; border-radius: 16px; padding: 15px; margin-bottom: 12px;
            border: 1px solid #e2e8f0;
        }

        .score-item {
            display: flex; align-items: center; gap: 12px; padding: 8px; border-bottom: 1px solid #edf2f7;
        }
        .score-item span:first-child { width: 200px; font-weight: 500; }
        .score-item input { width: 80px; }

        @media (max-width: 720px) {
            .app { flex-direction: column; }
            .template-sidebar { width: 100%; height: 280px; border-right: none; border-bottom: 1px solid #ddd; }
            .main-editor { height: calc(100vh - 280px); }
            .basic-info-panel { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- 左侧模板库 -->
    <div class="template-sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-layer-group" style="color:#2b5f9e;"></i> 模板库</h2>
            <button class="btn-primary" id="newTemplateBtn"><i class="fas fa-plus"></i> 新建</button>
        </div>
        <div class="search-filter">
            <div class="search-box">
                <i class="fas fa-search" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#94a3b8;"></i>
                <input type="text" id="searchInput" placeholder="搜索模板..." style="padding-left:36px;">
            </div>
            <div class="filter-tabs" id="filterTabs">
                <button class="filter-tab active" data-filter="all">全部</button>
                <button class="filter-tab" data-filter="评价">评价</button>
                <button class="filter-tab" data-filter="申请">申请</button>
                <button class="filter-tab" data-filter="投票">投票</button>
                <button class="filter-tab" data-filter="宿舍">宿舍</button>
            </div>
        </div>
        <div class="template-list" id="templateList"></div>
    </div>

    <!-- 右侧主编辑区 -->
    <div class="main-editor">
        <div class="editor-toolbar">
            <div class="template-title-section">
                <h1 id="currentTemplateName">奖学金申请表 (2025)</h1>
                <span class="version-tag" id="currentVersion"><i class="fas fa-code-branch"></i> v2.1</span>
                <span class="status-badge published" id="currentStatus">已发布</span>
            </div>
            <div class="action-buttons">
                <button class="btn-outline" id="previewBtn"><i class="fas fa-eye"></i> 预览</button>
                <button class="btn-outline" id="saveTemplateBtn"><i class="fas fa-save"></i> 保存</button>
                <button class="btn-outline" id="versionHistoryBtn"><i class="fas fa-history"></i> 版本</button>
            </div>
        </div>

        <!-- 基础信息卡片 -->
        <div class="basic-info-panel" id="basicInfoPanel">
            <div class="info-item">
                <span class="info-label">模板名称</span>
                <span class="info-value" id="infoName">奖学金申请表 (2025) <span class="edit-icon" data-field="name"><i class="fas fa-pen"></i> 编辑</span></span>
            </div>
            <div class="info-item">
                <span class="info-label">分类</span>
                <span class="info-value" id="infoCategory">申请 <span class="edit-icon" data-field="category"><i class="fas fa-pen"></i> 编辑</span></span>
            </div>
            <div class="info-item">
                <span class="info-label">适用对象</span>
                <span class="info-value" id="infoAudience">硕士、博士 <span class="edit-icon" data-field="audience"><i class="fas fa-pen"></i> 编辑</span></span>
            </div>
            <div class="info-item">
                <span class="info-label">有效期限</span>
                <span class="info-value" id="infoDate">2025-03-01 ~ 2025-04-01 <span class="edit-icon" data-field="date"><i class="fas fa-pen"></i> 编辑</span></span>
            </div>
        </div>

        <!-- 题型库快速添加 -->
        <div class="question-bank">
            <div class="bank-label"><i class="fas fa-cubes"></i> 题型库 (点击添加)</div>
            <div class="bank-items" id="questionBank">
                <div class="bank-item" data-type="单选"><i class="fas fa-dot-circle"></i> 单选</div>
                <div class="bank-item" data-type="多选"><i class="fas fa-check-square"></i> 多选</div>
                <div class="bank-item" data-type="文本"><i class="fas fa-align-left"></i> 文本</div>
                <div class="bank-item" data-type="评分"><i class="fas fa-star"></i> 评分</div>
                <div class="bank-item" data-type="矩阵"><i class="fas fa-table"></i> 矩阵</div>
                <div class="bank-item" data-type="附件"><i class="fas fa-paperclip"></i> 附件</div>
                <div class="bank-item" data-type="表格"><i class="fas fa-border-all"></i> 表格</div>
            </div>
        </div>

        <!-- 题目列表 (动态渲染) -->
        <div class="questions-container" id="questionsContainer"></div>

        <!-- 底部全局动作 -->
        <div class="footer-actions">
            <button class="btn-outline" id="addQuestionBtn"><i class="fas fa-plus"></i> 添加题目</button>
            <button class="btn-outline" id="globalLogicBtn"><i class="fas fa-link"></i> 全局逻辑规则 <span id="globalLogicCount">(0条)</span></button>
            <button class="btn-outline" id="scoreConfigBtn"><i class="fas fa-calculator"></i> 自动算分</button>
        </div>
    </div>
</div>

<!-- 新建/编辑模板模态框 -->
<div class="modal" id="templateModal">
    <div class="modal-content">
        <div class="modal-header"><i class="fas fa-edit"></i> <span id="modalTitle">新建问卷模板</span></div>
        <div class="modal-field"><label>模板名称</label><input type="text" id="modalTmplName"></div>
        <div class="modal-field"><label>分类</label><select id="modalCategory"><option>评价</option><option>申请</option><option>投票</option><option>宿舍</option></select></div>
        <div class="modal-field"><label>适用对象</label><select multiple size="3" id="modalAudience"><option value="硕士">硕士</option><option value="博士">博士</option><option value="导师">导师</option></select><small>按住ctrl多选</small></div>
        <div class="modal-field"><label>有效期限</label><input type="text" id="modalDate" placeholder="2025-03-01 ~ 2025-04-01"></div>
        <div class="modal-actions"><button class="btn-outline" id="closeModalBtn"><i class="fas fa-times"></i> 取消</button><button class="btn-primary" id="saveTemplateBtnModal"><i class="fas fa-save"></i> 保存</button></div>
    </div>
</div>

<!-- 预览模态框 -->
<div class="modal" id="previewModal">
    <div class="modal-content" style="max-width:700px;">
        <div class="modal-header"><i class="fas fa-eye"></i> 预览问卷 · <span id="previewTitle"></span></div>
        <div style="max-height:500px; overflow:auto; padding:8px 12px; background:#f9fafc; border-radius:24px;" id="previewContent"></div>
        <div class="modal-actions"><button class="btn-outline" id="closePreviewBtn"><i class="fas fa-times"></i> 关闭</button></div>
    </div>
</div>

<!-- 版本历史模态框 -->
<div class="modal" id="versionModal">
    <div class="modal-content">
        <div class="modal-header"><i class="fas fa-history"></i> 版本历史</div>
        <div class="version-list" id="versionList">
            <div class="version-item"><i class="fas fa-circle" style="color:#2563eb; font-size:0.6rem;"></i> v2.1 - 2025-02-10 当前</div>
            <div class="version-item"><i class="fas fa-circle" style="color:#94a3b8; font-size:0.6rem;"></i> v2.0 - 2025-01-15</div>
        </div>
        <div class="modal-actions"><button class="btn-outline" id="closeVersionBtn"><i class="fas fa-times"></i> 关闭</button></div>
    </div>
</div>

<!-- 单项逻辑规则配置模态框 -->
<div class="modal" id="singleLogicModal">
    <div class="modal-content" style="max-width:500px;">
        <div class="modal-header"><i class="fas fa-random"></i> 配置题目显示逻辑</div>
        <div id="singleLogicQuestionRef" style="margin-bottom:16px; font-weight:500;"></div>
        <div class="rule-item" style="background:#ffffff; border:1px solid #d9e2ef;">
            <div style="margin-bottom:10px;"><label>依赖题目</label> <select id="logicDepQuestion" style="width:100%;"></select></div>
            <div style="margin-bottom:10px;"><label>依赖选项</label> <select id="logicDepOption" style="width:100%;"></select></div>
            <div style="display: flex; align-items: center; gap:12px;">
                <label><input type="checkbox" id="logicShowHide"> <span id="logicActionText">显示</span> 此题</label>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-outline" id="closeSingleLogic"><i class="fas fa-times"></i> 取消</button>
            <button class="btn-primary" id="saveSingleLogic"><i class="fas fa-save"></i> 保存规则</button>
        </div>
    </div>
</div>

<!-- 全局逻辑规则配置模态框 -->
<div class="modal" id="globalLogicModal">
    <div class="modal-content">
        <div class="modal-header"><i class="fas fa-globe"></i> 全局逻辑规则</div>
        <div id="globalRulesContainer"></div>
        <button class="btn-outline" id="addGlobalRuleBtn" style="width:100%; margin:10px 0;"><i class="fas fa-plus"></i> 添加规则</button>
        <div class="modal-actions">
            <button class="btn-outline" id="closeGlobalLogic"><i class="fas fa-times"></i> 关闭</button>
            <button class="btn-primary" id="saveGlobalLogic"><i class="fas fa-save"></i> 保存全局规则</button>
        </div>
    </div>
</div>

<!-- 自动算分配置模态框 -->
<div class="modal" id="scoreModal">
    <div class="modal-content">
        <div class="modal-header"><i class="fas fa-calculator"></i> 自动算分配置</div>
        <div style="margin-bottom:16px; color:#4a5c72;">设置每题系数，总分 = Σ(题目得分 × 系数)</div>
        <div id="scoreItemsContainer" style="max-height:300px; overflow-y:auto; border:1px solid #e9edf4; border-radius:16px; padding:8px;"></div>
        <div style="margin-top:16px; display:flex; align-items:center; gap:16px;">
            <label><input type="checkbox" id="enableTotalScore"> 启用总分</label>
            <label>总分字段名 <input type="text" id="totalScoreLabel" value="总分" style="width:100px;"></label>
        </div>
        <div class="modal-actions">
            <button class="btn-outline" id="closeScoreModal"><i class="fas fa-times"></i> 取消</button>
            <button class="btn-primary" id="saveScoreConfig"><i class="fas fa-save"></i> 保存算分规则</button>
        </div>
    </div>
</div>

<!-- 编辑题目/选项模态框 -->
<div class="modal" id="editQuestionModal">
    <div class="modal-content">
        <div class="modal-header"><i class="fas fa-pen"></i> <span id="editModalTitle">编辑题目</span></div>
        <div class="modal-field"><label>题干</label><input type="text" id="editQuestionTitle"></div>
        <div class="modal-field"><label>权重</label><input type="number" id="editQuestionWeight" step="0.1" value="1.0"></div>
        <div class="modal-field"><label><input type="checkbox" id="editRequired"> 必填</label></div>
        <div id="editOptionsArea" style="display: none;">
            <label>选项列表 <span id="addOptionBtn" style="margin-left:10px;cursor:pointer;"><i class="fas fa-plus-circle"></i> 添加选项</span></label>
            <div id="optionsEditor" class="option-list"></div>
        </div>
        <div class="modal-actions">
            <button class="btn-outline" id="closeEditModal"><i class="fas fa-times"></i> 取消</button>
            <button class="btn-primary" id="saveEditBtn"><i class="fas fa-save"></i> 保存</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- 数据定义 ----------
        let templates = [
            { id: 't1', name: '奖学金申请表 (2025)', category: '申请', status: 'published', fillCount: 34, audience: '硕士,博士', version: 'v2.1', dateRange: '2025-03-01 ~ 2025-04-01', globalRules: [], scoreConfig: { enabled: true, totalLabel: '总分', coefficients: {} } },
            { id: 't2', name: '导师满意度调查', category: '评价', status: 'published', fillCount: 89, audience: '硕士', version: 'v3.0', dateRange: '2025-02-01 ~ 2025-03-01', globalRules: [], scoreConfig: { enabled: false } },

                    q.options.forEach(opt => {
                        optionsHtml += `<div class="option-row"><span>${opt.text}</span>${opt.score ? `<span class="option-score"><i class="fas fa-star"></i> ${opt.score}</span>` : ''}</div>`;
                    });
                    optionsHtml += '</div>';

                    optionsHtml = '<div class="q-options"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i> (评分)</div>';

                    optionsHtml = '<div class="matrix-preview">';

                        optionsHtml += `<div class="matrix-row"><span style="width:100px;">${row}</span> ${q.matrixCols.join(' · ')}</div>`;

        function deleteTemplate(id) {
            if (confirm('确认删除？')) {
                templates = templates.filter(t => t.id !== id);
                delete questionsData[id];

            const original = templates.find(t => t.id === id);

                const copy = { ...original, id: newId, name: original.name + ' 副本', status: 'draft', fillCount: 0, version: 'v1.0' };
                templates.push(copy);
                questionsData[newId] = JSON.parse(JSON.stringify(questionsData[id] || []));
                renderTemplateList();
                selectTemplate(newId);

                editQuestionWeight.value = q.weight;
                editRequired.checked = q.required || false;
                if (q.type === '单选' || q.type === '多选') {
                    editOptionsArea.style.display = 'block';
                    let optsHtml = '';
                    q.options.forEach((opt, idx) => {
                        optsHtml += `<div class="option-edit-item" data-idx="${idx}">
                            <input type="text" value="${opt.text}" placeholder="选项文字">
                            <input type="number" value="${opt.score || 0}" step="0.1" placeholder="分数" style="width:80px;">
                            <span class="remove-opt"><i class="fas fa-times-circle"></i></span>
                        </div>`;
                    });
                    optionsEditor.innerHTML = optsHtml;
                } else {
                    editOptionsArea.style.display = 'none';
                }
                editQuestionModal.classList.add('active');
            }
            else if (target.closest('[data-action="copy"]')) {
                const newQ = JSON.parse(JSON.stringify(q));
                newQ.id = 'q' + Date.now() + Math.random().toString(36).substr(2,4);
                qs.push(newQ);
                renderQuestions();
            }
            else if (target.closest('[data-action="delete"]')) {
                if (confirm('删除此题？')) {
                    const idx = qs.findIndex(qq => qq.id === qid);
                    if (idx !== -1) qs.splice(idx, 1);
                    renderQuestions();
                }
            }
        });

        saveEditBtn.addEventListener('click', () => {
            const qs = getCurrentQuestions();
            const q = qs.find(q => q.id === currentEditingQuestionId);
            if (!q) return;
            q.title = editQuestionTitle.value.trim() || '未命名';
            q.weight = parseFloat(editQuestionWeight.value) || 0;
            q.required = editRequired.checked;
            if (q.type === '单选' || q.type === '多选') {
                const opts = [];
                document.querySelectorAll('.option-edit-item').forEach(item => {
                    const text = item.querySelector('input[type="text"]').value.trim();
                    const score = parseFloat(item.querySelector('input[type="number"]').value) || 0;
                    if (text) opts.push({ text, score });
                });
                q.options = opts;
            }
            renderQuestions();
            editQuestionModal.classList.remove('active');
        });

        closeEditModal.addEventListener('click', () => editQuestionModal.classList.remove('active'));

        addOptionBtn.addEventListener('click', () => {
            const container = optionsEditor;
            const div = document.createElement('div');
            div.className = 'option-edit-item';
            div.innerHTML = `<input type="text" placeholder="选项文字"><input type="number" step="0.1" placeholder="分数" style="width:80px;"><span class="remove-opt"><i class="fas fa-times-circle"></i></span>`;
            container.appendChild(div);
        });

        optionsEditor.addEventListener('click', (e) => {
            if (e.target.closest('.remove-opt')) {
                e.target.closest('.option-edit-item').remove();
            }
        });

        questionBank.addEventListener('click', (e) => {
            const btn = e.target.closest('.bank-item');
            if (!btn) return;
            const type = btn.dataset.type;
            const qs = getCurrentQuestions();
            const newId = 'q' + Date.now() + Math.random().toString(36).substr(2,4);
            let newQ = { id: newId, type: type, title: '新'+type+'题', required: false, weight: 1, logic: null };
            if (type === '单选' || type === '多选') {
                newQ.options = [{text:'选项1',score:0},{text:'选项2',score:0}];
            } else if (type === '矩阵') {
                newQ.type = '矩阵单选';
                newQ.matrixRows = ['行1','行2'];
                newQ.matrixCols = ['列1','列2','列3'];
            } else if (type === '表格') {
                newQ.type = '表格填写';
                newQ.tableCols = ['列1','列2'];
            }
            qs.push(newQ);
            renderQuestions();
        });

        addQuestionBtn.addEventListener('click', () => {
            const qs = getCurrentQuestions();
            const newId = 'q' + Date.now() + Math.random().toString(36).substr(2,4);
            qs.push({ id: newId, type: '文本', title: '新文本题', required: false, weight: 0, options: [] });
            renderQuestions();
        });

        saveTemplateBtn.addEventListener('click', saveCurrentTemplate);

        filterTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                filterTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.filter;
                renderTemplateList();
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderTemplateList();
        });

        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) e.target.classList.remove('active');
        });

        renderTemplateList();
        selectTemplate('t1');
    })();
</script>
</body>
</html>
