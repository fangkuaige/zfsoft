<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>研究生站内信 · 模板管理</title>
    <!-- Font Awesome 6 免费图标库 (专业图标替换简易符号) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            background-color: #f0f2f5;
        }

        /* 主容器，撑满整个屏幕 */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 100%;
            background-color: #fff;
        }

        /* 头部区域 (无导航条) */
        .app-header {
            padding: 1rem 1.5rem;
            background: #ffffff;
            border-bottom: 1px solid #e4e6e9;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
            flex-shrink: 0;
        }

        .header-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e293b;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-new {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(37,99,235,0.2);
            transition: background 0.15s;
            border: 1px solid #2563eb;
        }

        .btn-new:hover {
            background-color: #1d4ed8;
        }

        /* 搜索栏 */
        .search-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem 1.2rem;
            background: #f8fafc;
            padding: 0.8rem 1rem;
            border-radius: 40px;
            border: 1px solid #e2e8f0;
        }

        .search-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .search-item label {
            color: #475569;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .search-item input, .search-item select {
            padding: 0.5rem 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 30px;
            font-size: 0.9rem;
            background: white;
            min-width: 150px;
        }

        .search-actions {
            display: flex;
            gap: 0.5rem;
            margin-left: auto;
        }

        .search-actions button {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 0.45rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-actions button:first-child {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        /* 主体：左右分栏 */
        .main-area {
            display: flex;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        /* 左侧模板列表 */
        .template-list-panel {
            width: 32%;
            background: #ffffff;
            border-right: 1px solid #e9edf2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .list-header {
            padding: 1rem 1.2rem 0.5rem;
            font-weight: 600;
            color: #334155;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 1rem 1rem;
        }

        .template-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .template-table thead {
            background: #f8fafc;
            color: #475569;
            font-weight: 500;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .template-table th, .template-table td {
            padding: 0.75rem 0.4rem;
            text-align: left;
            border-bottom: 1px solid #ecf1f6;
            vertical-align: middle;
        }

        .template-table tbody tr {
            cursor: pointer;
            transition: background 0.1s;
        }

        .template-table tbody tr:hover {
            background: #f1f5f9;
        }

        .template-table tbody tr.selected {
            background: #e6f0ff;
            border-left: 3px solid #2563eb;
        }

        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-active {
            background: #dff0e6;
            color: #0b5e42;
        }

        .status-inactive {
            background: #fee9e7;
            color: #aa2e2e;
        }

        .row-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: none;
            border: none;
            color: #4b5563;
            font-size: 1rem;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            transition: background 0.1s;
        }

        .action-btn:hover {
            background: #e2e8f0;
        }

        .action-btn.edit-btn { color: #2563eb; }
        .action-btn.delete-btn { color: #dc2626; }
        .action-btn.preview-btn { color: #7c3aed; }

        /* 右侧编辑面板 */
        .edit-panel {
            width: 68%;
            background: #fbfdff;
            overflow-y: auto;
            padding: 1.5rem 2rem;
            border-left: 1px solid #e9edf2;
        }

        .panel-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-row {
            margin-bottom: 1.2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
        }

        .form-label {
            width: 100px;
            font-weight: 500;
            color: #334155;
        }

        .form-control {
            flex: 1;
            min-width: 200px;
            padding: 0.6rem 1rem;
            border: 1px solid #cfddee;
            border-radius: 20px;
            font-size: 0.95rem;
            background: white;
        }

        .type-select {
            flex: 1;
            min-width: 200px;
            padding: 0.6rem 1rem;
            border-radius: 20px;
            border: 1px solid #cfddee;
            background: white;
        }

        /* 开关 */
        .toggle-switch {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .toggle-switch input {
            width: 40px;
            height: 22px;
            appearance: none;
            background: #cbd5e1;
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }
        .toggle-switch input:checked {
            background: #2563eb;
        }
        .toggle-switch input::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.2s;
        }
        .toggle-switch input:checked::before {
            left: 20px;
        }

        /* 富文本工具栏 (使用 Font Awesome 图标) */
        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            background: #f1f5f9;
            padding: 0.6rem;
            border-radius: 30px 30px 0 0;
            border: 1px solid #dde3ea;
            border-bottom: none;
        }
        .editor-toolbar button {
            background: white;
            border: none;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #cddae9;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .editor-content {
            border: 1px solid #dde3ea;
            border-radius: 0 0 20px 20px;
            min-height: 150px;
            padding: 1rem;
            background: white;
            overflow-y: auto;
            outline: none;
            font-size: 0.95rem;
        }
        [contenteditable="true"]:focus {
            border-color: #2563eb;
        }

        /* 变量面板 */
        .variable-panel {
            margin: 1.2rem 0;
            background: #f0f4fe;
            padding: 1rem;
            border-radius: 24px;
        }
        .variable-title {
            font-weight: 600;
            margin-bottom: 0.6rem;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .variable-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .var-btn {
            background: white;
            border: 1px solid #a5c0fa;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            color: #1e3a8a;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .var-btn:hover {
            background: #dbeafe;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        .save-btn, .preview-main-btn {
            padding: 0.7rem 2rem;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .save-btn {
            background: #2563eb;
            color: white;
        }
        .preview-main-btn {
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #bbcde0;
        }

        /* 预览模态框 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: white;
            width: 90%;
            max-width: 700px;
            max-height: 80%;
            border-radius: 32px;
            padding: 2rem;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .modal-card h3 {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .preview-content {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 24px;
            white-space: pre-wrap;
            border: 1px solid #e2e8f0;
        }
        .close-modal {
            float: right;
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #64748b;
        }

        /* 移动端适配 */
        @media screen and (max-width: 768px) {
            .app-header { padding: 0.8rem; }
            .header-title { font-size: 1.3rem; }
            .search-bar { border-radius: 20px; padding: 0.8rem; }
            .search-item input, .search-item select { min-width: 120px; }

            .main-area {
                flex-direction: column;
            }
            .template-list-panel, .edit-panel {
                width: 100% !important;
                height: 50%;
                border-right: none;
                border-bottom: 1px solid #e9edf2;
            }
            .edit-panel {
                border-left: none;
                overflow-y: auto;
                padding: 1rem;
            }
            .template-table {
                font-size: 0.8rem;
            }
            .template-table th, .template-table td {
                padding: 0.5rem 0.3rem;
            }
            .row-actions {
                flex-direction: column;
                gap: 2px;
            }
            .form-row {
                flex-direction: column;
                align-items: flex-start;
            }
            .form-label {
                width: auto;
            }
            .form-control, .type-select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 头部：无导航，使用专业图标 -->
        <div class="app-header">
            <div class="header-row">
                <span class="header-title"></span>
                <button class="btn-new" id="newTemplateBtn"><i class="fas fa-plus"></i> 新建模板</button>
            </div>
            <div class="search-bar">
                <div class="search-item">
                    <label><i class="fas fa-tag"></i> 名称</label>
                    <input type="text" placeholder="模板名称" id="searchName">
                </div>
                <div class="search-item">
                    <label><i class="fas fa-filter"></i> 类型</label>
                    <select id="searchType">
                        <option value="">全部</option>
                        <option value="学位">学位</option>
                        <option value="培养">培养</option>
                        <option value="研工">研工</option>
                        <option value="导师">导师</option>
                        <option value="通用">通用</option>
                    </select>
                </div>
                <div class="search-actions">
                    <button id="searchBtn"><i class="fas fa-search"></i> 查询</button>
                    <button id="resetBtn"><i class="fas fa-undo-alt"></i> 重置</button>
                </div>
            </div>
        </div>

        <!-- 左右主体 -->
        <div class="main-area">
            <!-- 左侧列表区 -->
            <div class="template-list-panel">
                <div class="list-header"><i class="fas fa-list-ul" style="color: #2563eb;"></i> 模板列表</div>
                <div class="list-container" id="listContainer">
                    <!-- 动态表格会由js渲染 -->
                </div>
            </div>

            <!-- 右侧编辑区 -->
            <div class="edit-panel" id="editPanel">
                <div class="panel-title" id="editPanelTitle"><i class="fas fa-pen-to-square" style="color: #2563eb;"></i> 编辑模板</div>
                <form id="templateForm" onsubmit="return false;">
                    <div class="form-row">
                        <span class="form-label"><i class="fas fa-font"></i> 模板名称</span>
                        <input type="text" class="form-control" id="templateName" placeholder="如：硕士开题通知" required>
                    </div>
                    <div class="form-row">
                        <span class="form-label"><i class="fas fa-code"></i> 模板编码</span>
                        <input type="text" class="form-control" id="templateCode" placeholder="OPENING_REVIEW" required>
                    </div>
                    <div class="form-row">
                        <span class="form-label"><i class="fas fa-tags"></i> 模板类型</span>
                        <select class="type-select" id="templateType">
                            <option value="学位">学位</option>
                            <option value="培养">培养</option>
                            <option value="研工">研工</option>
                            <option value="导师">导师</option>
                            <option value="通用">通用</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <span class="form-label"><i class="fas fa-power-off"></i> 状态</span>
                        <div class="toggle-switch">
                            <input type="checkbox" id="templateStatus" checked>
                            <span id="statusText">启用</span>
                        </div>
                    </div>

                    <!-- 富文本工具栏（图标替换） -->
                    <div style="margin: 1rem 0 0.5rem; font-weight: 500;"><i class="fas fa-edit"></i> 正文</div>
                    <div class="editor-toolbar">
                        <button id="boldBtn"><i class="fas fa-bold"></i> 加粗</button>
                        <button id="italicBtn"><i class="fas fa-italic"></i> 倾斜</button>
                        <button id="insertVarBtn" disabled style="opacity:0.5; background:#eee;"><i class="fas fa-braces"></i> 变量</button>
                        <span style="margin-left:auto; font-size:0.8rem; color:#4b5563;"><i class="fas fa-mouse-pointer"></i> 点击下方变量插入</span>
                    </div>
                    <div class="editor-content" id="richEditor" contenteditable="true">
                        例如：{studentName}同学，你好。请于{defenseDate}在{defenseLocation}参加答辩。
                    </div>

                    <!-- 变量面板 -->
                    <div class="variable-panel">
                        <div class="variable-title"><i class="fas fa-paperclip" style="color: #1e3a8a;"></i> 可用变量 (点击插入)</div>
                        <div class="variable-buttons" id="variablePanel">
                            <button class="var-btn" data-var="{studentName}"><i class="fas fa-user-graduate"></i> 学生姓名</button>
                            <button class="var-btn" data-var="{studentId}"><i class="fas fa-id-card"></i> 学号</button>
                            <button class="var-btn" data-var="{mentorName}"><i class="fas fa-chalkboard-user"></i> 导师姓名</button>
                            <button class="var-btn" data-var="{thesisTitle}"><i class="fas fa-book"></i> 论文题目</button>
                            <button class="var-btn" data-var="{defenseDate}"><i class="fas fa-calendar-day"></i> 答辩日期</button>
                            <button class="var-btn" data-var="{defenseLocation}"><i class="fas fa-location-dot"></i> 答辩地点</button>
                            <button class="var-btn" data-var="{mentorTitle}"><i class="fas fa-user-tie"></i> 导师职称</button>
                            <button class="var-btn" data-var="{currentDate}"><i class="fas fa-clock"></i> 当前日期</button>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="save-btn" id="saveTemplateBtn"><i class="fas fa-save"></i> 保存模板</button>
                        <button class="preview-main-btn" id="previewBtn"><i class="fas fa-eye"></i> 预览</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 预览模态框 -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal-card">
            <button class="close-modal" id="closePreviewModal"><i class="fas fa-xmark"></i></button>
            <h3><i class="fas fa-file-lines" style="color:#2563eb;"></i> 模板预览 (示例数据)</h3>
            <div class="preview-content" id="previewContent">
                正在加载...
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- 模拟数据 ----------
            let templates = [
                { id: 't1', name: '硕士开题通知', code: 'OPENING_REVIEW', type: '培养', status: true, content: '{studentName}同学，你的开题报告《{thesisTitle}》定于{defenseDate}在{defenseLocation}举行。导师：{mentorName}' },
                { id: 't2', name: '学位论文答辩', code: 'DEFENSE_NOTICE', type: '学位', status: true, content: '{studentName}，请于{defenseDate}参加答辩，地点{defenseLocation}。' },
                { id: 't3', name: '奖学金公示提醒', code: 'SCHOLARSHIP', type: '研工', status: false, content: '{studentName}同学，奖学金{scholarshipName}已公示，请查看。' },
                { id: 't4', name: '导师双选确认', code: 'MENTOR_SELECT', type: '导师', status: true, content: '{studentName}同学，{mentorName}导师已确认指导关系。' },
            ];

            // 当前选中的模板id (用于编辑)
            let currentEditId = null;

            // 获取DOM元素
            const listContainer = document.getElementById('listContainer');
            const newBtn = document.getElementById('newTemplateBtn');
            const searchBtn = document.getElementById('searchBtn');
            const resetBtn = document.getElementById('resetBtn');
            const searchName = document.getElementById('searchName');
            const searchType = document.getElementById('searchType');

            // 表单元素
            const templateName = document.getElementById('templateName');
            const templateCode = document.getElementById('templateCode');
            const templateType = document.getElementById('templateType');
            const templateStatus = document.getElementById('templateStatus');
            const statusText = document.getElementById('statusText');
            const richEditor = document.getElementById('richEditor');
            const saveBtn = document.getElementById('saveTemplateBtn');
            const previewBtn = document.getElementById('previewBtn');

            // 预览模态框
            const modal = document.getElementById('previewModal');
            const previewContent = document.getElementById('previewContent');
            const closeModal = document.getElementById('closePreviewModal');

            // 变量按钮
            const varButtons = document.querySelectorAll('.var-btn');

            // 状态开关文字
            templateStatus.addEventListener('change', function() {
                statusText.innerText = this.checked ? '启用' : '禁用';
            });

            // ----- 富文本简单加粗/斜体 (execCommand 已足够) -----
            document.getElementById('boldBtn').addEventListener('click', () => {
                document.execCommand('bold', false, null);
                richEditor.focus();
            });
            document.getElementById('italicBtn').addEventListener('click', () => {
                document.execCommand('italic', false, null);
                richEditor.focus();
            });

            // ----- 插入变量 -----
            function insertTextAtCursor(text) {
                const sel = window.getSelection();
                if (sel.rangeCount > 0 && richEditor.contains(sel.anchorNode)) {
                    const range = sel.getRangeAt(0);
                    range.deleteContents();
                    const textNode = document.createTextNode(text);
                    range.insertNode(textNode);
                    range.collapse(false);
                    sel.removeAllRanges();
                    sel.addRange(range);
                } else {
                    richEditor.appendChild(document.createTextNode(text));
                }
                richEditor.focus();
            }

            varButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const variable = e.currentTarget.getAttribute('data-var');
                    insertTextAtCursor(variable);
                });
            });

            // ----- 渲染列表 -----
            function renderList(filterName = '', filterType = '') {
                const filtered = templates.filter(t => {
                    const matchName = t.name.toLowerCase().includes(filterName.toLowerCase());
                    const matchType = filterType === '' || t.type === filterType;
                    return matchName && matchType;
                });

                let html = `
                    <table class="template-table">
                        <thead>
                            <tr><th>名称</th><th>编码</th><th>类型</th><th>状态</th><th>操作</th></tr>
                        </thead>
                        <tbody>
                `;
                filtered.forEach(t => {
                    const statusClass = t.status ? 'status-active' : 'status-inactive';
                    const statusLabel = t.status ? '启用' : '禁用';
                    const selectedClass = (currentEditId === t.id) ? 'selected' : '';
                    html += `<tr data-id="${t.id}" class="${selectedClass}">`;
                    html += `<td>${t.name}</td>`;
                    html += `<td>${t.code}</td>`;
                    html += `<td>${t.type}</td>`;
                    html += `<td><span class="status-badge ${statusClass}">${statusLabel}</span></td>`;
                    html += `<td class="row-actions">
                        <button class="action-btn edit-btn" data-id="${t.id}" title="编辑"><i class="fas fa-pencil-alt"></i></button>
                        <button class="action-btn delete-btn" data-id="${t.id}" title="删除"><i class="fas fa-trash-can"></i></button>
                        <button class="action-btn preview-btn" data-id="${t.id}" title="预览"><i class="fas fa-eye"></i></button>
                    </td>`;
                    html += `</tr>`;
                });
                html += '</tbody></table>';
                listContainer.innerHTML = html;

                // 行点击选中
                document.querySelectorAll('.template-table tbody tr').forEach(tr => {
                    tr.addEventListener('click', (e) => {
                        if (e.target.closest('.action-btn')) return;
                        const id = tr.dataset.id;
                        selectTemplate(id);
                    });
                });

                // 操作按钮事件
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        selectTemplate(id);
                    });
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        if (confirm('确认删除该模板？(逻辑删除)')) {
                            templates = templates.filter(t => t.id !== id);
                            if (currentEditId === id) {
                                clearForm();
                                currentEditId = null;
                                document.getElementById('editPanelTitle').innerHTML = '<i class="fas fa-pen-to-square" style="color: #2563eb;"></i> 新建模板';
                            }
                            renderList(searchName.value, searchType.value);
                        }
                    });
                });

                document.querySelectorAll('.preview-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        const tmpl = templates.find(t => t.id === id);
                        if (tmpl) showPreview(tmpl);
                    });
                });
            }

            // 选中模板填充到右侧
            function selectTemplate(id) {
                const tmpl = templates.find(t => t.id === id);
                if (!tmpl) return;
                currentEditId = id;
                templateName.value = tmpl.name || '';
                templateCode.value = tmpl.code || '';
                templateType.value = tmpl.type || '通用';
                templateStatus.checked = tmpl.status;
                statusText.innerText = tmpl.status ? '启用' : '禁用';
                richEditor.innerHTML = tmpl.content || '';
                document.getElementById('editPanelTitle').innerHTML = '<i class="fas fa-pen-to-square" style="color: #2563eb;"></i> 编辑模板';

                renderList(searchName.value, searchType.value);
            }

            function clearForm() {
                templateName.value = '';
                templateCode.value = '';
                templateType.value = '通用';
                templateStatus.checked = true;
                statusText.innerText = '启用';
                richEditor.innerHTML = '例如：{studentName}同学，你好。';
                currentEditId = null;
                document.getElementById('editPanelTitle').innerHTML = '<i class="fas fa-pen-to-square" style="color: #2563eb;"></i> 新建模板';
                renderList(searchName.value, searchType.value);
            }

            // 预览
            function showPreview(tmpl) {
                let content = tmpl.content || richEditor.innerHTML;
                const mockData = {
                    '{studentName}': '李华',
                    '{studentId}': 'M20230012',
                    '{mentorName}': '张敏教授',
                    '{thesisTitle}': '基于深度学习的图像分割',
                    '{defenseDate}': '2026-04-15',
                    '{defenseLocation}': '研究生院A座307',
                    '{mentorTitle}': '博导',
                    '{currentDate}': '2026-03-12',
                };
                let previewHtml = content.replace(/\{[\w]+\}/g, (match) => mockData[match] || `[${match}]`);
                previewContent.innerHTML = previewHtml;
                modal.style.display = 'flex';
            }

            // 保存模板
            function saveTemplate() {
                const name = templateName.value.trim();
                const code = templateCode.value.trim();
                const type = templateType.value;
                const status = templateStatus.checked;
                const content = richEditor.innerHTML;

                if (!name || !code) {
                    alert('模板名称和编码不能为空');
                    return;
                }

                if (currentEditId) {
                    const index = templates.findIndex(t => t.id === currentEditId);
                    if (index !== -1) {
                        templates[index] = { ...templates[index], name, code, type, status, content };
                    }
                } else {
                    const newId = 't' + Date.now();
                    templates.push({ id: newId, name, code, type, status, content });
                    currentEditId = newId;
                }

                renderList(searchName.value, searchType.value);
                alert('保存成功');
            }

            // 事件绑定
            newBtn.addEventListener('click', clearForm);
            saveBtn.addEventListener('click', saveTemplate);
            previewBtn.addEventListener('click', () => {
                if (currentEditId) {
                    const tmpl = templates.find(t => t.id === currentEditId);
                    if (tmpl) showPreview(tmpl);
                    else showPreview({ content: richEditor.innerHTML });
                } else {
                    showPreview({ content: richEditor.innerHTML });
                }
            });

            closeModal.addEventListener('click', () => {
                modal.style.display = 'none';
            });
            window.addEventListener('click', (e) => {
                if (e.target === modal) modal.style.display = 'none';
            });

            searchBtn.addEventListener('click', () => {
                renderList(searchName.value, searchType.value);
            });

            resetBtn.addEventListener('click', () => {
                searchName.value = '';
                searchType.value = '';
                renderList('', '');
            });

            // 初始化
            renderList();
            if (templates.length > 0) {
                selectTemplate(templates[0].id);
            }
        })();
    </script>
</body>
</html>
