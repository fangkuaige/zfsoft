<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>研究生成绩模型 · 全屏管理 (视觉同步)</title>
    <!-- 引入与分数变动页完全相同的字体和图标库，保证视觉效果一致 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 从学生分数变动记录页面复用的样式 — 完全沿用其柔和卡片、背景、按钮、弹窗等视觉效果 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #eef3f8;      /* 与分数变动页背景一致 */
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 全屏容器 — 与原分数变动页的 .full-screen 相同 */
        .full-screen {
            width: 100%;
            padding: 1.5rem 1.8rem;
            flex: 1;
        }
        @media (max-width: 640px) {
            .full-screen { padding: 1rem 1rem; }
        }

        /* 卡片样式 — 完全复制分数变动页的 .card */
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,20,40,0.08);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e9eef4;
            width: 100%;
        }
        @media (max-width: 640px) {
            .card { padding: 1.5rem 1.2rem; }
        }

        /* 标题区 — 类似于 .section-title 但用于内部模块 (可复用) */
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 1.5rem;
        }
        .section-title i { color: #2f6e9e; font-size: 1.4rem; }

        /* 操作栏 / 筛选栏样式 (沿用 filter-bar 样式, 保证按钮、输入框一致) */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
            margin-bottom: 1rem;  /* 稍微调整 */
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 170px;
            flex: 1 1 160px;
        }
        .filter-item label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
        }
        .filter-input, .filter-select {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.65rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn {
            border: none;
            background: transparent;
            font-weight: 500;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .btn-primary {
            background: #1e4a6f;
            color: white;
            box-shadow: 0 4px 10px rgba(0,60,110,0.2);
        }
        .btn-primary:hover { background: #123a58; transform: translateY(-2px); }
        .btn-outline {
            background: white;
            border-color: #cbd5e1;
            color: #2c455d;
        }
        .btn-outline:hover { background: #f1f7fd; border-color: #9bb0c5; }
        .btn-sm { padding: 0.45rem 1.2rem; font-size: 0.8rem; }

        /* 卡片列表区域 — 用网格布局展示卡片，但整体依然在 card 内部 */
        .models-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 0.8rem;
            max-height: calc(100vh - 280px);
            overflow-y: auto;
            padding-right: 8px;
            scrollbar-width: thin;
            scrollbar-color: #acc9e0 #e9f0f7;
        }
        .models-grid::-webkit-scrollbar {
            width: 6px;
        }
        .models-grid::-webkit-scrollbar-track {
            background: #e9f0f7;
            border-radius: 20px;
        }
        .models-grid::-webkit-scrollbar-thumb {
            background: #acc9e0;
            border-radius: 20px;
        }

        /* 单个模型卡片 — 柔和卡片, 但背景微调, 保持与分数变动页一致 */
        .model-card {
            background: #f9fcff;
            border-radius: 28px;
            padding: 22px 24px;
            border: 1px solid #d2e5f5;
            box-shadow: 0 5px 15px rgba(45, 90, 120, 0.05);
            transition: 0.15s;
        }
        .model-card:hover {
            border-color: #9bc0db;
            box-shadow: 0 10px 25px -8px #2b6a9c30;
        }

        .model-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .model-name {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0d3148;
            line-height: 1.3;
        }
        .model-badge {
            background: #daeaf7;
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1a5780;
        }
        .model-desc {
            color: #3e6281;
            font-size: 1rem;
            margin: 10px 0 18px 0;
            padding-left: 16px;
            border-left: 3px solid #a2c9e9;
        }

        /* 评分项预览 */
        .config-preview {
            background: #edf5fc;
            border-radius: 22px;
            padding: 18px 20px;
            margin: 18px 0 16px;
        }
        .config-items {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
        }
        .config-item {
            background: white;
            border-radius: 40px;
            padding: 6px 22px;
            border: 1px solid #b9d6ee;
            color: #1d4f77;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 2px 6px #c7dff1;
        }

        /* 卡片内操作按钮 — 沿用 btn-secondary 风格, 与分数变动页 icon-btn 类似 */
        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }
        .btn-secondary {
            background: white;
            border: 1px solid #b6d2ea;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1e4f76;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-secondary:hover {
            background: #e7f0f9;
            border-color: #8bb9dd;
        }

        /* 分页控件 — 与分数变动页 .pagination-bar 一致 */
        .pagination-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.8rem;
            flex-wrap: wrap;
        }
        .pagination-btn {
            background: white;
            border: 1px solid #c9d9eb;
            color: #1d4a6b;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
        }
        .pagination-btn.active {
            background: #1e4a6f;
            border-color: #1e4a6f;
            color: white;
        }
        .pagination-btn:hover:not(.active) {
            background: #e5f0fb;
        }
        .page-info {
            color: #466585;
            margin-right: 0.8rem;
            font-size: 0.9rem;
        }

        /* 模态框 — 完全复用分数变动页的弹窗样式，保证视觉统一 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,20,40,0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-card {
            background: white; border-radius: 32px; width: 90%; max-width: 750px;
            padding: 2rem 2.2rem; box-shadow: 0 40px 70px rgba(0,20,50,0.4);
            transform: scale(0.95); transition: transform 0.2s ease;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.show .modal-card { transform: scale(1); }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-header h3 { font-size: 1.6rem; font-weight: 600; color: #0c2b48; }
        .modal-close {
            background: none; border: none; font-size: 2.2rem; cursor: pointer;
            color: #8ba5c2; line-height: 1;
        }
        .modal-close:hover { color: #1e3a5f; }

        /* 表单网格与输入组 — 沿用分数变动页 */
        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem 1.8rem;
        }
        .full-width { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .input-group label {
            font-weight: 600; font-size: 0.75rem; color: #4e6f8c; text-transform: uppercase;
            display: flex; align-items: center; gap: 4px;
        }
        .input-field {
            background: #f8fafd; border: 1px solid #dde3ea; border-radius: 16px;
            padding: 0.75rem 1.2rem; font-size: 0.95rem; font-family: 'Inter', sans-serif;
        }
        .input-field:focus {
            outline: none; border-color: #2f6e9e;
            box-shadow: 0 0 0 3px rgba(47,110,158,0.15); background: white;
        }
        .readonly-field {
            background: #ecf2f9; color: #2a4e6e; font-weight: 500;
        }

        /* 评分项专用行 (可复用config-item-row但为了视觉统一，使用与分数变动页类似风格) */
        .config-item-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: #f0f8ff;
            padding: 16px 20px;
            border-radius: 60px;
            margin-bottom: 14px;
        }
        .config-item-row input {
            flex: 1 1 180px;
            padding: 12px 20px;
            border-radius: 60px;
            border: 1px solid #bdd2e8;
            background: white;
        }
        .config-item-row .weight-input {
            max-width: 140px;
        }
        .remove-item {
            background: #f7e9e9;
            border: none;
            border-radius: 60px;
            padding: 10px 24px;
            color: #a04b4b;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #e3c3c3;
            transition: 0.1s;
        }
        .remove-item:hover { background: #f5d6d6; }

        .add-item-btn {
            background: #e6f2fe;
            border: 2px dashed #7eafd3;
            color: #1e6091;
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            margin: 10px 0 15px;
            cursor: pointer;
            transition: 0.1s;
        }
        .add-item-btn:hover { background: #d6e9fd; }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 30px;
        }

        /* Toast 提示 (从分数变动页完整复制) */
        .toast-message {
            background: #1e4a6f; color: white; padding: 0.8rem 2rem;
            border-radius: 60px; font-weight: 500; box-shadow: 0 15px 30px rgba(0,40,70,0.4);
            position: fixed; bottom: 30px; right: 30px; z-index: 1100;
            opacity: 0; transform: translateY(10px); transition: 0.2s; pointer-events: none;
        }
        .toast-message.show { opacity: 1; transform: translateY(0); }

        /* 小屏微调 */
        @media (max-width: 600px) {
            .model-name { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="full-screen">
    <!-- 顶部卡片：搜索 + 新建模型 (与分数变动页筛选卡片类似) -->
    <div class="card">
        <div class="filter-bar" style="margin-bottom: 0;">
            <div class="filter-item" style="min-width: 240px;">
                <label><i class="fas fa-search"></i> 模型名称</label>
                <input type="text" class="filter-input" id="searchInput" placeholder="例如：博士论文" value="">
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; margin-left: auto;">
                <button class="btn btn-outline" id="clearSearchBtn"><i class="fas fa-undo"></i> 重置</button>
                <button class="btn btn-primary" id="addModelBtn"><i class="fas fa-plus-circle"></i> 新建模型</button>
            </div>
        </div>
    </div>

    <!-- 模型列表卡片 (内含卡片列表和分页) -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-cubes"></i> 成绩模型库
        </div>
        <!-- 模型卡片容器 (滚动) -->
        <div class="models-grid" id="modelList"></div>

        <!-- 分页组件 (与分数变动页完全一致) -->
        <div class="pagination-bar" id="paginationContainer">
            <!-- 动态注入分页 -->
        </div>
    </div>
</div>

<!-- 模态框：新建/编辑模型 (与分数变动页风格统一) -->
<div class="modal-overlay" id="modelModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle"><i class="fas fa-pen"></i> 新建成绩模型</h3>
            <button class="modal-close" id="cancelModalBtn">&times;</button>
        </div>
        <form id="modelForm" onsubmit="return false;">
            <div class="form-grid">
                <div class="input-group full-width">
                    <label><i class="fas fa-tag"></i> 模型名称 *</label>
                    <input type="text" class="input-field" id="modelNameInput" placeholder="例如：博士论文评审模型" required>
                </div>
                <div class="input-group full-width">
                    <label><i class="fas fa-align-left"></i> 描述</label>
                    <input type="text" class="input-field" id="modelDescInput" placeholder="简要描述该模型的用途和评分维度">
                </div>
            </div>

            <div style="margin: 20px 0 12px;">
                <label style="font-weight:600; color:#205787;"><i class="fas fa-list-ul"></i> 评分项构成 (可自定义)</label>
            </div>
            <div id="configItemsContainer"></div>
            <button type="button" class="add-item-btn" id="addConfigItemBtn"><i class="fas fa-plus"></i> 添加评分项</button>

            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="modalCancelBtn"><i class="fas fa-times"></i> 取消</button>
                <button type="button" class="btn btn-primary" id="saveModelBtn"><i class="fas fa-save"></i> 保存模型</button>
            </div>
        </form>
    </div>
</div>

<!-- Toast 提示 -->
<div id="toast" class="toast-message">操作成功</div>

<script>
    (function() {
        // 初始模拟数据 (与原成绩模型管理相同，保留所有功能)
        let models = [
            { id: Date.now() - 6000, name: '硕士研究生课程模型', description: '课程作业、期中考试、期末考试', items: [{ name: '课程作业', weight: 0.3 }, { name: '期中考试', weight: 0.3 }, { name: '期末考试', weight: 0.4 }] },
            { id: Date.now() - 5000, name: '博士学位论文评审', description: '创新性、工作量、写作水平', items: [{ name: '创新性', weight: 0.4 }, { name: '工作量', weight: 0.3 }, { name: '写作水平', weight: 0.3 }] },
            { id: Date.now() - 4000, name: '研究生实验考核', description: '实验操作、数据处理、报告质量', items: [{ name: '实验操作', weight: 0.4 }, { name: '数据处理', weight: 0.3 }, { name: '报告质量', weight: 0.3 }] },
            { id: Date.now() - 3000, name: '学术英语成绩模型', description: '听力、阅读、写作、口语', items: [{ name: '听力', weight: 0.25 }, { name: '阅读', weight: 0.25 }, { name: '写作', weight: 0.25 }, { name: '口语', weight: 0.25 }] },
            { id: Date.now() - 2000, name: '中期考核模型', description: '研究进展、导师评价、学术报告', items: [{ name: '研究进展', weight: 0.5 }, { name: '导师评价', weight: 0.2 }, { name: '学术报告', weight: 0.3 }] },
            { id: Date.now() - 1000, name: '专业实践评分', description: '实践报告、单位评价、答辩表现', items: [{ name: '实践报告', weight: 0.4 }, { name: '单位评价', weight: 0.3 }, { name: '答辩表现', weight: 0.3 }] },
        ];

        // 分页配置 (使用与分数变动页一致的pageSize=5，但可以保留原3；为了体验更佳，使用5条每页)
        const pageSize = 5; 
        let currentPage = 1;
        let searchKeyword = '';
        let editingModelId = null;
        let tempItems = [];

        // DOM 元素
        const modelListEl = document.getElementById('modelList');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const addModelBtn = document.getElementById('addModelBtn');
        const paginationContainer = document.getElementById('paginationContainer');
        const modal = document.getElementById('modelModal');
        const modalTitle = document.getElementById('modalTitle');
        const modelNameInput = document.getElementById('modelNameInput');
        const modelDescInput = document.getElementById('modelDescInput');
        const configItemsContainer = document.getElementById('configItemsContainer');
        const addConfigItemBtn = document.getElementById('addConfigItemBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');          // 头部X
        const modalCancelBtn = document.getElementById('modalCancelBtn');          // 下方取消
        const saveModelBtn = document.getElementById('saveModelBtn');
        const toast = document.getElementById('toast');

        // 辅助函数
        function showToast(text, duration = 2000) {
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/[&<>"]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                return m;
            });
        }

        function getFilteredModels() {
            const keyword = searchKeyword.trim().toLowerCase();
            if (!keyword) return models;
            return models.filter(m => m.name.toLowerCase().includes(keyword));
        }

        function totalPages() {
            return Math.ceil(getFilteredModels().length / pageSize) || 1;
        }

        function goToPage(page) {
            const total = totalPages();
            if (page < 1) page = 1;
            if (page > total) page = total;
            if (page === currentPage) return;
            currentPage = page;
            renderModels();
            renderPagination();
        }
        window.pageGo = goToPage;  // 供分页按钮onclick使用

        function renderPagination() {
            const total = totalPages();
            if (total <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }
            let html = `<span class="page-info"><i class="fas fa-layer-group"></i> 第 ${currentPage} / ${total} 页</span>`;
            html += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.pageGo(${currentPage-1})"><i class="fas fa-chevron-left"></i></button>`;
            for (let i = 1; i <= total; i++) {
                if (i === currentPage) html += `<span class="pagination-btn active">${i}</span>`;
                else html += `<button class="pagination-btn" onclick="window.pageGo(${i})">${i}</button>`;
            }
            html += `<button class="pagination-btn" ${currentPage === total ? 'disabled' : ''} onclick="window.pageGo(${currentPage+1})"><i class="fas fa-chevron-right"></i></button>`;
            paginationContainer.innerHTML = html;
        }

        function renderModels() {
            const filtered = getFilteredModels();
            const total = totalPages();
            if (currentPage > total) currentPage = total || 1;
            const start = (currentPage - 1) * pageSize;
            const paginated = filtered.slice(start, start + pageSize);

            modelListEl.innerHTML = '';
            if (paginated.length === 0) {
                modelListEl.innerHTML = '<div style="color: #6f8fa8; text-align: center; padding: 40px;">📄 没有匹配的成绩模型</div>';
            } else {
                paginated.forEach(model => {
                    const card = document.createElement('div');
                    card.className = 'model-card';
                    const itemsHtml = model.items.map(it => 
                        `<span class="config-item">${escapeHtml(it.name)} : ${(it.weight*100).toFixed(0)}%</span>`
                    ).join('');

                    card.innerHTML = `
                        <div class="model-header">
                            <span class="model-name">${escapeHtml(model.name)}</span>
                            <span class="model-badge">${model.items.length}项</span>
                        </div>
                        <div class="model-desc">${escapeHtml(model.description) || '无描述'}</div>
                        <div class="config-preview">
                            <div class="config-items">${itemsHtml}</div>
                        </div>
                        <div class="card-actions">
                            <button class="btn-secondary" data-id="${model.id}" data-action="editModel"><i class="fas fa-pen"></i> 编辑</button>
                            <button class="btn-secondary" data-id="${model.id}" data-action="deleteModel"><i class="fas fa-trash"></i> 删除</button>
                        </div>
                    `;
                    modelListEl.appendChild(card);
                });
            }
            renderPagination();
        }

        // 弹窗内渲染评分项
        function renderConfigItems() {
            configItemsContainer.innerHTML = '';
            tempItems.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'config-item-row';
                row.innerHTML = `
                    <input type="text" placeholder="项目名称 (如: 文献综述)" value="${escapeHtml(item.name || '')}" data-index="${index}" class="item-name-input">
                    <input type="number" step="0.01" min="0" max="1" value="${item.weight ?? 0}" placeholder="权重" data-index="${index}" class="weight-input item-weight-input">
                    <button type="button" class="remove-item" data-index="${index}"><i class="fas fa-times"></i> 移除</button>
                `;
                configItemsContainer.appendChild(row);
            });

            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = e.currentTarget.getAttribute('data-index');
                    if (idx !== null) {
                        tempItems.splice(parseInt(idx), 1);
                        renderConfigItems();
                    }
                });
            });

            document.querySelectorAll('.item-name-input').forEach(inp => {
                inp.addEventListener('input', (e) => {
                    const idx = e.target.getAttribute('data-index');
                    if (idx !== null) tempItems[idx].name = e.target.value;
                });
            });
            document.querySelectorAll('.item-weight-input').forEach(inp => {
                inp.addEventListener('input', (e) => {
                    const idx = e.target.getAttribute('data-index');
                    if (idx !== null) tempItems[idx].weight = parseFloat(e.target.value) || 0;
                });
            });
        }

        function openNewModelModal() {
            editingModelId = null;
            modalTitle.innerHTML = '<i class="fas fa-plus-circle"></i> 新建成绩模型';
            modelNameInput.value = '';
            modelDescInput.value = '';
            tempItems = [
                { name: '文献综述', weight: 0.3 },
                { name: '实验报告', weight: 0.3 },
                { name: '期末论文', weight: 0.4 }
            ];
            renderConfigItems();
            modal.classList.add('show');
        }

        function openEditModelModal(id) {
            const model = models.find(m => m.id === id);
            if (!model) return;
            editingModelId = id;
            modalTitle.innerHTML = '<i class="fas fa-edit"></i> 编辑成绩模型';
            modelNameInput.value = model.name || '';
            modelDescInput.value = model.description || '';
            tempItems = model.items.map(it => ({ name: it.name, weight: it.weight }));
            renderConfigItems();
            modal.classList.add('show');
        }

        function closeModal() {
            modal.classList.remove('show');
            editingModelId = null;
        }

        function saveModel() {
            const name = modelNameInput.value.trim();
            if (!name) { showToast('请输入模型名称'); return; }
            const description = modelDescInput.value.trim();

            const items = [];
            const nameInputs = document.querySelectorAll('.item-name-input');
            const weightInputs = document.querySelectorAll('.item-weight-input');
            for (let i = 0; i < nameInputs.length; i++) {
                const itemName = nameInputs[i].value.trim();
                const weight = parseFloat(weightInputs[i].value) || 0;
                if (itemName === '') continue;
                items.push({ name: itemName, weight: Math.min(1, Math.max(0, weight)) });
            }
            if (items.length === 0) {
                showToast('至少保留一个有效的评分项');
                return;
            }

            if (editingModelId !== null) {
                models = models.map(m => m.id === editingModelId ? { ...m, name, description, items } : m);
                showToast('模型已更新');
            } else {
                const newModel = { id: Date.now(), name, description, items };
                models.push(newModel);
                showToast('模型已添加');
                // 跳转到最后一页
                const filtered = getFilteredModels();
                currentPage = Math.ceil(filtered.length / pageSize);
            }

            closeModal();
            renderModels();
        }

        function deleteModel(id) {
            if (confirm('确认删除该成绩模型？')) {
                models = models.filter(m => m.id !== id);
                const filtered = getFilteredModels();
                if (filtered.length === 0 && currentPage > 1) currentPage--;
                showToast('模型已删除');
                renderModels();
            }
        }

        // 事件绑定
        searchInput.addEventListener('input', (e) => {
            searchKeyword = e.target.value;
            currentPage = 1;
            renderModels();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchKeyword = '';
            currentPage = 1;
            renderModels();
        });

        addModelBtn.addEventListener('click', openNewModelModal);

        modelListEl.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const id = Number(btn.getAttribute('data-id'));
            const action = btn.getAttribute('data-action');
            if (action === 'editModel') openEditModelModal(id);
            if (action === 'deleteModel') deleteModel(id);
        });

        addConfigItemBtn.addEventListener('click', () => {
            tempItems.push({ name: '', weight: 0.0 });
            renderConfigItems();
        });

        cancelModalBtn.addEventListener('click', closeModal);
        modalCancelBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        saveModelBtn.addEventListener('click', saveModel);

        // 初始化
        renderModels();
    })();
</script>
</body>
</html>
