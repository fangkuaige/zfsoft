<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>研究生成绩模型 · 全屏管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f0f4fa;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* 全屏主容器 — 无卡片效果，直接铺满 */
        .model-manager {
            width: 100%;
            min-height: 100vh;
            background: transparent;  /* 继承body背景 */
            padding: 24px 30px;
            display: flex;
            flex-direction: column;
            box-shadow: none;
            border: none;
            border-radius: 0;
        }

        /* 头部区域 — 只保留操作栏，标题已移除 */
        .manager-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;  /* 操作栏靠右 */
            margin-bottom: 28px;
            gap: 16px;
        }

        /* 操作栏左部留空，但为了灵活性用flex-end已经靠右，如果希望左边空白可以再加一个空div，目前足够 */
        .action-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: #f2f7fd;
            border-radius: 60px;
            padding: 4px 4px 4px 20px;
            border: 1px solid #c5dbee;
            min-width: 240px;
        }

        .search-wrapper input {
            border: none;
            background: transparent;
            padding: 10px 0;
            font-size: 0.95rem;
            width: 160px;
            outline: none;
            color: #1a405b;
        }

        .search-wrapper input::placeholder {
            color: #7b9cba;
        }

        .search-wrapper button {
            background: #e3effa;
            border: none;
            border-radius: 60px;
            padding: 8px 20px;
            font-weight: 500;
            color: #1d5980;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid transparent;
        }

        .search-wrapper button:hover {
            background: #cde2f5;
        }

        .btn-primary {
            background: #2a5f8a;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 18px -6px #2a5f8a80;
            transition: 0.15s;
            border: 1px solid #ffffff30;
            letter-spacing: 0.3px;
        }

        .btn-primary:hover {
            background: #3273a5;
            transform: scale(1.02);
        }

        /* 卡片列表区域 — 占据主要空间，允许滚动 */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
            margin: 0 0 25px;
            max-height: calc(100vh - 170px); /* 动态适应，预留分页和头部空间 */
            scrollbar-width: thin;
            scrollbar-color: #acc9e0 #e9f0f7;
        }

        .cards-container::-webkit-scrollbar {
            width: 6px;
        }

        .cards-container::-webkit-scrollbar-track {
            background: #e9f0f7;
            border-radius: 20px;
        }

        .cards-container::-webkit-scrollbar-thumb {
            background: #acc9e0;
            border-radius: 20px;
        }

        /* 单个模型卡片 — 柔和卡片样式，但外部容器无效果 */
        .model-card {
            background: #f9fcff;
            border-radius: 28px;
            padding: 22px 24px;
            border: 1px solid #d2e5f5;
            box-shadow: 0 5px 15px rgba(45, 90, 120, 0.05);
            transition: 0.15s;
        }

        .model-card:hover {
            border-color: #9bc0db;
            box-shadow: 0 10px 25px -8px #2b6a9c30;
        }

        .model-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .model-name {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0d3148;
            line-height: 1.3;
        }

        .model-badge {
            background: #daeaf7;
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1a5780;
        }

        .model-desc {
            color: #3e6281;
            font-size: 1rem;
            margin: 10px 0 18px 0;
            padding-left: 16px;
            border-left: 3px solid #a2c9e9;
        }

        .config-preview {
            background: #edf5fc;
            border-radius: 22px;
            padding: 18px 20px;
            margin: 18px 0 16px;
        }

        .config-items {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
        }

        .config-item {
            background: white;
            border-radius: 40px;
            padding: 6px 22px;
            border: 1px solid #b9d6ee;
            color: #1d4f77;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 2px 6px #c7dff1;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-secondary {
            background: white;
            border: 1px solid #b6d2ea;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1e4f76;
            cursor: pointer;
            transition: 0.1s;
        }

        .btn-secondary:hover {
            background: #e7f0f9;
            border-color: #8bb9dd;
        }

        /* 分页控件 — 固定在底部附近 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 5px;
            padding-top: 15px;
            border-top: 1px solid #cde0ee;
            background: transparent; /* 无额外背景 */
        }

        .pagination button {
            background: white;
            border: 1px solid #c5daee;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 500;
            color: #1b4c73;
            cursor: pointer;
            transition: 0.1s;
            min-width: 80px;
            font-size: 0.95rem;
        }

        .pagination button:disabled {
            opacity: 0.4;
            pointer-events: none;
            background: #f1f7fc;
        }

        .pagination button:not(:disabled):hover {
            background: #dbeafe;
            border-color: #7fafd3;
        }

        .page-numbers {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .page-numbers button {
            min-width: 44px;
            padding: 10px 0;
            background: #f3f9ff;
            border: 1px solid #cbdef0;
        }

        .page-numbers button.active-page {
            background: #2a5f8a;
            border-color: #2a5f8a;
            color: white;
            font-weight: 600;
            box-shadow: 0 5px 10px #2a5f8a60;
        }

        /* 模态框 — 保持不变 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(20, 45, 70, 0.3);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 44px;
            max-width: 680px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px 34px;
            box-shadow: 0 40px 80px -20px #0b2940;
            border: 1px solid #c6deef;
        }

        .modal-content h3 {
            font-size: 2rem;
            font-weight: 600;
            color: #113750;
            margin-bottom: 22px;
            letter-spacing: -0.01em;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            font-weight: 600;
            color: #205787;
            display: block;
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 16px 22px;
            border: 1px solid #c3dbef;
            border-radius: 60px;
            font-size: 1rem;
            background: #f9fdff;
            outline: none;
            transition: 0.15s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #3478a8;
            box-shadow: 0 0 0 3px rgba(52,120,168,0.15);
        }

        .config-item-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            background: #f0f8ff;
            padding: 16px 20px;
            border-radius: 60px;
            margin-bottom: 14px;
        }

        .config-item-row input {
            flex: 1 1 180px;
            padding: 12px 20px;
            border-radius: 60px;
            border: 1px solid #bdd2e8;
            background: white;
        }

        .config-item-row .weight-input {
            max-width: 140px;
        }

        .remove-item {
            background: #f7e9e9;
            border: none;
            border-radius: 60px;
            padding: 10px 24px;
            color: #a04b4b;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #e3c3c3;
            transition: 0.1s;
        }

        .remove-item:hover {
            background: #f5d6d6;
        }

        .add-item-btn {
            background: #e6f2fe;
            border: 2px dashed #7eafd3;
            color: #1e6091;
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            margin: 10px 0 15px;
            cursor: pointer;
            transition: 0.1s;
        }

        .add-item-btn:hover {
            background: #d6e9fd;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 30px;
        }

        /* 移动端调整 */
        @media (max-width: 600px) {
            .model-manager { padding: 18px 18px; }
            .manager-header { justify-content: center; } /* 小屏居中操作栏 */
            .model-name { font-size: 1.3rem; }
            .modal-content { padding: 24px 20px; }
            .cards-container { max-height: calc(100vh - 150px); }
        }
    </style>
</head>
<body>
    <div class="model-manager">
        <!-- 头部：无标题，只有操作栏靠右（小屏居中） -->
        <div class="manager-header">
            <div class="action-bar">
                <div class="search-wrapper">
                    <input type="text" id="searchInput" placeholder="搜索模型名称" value="">
                    <button id="clearSearchBtn">重置</button>
                </div>
                <button class="btn-primary" id="addModelBtn">新建模型</button>
            </div>
        </div>

        <!-- 模型卡片列表容器 -->
        <div class="cards-container" id="modelList"></div>

        <!-- 分页控件 -->
        <div class="pagination" id="pagination">
            <button id="prevPage" disabled>上一页</button>
            <div class="page-numbers" id="pageNumbers"></div>
            <button id="nextPage" disabled>下一页</button>
        </div>
    </div>

    <!-- 模态框：新建/编辑模型 -->
    <div class="modal" id="modelModal">
        <div class="modal-content">
            <h3 id="modalTitle">新建成绩模型</h3>
            <form id="modelForm" onsubmit="return false;">
                <div class="form-group">
                    <label>模型名称 <span style="color:#b34a4a;">*</span></label>
                    <input type="text" id="modelNameInput" placeholder="例如：博士论文评审模型" required>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="modelDescInput" rows="2" placeholder="简要描述该模型的用途和评分维度"></textarea>
                </div>
                <div style="margin: 20px 0 12px;">
                    <label style="font-weight:600; color:#205787;">📊 评分项构成 (可自定义)</label>
                </div>
                <div id="configItemsContainer"></div>
                <button type="button" class="add-item-btn" id="addConfigItemBtn">添加评分项</button>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="cancelModalBtn">取消</button>
                    <button type="button" class="btn-primary" id="saveModelBtn">保存模型</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function() {
            // 研究生主题模拟数据 (保持不变)
            let models = [
                { id: Date.now() - 6000, name: '硕士研究生课程模型', description: '课程作业、期中考试、期末考试', items: [{ name: '课程作业', weight: 0.3 }, { name: '期中考试', weight: 0.3 }, { name: '期末考试', weight: 0.4 }] },
                { id: Date.now() - 5000, name: '博士学位论文评审', description: '创新性、工作量、写作水平', items: [{ name: '创新性', weight: 0.4 }, { name: '工作量', weight: 0.3 }, { name: '写作水平', weight: 0.3 }] },
                { id: Date.now() - 4000, name: '研究生实验考核', description: '实验操作、数据处理、报告质量', items: [{ name: '实验操作', weight: 0.4 }, { name: '数据处理', weight: 0.3 }, { name: '报告质量', weight: 0.3 }] },
                { id: Date.now() - 3000, name: '学术英语成绩模型', description: '听力、阅读、写作、口语', items: [{ name: '听力', weight: 0.25 }, { name: '阅读', weight: 0.25 }, { name: '写作', weight: 0.25 }, { name: '口语', weight: 0.25 }] },
                { id: Date.now() - 2000, name: '中期考核模型', description: '研究进展、导师评价、学术报告', items: [{ name: '研究进展', weight: 0.5 }, { name: '导师评价', weight: 0.2 }, { name: '学术报告', weight: 0.3 }] },
                { id: Date.now() - 1000, name: '专业实践评分', description: '实践报告、单位评价、答辩表现', items: [{ name: '实践报告', weight: 0.4 }, { name: '单位评价', weight: 0.3 }, { name: '答辩表现', weight: 0.3 }] },
            ];

            // 分页变量
            let currentPage = 1;
            const pageSize = 3;

            // 搜索关键词
            let searchKeyword = '';

            // 当前编辑的模型id
            let editingModelId = null;

            // 临时配置项
            let tempItems = [];

            // DOM 元素
            const modelListEl = document.getElementById('modelList');
            const addModelBtn = document.getElementById('addModelBtn');
            const searchInput = document.getElementById('searchInput');
            const clearSearchBtn = document.getElementById('clearSearchBtn');
            const prevBtn = document.getElementById('prevPage');
            const nextBtn = document.getElementById('nextPage');
            const pageNumbersDiv = document.getElementById('pageNumbers');

            const modal = document.getElementById('modelModal');
            const modalTitle = document.getElementById('modalTitle');
            const modelNameInput = document.getElementById('modelNameInput');
            const modelDescInput = document.getElementById('modelDescInput');
            const configItemsContainer = document.getElementById('configItemsContainer');
            const addConfigItemBtn = document.getElementById('addConfigItemBtn');
            const cancelModalBtn = document.getElementById('cancelModalBtn');
            const saveModelBtn = document.getElementById('saveModelBtn');

            // 辅助
            function escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function getFilteredModels() {
                const keyword = searchKeyword.trim().toLowerCase();
                if (!keyword) return models;
                return models.filter(m => m.name.toLowerCase().includes(keyword));
            }

            function renderPagination() {
                const filtered = getFilteredModels();
                const totalPages = Math.ceil(filtered.length / pageSize) || 1;
                if (currentPage > totalPages) currentPage = totalPages;

                prevBtn.disabled = currentPage <= 1;
                nextBtn.disabled = currentPage >= totalPages;

                let html = '';
                for (let i = 1; i <= totalPages; i++) {
                    html += `<button class="${i === currentPage ? 'active-page' : ''}" data-page="${i}">${i}</button>`;
                }
                pageNumbersDiv.innerHTML = html;

                document.querySelectorAll('.page-numbers button').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const page = parseInt(e.target.getAttribute('data-page'));
                        if (page !== currentPage) {
                            currentPage = page;
                            renderModels();
                        }
                    });
                });
            }

            function renderModels() {
                const filtered = getFilteredModels();
                const totalPages = Math.ceil(filtered.length / pageSize) || 1;
                if (currentPage > totalPages) currentPage = totalPages;
                const start = (currentPage - 1) * pageSize;
                const paginatedModels = filtered.slice(start, start + pageSize);

                modelListEl.innerHTML = '';
                if (paginatedModels.length === 0) {
                    modelListEl.innerHTML = '<div style="color: #6f8fa8; text-align: center; padding: 40px;">📄 没有匹配的成绩模型</div>';
                } else {
                    paginatedModels.forEach(model => {
                        const card = document.createElement('div');
                        card.className = 'model-card';
                        const itemsHtml = model.items.map(it => 
                            `<span class="config-item">${escapeHtml(it.name)} : ${(it.weight*100).toFixed(0)}%</span>`
                        ).join('');

                        card.innerHTML = `
                            <div class="model-header">
                                <span class="model-name">${escapeHtml(model.name)}</span>
                                <span class="model-badge">${model.items.length}项</span>
                            </div>
                            <div class="model-desc">${escapeHtml(model.description) || '无描述'}</div>
                            <div class="config-preview">
                                <div class="config-items">${itemsHtml}</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn-secondary" data-id="${model.id}" data-action="editModel">编辑</button>
                                <button class="btn-secondary" data-id="${model.id}" data-action="deleteModel">删除</button>
                            </div>
                        `;
                        modelListEl.appendChild(card);
                    });
                }

                renderPagination();
            }

            // 模态框配置项渲染
            function renderConfigItems() {
                configItemsContainer.innerHTML = '';
                tempItems.forEach((item, index) => {
                    const row = document.createElement('div');
                    row.className = 'config-item-row';
                    row.innerHTML = `
                        <input type="text" placeholder="项目名称 (如: 文献综述)" value="${escapeHtml(item.name || '')}" data-index="${index}" class="item-name-input">
                        <input type="number" step="0.01" min="0" max="1" value="${item.weight ?? 0}" placeholder="权重" data-index="${index}" class="weight-input item-weight-input">
                        <button type="button" class="remove-item" data-index="${index}">移除</button>
                    `;
                    configItemsContainer.appendChild(row);
                });

                document.querySelectorAll('.remove-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const idx = e.target.getAttribute('data-index');
                        if (idx !== null) {
                            tempItems.splice(parseInt(idx), 1);
                            renderConfigItems();
                        }
                    });
                });

                document.querySelectorAll('.item-name-input').forEach(inp => {
                    inp.addEventListener('input', (e) => {
                        const idx = e.target.getAttribute('data-index');
                        if (idx !== null) tempItems[idx].name = e.target.value;
                    });
                });
                document.querySelectorAll('.item-weight-input').forEach(inp => {
                    inp.addEventListener('input', (e) => {
                        const idx = e.target.getAttribute('data-index');
                        if (idx !== null) tempItems[idx].weight = parseFloat(e.target.value) || 0;
                    });
                });
            }

            function openNewModelModal() {
                editingModelId = null;
                modalTitle.innerText = '新建成绩模型';
                modelNameInput.value = '';
                modelDescInput.value = '';
                tempItems = [
                    { name: '文献综述', weight: 0.3 },
                    { name: '实验报告', weight: 0.3 },
                    { name: '期末论文', weight: 0.4 }
                ];
                renderConfigItems();
                modal.classList.add('active');
            }

            function openEditModelModal(id) {
                const model = models.find(m => m.id === id);
                if (!model) return;
                editingModelId = id;
                modalTitle.innerText = '编辑成绩模型';
                modelNameInput.value = model.name || '';
                modelDescInput.value = model.description || '';
                tempItems = model.items.map(it => ({ name: it.name, weight: it.weight }));
                renderConfigItems();
                modal.classList.add('active');
            }

            function saveModel() {
                const name = modelNameInput.value.trim();
                if (!name) { alert('请输入模型名称'); return; }
                const description = modelDescInput.value.trim();

                const items = [];
                const nameInputs = document.querySelectorAll('.item-name-input');
                const weightInputs = document.querySelectorAll('.item-weight-input');
                for (let i = 0; i < nameInputs.length; i++) {
                    const itemName = nameInputs[i].value.trim();
                    const weight = parseFloat(weightInputs[i].value) || 0;
                    if (itemName === '') continue;
                    items.push({ name: itemName, weight: Math.min(1, Math.max(0, weight)) });
                }
                if (items.length === 0) {
                    alert('至少保留一个有效的评分项');
                    return;
                }

                if (editingModelId !== null) {
                    models = models.map(m => m.id === editingModelId ? { ...m, name, description, items } : m);
                } else {
                    const newModel = {
                        id: Date.now(),
                        name,
                        description,
                        items,
                    };
                    models.push(newModel);
                }

                modal.classList.remove('active');
                currentPage = 1;
                renderModels();
            }

            function deleteModel(id) {
                if (confirm('确认删除该成绩模型？')) {
                    models = models.filter(m => m.id !== id);
                    currentPage = 1;
                    renderModels();
                }
            }

            // 事件绑定
            addModelBtn.addEventListener('click', openNewModelModal);

            function applySearch() {
                searchKeyword = searchInput.value;
                currentPage = 1;
                renderModels();
            }
            searchInput.addEventListener('input', applySearch);
            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchKeyword = '';
                currentPage = 1;
                renderModels();
            });

            modelListEl.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (!btn) return;
                const id = Number(btn.getAttribute('data-id'));
                const action = btn.getAttribute('data-action');
                if (action === 'editModel') openEditModelModal(id);
                if (action === 'deleteModel') deleteModel(id);
            });

            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderModels();
                }
            });

            nextBtn.addEventListener('click', () => {
                const filtered = getFilteredModels();
                const totalPages = Math.ceil(filtered.length / pageSize);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderModels();
                }
            });

            addConfigItemBtn.addEventListener('click', () => {
                tempItems.push({ name: '', weight: 0.0 });
                renderConfigItems();
            });

            cancelModalBtn.addEventListener('click', () => {
                modal.classList.remove('active');
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('active');
            });

            saveModelBtn.addEventListener('click', saveModel);

            // 初始化
            renderModels();
        })();
    </script>
</body>
</html>
