<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>研究生 · 毕业答辩管理（真实导入Excel/ZIP）</title>
    <!-- Inter 字体 + 图标库 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- 引入 SheetJS 用于解析 Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <!-- 引入 JSZip 用于解析 ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* 完全沿用参考风格，适配答辩管理场景 + 预览样式微调 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #eef3f8;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .full-screen {
            width: 100%;
            padding: 1.5rem 1.8rem;
            flex: 1;
        }
        @media (max-width: 640px) {
            .full-screen { padding: 1rem 1rem; }
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,20,40,0.08);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e9eef4;
            width: 100%;
        }
        @media (max-width: 640px) {
            .card { padding: 1.5rem 1.2rem; }
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 1.5rem;
        }
        .section-title i { color: #2f6e9e; font-size: 1.4rem; }

        /* 筛选栏 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 170px;
            flex: 1 1 160px;
        }
        .filter-item label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
        }
        .filter-input, .filter-select {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.65rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn {
            border: none;
            background: transparent;
            font-weight: 500;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .btn-primary {
            background: #1e4a6f;
            color: white;
            box-shadow: 0 4px 10px rgba(0,60,110,0.2);
        }
        .btn-primary:hover { background: #123a58; transform: translateY(-2px); }
        .btn-outline {
            background: white;
            border-color: #cbd5e1;
            color: #2c455d;
        }
        .btn-outline:hover { background: #f1f7fd; border-color: #9bb0c5; }
        .btn-sm { padding: 0.45rem 1.2rem; font-size: 0.8rem; }

        /* 表格区域 */
        .table-wrapper {
            border-radius: 20px;
            background: #ffffff;
            border: 1px solid #e2eaf3;
            overflow-x: auto;
            margin-top: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1300px;
        }
        th {
            text-align: left;
            padding: 1.2rem 1rem;
            background: #eaf1f9;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1d4b6e;
            text-transform: uppercase;
        }
        td {
            padding: 1rem 1rem;
            border-bottom: 1px solid #e3eaf2;
            vertical-align: middle;
        }
        .student-name { font-weight: 600; color: #0b2b40; }
        .badge-info {
            background: #e3f0fa;
            color: #11517c;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .info-chip {
            background: #ecf5fb;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.75rem;
            display: inline-block;
            color: #1e4e6f;
            border: 1px solid #c3d9ec;
        }
        .action-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .icon-btn {
            background: none; border: none; font-size: 0.8rem; padding: 0.4rem 1rem;
            border-radius: 40px; cursor: pointer; color: #2a577b; background: #f2f8ff;
            display: inline-flex; align-items: center; gap: 0.4rem; border: 1px solid transparent;
        }
        .icon-btn:hover { background: #dae9f8; }
        .delete-btn:hover { background: #ffeae9; color: #b13e3e; }
        .preview-btn:hover { background: #e0effa; color: #005b96; }

        /* 分页 */
        .pagination-bar {
            display: flex; justify-content: flex-end; align-items: center;
            gap: 0.5rem; margin-top: 1.8rem; flex-wrap: wrap;
        }
        .pagination-btn {
            background: white; border: 1px solid #c9d9eb; color: #1d4a6b;
            width: 38px; height: 38px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 500; cursor: pointer; transition: 0.1s;
        }
        .pagination-btn.active { background: #1e4a6f; border-color: #1e4a6f; color: white; }
        .pagination-btn:hover:not(.active) { background: #e5f0fb; }
        .page-info { color: #466585; margin-right: 0.8rem; font-size: 0.9rem; }

        /* 弹窗 (复用风格) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,20,40,0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-card {
            background: white; border-radius: 32px; width: 90%; max-width: 750px;
            padding: 2rem 2.2rem; box-shadow: 0 40px 70px rgba(0,20,50,0.4);
            transform: scale(0.95); transition: transform 0.2s ease;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.show .modal-card { transform: scale(1); }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-header h3 { font-size: 1.6rem; font-weight: 600; color: #0c2b48; }
        .modal-close {
            background: none; border: none; font-size: 2.2rem; cursor: pointer;
            color: #8ba5c2; line-height: 1;
        }
        .modal-close:hover { color: #1e3a5f; }

        /* 预览卡片样式 */
        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem 2rem;
            background: #f8fcff;
            padding: 1.8rem;
            border-radius: 24px;
            border: 1px solid #dde9f5;
        }
        .preview-item {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .preview-item.full-width { grid-column: span 2; }
        .preview-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .preview-value {
            font-size: 1rem;
            font-weight: 500;
            color: #0b2d4b;
            background: white;
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            border: 1px solid #d4e2f0;
            word-break: break-word;
        }
        .preview-value.reviewer-multi {
            background: #ecf5fb;
            white-space: pre-line;
        }

        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem 1.8rem;
        }
        .full-width { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .input-group label {
            font-weight: 600; font-size: 0.75rem; color: #4e6f8c; text-transform: uppercase;
            display: flex; align-items: center; gap: 4px;
        }
        .input-field {
            background: #f8fafd; border: 1px solid #dde3ea; border-radius: 16px;
            padding: 0.75rem 1.2rem; font-size: 0.95rem; font-family: 'Inter', sans-serif;
        }
        .input-field:focus {
            outline: none; border-color: #2f6e9e;
            box-shadow: 0 0 0 3px rgba(47,110,158,0.15); background: white;
        }
        .readonly-field {
            background: #ecf2f9; color: #2a4e6e; font-weight: 500;
        }
        .modal-actions {
            display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2.2rem;
        }

        /* Toast */
        .toast-message {
            background: #1e4a6f; color: white; padding: 0.8rem 2rem;
            border-radius: 60px; font-weight: 500; box-shadow: 0 15px 30px rgba(0,40,70,0.4);
            position: fixed; bottom: 30px; right: 30px; z-index: 1100;
            opacity: 0; transform: translateY(10px); transition: 0.2s; pointer-events: none;
        }
        .toast-message.show { opacity: 1; transform: translateY(0); }

        /* 导入按钮组 */
        .import-group {
            display: flex;
            gap: 0.8rem;
            margin-left: auto;
        }
        @media (max-width: 700px) {
            .filter-bar .import-group { margin-left: 0; width: 100%; justify-content: flex-start; }
        }

        /* 隐藏的文件输入 */
        .file-input-hidden {
            display: none;
        }
        .import-status {
            margin-left: 1rem;
            font-size: 0.85rem;
            color: #1e4a6f;
            background: #e3f0fa;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="full-screen">
    <!-- 卡片：筛选栏 + 导入/新增 -->
    <div class="card">
        <div class="filter-bar">
            <div class="filter-item">
                <label><i class="fas fa-user-graduate"></i> 学生姓名</label>
                <input type="text" class="filter-input" id="filterStudentName" placeholder="姓名">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-id-card"></i> 学号</label>
                <input type="text" class="filter-input" id="filterStudentId" placeholder="学号">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-users"></i> 班级</label>
                <input type="text" class="filter-input" id="filterClass" placeholder="例如 研计算机1班">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-chalkboard-teacher"></i> 导师</label>
                <input type="text" class="filter-input" id="filterSupervisor" placeholder="导师姓名">
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                <button class="btn btn-outline" id="resetFilterBtn"><i class="fas fa-undo"></i> 重置</button>
                <div class="import-group">
                    <button class="btn btn-outline" id="importExcelBtn"><i class="fas fa-file-excel"></i> 导入Excel</button>
                    <button class="btn btn-outline" id="importZipBtn"><i class="fas fa-file-archive"></i> 导入ZIP</button>
                    <button class="btn btn-primary" id="openAddModalBtn"><i class="fas fa-plus-circle"></i> 新增答辩</button>
                </div>
            </div>
        </div>
        <!-- 导入状态显示 -->
        <div id="importStatus" class="import-status" style="display: none;"></div>
    </div>

    <!-- 答辩信息列表卡片 -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-gavel"></i> 论文毕业答辩安排（点击预览查看详情）
        </div>
        <div class="table-wrapper">
            <table id="defenseTable">
                <thead>
                    <tr>
                        <th>姓名</th><th>学号</th><th>班级</th><th>答辩时间</th><th>地点</th><th>导师</th><th>答辩秘书</th><th>评阅人</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <!-- 分页 -->
        <div class="pagination-bar" id="paginationContainer"></div>
    </div>
</div>

<!-- 隐藏的文件输入框 (用于导入) -->
<input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="file-input-hidden" />
<input type="file" id="zipFileInput" accept=".zip" class="file-input-hidden" />

<!-- 新增/编辑 弹窗 -->
<div class="modal-overlay" id="defenseModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle"><i class="fas fa-pen"></i> 答辩信息</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <form id="defenseForm" onsubmit="return false;">
            <div class="form-grid">
                <div class="input-group">
                    <label><i class="fas fa-user"></i> 学生姓名 *</label>
                    <input type="text" class="input-field" id="modalStudentName" required placeholder="张明">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-id-card"></i> 学号 *</label>
                    <input type="text" class="input-field" id="modalStudentId" required placeholder="G2024001">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-users"></i> 班级</label>
                    <input type="text" class="input-field" id="modalClass" placeholder="研计算机2021级1班">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-calendar-check"></i> 答辩时间 *</label>
                    <input type="datetime-local" class="input-field" id="modalDefenseTime" required>
                </div>
                <div class="input-group full-width">
                    <label><i class="fas fa-map-pin"></i> 地点 *</label>
                    <input type="text" class="input-field" id="modalLocation" required placeholder="信息楼A201">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-chalkboard-teacher"></i> 导师 *</label>
                    <input type="text" class="input-field" id="modalSupervisor" required placeholder="陈建平">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-user-tie"></i> 答辩秘书</label>
                    <input type="text" class="input-field" id="modalSecretary" placeholder="王助教 (可选)">
                </div>
                <div class="input-group full-width">
                    <label><i class="fas fa-users-between-lines"></i> 评阅人信息</label>
                    <input type="text" class="input-field" id="modalReviewers" placeholder="张教授(北大), 李教授(清华) ...">
                </div>
                <div class="input-group">
                    <label>登记人</label>
                    <input type="text" class="input-field readonly-field" id="modalRegistrar" readonly value="教务秘书">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="modalCancelBtn"><i class="fas fa-times"></i> 取消</button>
                <button type="submit" class="btn btn-primary" id="modalSaveBtn"><i class="fas fa-save"></i> 保存答辩</button>
            </div>
        </form>
    </div>
</div>

<!-- 预览弹窗 -->
<div class="modal-overlay" id="previewModal">
    <div class="modal-card" style="max-width: 780px;">
        <div class="modal-header">
            <h3><i class="fas fa-eye"></i> 答辩详情预览</h3>
            <button class="modal-close" id="closePreviewBtn">&times;</button>
        </div>
        <div id="previewContent" class="preview-grid">
            <!-- 动态填充预览数据 -->
        </div>
        <div class="modal-actions" style="margin-top:2rem;">
            <button type="button" class="btn btn-outline" id="closePreviewFooterBtn"><i class="fas fa-times"></i> 关闭</button>
        </div>
    </div>
</div>

<div id="toast" class="toast-message">操作成功</div>

<script>
    (function(){
        // ---------- 模拟初始答辩数据 ----------
        let allDefenses = [
            { id: 'd1', studentName: '欧阳雪', studentId: 'G202401', className: '计算机学硕1班', defenseTime: '2026-06-10T14:00', location: '信息楼A201', supervisor: '陈建平', secretary: '王助教', reviewers: '张维(北大)、李东(清华)' },
            { id: 'd2', studentName: '王博文', studentId: 'G202402', className: '计算机学硕2班', defenseTime: '2026-06-11T09:30', location: '科研楼B305', supervisor: '刘竞', secretary: '赵雨', reviewers: '周明(复旦)、孙立人(上交)' },
            { id: 'd3', studentName: '李思睿', studentId: 'G202403', className: '人工智能班', defenseTime: '2026-06-12T15:00', location: '软件园C102', supervisor: '吴方', secretary: '郑秘书', reviewers: '王华(中科院)' },
            { id: 'd4', studentName: '赵一凡', studentId: 'G202404', className: '计算机学硕1班', defenseTime: '2026-06-10T16:00', location: '信息楼A202', supervisor: '陈建平', secretary: '王助教', reviewers: '张维(北大)、李东(清华)、刘杨(浙大)' },
            { id: 'd5', studentName: '陈果', studentId: 'G202405', className: '计算机学硕2班', defenseTime: '2026-06-13T10:00', location: '科研楼B307', supervisor: '刘竞', secretary: '赵雨', reviewers: '周明(复旦)' },
            { id: 'd6', studentName: '周明', studentId: 'G202406', className: '人工智能班', defenseTime: '2026-06-14T13:30', location: '软件园C105', supervisor: '吴方', secretary: '郑秘书', reviewers: '王华(中科院)、刘颖(北邮)' },
            { id: 'd7', studentName: '郑青', studentId: 'G202407', className: '计算机学硕1班', defenseTime: '2026-06-15T09:00', location: '信息楼A203', supervisor: '陈建平', secretary: '王助教', reviewers: '张维(北大)' },
            { id: 'd8', studentName: '林溪', studentId: 'G202408', className: '计算机学硕2班', defenseTime: '2026-06-16T14:00', location: '科研楼B310', supervisor: '刘竞', secretary: '赵雨', reviewers: '孙立人(上交)、周明(复旦)' },
            { id: 'd9', studentName: '徐远', studentId: 'G202409', className: '人工智能班', defenseTime: '2026-06-17T11:00', location: '软件园C110', supervisor: '吴方', secretary: '郑秘书', reviewers: '王华(中科院)' },
            { id: 'd10', studentName: '沈梦', studentId: 'G202410', className: '计算机学硕1班', defenseTime: '2026-06-18T10:30', location: '信息楼A205', supervisor: '陈建平', secretary: '王助教', reviewers: '张维(北大)、李东(清华)、刘杨(浙大)' }
        ];

        // 分页配置
        const pageSize = 5;
        let currentPage = 1;
        // 筛选条件
        let filters = { studentName: '', studentId: '', className: '', supervisor: '' };

        // DOM 元素
        const tbody = document.getElementById('tableBody');
        const toast = document.getElementById('toast');
        const paginationContainer = document.getElementById('paginationContainer');
        const filterName = document.getElementById('filterStudentName');
        const filterId = document.getElementById('filterStudentId');
        const filterClass = document.getElementById('filterClass');
        const filterSupervisor = document.getElementById('filterSupervisor');
        const resetFilterBtn = document.getElementById('resetFilterBtn');
        const openAddModalBtn = document.getElementById('openAddModalBtn');
        const importExcelBtn = document.getElementById('importExcelBtn');
        const importZipBtn = document.getElementById('importZipBtn');
        const excelFileInput = document.getElementById('excelFileInput');
        const zipFileInput = document.getElementById('zipFileInput');
        const importStatus = document.getElementById('importStatus');

        // 编辑弹窗元素
        const modal = document.getElementById('defenseModal');
        const modalTitle = document.getElementById('modalTitle');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalSaveBtn = document.getElementById('modalSaveBtn');
        const modalForm = document.getElementById('defenseForm');
        const modalStudentName = document.getElementById('modalStudentName');
        const modalStudentId = document.getElementById('modalStudentId');
        const modalClass = document.getElementById('modalClass');
        const modalDefenseTime = document.getElementById('modalDefenseTime');
        const modalLocation = document.getElementById('modalLocation');
        const modalSupervisor = document.getElementById('modalSupervisor');
        const modalSecretary = document.getElementById('modalSecretary');
        const modalReviewers = document.getElementById('modalReviewers');
        const modalRegistrar = document.getElementById('modalRegistrar');

        // 预览弹窗元素
        const previewModal = document.getElementById('previewModal');
        const previewContent = document.getElementById('previewContent');
        const closePreviewBtn = document.getElementById('closePreviewBtn');
        const closePreviewFooterBtn = document.getElementById('closePreviewFooterBtn');

        // 当前编辑ID
        let editingId = null;

        // 辅助函数
        function showToast(text, duration = 2000) {
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }
        function generateId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 8); }
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
        // 格式化日期时间用于显示
        function formatDateTime(datetimeStr) {
            if (!datetimeStr) return '—';
            const d = new Date(datetimeStr);
            if (isNaN(d.getTime())) return datetimeStr;
            return d.toLocaleString('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}).replace(/\//g,'-');
        }

        // 筛选逻辑
        function filterList() {
            return allDefenses.filter(item => {
                if (filters.studentName && !item.studentName.toLowerCase().includes(filters.studentName.toLowerCase())) return false;
                if (filters.studentId && !item.studentId.includes(filters.studentId)) return false;
                if (filters.className && !(item.className || '').toLowerCase().includes(filters.className.toLowerCase())) return false;
                if (filters.supervisor && !(item.supervisor || '').toLowerCase().includes(filters.supervisor.toLowerCase())) return false;
                return true;
            });
        }

        function getFiltered() { return filterList(); }

        function getPaginated() {
            const filtered = getFiltered();
            const start = (currentPage - 1) * pageSize;
            return filtered.slice(start, start + pageSize);
        }

        function totalPages() {
            return Math.ceil(getFiltered().length / pageSize);
        }

        function goToPage(page) {
            const total = totalPages();
            if (page < 1) page = 1;
            if (total > 0 && page > total) page = total;
            if (page === currentPage) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }
        window.pageGo = goToPage;

        // 渲染分页
        function renderPagination() {
            const total = totalPages();
            if (total <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }
            let html = `<span class="page-info"><i class="fas fa-layer-group"></i> 第 ${currentPage} / ${total} 页</span>`;
            html += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.pageGo(${currentPage-1})"><i class="fas fa-chevron-left"></i></button>`;
            for (let i = 1; i <= total; i++) {
                if (i === currentPage) html += `<span class="pagination-btn active">${i}</span>`;
                else html += `<button class="pagination-btn" onclick="window.pageGo(${i})">${i}</button>`;
            }
            html += `<button class="pagination-btn" ${currentPage === total ? 'disabled' : ''} onclick="window.pageGo(${currentPage+1})"><i class="fas fa-chevron-right"></i></button>`;
            paginationContainer.innerHTML = html;
        }

        // 删除记录
        function deleteDefense(id) {
            allDefenses = allDefenses.filter(a => a.id !== id);
            const filtered = getFiltered();
            if (filtered.length === 0 && currentPage > 1) currentPage--;
            showToast('答辩记录已删除');
            renderTable();
            renderPagination();
        }

        // 打开新增弹窗
        function openAddModal() {
            editingId = null;
            modalTitle.innerHTML = '<i class="fas fa-plus-circle"></i> 新增答辩';
            modalStudentName.value = '';
            modalStudentId.value = '';
            modalClass.value = '';
            const now = new Date();
            now.setDate(now.getDate() + 7);
            now.setHours(14,0,0,0);
            const tzOffset = now.getTimezoneOffset() * 60000;
            const localISOTime = new Date(now - tzOffset).toISOString().slice(0,16);
            modalDefenseTime.value = localISOTime;
            modalLocation.value = '';
            modalSupervisor.value = '';
            modalSecretary.value = '';
            modalReviewers.value = '';
            modalRegistrar.value = '教务秘书';
            modal.classList.add('show');
        }

        // 打开编辑弹窗
        function openEditModal(id) {
            const item = allDefenses.find(a => a.id === id);
            if (!item) return;
            editingId = id;
            modalTitle.innerHTML = '<i class="fas fa-edit"></i> 编辑答辩';
            modalStudentName.value = item.studentName || '';
            modalStudentId.value = item.studentId || '';
            modalClass.value = item.className || '';
            let dt = item.defenseTime;
            if (dt && dt.length === 16) modalDefenseTime.value = dt;
            else {
                const d = new Date(dt);
                if (!isNaN(d.getTime())) {
                    const tzOffset = d.getTimezoneOffset() * 60000;
                    const local = new Date(d - tzOffset).toISOString().slice(0,16);
                    modalDefenseTime.value = local;
                } else modalDefenseTime.value = '';
            }
            modalLocation.value = item.location || '';
            modalSupervisor.value = item.supervisor || '';
            modalSecretary.value = item.secretary || '';
            modalReviewers.value = item.reviewers || '';
            modalRegistrar.value = '教务秘书';
            modal.classList.add('show');
        }

        function closeModal() {
            modal.classList.remove('show');
            editingId = null;
        }

        // 保存答辩记录
        function saveDefense() {
            const studentName = modalStudentName.value.trim();
            const studentId = modalStudentId.value.trim();
            const defenseTime = modalDefenseTime.value;
            const location = modalLocation.value.trim();
            const supervisor = modalSupervisor.value.trim();
            if (!studentName || !studentId || !defenseTime || !location || !supervisor) {
                showToast('姓名、学号、答辩时间、地点、导师为必填项', 1500);
                return;
            }

            const data = {
                studentName, studentId,
                className: modalClass.value.trim() || null,
                defenseTime,
                location,
                supervisor,
                secretary: modalSecretary.value.trim() || null,
                reviewers: modalReviewers.value.trim() || null,
            };

            if (editingId) {
                const index = allDefenses.findIndex(a => a.id === editingId);
                if (index !== -1) { allDefenses[index] = { ...allDefenses[index], ...data }; }
                showToast('答辩已更新');
            } else {
                const newItem = { id: generateId(), ...data };
                allDefenses.push(newItem);
                showToast('新答辩已添加');
                const filtered = getFiltered();
                currentPage = Math.ceil(filtered.length / pageSize);
            }
            closeModal();
            renderTable();
            renderPagination();
        }

        // 预览功能
        function openPreviewModal(id) {
            const item = allDefenses.find(a => a.id === id);
            if (!item) return;
            const html = `
                <div class="preview-item full-width">
                    <span class="preview-label"><i class="fas fa-user"></i> 姓名</span>
                    <span class="preview-value">${escapeHtml(item.studentName)}</span>
                </div>
                <div class="preview-item">
                    <span class="preview-label"><i class="fas fa-id-card"></i> 学号</span>
                    <span class="preview-value">${escapeHtml(item.studentId)}</span>
                </div>
                <div class="preview-item">
                    <span class="preview-label"><i class="fas fa-users"></i> 班级</span>
                    <span class="preview-value">${escapeHtml(item.className || '—')}</span>
                </div>
                <div class="preview-item">
                    <span class="preview-label"><i class="fas fa-calendar-alt"></i> 答辩时间</span>
                    <span class="preview-value">${formatDateTime(item.defenseTime)}</span>
                </div>
                <div class="preview-item full-width">
                    <span class="preview-label"><i class="fas fa-map-pin"></i> 地点</span>
                    <span class="preview-value">${escapeHtml(item.location)}</span>
                </div>
                <div class="preview-item">
                    <span class="preview-label"><i class="fas fa-chalkboard-teacher"></i> 导师</span>
                    <span class="preview-value">${escapeHtml(item.supervisor)}</span>
                </div>
                <div class="preview-item">
                    <span class="preview-label"><i class="fas fa-user-tie"></i> 答辩秘书</span>
                    <span class="preview-value">${escapeHtml(item.secretary || '—')}</span>
                </div>
                <div class="preview-item full-width">
                    <span class="preview-label"><i class="fas fa-users-between-lines"></i> 评阅人</span>
                    <span class="preview-value reviewer-multi">${escapeHtml(item.reviewers || '无')}</span>
                </div>
            `;
            previewContent.innerHTML = html;
            previewModal.classList.add('show');
        }

        function closePreviewModal() {
            previewModal.classList.remove('show');
        }

        // 渲染表格
        function renderTable() {
            const paginated = getPaginated();
            let html = '';
            if (paginated.length === 0) {
                html = `<tr><td colspan="9" style="text-align:center; padding:3rem; color:#8899bb;"><i class="fas fa-gavel" style="font-size:2rem; opacity:0.5;"></i><br>暂无答辩记录</td></tr>`;
            } else {
                paginated.forEach(item => {
                    html += `<tr>`;
                    html += `<td class="student-name">${escapeHtml(item.studentName)}</td>`;
                    html += `<td>${escapeHtml(item.studentId)}</td>`;
                    html += `<td>${escapeHtml(item.className || '—')}</td>`;
                    html += `<td>${formatDateTime(item.defenseTime)}</td>`;
                    html += `<td><span class="info-chip">${escapeHtml(item.location)}</span></td>`;
                    html += `<td>${escapeHtml(item.supervisor)}</td>`;
                    html += `<td>${escapeHtml(item.secretary || '—')}</td>`;
                    html += `<td><span class="badge-info" title="${escapeHtml(item.reviewers || '')}">${escapeHtml(item.reviewers || '—')}</span></td>`;
                    html += `<td><div class="action-btns">`;
                    html += `<button class="icon-btn preview-btn" onclick="window.previewHandler('${item.id}')"><i class="fas fa-eye"></i> 预览</button>`;
                    html += `<button class="icon-btn" onclick="window.editHandler('${item.id}')"><i class="fas fa-pen"></i> 编辑</button>`;
                    html += `<button class="icon-btn delete-btn" onclick="window.deleteHandler('${item.id}')"><i class="fas fa-trash"></i> 删除</button>`;
                    html += `</div></td></tr>`;
                });
            }
            tbody.innerHTML = html;
        }

        // 筛选应用
        function applyFilters() {
            filters.studentName = filterName.value;
            filters.studentId = filterId.value;
            filters.className = filterClass.value;
            filters.supervisor = filterSupervisor.value;
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        function resetFilters() {
            filterName.value = '';
            filterId.value = '';
            filterClass.value = '';
            filterSupervisor.value = '';
            filters = { studentName: '', studentId: '', className: '', supervisor: '' };
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        // ---------- 真实导入功能 ----------
        // 显示导入状态
        function setStatus(msg, isError = false) {
            importStatus.style.display = 'inline-block';
            importStatus.textContent = msg;
            importStatus.style.background = isError ? '#ffebe9' : '#e3f0fa';
            importStatus.style.color = isError ? '#b13e3e' : '#1e4a6f';
            setTimeout(() => { importStatus.style.display = 'none'; }, 4000);
        }

        // 解析Excel并导入
        function handleExcelImport(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    // 转换为JSON，期望表头：学生姓名,学号,班级,答辩时间,地点,导师,答辩秘书,评阅人
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                    if (rows.length < 2) {
                        setStatus('Excel 无有效数据', true);
                        return;
                    }
                    const headers = rows[0];
                    // 简单映射，忽略大小写/空格
                    const nameIdx = headers.findIndex(h => h.includes('姓名'));
                    const idIdx = headers.findIndex(h => h.includes('学号'));
                    const classIdx = headers.findIndex(h => h.includes('班级'));
                    const timeIdx = headers.findIndex(h => h.includes('答辩时间'));
                    const locIdx = headers.findIndex(h => h.includes('地点'));
                    const supIdx = headers.findIndex(h => h.includes('导师'));
                    const secIdx = headers.findIndex(h => h.includes('秘书'));
                    const revIdx = headers.findIndex(h => h.includes('评阅人'));

                    if (nameIdx === -1 || idIdx === -1 || timeIdx === -1 || locIdx === -1 || supIdx === -1) {
                        setStatus('Excel缺少必要列(姓名/学号/答辩时间/地点/导师)', true);
                        return;
                    }

                    let added = 0;
                    for (let i = 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row || row.length === 0) continue;
                        const studentName = row[nameIdx]?.toString().trim();
                        const studentId = row[idIdx]?.toString().trim();
                        const defenseTime = row[timeIdx] ? row[timeIdx].toString().trim() : '';
                        const location = row[locIdx]?.toString().trim();
                        const supervisor = row[supIdx]?.toString().trim();
                        if (!studentName || !studentId || !defenseTime || !location || !supervisor) continue; // 跳过不完整行

                        // 尝试将Excel日期转换为datetime-local (简单处理)
                        let formattedTime = defenseTime;
                        if (typeof defenseTime === 'number') {
                            // Excel序列号日期 (粗略)
                            const date = XLSX.SSF.parse_date_code(defenseTime);
                            if (date) {
                                const y = date.y, m = String(date.m).padStart(2,'0'), d = String(date.d).padStart(2,'0');
                                const h = String(date.H || 0).padStart(2,'0'), min = String(date.M || 0).padStart(2,'0');
                                formattedTime = `${y}-${m}-${d}T${h}:${min}`;
                            }
                        } else if (defenseTime.includes('/') || defenseTime.includes('-')) {
                            // 简单处理字符串日期，补充时间部分
                            if (defenseTime.length === 10) formattedTime = defenseTime + 'T00:00';
                        }

                        const newItem = {
                            id: generateId(),
                            studentName,
                            studentId,
                            className: row[classIdx]?.toString().trim() || null,
                            defenseTime: formattedTime,
                            location,
                            supervisor,
                            secretary: secIdx > -1 ? row[secIdx]?.toString().trim() || null : null,
                            reviewers: revIdx > -1 ? row[revIdx]?.toString().trim() || null : null,
                        };
                        allDefenses.push(newItem);
                        added++;
                    }
                    setStatus(`Excel导入成功，新增 ${added} 条记录`);
                    // 重置到第一页
                    currentPage = 1;
                    renderTable();
                    renderPagination();
                } catch (err) {
                    setStatus('Excel解析失败: ' + err.message, true);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 解析ZIP并导入（模拟：ZIP内包含Excel和附件命名规则，这里实现真实解压并查找第一个Excel）
        function handleZipImport(file) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const zip = new JSZip();
                    const zipData = await zip.loadAsync(e.target.result);
                    let excelFile = null;
                    let excelFileName = '';
                    // 查找第一个 .xlsx 或 .xls 文件
                    for (let filename of Object.keys(zipData.files)) {
                        if (filename.endsWith('.xlsx') || filename.endsWith('.xls') || filename.endsWith('.csv')) {
                            excelFile = zipData.files[filename];
                            excelFileName = filename;
                            break;
                        }
                    }
                    if (!excelFile) {
                        setStatus('ZIP内未找到Excel文件', true);
                        return;
                    }
                    const blob = await excelFile.async('blob');
                    // 复用Excel导入逻辑
                    const excelReader = new FileReader();
                    excelReader.onload = (excelEv) => {
                        try {
                            const data = new Uint8Array(excelEv.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                            const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                            if (rows.length < 2) {
                                setStatus('ZIP内Excel无有效数据', true);
                                return;
                            }
                            // 简略导入，同上逻辑
                            const headers = rows[0];
                            const nameIdx = headers.findIndex(h => h.includes('姓名'));
                            const idIdx = headers.findIndex(h => h.includes('学号'));
                            const classIdx = headers.findIndex(h => h.includes('班级'));
                            const timeIdx = headers.findIndex(h => h.includes('答辩时间'));
                            const locIdx = headers.findIndex(h => h.includes('地点'));
                            const supIdx = headers.findIndex(h => h.includes('导师'));
                            const secIdx = headers.findIndex(h => h.includes('秘书'));
                            const revIdx = headers.findIndex(h => h.includes('评阅人'));

                            if (nameIdx === -1 || idIdx === -1 || timeIdx === -1 || locIdx === -1 || supIdx === -1) {
                                setStatus('Excel缺少必要列', true);
                                return;
                            }
                            let added = 0;
                            for (let i = 1; i < rows.length; i++) {
                                const row = rows[i];
                                if (!row) continue;
                                const studentName = row[nameIdx]?.toString().trim();
                                const studentId = row[idIdx]?.toString().trim();
                                const defenseTime = row[timeIdx]?.toString().trim();
                                const location = row[locIdx]?.toString().trim();
                                const supervisor = row[supIdx]?.toString().trim();
                                if (!studentName || !studentId || !defenseTime || !location || !supervisor) continue;
                                const newItem = {
                                    id: generateId(),
                                    studentName,
                                    studentId,
                                    className: classIdx > -1 ? row[classIdx]?.toString().trim() : null,
                                    defenseTime,
                                    location,
                                    supervisor,
                                    secretary: secIdx > -1 ? row[secIdx]?.toString().trim() : null,
                                    reviewers: revIdx > -1 ? row[revIdx]?.toString().trim() : null,
                                };
                                allDefenses.push(newItem);
                                added++;
                            }
                            // 模拟附件处理：仅提示
                            let attachmentMsg = '';
                            for (let filename of Object.keys(zipData.files)) {
                                if (filename.includes('.pdf') || filename.includes('.doc')) {
                                    attachmentMsg = '，并发现附件文件';
                                    break;
                                }
                            }
                            setStatus(`ZIP导入成功，从 ${excelFileName} 新增 ${added} 条记录${attachmentMsg}`);
                            currentPage = 1;
                            renderTable();
                            renderPagination();
                        } catch (err) {
                            setStatus('ZIP内Excel解析失败', true);
                        }
                    };
                    excelReader.readAsArrayBuffer(blob);
                } catch (err) {
                    setStatus('ZIP解析失败: ' + err.message, true);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 触发文件选择
        importExcelBtn.addEventListener('click', () => {
            excelFileInput.click();
        });
        excelFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleExcelImport(file);
            excelFileInput.value = ''; // 允许重复选择同文件
        });

        importZipBtn.addEventListener('click', () => {
            zipFileInput.click();
        });
        zipFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleZipImport(file);
            zipFileInput.value = '';
        });

        // 挂载全局方法
        window.deleteHandler = deleteDefense;
        window.editHandler = openEditModal;
        window.previewHandler = openPreviewModal;

        // 事件监听
        filterName.addEventListener('input', applyFilters);
        filterId.addEventListener('input', applyFilters);
        filterClass.addEventListener('input', applyFilters);
        filterSupervisor.addEventListener('input', applyFilters);
        resetFilterBtn.addEventListener('click', resetFilters);
        openAddModalBtn.addEventListener('click', openAddModal);

        closeModalBtn.addEventListener('click', closeModal);
        modalCancelBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        modalForm.addEventListener('submit', (e) => { e.preventDefault(); saveDefense(); });

        closePreviewBtn.addEventListener('click', closePreviewModal);
        closePreviewFooterBtn.addEventListener('click', closePreviewModal);
        previewModal.addEventListener('click', (e) => { if (e.target === previewModal) closePreviewModal(); });

        // 初始化
        renderTable();
        renderPagination();
    })();
</script>
</body>
</html>
