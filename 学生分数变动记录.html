<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>研究生分数变动管理 · 完整CRUD</title>
    <!-- Inter 字体 + 图标库 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 完全沿用参考风格，但适配分数变动场景 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #eef3f8;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .full-screen {
            width: 100%;
            padding: 1.5rem 1.8rem;  /* 移动端稍微缩小边距 */
            flex: 1;
        }
        @media (max-width: 640px) {
            .full-screen { padding: 1rem 1rem; }
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,20,40,0.08);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e9eef4;
            width: 100%;
        }
        @media (max-width: 640px) {
            .card { padding: 1.5rem 1.2rem; }
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 1.5rem;
        }
        .section-title i { color: #2f6e9e; font-size: 1.4rem; }

        /* 筛选栏 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 170px;
            flex: 1 1 160px;
        }
        .filter-item label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
        }
        .filter-input, .filter-select {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.65rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn {
            border: none;
            background: transparent;
            font-weight: 500;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .btn-primary {
            background: #1e4a6f;
            color: white;
            box-shadow: 0 4px 10px rgba(0,60,110,0.2);
        }
        .btn-primary:hover { background: #123a58; transform: translateY(-2px); }
        .btn-outline {
            background: white;
            border-color: #cbd5e1;
            color: #2c455d;
        }
        .btn-outline:hover { background: #f1f7fd; border-color: #9bb0c5; }
        .btn-sm { padding: 0.45rem 1.2rem; font-size: 0.8rem; }

        /* 表格区域 */
        .table-wrapper {
            border-radius: 20px;
            background: #ffffff;
            border: 1px solid #e2eaf3;
            overflow-x: auto;
            margin-top: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;  /* 保证字段完整显示 */
        }
        th {
            text-align: left;
            padding: 1.2rem 1rem;
            background: #eaf1f9;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1d4b6e;
            text-transform: uppercase;
        }
        td {
            padding: 1rem 1rem;
            border-bottom: 1px solid #e3eaf2;
            vertical-align: middle;
        }
        .student-name { font-weight: 600; color: #0b2b40; }
        .badge-reason {
            background: #e3f0fa;
            color: #11517c;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .score-change {
            background: #e6f0f9;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.8rem;
            display: inline-block;
        }
        .action-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .icon-btn {
            background: none; border: none; font-size: 0.8rem; padding: 0.4rem 1rem;
            border-radius: 40px; cursor: pointer; color: #2a577b; background: #f2f8ff;
            display: inline-flex; align-items: center; gap: 0.4rem; border: 1px solid transparent;
        }
        .icon-btn:hover { background: #dae9f8; }
        .delete-btn:hover { background: #ffeae9; color: #b13e3e; }

        /* 分页 */
        .pagination-bar {
            display: flex; justify-content: flex-end; align-items: center;
            gap: 0.5rem; margin-top: 1.8rem; flex-wrap: wrap;
        }
        .pagination-btn {
            background: white; border: 1px solid #c9d9eb; color: #1d4a6b;
            width: 38px; height: 38px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 500; cursor: pointer; transition: 0.1s;
        }
        .pagination-btn.active { background: #1e4a6f; border-color: #1e4a6f; color: white; }
        .pagination-btn:hover:not(.active) { background: #e5f0fb; }
        .page-info { color: #466585; margin-right: 0.8rem; font-size: 0.9rem; }

        /* 弹窗 (完全复用风格) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,20,40,0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-card {
            background: white; border-radius: 32px; width: 90%; max-width: 750px;
            padding: 2rem 2.2rem; box-shadow: 0 40px 70px rgba(0,20,50,0.4);
            transform: scale(0.95); transition: transform 0.2s ease;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.show .modal-card { transform: scale(1); }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-header h3 { font-size: 1.6rem; font-weight: 600; color: #0c2b48; }
        .modal-close {
            background: none; border: none; font-size: 2.2rem; cursor: pointer;
            color: #8ba5c2; line-height: 1;
        }
        .modal-close:hover { color: #1e3a5f; }

        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem 1.8rem;
        }
        .full-width { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .input-group label {
            font-weight: 600; font-size: 0.75rem; color: #4e6f8c; text-transform: uppercase;
            display: flex; align-items: center; gap: 4px;
        }
        .input-field {
            background: #f8fafd; border: 1px solid #dde3ea; border-radius: 16px;
            padding: 0.75rem 1.2rem; font-size: 0.95rem; font-family: 'Inter', sans-serif;
        }
        .input-field:focus {
            outline: none; border-color: #2f6e9e;
            box-shadow: 0 0 0 3px rgba(47,110,158,0.15); background: white;
        }
        .readonly-field {
            background: #ecf2f9; color: #2a4e6e; font-weight: 500;
        }
        .modal-actions {
            display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2.2rem;
        }

        /* Toast */
        .toast-message {
            background: #1e4a6f; color: white; padding: 0.8rem 2rem;
            border-radius: 60px; font-weight: 500; box-shadow: 0 15px 30px rgba(0,40,70,0.4);
            position: fixed; bottom: 30px; right: 30px; z-index: 1100;
            opacity: 0; transform: translateY(10px); transition: 0.2s; pointer-events: none;
        }
        .toast-message.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
<div class="full-screen">
    <!-- 卡片：筛选栏 + 新增按钮 -->
    <div class="card">
        <div class="filter-bar">
            <div class="filter-item">
                <label><i class="fas fa-user-graduate"></i> 学生姓名</label>
                <input type="text" class="filter-input" id="filterStudentName" placeholder="姓名">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-id-card"></i> 学号</label>
                <input type="text" class="filter-input" id="filterStudentId" placeholder="学号">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-calendar"></i> 起始日期</label>
                <input type="date" class="filter-input" id="filterDateFrom">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-calendar"></i> 结束日期</label>
                <input type="date" class="filter-input" id="filterDateTo">
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                <button class="btn btn-outline" id="resetFilterBtn"><i class="fas fa-undo"></i> 重置</button>
                <button class="btn btn-primary" id="openAddModalBtn"><i class="fas fa-plus-circle"></i> 新增记录</button>
            </div>
        </div>
    </div>

    <!-- 分数变动列表卡片 -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-history"></i> 研究生分数变动记录
        </div>
        <div class="table-wrapper">
            <table id="scoreTable">
                <thead>
                    <tr>
                        <th>学生姓名</th><th>学号</th><th>课程</th><th>调整前</th><th>调整后</th><th>调整原因</th><th>调整时间</th><th>登记人</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <!-- 分页 -->
        <div class="pagination-bar" id="paginationContainer"></div>
    </div>
</div>

<!-- 新增/编辑 弹窗 -->
<div class="modal-overlay" id="scoreModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle"><i class="fas fa-pen"></i> 分数变动</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <form id="scoreForm" onsubmit="return false;">
            <div class="form-grid">
                <!-- 学生姓名 + 学号 两列 -->
                <div class="input-group">
                    <label><i class="fas fa-user"></i> 学生姓名 *</label>
                    <input type="text" class="input-field" id="modalStudentName" required placeholder="例如：张明">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-id-card"></i> 学号 *</label>
                    <input type="text" class="input-field" id="modalStudentId" required placeholder="20231001">
                </div>
                <div class="input-group full-width">
                    <label><i class="fas fa-book-open"></i> 课程名称（选填）</label>
                    <input type="text" class="input-field" id="modalCourse" placeholder="高等数值分析">
                </div>
                <div class="input-group">
                    <label>调整前分数 *</label>
                    <input type="number" step="0.1" min="0" max="100" class="input-field" id="modalBefore" required value="0">
                </div>
                <div class="input-group">
                    <label>调整后分数 *</label>
                    <input type="number" step="0.1" min="0" max="100" class="input-field" id="modalAfter" required value="0">
                </div>
                <div class="input-group full-width">
                    <label>调整原因 *</label>
                    <input type="text" class="input-field" id="modalReason" required placeholder="例如：核分错误/平时分补登">
                </div>
                <div class="input-group">
                    <label>调整时间</label>
                    <input type="datetime-local" class="input-field" id="modalAdjustedAt">
                </div>
                <div class="input-group">
                    <label>登记人</label>
                    <input type="text" class="input-field readonly-field" id="modalAdjustedBy" readonly value="admin@graduate">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="modalCancelBtn"><i class="fas fa-times"></i> 取消</button>
                <button type="submit" class="btn btn-primary" id="modalSaveBtn"><i class="fas fa-save"></i> 保存记录</button>
            </div>
        </form>
    </div>
</div>

<div id="toast" class="toast-message">操作成功</div>

<script>
    (function(){
        // ---------- 模拟初始数据 (研究生分数变动记录) ----------
        let allAdjustments = [
            { id: 'a1', studentName: '欧阳雪', studentId: 'G202401', course: '高级机器学习', beforeScore: 82.5, afterScore: 87.0, reason: '核分错误', adjustedAt: '2026-03-10T14:30', adjustedBy: '教务李老师' },
            { id: 'a2', studentName: '王博文', studentId: 'G202402', course: '自然语言处理', beforeScore: 91.0, afterScore: 91.0, reason: '平时分补登', adjustedAt: '2026-03-09T09:20', adjustedBy: '助教小王' },
            { id: 'a3', studentName: '李思睿', studentId: 'G202403', course: '论文写作指导', beforeScore: 75.0, afterScore: 85.0, reason: '重新批改', adjustedAt: '2026-03-08T16:00', adjustedBy: '导师陈' },
            { id: 'a4', studentName: '赵一凡', studentId: 'G202404', course: '实验设计', beforeScore: 68.0, afterScore: 78.5, reason: '实验报告补交', adjustedAt: '2026-03-07T11:15', adjustedBy: '实验员张' },
            { id: 'a5', studentName: '陈果', studentId: 'G202405', course: '数值分析', beforeScore: 93.0, afterScore: 96.0, reason: '加分题', adjustedAt: '2026-03-06T10:10', adjustedBy: '任课教师刘' },
            { id: 'a6', studentName: '周明', studentId: 'G202406', course: '数据可视化', beforeScore: 77.0, afterScore: 82.0, reason: '核分错误', adjustedAt: '2026-03-05T08:45', adjustedBy: '教务李老师' },
            { id: 'a7', studentName: '郑青', studentId: 'G202407', course: '算法设计与分析', beforeScore: 88.0, afterScore: 88.0, reason: '平时分补登', adjustedAt: '2026-03-04T13:30', adjustedBy: '助教赵' },
            { id: 'a8', studentName: '林溪', studentId: 'G202408', course: '学术英语', beforeScore: 79.0, afterScore: 84.0, reason: '口语补测', adjustedAt: '2026-03-03T09:00', adjustedBy: '外语学院王' },
            { id: 'a9', studentName: '徐远', studentId: 'G202409', course: '深度学习', beforeScore: 64.0, afterScore: 72.0, reason: '重交作业', adjustedAt: '2026-03-02T14:20', adjustedBy: '助教小王' },
            { id: 'a10', studentName: '沈梦', studentId: 'G202410', course: '计算机视觉', beforeScore: 81.0, afterScore: 86.5, reason: '核分错误', adjustedAt: '2026-03-01T10:00', adjustedBy: '教务李老师' }
        ];

        // 分页配置
        const pageSize = 5;
        let currentPage = 1;
        // 筛选条件
        let filters = { studentName: '', studentId: '', dateFrom: '', dateTo: '' };

        // DOM 元素
        const tbody = document.getElementById('tableBody');
        const toast = document.getElementById('toast');
        const paginationContainer = document.getElementById('paginationContainer');
        const filterName = document.getElementById('filterStudentName');
        const filterId = document.getElementById('filterStudentId');
        const filterDateFrom = document.getElementById('filterDateFrom');
        const filterDateTo = document.getElementById('filterDateTo');
        const resetFilterBtn = document.getElementById('resetFilterBtn');
        const openAddModalBtn = document.getElementById('openAddModalBtn');

        // 弹窗元素
        const modal = document.getElementById('scoreModal');
        const modalTitle = document.getElementById('modalTitle');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalSaveBtn = document.getElementById('modalSaveBtn');
        const modalForm = document.getElementById('scoreForm');
        const modalStudentName = document.getElementById('modalStudentName');
        const modalStudentId = document.getElementById('modalStudentId');
        const modalCourse = document.getElementById('modalCourse');
        const modalBefore = document.getElementById('modalBefore');
        const modalAfter = document.getElementById('modalAfter');
        const modalReason = document.getElementById('modalReason');
        const modalAdjustedAt = document.getElementById('modalAdjustedAt');
        const modalAdjustedBy = document.getElementById('modalAdjustedBy');

        // 当前编辑ID
        let editingId = null;

        // 辅助函数
        function showToast(text, duration = 2000) {
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }
        function generateId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 8); }
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
        // 格式化日期时间用于显示
        function formatDateTime(datetimeStr) {
            if (!datetimeStr) return '—';
            const d = new Date(datetimeStr);
            if (isNaN(d.getTime())) return datetimeStr;
            return d.toLocaleString('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}).replace(/\//g,'-');
        }

        // 筛选逻辑
        function filterList() {
            return allAdjustments.filter(item => {
                if (filters.studentName && !item.studentName.toLowerCase().includes(filters.studentName.toLowerCase())) return false;
                if (filters.studentId && !item.studentId.includes(filters.studentId)) return false;
                if (filters.dateFrom) {
                    const itemDate = item.adjustedAt ? item.adjustedAt.slice(0,10) : '';
                    if (itemDate < filters.dateFrom) return false;
                }
                if (filters.dateTo) {
                    const itemDate = item.adjustedAt ? item.adjustedAt.slice(0,10) : '';
                    if (itemDate > filters.dateTo) return false;
                }
                return true;
            });
        }

        function getFiltered() { return filterList(); }

        function getPaginated() {
            const filtered = getFiltered();
            const start = (currentPage - 1) * pageSize;
            return filtered.slice(start, start + pageSize);
        }

        function totalPages() {
            return Math.ceil(getFiltered().length / pageSize);
        }

        function goToPage(page) {
            const total = totalPages();
            if (page < 1) page = 1;
            if (total > 0 && page > total) page = total;
            if (page === currentPage) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }
        window.pageGo = goToPage;

        // 渲染分页
        function renderPagination() {
            const total = totalPages();
            if (total <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }
            let html = `<span class="page-info"><i class="fas fa-layer-group"></i> 第 ${currentPage} / ${total} 页</span>`;
            html += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.pageGo(${currentPage-1})"><i class="fas fa-chevron-left"></i></button>`;
            for (let i = 1; i <= total; i++) {
                if (i === currentPage) html += `<span class="pagination-btn active">${i}</span>`;
                else html += `<button class="pagination-btn" onclick="window.pageGo(${i})">${i}</button>`;
            }
            html += `<button class="pagination-btn" ${currentPage === total ? 'disabled' : ''} onclick="window.pageGo(${currentPage+1})"><i class="fas fa-chevron-right"></i></button>`;
            paginationContainer.innerHTML = html;
        }

        // 删除记录
        function deleteAdjustment(id) {
            allAdjustments = allAdjustments.filter(a => a.id !== id);
            const filtered = getFiltered();
            if (filtered.length === 0 && currentPage > 1) currentPage--;
            showToast('记录已删除');
            renderTable();
            renderPagination();
        }

        // 打开新增弹窗
        function openAddModal() {
            editingId = null;
            modalTitle.innerHTML = '<i class="fas fa-plus-circle"></i> 新增分数变动';
            modalStudentName.value = '';
            modalStudentId.value = '';
            modalCourse.value = '';
            modalBefore.value = 0;
            modalAfter.value = 0;
            modalReason.value = '';
            // 默认调整时间为当前时间
            const now = new Date();
            const tzOffset = now.getTimezoneOffset() * 60000;
            const localISOTime = new Date(now - tzOffset).toISOString().slice(0,16);
            modalAdjustedAt.value = localISOTime;
            modalAdjustedBy.value = '当前教务员';  // 模拟登录用户
            modal.classList.add('show');
        }

        // 打开编辑弹窗
        function openEditModal(id) {
            const item = allAdjustments.find(a => a.id === id);
            if (!item) return;
            editingId = id;
            modalTitle.innerHTML = '<i class="fas fa-edit"></i> 编辑分数变动';
            modalStudentName.value = item.studentName || '';
            modalStudentId.value = item.studentId || '';
            modalCourse.value = item.course || '';
            modalBefore.value = item.beforeScore ?? 0;
            modalAfter.value = item.afterScore ?? 0;
            modalReason.value = item.reason || '';
            // 确保datetime-local格式 YYYY-MM-DDTHH:MM
            let adjAt = item.adjustedAt;
            if (adjAt && adjAt.length === 16) modalAdjustedAt.value = adjAt;
            else {
                const d = new Date(adjAt);
                if (!isNaN(d.getTime())) {
                    const tzOffset = d.getTimezoneOffset() * 60000;
                    const local = new Date(d - tzOffset).toISOString().slice(0,16);
                    modalAdjustedAt.value = local;
                } else {
                    modalAdjustedAt.value = '';
                }
            }
            modalAdjustedBy.value = item.adjustedBy || 'admin';
            modal.classList.add('show');
        }

        function closeModal() {
            modal.classList.remove('show');
            editingId = null;
        }

        // 保存记录
        function saveAdjustment() {
            const studentName = modalStudentName.value.trim();
            const studentId = modalStudentId.value.trim();
            const before = parseFloat(modalBefore.value);
            const after = parseFloat(modalAfter.value);
            const reason = modalReason.value.trim();
            if (!studentName || !studentId || isNaN(before) || isNaN(after) || !reason) {
                showToast('请填写必填项（姓名、学号、分数、原因）', 1500);
                return;
            }
            // 简单校验范围
            if (before < 0 || before > 100 || after < 0 || after > 100) {
                showToast('分数应在0-100之间', 1500);
                return;
            }

            const adjustedAt = modalAdjustedAt.value; // datetime-local 格式
            const adjustedBy = modalAdjustedBy.value.trim() || '教务员';

            const data = {
                studentName, studentId,
                course: modalCourse.value.trim() || null,
                beforeScore: before,
                afterScore: after,
                reason,
                adjustedAt: adjustedAt || new Date().toISOString().slice(0,16),
                adjustedBy,
            };

            if (editingId) {
                const index = allAdjustments.findIndex(a => a.id === editingId);
                if (index !== -1) { allAdjustments[index] = { ...allAdjustments[index], ...data }; }
                showToast('记录已更新');
            } else {
                const newItem = { id: generateId(), ...data };
                allAdjustments.push(newItem);
                showToast('记录已添加');
                // 跳转到最后一页以便看见新增
                const filtered = getFiltered();
                currentPage = Math.ceil(filtered.length / pageSize);
            }
            closeModal();
            renderTable();
            renderPagination();
        }

        // 渲染表格
        function renderTable() {
            const paginated = getPaginated();
            let html = '';
            if (paginated.length === 0) {
                html = `<tr><td colspan="9" style="text-align:center; padding:3rem; color:#8899bb;"><i class="fas fa-edit" style="font-size:2rem; opacity:0.5;"></i><br>暂无分数变动记录</td></tr>`;
            } else {
                paginated.forEach(item => {
                    const diff = (item.afterScore - item.beforeScore).toFixed(1);
                    const diffClass = diff > 0 ? ' (↑)' : (diff < 0 ? ' (↓)' : '');
                    html += `<tr>`;
                    html += `<td class="student-name">${escapeHtml(item.studentName)}</td>`;
                    html += `<td>${escapeHtml(item.studentId)}</td>`;
                    html += `<td>${escapeHtml(item.course || '—')}</td>`;
                    html += `<td><span class="score-change">${item.beforeScore}</span></td>`;
                    html += `<td><span class="score-change" style="background:#d9f0f7;">${item.afterScore} ${diff !== '0.0' ? diff : ''}</span></td>`;
                    html += `<td><span class="badge-reason" title="${escapeHtml(item.reason)}">${escapeHtml(item.reason)}</span></td>`;
                    html += `<td>${formatDateTime(item.adjustedAt)}</td>`;
                    html += `<td>${escapeHtml(item.adjustedBy || '—')}</td>`;
                    html += `<td><div class="action-btns">`;
                    html += `<button class="icon-btn" onclick="window.editHandler('${item.id}')"><i class="fas fa-pen"></i> 编辑</button>`;
                    html += `<button class="icon-btn delete-btn" onclick="window.deleteHandler('${item.id}')"><i class="fas fa-trash"></i> 删除</button>`;
                    html += `</div></td></tr>`;
                });
            }
            tbody.innerHTML = html;
        }

        // 收集筛选并应用
        function applyFilters() {
            filters.studentName = filterName.value;
            filters.studentId = filterId.value;
            filters.dateFrom = filterDateFrom.value;
            filters.dateTo = filterDateTo.value;
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        function resetFilters() {
            filterName.value = '';
            filterId.value = '';
            filterDateFrom.value = '';
            filterDateTo.value = '';
            filters = { studentName: '', studentId: '', dateFrom: '', dateTo: '' };
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        // 挂载全局方法
        window.deleteHandler = deleteAdjustment;
        window.editHandler = openEditModal;

        // 事件监听
        filterName.addEventListener('input', applyFilters);
        filterId.addEventListener('input', applyFilters);
        filterDateFrom.addEventListener('change', applyFilters);
        filterDateTo.addEventListener('change', applyFilters);
        resetFilterBtn.addEventListener('click', resetFilters);
        openAddModalBtn.addEventListener('click', openAddModal);

        closeModalBtn.addEventListener('click', closeModal);
        modalCancelBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        modalForm.addEventListener('submit', (e) => { e.preventDefault(); saveAdjustment(); });

        // 初始化
        renderTable();
        renderPagination();
    })();
</script>
</body>
</html>
