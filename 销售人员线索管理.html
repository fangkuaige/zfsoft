<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>销售人员线索管理 · 优化分页/弹窗/图标</title>
    <!-- Inter 字体 + Font Awesome 6 (同时保留两个风格) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 完全沿用“学生分数变动记录”风格，同时保留线索功能结构 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #eef3f8;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .full-screen {
            width: 100%;
            padding: 1.5rem 1.8rem;
            flex: 1;
        }
        @media (max-width: 640px) {
            .full-screen { padding: 1rem 1rem; }
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,20,40,0.08);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e9eef4;
            width: 100%;
        }
        @media (max-width: 640px) {
            .card { padding: 1.5rem 1.2rem; }
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 1.5rem;
        }
        .section-title i { color: #2f6e9e; font-size: 1.4rem; }

        /* 筛选栏 (完全参考分数变动页) */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 170px;
            flex: 1 1 160px;
        }
        .filter-item label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .filter-input, .filter-select {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.65rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn {
            border: none;
            background: transparent;
            font-weight: 500;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .btn-primary {
            background: #1e4a6f;
            color: white;
            box-shadow: 0 4px 10px rgba(0,60,110,0.2);
        }
        .btn-primary:hover { background: #123a58; transform: translateY(-2px); }
        .btn-outline {
            background: white;
            border-color: #cbd5e1;
            color: #2c455d;
        }
        .btn-outline:hover { background: #f1f7fd; border-color: #9bb0c5; }
        .btn-sm { padding: 0.45rem 1.2rem; font-size: 0.8rem; }

        /* 线索特有的badge/owner标记，但用卡片内风格 */
        .badge-owner {
            background: #e6f0fa;
            color: #11517c;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid #cbddee;
        }

        /* 高级搜索区域 */
        .advanced-search {
            display: none; 
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px dashed #cbd5e1;
            flex-wrap: wrap;
            gap: 1.2rem;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin: 1.2rem 0 1.5rem 0;
            gap: 1rem;
        }
        .toolbar-left, .toolbar-right {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        /* 表格区 (完全套用分数变动风格) */
        .table-wrapper {
            border-radius: 20px;
            background: #ffffff;
            border: 1px solid #e2eaf3;
            overflow-x: auto;
            margin-top: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }
        th {
            text-align: left;
            padding: 1.2rem 1rem;
            background: #eaf1f9;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1d4b6e;
            text-transform: uppercase;
        }
        td {
            padding: 1rem 1rem;
            border-bottom: 1px solid #e3eaf2;
            vertical-align: middle;
        }
        .checkbox-col { width: 28px; text-align: center; }
        .status-badge {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .status-new { background: #dbeafe; color: #1e4f8a; }
        .status-followup { background: #fef9c3; color: #854d0e; }
        .status-closed { background: #e2e8f0; color: #334155; }
        .source-cms {
            background: #e6f0ff; 
            border-radius: 40px; 
            padding: 0.2rem 0.8rem; 
            font-size: 0.7rem;
            font-weight: 600; 
            color: #2563eb; 
            margin-left: 6px;
        }
        .action-icons {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        /* 操作图标不同颜色区分 */
        .icon-edit { color: #1e6f9f; background: #e3f0fa; }
        .icon-visit { color: #2e7d5e; background: #e0f2e9; }
        .icon-quick { color: #b85e00; background: #fff0e0; }
        .icon-trace { color: #7b4e9e; background: #ede7f6; }
        .action-icons i {
            cursor: pointer;
            font-size: 1rem;
            padding: 0.5rem;
            border-radius: 50%;
            transition: 0.1s;
            width: 2.2rem; height: 2.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .action-icons i:hover { filter: brightness(0.95); transform: scale(1.1); }

        /* 快速菜单 dropdown 视觉融合 */
        .quick-menu { position: relative; display: inline-block; }
        .dropdown-content {
            display: none; position: absolute; background: white; min-width: 140px;
            box-shadow: 0 15px 30px rgba(0,20,40,0.12); border-radius: 20px;
            padding: 8px 0; z-index: 10; border: 1px solid #e9edf2;
        }
        .dropdown-content a {
            display: flex; align-items: center; gap: 8px; padding: 10px 16px;
            text-decoration: none; color: #1e293b; font-size: 0.85rem;
        }
        .dropdown-content a:hover { background: #f1f7fd; }
        .quick-menu:hover .dropdown-content { display: block; }

        /* 分页 (同分数变动) 修复闪烁：使用稳定的渲染方式 */
        .pagination-bar {
            display: flex; justify-content: flex-end; align-items: center;
            gap: 0.5rem; margin-top: 1.8rem; flex-wrap: wrap;
        }
        .pagination-btn {
            background: white; border: 1px solid #c9d9eb; color: #1d4a6b;
            width: 38px; height: 38px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 500; cursor: pointer; transition: 0.1s;
        }
        .pagination-btn.active { background: #1e4a6f; border-color: #1e4a6f; color: white; }
        .pagination-btn:hover:not(.active) { background: #e5f0fb; }
        .page-info { color: #466585; margin-right: 0.8rem; font-size: 0.9rem; }

        /* 弹窗完全复用分数变动模态风格 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,20,40,0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-card {
            background: white; border-radius: 32px; width: 90%; max-width: 550px;
            padding: 2rem 2.2rem; box-shadow: 0 40px 70px rgba(0,20,50,0.4);
            transform: scale(0.95); transition: transform 0.2s ease;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.show .modal-card { transform: scale(1); }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-header h3 { font-size: 1.6rem; font-weight: 600; color: #0c2b48; }
        .modal-close {
            background: none; border: none; font-size: 2.2rem; cursor: pointer;
            color: #8ba5c2; line-height: 1;
        }
        .modal-close:hover { color: #1e3a5f; }

        .input-group { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 1.2rem; }
        .input-group label {
            font-weight: 600; font-size: 0.75rem; color: #4e6f8c; text-transform: uppercase;
            display: flex; align-items: center; gap: 4px;
        }
        .input-field {
            background: #f8fafd; border: 1px solid #dde3ea; border-radius: 16px;
            padding: 0.75rem 1.2rem; font-size: 0.95rem; font-family: 'Inter', sans-serif;
            width: 100%;
        }
        .input-field:focus {
            outline: none; border-color: #2f6e9e;
            box-shadow: 0 0 0 3px rgba(47,110,158,0.15); background: white;
        }
        .modal-actions {
            display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;
        }
        .toast-message {
            background: #1e4a6f; color: white; padding: 0.8rem 2rem;
            border-radius: 60px; font-weight: 500; box-shadow: 0 15px 30px rgba(0,40,70,0.4);
            position: fixed; bottom: 30px; right: 30px; z-index: 1100;
            opacity: 0; transform: translateY(10px); transition: 0.2s; pointer-events: none;
        }
        .toast-message.show { opacity: 1; transform: translateY(0); }
        /* 拜访/邮件模板等模态稍微加宽 */
        #visitModal .modal-card, #emailTemplateModal .modal-card, #quickActionModal .modal-card { max-width: 500px; }
        .visit-badge {
            font-size: 0.7rem; background: #f1f5f9; padding: 2px 8px; border-radius: 40px; margin-left: 8px;
        }
        #fileImport { display: none; }
    </style>
</head>
<body>
<div class="full-screen">
    <!-- 卡片：筛选栏 (完全分数变动风格) -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-filter"></i> 线索筛选
        </div>
        <div class="filter-bar">
            <div class="filter-item">
                <label><i class="fas fa-user"></i> 线索名称</label>
                <input type="text" class="filter-input" id="searchName" placeholder="输入名称">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-tag"></i> 线索状态</label>
                <select class="filter-select" id="searchStatus">
                    <option value="">全部</option>
                    <option value="新线索">新线索</option>
                    <option value="跟进中">跟进中</option>
                    <option value="已关闭">已关闭</option>
                </select>
            </div>
            <div class="filter-item">
                <label><i class="fas fa-user-tie"></i> 推荐人</label>
                <input type="text" class="filter-input" id="searchReferrer" placeholder="推荐人姓名">
            </div>
            <div class="filter-item" style="flex:0 1 auto;">
                <label><i class="fas fa-sliders"></i> 更多字段</label>
                <button class="btn btn-outline btn-sm" id="toggleAdvancedBtn"><i class="fa-regular fa-filter"></i> 高级</button>
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                <button class="btn btn-primary" id="searchBtn"><i class="fas fa-magnifying-glass"></i> 查询</button>
                <button class="btn btn-outline" id="exportBtn"><i class="fas fa-download"></i> 导出</button>
                <button class="btn btn-outline" id="cmsSyncBtn"><i class="fas fa-rotate"></i> 博达CMS溯源</button>
            </div>
        </div>

        <!-- 高级搜索区域 (同样融入卡片) -->
        <div class="advanced-search" id="advancedSearch">
            <div class="filter-item">
                <label>线索来源</label>
                <select class="filter-select" id="searchSource">
                    <option value="">全部</option>
                    <option value="博达CMS">博达CMS</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="filter-item">
                <label>创建起始</label>
                <input type="date" class="filter-input" id="searchStartDate">
            </div>
            <div class="filter-item">
                <label>创建结束</label>
                <input type="date" class="filter-input" id="searchEndDate">
            </div>
        </div>

        <div style="margin-top: 1.2rem; display: flex; gap: 16px; align-items: center;">
            <span class="badge-owner"><i class="fa-regular fa-user"></i> 当前负责人: 张明 (仅自己线索)</span>
            <span class="badge-owner"><i class="fa-regular fa-clock"></i> 溯源: 博达CMS标记</span>
        </div>
    </div>

    <!-- 第二张卡片：工具栏 + 线索表格 -->
    <div class="card" style="padding-bottom: 1.5rem;">
        <div class="section-title">
            <i class="fas fa-people-arrows"></i> 销售人员线索管理
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="toolbar-left">
                <button class="btn btn-primary" id="addSingleBtn"><i class="fa-regular fa-plus"></i> 单个录入</button>
                <button class="btn btn-outline" id="batchImportBtn"><i class="fa-regular fa-upload"></i> 批量导入</button>
                <input type="file" id="fileImport" accept=".csv, .txt, .xlsx">
                <a href="#" id="downloadTemplate" class="btn btn-outline"><i class="fa-regular fa-file-lines"></i> 模板</a>
            </div>
            <div class="toolbar-right">
                <span style="align-self: center; background: #eaf1f9; padding:0.3rem 1.2rem; border-radius:40px; font-size:0.8rem; font-weight:500;" id="selectedCount">0 选中</span>
                <button class="btn btn-outline" id="batchTransferBtn"><i class="fa-regular fa-share"></i> 批量转交</button>
                <button class="btn btn-outline" id="batchEmailBtn"><i class="fa-regular fa-envelope"></i> 批量邮件</button>
                <button class="btn btn-outline" id="batchCloseBtn"><i class="fa-regular fa-circle-xmark"></i> 批量关闭</button>
                <button class="btn btn-outline" id="quickBatchBtn"><i class="fa-regular fa-bolt"></i> 快速处理</button>
            </div>
        </div>

        <!-- 线索表格 -->
        <div class="table-wrapper">
            <table id="leadTable">
                <thead>
                    <tr>
                        <th class="checkbox-col"><input type="checkbox" id="selectAll"></th>
                        <th>线索名称</th>
                        <th>公司</th>
                        <th>推荐人 / 溯源</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>最近拜访</th>
                        <th>操作 (维护/拜访/快速/溯源)</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 动态渲染 -->
                </tbody>
            </table>
        </div>

        <!-- 分页组件 (修复闪烁，稳定渲染) -->
        <div class="pagination-bar" id="paginationContainer">
            <!-- 由js动态生成，但不再频繁setInterval，而是每次刷新表格时调用renderPagination -->
        </div>
        <div style="display: flex; justify-content: flex-end; margin-top: 0.5rem;">
            <span class="page-info" id="paginationInfo"></span>
        </div>
    </div>
</div>

<!-- 所有模态框改成 modal-overlay 结构，与分数变动风格统一 -->
<!-- 线索编辑/添加模态框 -->
<div class="modal-overlay" id="leadModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle">添加线索</h3>
            <button class="modal-close" id="modalCloseBtn">&times;</button>
        </div>
        <div class="input-group">
            <label><i class="fas fa-user"></i> 线索名称 *</label>
            <input type="text" class="input-field" id="leadName" placeholder="例：张三科技">
        </div>
        <div class="input-group">
            <label><i class="fas fa-building"></i> 公司</label>
            <input type="text" class="input-field" id="leadCompany" placeholder="例：云创网络">
        </div>
        <div class="input-group">
            <label><i class="fas fa-user-tie"></i> 推荐人</label>
            <input type="text" class="input-field" id="leadReferrer" placeholder="姓名 (博达CMS自动标记)">
        </div>
        <div class="input-group">
            <label><i class="fas fa-tag"></i> 状态</label>
            <select class="input-field" id="leadStatus">
                <option value="新线索">新线索</option>
                <option value="跟进中">跟进中</option>
                <option value="已关闭">已关闭</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="modalCancelBtn">取消</button>
            <button class="btn btn-primary" id="modalSaveBtn">保存线索</button>
        </div>
    </div>
</div>

<!-- 拜访记录模态框 -->
<div class="modal-overlay" id="visitModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>记录拜访</h3>
            <button class="modal-close" id="visitCloseBtn">&times;</button>
        </div>
        <div class="input-group">
            <label><i class="fas fa-comment"></i> 拜访内容</label>
            <textarea id="visitContent" rows="3" class="input-field" placeholder="沟通详情..."></textarea>
        </div>
        <div class="input-group">
            <label><i class="fas fa-calendar"></i> 下次跟进</label>
            <input type="date" class="input-field" id="visitNextDate">
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="visitCancelBtn">取消</button>
            <button class="btn btn-primary" id="visitSaveBtn">保存记录</button>
        </div>
    </div>
</div>

<!-- 转交模态框 -->
<div class="modal-overlay" id="transferModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>转交线索</h3>
            <button class="modal-close" id="transferCloseBtn">&times;</button>
        </div>
        <p id="transferLeadIds" style="margin-bottom:1rem; color:#475569;"></p>
        <div class="input-group">
            <label>转交给 (销售姓名)</label>
            <select class="input-field" id="transferOwner">
                <option value="李芳">李芳</option>
                <option value="王磊">王磊</option>
                <option value="赵敏">赵敏</option>
                <option value="陈晨">陈晨</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="transferCancelBtn">取消</button>
            <button class="btn btn-primary" id="transferConfirmBtn">确认转交</button>
        </div>
    </div>
</div>

<!-- 溯源模态框 -->
<div class="modal-overlay" id="traceModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>线索溯源</h3>
            <button class="modal-close" id="traceCloseBtn">&times;</button>
        </div>
        <div id="traceContent" style="padding: 0.5rem 0;">加载中...</div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="traceCloseAction">关闭</button>
        </div>
    </div>
</div>

<!-- 新增：批量邮件模板选择弹窗 -->
<div class="modal-overlay" id="emailTemplateModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3><i class="fa-regular fa-envelope"></i> 选择邮件模板</h3>
            <button class="modal-close" id="emailTemplateClose">&times;</button>
        </div>
        <div class="input-group">
            <label>邮件模板</label>
            <select class="input-field" id="emailTemplateSelect">
                <option value="标准跟进模板">标准跟进模板</option>
                <option value="产品介绍模板">产品介绍模板</option>
                <option value="活动邀请模板">活动邀请模板</option>
                <option value="节日问候模板">节日问候模板</option>
            </select>
        </div>
        <div class="input-group">
            <label>额外备注</label>
            <textarea class="input-field" rows="2" id="emailRemark" placeholder="可附加个性化内容..."></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="emailTemplateCancel">取消</button>
            <button class="btn btn-primary" id="emailTemplateConfirm">发送邮件</button>
        </div>
    </div>
</div>

<!-- 新增：快速处理弹窗 (批量标记/转换) -->
<div class="modal-overlay" id="quickActionModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3><i class="fa-regular fa-bolt"></i> 快速处理</h3>
            <button class="modal-close" id="quickActionClose">&times;</button>
        </div>
        <div class="input-group">
            <label>选择操作</label>
            <select class="input-field" id="quickActionSelect">
                <option value="markFollowup">标记为跟进中</option>
                <option value="markNew">标记为新线索</option>
                <option value="markClosed">标记为已关闭</option>
                <option value="batchConvert">批量转换为客户</option>
            </select>
        </div>
        <div class="input-group">
            <label>备注 (可选)</label>
            <input type="text" class="input-field" id="quickActionRemark" placeholder="例如：已初步沟通">
        </div>
        <div class="modal-actions">
            <button class="btn btn-outline" id="quickActionCancel">取消</button>
            <button class="btn btn-primary" id="quickActionConfirm">执行</button>
        </div>
    </div>
</div>

<div id="toast" class="toast-message">操作成功</div>

<script>
    (function() {
        // ---------- 数据 ----------
        let leadsData = [
            { id: 'L001', name: '云途科技', company: '云途科技', referrer: '王博 (博达CMS)', status: '新线索', createTime: '2025-02-10', owner: '张明', cmsSource: true, lastVisit: '' },
            { id: 'L002', name: '智创未来', company: '智创工作室', referrer: '李芳', status: '跟进中', createTime: '2025-02-14', owner: '张明', cmsSource: false, lastVisit: '2025-02-20 电话沟通' },
            { id: 'L003', name: '数海信息', company: '数海信息集团', referrer: '陈博达(博达推荐)', status: '新线索', createTime: '2025-02-18', owner: '张明', cmsSource: true, lastVisit: '' },
            { id: 'L004', name: '绿源农业', company: '绿源生态', referrer: '赵岩', status: '已关闭', createTime: '2025-01-22', owner: '张明', cmsSource: false, lastVisit: '' },
            { id: 'L005', name: '星耀传媒', company: '星耀传媒', referrer: '周瑾 (博达CMS)', status: '跟进中', createTime: '2025-02-20', owner: '张明', cmsSource: true, lastVisit: '2025-02-21 微信沟通' },
            { id: 'L006', name: '华诚咨询', company: '华诚咨询', referrer: '刘敏', status: '新线索', createTime: '2025-02-21', owner: '张明', cmsSource: false, lastVisit: '' },
            { id: 'L007', name: '百川电商', company: '百川网络', referrer: '徐汇博达', status: '跟进中', createTime: '2025-02-09', owner: '张明', cmsSource: true, lastVisit: '' },
            { id: 'L008', name: '非本人线索', company: '其他公司', referrer: '赵六', status: '新线索', createTime: '2025-02-01', owner: '李四', cmsSource: false, lastVisit: '' }
        ];

        const currentUser = '张明';
        let myLeads = leadsData.filter(lead => lead.owner === currentUser);
        let currentDisplayData = [...myLeads];

        // 分页设置
        let currentPage = 1;
        const pageSize = 5;

        // DOM 元素
        const tbody = document.getElementById('tableBody');
        const selectAllCheck = document.getElementById('selectAll');
        const selectedCountSpan = document.getElementById('selectedCount');
        const searchName = document.getElementById('searchName');
        const searchStatus = document.getElementById('searchStatus');
        const searchReferrer = document.getElementById('searchReferrer');
        const searchSource = document.getElementById('searchSource');
        const searchStartDate = document.getElementById('searchStartDate');
        const searchEndDate = document.getElementById('searchEndDate');
        const searchBtn = document.getElementById('searchBtn');
        const toggleAdvancedBtn = document.getElementById('toggleAdvancedBtn');
        const advancedSearch = document.getElementById('advancedSearch');
        const exportBtn = document.getElementById('exportBtn');
        const cmsSyncBtn = document.getElementById('cmsSyncBtn');
        const addSingleBtn = document.getElementById('addSingleBtn');
        const batchImportBtn = document.getElementById('batchImportBtn');
        const fileImport = document.getElementById('fileImport');
        const downloadTemplate = document.getElementById('downloadTemplate');
        const batchTransferBtn = document.getElementById('batchTransferBtn');
        const batchEmailBtn = document.getElementById('batchEmailBtn');
        const batchCloseBtn = document.getElementById('batchCloseBtn');
        const quickBatchBtn = document.getElementById('quickBatchBtn');
        const paginationInfo = document.getElementById('paginationInfo');
        const paginationContainer = document.getElementById('paginationContainer');

        // 模态框
        const leadModal = document.getElementById('leadModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalSaveBtn = document.getElementById('modalSaveBtn');
        const leadName = document.getElementById('leadName');
        const leadCompany = document.getElementById('leadCompany');
        const leadReferrer = document.getElementById('leadReferrer');
        const leadStatus = document.getElementById('leadStatus');

        const visitModal = document.getElementById('visitModal');
        const visitCloseBtn = document.getElementById('visitCloseBtn');
        const visitCancelBtn = document.getElementById('visitCancelBtn');
        const visitSaveBtn = document.getElementById('visitSaveBtn');
        const visitContent = document.getElementById('visitContent');
        const visitNextDate = document.getElementById('visitNextDate');

        const transferModal = document.getElementById('transferModal');
        const transferCloseBtn = document.getElementById('transferCloseBtn');
        const transferCancelBtn = document.getElementById('transferCancelBtn');
        const transferConfirmBtn = document.getElementById('transferConfirmBtn');
        const transferLeadIds = document.getElementById('transferLeadIds');
        const transferOwner = document.getElementById('transferOwner');

        const traceModal = document.getElementById('traceModal');
        const traceCloseBtn = document.getElementById('traceCloseBtn');
        const traceCloseAction = document.getElementById('traceCloseAction');
        const traceContent = document.getElementById('traceContent');

        // 新弹窗
        const emailTemplateModal = document.getElementById('emailTemplateModal');
        const emailTemplateClose = document.getElementById('emailTemplateClose');
        const emailTemplateCancel = document.getElementById('emailTemplateCancel');
        const emailTemplateConfirm = document.getElementById('emailTemplateConfirm');
        const emailTemplateSelect = document.getElementById('emailTemplateSelect');
        const emailRemark = document.getElementById('emailRemark');

        const quickActionModal = document.getElementById('quickActionModal');
        const quickActionClose = document.getElementById('quickActionClose');
        const quickActionCancel = document.getElementById('quickActionCancel');
        const quickActionConfirm = document.getElementById('quickActionConfirm');
        const quickActionSelect = document.getElementById('quickActionSelect');
        const quickActionRemark = document.getElementById('quickActionRemark');

        const toast = document.getElementById('toast');

        let editingId = null;
        let currentVisitLeadId = null;
        let transferIds = [];

        // 辅助函数
        function showToast(text, duration=2000) {
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }
        function generateId() { return 'L' + Date.now().toString().slice(-6) + Math.random().toString(36).substr(2,4); }

        // 过滤并分页
        function applySearchAndPage() {
            let filtered = myLeads.filter(lead => true);
            const nameVal = searchName.value.toLowerCase();
            const statusVal = searchStatus.value;
            const referrerVal = searchReferrer.value.toLowerCase();
            const sourceVal = searchSource.value;
            const startDate = searchStartDate.value;
            const endDate = searchEndDate.value;

            filtered = filtered.filter(lead => {
                if (nameVal && !lead.name.toLowerCase().includes(nameVal)) return false;
                if (statusVal && lead.status !== statusVal) return false;
                if (referrerVal && !(lead.referrer && lead.referrer.toLowerCase().includes(referrerVal))) return false;
                if (sourceVal) {
                    const isCms = lead.referrer && lead.referrer.toLowerCase().includes('博达');
                    if (sourceVal === '博达CMS' && !isCms) return false;
                    if (sourceVal === '其他' && isCms) return false;
                }
                if (startDate && lead.createTime < startDate) return false;
                if (endDate && lead.createTime > endDate) return false;
                return true;
            });

            const total = filtered.length;
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            currentDisplayData = filtered.slice(start, end);

            renderTable(currentDisplayData);
            const startDisplay = total === 0 ? 0 : start + 1;
            const endDisplay = Math.min(end, total);
            paginationInfo.innerText = total ? `第 ${currentPage} / ${Math.ceil(total/pageSize)} 页 · 显示 ${startDisplay}-${endDisplay} 条 / 共 ${total} 条` : '无数据';
            renderPagination(total); // 传入总条数
        }

        // 渲染表格 (操作图标区分颜色)
        function renderTable(data) {
            let html = '';
            data.forEach(lead => {
                const statusClass = lead.status === '新线索' ? 'status-new' : (lead.status === '跟进中' ? 'status-followup' : 'status-closed');
                const cmsBadge = lead.cmsSource ? '<span class="source-cms"><i class="fa-regular fa-link"></i> 博达CMS</span>' : '';
                const visitDisplay = lead.lastVisit ? `<span class="visit-badge">${lead.lastVisit.substring(0,10)}</span>` : '';
                html += `<tr data-id="${lead.id}">
                    <td class="checkbox-col"><input type="checkbox" class="row-checkbox" value="${lead.id}"></td>
                    <td><strong>${lead.name}</strong></td>
                    <td>${lead.company || ''}</td>
                    <td>${lead.referrer} ${cmsBadge}</td>
                    <td><span class="status-badge ${statusClass}">${lead.status}</span></td>
                    <td>${lead.createTime}</td>
                    <td>${visitDisplay ? lead.lastVisit : '—'}</td>
                    <td>
                        <div class="action-icons">
                            <i class="fa-regular fa-pen-to-square icon-edit" data-action="edit" data-id="${lead.id}" title="日常维护"></i>
                            <i class="fa-regular fa-calendar-check icon-visit" data-action="visit" data-id="${lead.id}" title="记录拜访"></i>
                            <div class="quick-menu">
                                <i class="fa-regular fa-bolt icon-quick" title="快速处理"></i>
                                <div class="dropdown-content">
                                    <a href="#" data-action="quickTransfer" data-id="${lead.id}"><i class="fa-regular fa-share"></i>转交</a>
                                    <a href="#" data-action="quickMail" data-id="${lead.id}"><i class="fa-regular fa-envelope"></i>发送邮件</a>
                                    <a href="#" data-action="quickClose" data-id="${lead.id}"><i class="fa-regular fa-circle-xmark"></i>关闭</a>
                                </div>
                            </div>
                            <i class="fa-regular fa-diagram-project icon-trace" data-action="trace" data-id="${lead.id}" title="线索溯源"></i>
                        </div>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const checked = document.querySelectorAll('.row-checkbox:checked').length;
            selectedCountSpan.innerText = checked + ' 选中';
            if (selectAllCheck) {
                selectAllCheck.checked = checked === document.querySelectorAll('.row-checkbox').length && checked > 0;
            }
        }

        function refreshDataAndRender() {
            myLeads = leadsData.filter(lead => lead.owner === currentUser);
            if (currentPage < 1) currentPage = 1;
            applySearchAndPage();
        }

        // 分页渲染，不再使用setInterval
        function renderPagination(totalItems) {
            const totalPages = Math.ceil(totalItems / pageSize);
            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }
            let html = `<button class="pagination-btn" ${currentPage===1?'disabled':''} onclick="window.pageGo(${currentPage-1})"><i class="fas fa-chevron-left"></i></button>`;
            for (let i=1; i<=totalPages; i++) {
                if (i===currentPage) html += `<span class="pagination-btn active">${i}</span>`;
                else html += `<button class="pagination-btn" onclick="window.pageGo(${i})">${i}</button>`;
            }
            html += `<button class="pagination-btn" ${currentPage===totalPages?'disabled':''} onclick="window.pageGo(${currentPage+1})"><i class="fas fa-chevron-right"></i></button>`;
            paginationContainer.innerHTML = html;
        }
        window.pageGo = function(page) {
            // 重新计算过滤后总条数
            let filtered = myLeads.filter(lead => {
                const nameVal = searchName.value.toLowerCase();
                const statusVal = searchStatus.value;
                const referrerVal = searchReferrer.value.toLowerCase();
                if (nameVal && !lead.name.toLowerCase().includes(nameVal)) return false;
                if (statusVal && lead.status !== statusVal) return false;
                if (referrerVal && !(lead.referrer && lead.referrer.toLowerCase().includes(referrerVal))) return false;
                return true;
            });
            const totalPages = Math.ceil(filtered.length / pageSize);
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            currentPage = page;
            applySearchAndPage(); // 内部会调用renderPagination
        };

        // 事件绑定
        selectAllCheck.addEventListener('change', function() {
            document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = selectAllCheck.checked);
            updateSelectedCount();
        });
        document.addEventListener('change', function(e) {
            if (e.target.classList.contains('row-checkbox')) updateSelectedCount();
        });

        searchBtn.addEventListener('click', function() { currentPage = 1; applySearchAndPage(); });

        toggleAdvancedBtn.addEventListener('click', function() {
            advancedSearch.style.display = advancedSearch.style.display === 'flex' ? 'none' : 'flex';
        });

        exportBtn.addEventListener('click', function() { /* 导出同前，略 */ 
            let filteredAll = myLeads.filter(lead => {
                const nameVal = searchName.value.toLowerCase();
                const statusVal = searchStatus.value;
                const referrerVal = searchReferrer.value.toLowerCase();
                const sourceVal = searchSource.value;
                if (nameVal && !lead.name.toLowerCase().includes(nameVal)) return false;
                if (statusVal && lead.status !== statusVal) return false;
                if (referrerVal && !(lead.referrer && lead.referrer.toLowerCase().includes(referrerVal))) return false;
                if (sourceVal) {
                    const isCms = lead.referrer && lead.referrer.toLowerCase().includes('博达');
                    if (sourceVal === '博达CMS' && !isCms) return false;
                    if (sourceVal === '其他' && isCms) return false;
                }
                return true;
            });
            if (filteredAll.length === 0) { showToast('没有数据可导出'); return; }
            const headers = ['线索名称','公司','推荐人','状态','创建时间','负责人','最近拜访'];
            const rows = filteredAll.map(l => [l.name, l.company||'', l.referrer||'', l.status, l.createTime, l.owner, l.lastVisit||'']);
            let csv = headers.join(',') + '\n' + rows.map(r => r.map(cell => `"${cell}"`).join(',')).join('\n');
            const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8;'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '线索导出.csv';
            link.click();
            showToast('导出成功');
        });

        cmsSyncBtn.addEventListener('click', function() {
            leadsData.forEach(l => { if (l.referrer && l.referrer.includes('博达')) l.cmsSource = true; });
            refreshDataAndRender();
            showToast('已同步博达CMS推荐人');
        });

        addSingleBtn.addEventListener('click', function() {
            editingId = null;
            modalTitle.innerText = '添加线索';
            leadName.value = ''; leadCompany.value = ''; leadReferrer.value = ''; leadStatus.value = '新线索';
            leadModal.classList.add('show');
        });

        batchImportBtn.addEventListener('click', () => fileImport.click());
        fileImport.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const text = ev.target.result;
                const lines = text.split('\n').filter(line => line.trim() !== '');
                const newLeads = [];
                lines.forEach((line, idx) => {
                    const parts = line.split(',').map(s => s.replace(/^"|"$/g, '').trim());
                    if (parts.length >= 3) {
                        const name = parts[0] || `导入客户${idx+1}`;
                        const company = parts[1] || '未知';
                        const referrer = parts[2] || '批量导入';
                        const status = parts[3] && ['新线索','跟进中','已关闭'].includes(parts[3]) ? parts[3] : '新线索';
                        const cmsSource = referrer.includes('博达');
                        newLeads.push({
                            id: generateId() + idx,
                            name, company, referrer, status,
                            createTime: new Date().toISOString().slice(0,10),
                            owner: '张明', cmsSource, lastVisit: ''
                        });
                    }
                });
                if (newLeads.length > 0) {
                    leadsData.push(...newLeads);
                    refreshDataAndRender();
                    showToast(`成功导入 ${newLeads.length} 条线索`);
                } else showToast('未解析到有效数据');
                fileImport.value = '';
            };
            reader.readAsText(file, 'UTF-8');
        });

        downloadTemplate.addEventListener('click', (e) => {
            e.preventDefault();
            const template = '线索名称,公司,推荐人,状态\n"示例客户A","XX科技","李博达(博达)","新线索"';
            const blob = new Blob(['\uFEFF' + template], {type: 'text/csv'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '导入模板.csv';
            link.click();
        });

        // 批量转交
        batchTransferBtn.addEventListener('click', () => {
            const checked = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb => cb.value);
            if (checked.length === 0) { showToast('至少选择一条线索'); return; }
            transferIds = checked;
            transferLeadIds.innerText = `已选择 ${checked.length} 条线索，将转交给：`;
            transferModal.classList.add('show');
        });

        // 操作委托
        document.addEventListener('click', function(e) {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            const action = target.dataset.action;
            const id = target.dataset.id;
            if (!id) return;
            const lead = leadsData.find(l => l.id === id);
            if (!lead || lead.owner !== currentUser) { showToast('只能操作自己负责的线索'); return; }

            if (action === 'edit') {
                editingId = id;
                modalTitle.innerText = '编辑线索';
                leadName.value = lead.name;
                leadCompany.value = lead.company || '';
                leadReferrer.value = lead.referrer || '';
                leadStatus.value = lead.status;
                leadModal.classList.add('show');
            } else if (action === 'visit') {
                currentVisitLeadId = id;
                visitContent.value = '';
                visitNextDate.value = '';
                visitModal.classList.add('show');
            } else if (action === 'quickTransfer') {
                e.preventDefault();
                transferIds = [id];
                transferLeadIds.innerText = `转交线索 ${id}`;
                transferModal.classList.add('show');
            } else if (action === 'quickMail') {
                e.preventDefault();
                // 打开邮件模板弹窗，并记录当前线索id用于后续发送（演示用单个）
                window.currentMailLeadId = id; // 简单存一下
                emailTemplateModal.classList.add('show');
            } else if (action === 'quickClose') {
                e.preventDefault();
                lead.status = '已关闭';
                refreshDataAndRender();
                showToast('线索已关闭');
            } else if (action === 'trace') {
                traceContent.innerHTML = `
                    <p><strong>线索名称：</strong> ${lead.name}</p>
                    <p><strong>推荐人：</strong> ${lead.referrer}</p>
                    <p><strong>博达CMS来源：</strong> ${lead.cmsSource ? '是' : '否'}</p>
                    <p><strong>创建时间：</strong> ${lead.createTime}</p>
                    <p><strong>最近拜访：</strong> ${lead.lastVisit || '无'}</p>
                    <p><small>点击“博达CMS溯源”同步信息。</small></p>
                `;
                traceModal.classList.add('show');
            }
        });

        // 保存线索
        modalSaveBtn.addEventListener('click', function() {
            const name = leadName.value.trim();
            if (!name) { showToast('请输入线索名称'); return; }
            if (editingId) {
                const lead = leadsData.find(l => l.id === editingId);
                if (lead) {
                    lead.name = name;
                    lead.company = leadCompany.value;
                    lead.referrer = leadReferrer.value;
                    lead.status = leadStatus.value;
                    lead.cmsSource = lead.referrer.toLowerCase().includes('博达');
                }
            } else {
                const newLead = {
                    id: generateId(),
                    name: name,
                    company: leadCompany.value,
                    referrer: leadReferrer.value || '手动录入',
                    status: leadStatus.value,
                    createTime: new Date().toISOString().slice(0,10),
                    owner: '张明',
                    cmsSource: leadReferrer.value.toLowerCase().includes('博达'),
                    lastVisit: ''
                };
                leadsData.push(newLead);
            }
            leadModal.classList.remove('show');
            refreshDataAndRender();
            showToast(editingId ? '线索已更新' : '线索已添加');
        });

        // 拜访保存
        visitSaveBtn.addEventListener('click', function() {
            if (!currentVisitLeadId) return;
            const lead = leadsData.find(l => l.id === currentVisitLeadId);
            if (lead) {
                const content = visitContent.value.trim() || '电话沟通';
                const date = visitNextDate.value || new Date().toISOString().slice(0,10);
                lead.lastVisit = `${date} ${content}`;
            }
            visitModal.classList.remove('show');
            refreshDataAndRender();
            showToast('拜访记录已保存');
        });

        // 转交确认
        transferConfirmBtn.addEventListener('click', function() {
            const newOwner = transferOwner.value;
            transferIds.forEach(id => {
                const lead = leadsData.find(l => l.id === id);
                if (lead && lead.owner === currentUser) lead.owner = newOwner;
            });
            transferModal.classList.remove('show');
            refreshDataAndRender();
            showToast(`已转交 ${transferIds.length} 条线索给 ${newOwner}`);
        });

        // 邮件模板弹窗确认
        emailTemplateConfirm.addEventListener('click', function() {
            const template = emailTemplateSelect.value;
            const remark = emailRemark.value;
            showToast(`已选择模板：“${template}” 备注：${remark || '无'}，邮件发送成功(模拟)`);
            emailTemplateModal.classList.remove('show');
            emailRemark.value = '';
        });

        // 快速处理弹窗确认
        quickActionConfirm.addEventListener('click', function() {
            const action = quickActionSelect.value;
            const remark = quickActionRemark.value;
            let msg = `执行操作：${action}，备注：${remark || '无'}`;
            // 针对选中的线索做处理（简化：批量操作选中行）
            const checked = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb => cb.value);
            if (checked.length === 0) { showToast('请至少选择一条线索'); quickActionModal.classList.remove('show'); return; }
            checked.forEach(id => {
                const lead = leadsData.find(l => l.id === id);
                if (lead && lead.owner === currentUser) {
                    if (action === 'markFollowup') lead.status = '跟进中';
                    else if (action === 'markNew') lead.status = '新线索';
                    else if (action === 'markClosed') lead.status = '已关闭';
                    // batchConvert 演示不实际转换
                }
            });
            refreshDataAndRender();
            showToast(msg + '，已更新状态');
            quickActionModal.classList.remove('show');
            quickActionRemark.value = '';
        });

        // 关闭模态通用
        function closeAllModals() {
            leadModal.classList.remove('show');
            visitModal.classList.remove('show');
            transferModal.classList.remove('show');
            traceModal.classList.remove('show');
            emailTemplateModal.classList.remove('show');
            quickActionModal.classList.remove('show');
        }
        modalCloseBtn.addEventListener('click', ()=>leadModal.classList.remove('show'));
        modalCancelBtn.addEventListener('click', ()=>leadModal.classList.remove('show'));
        visitCloseBtn.addEventListener('click', ()=>visitModal.classList.remove('show'));
        visitCancelBtn.addEventListener('click', ()=>visitModal.classList.remove('show'));
        transferCloseBtn.addEventListener('click', ()=>transferModal.classList.remove('show'));
        transferCancelBtn.addEventListener('click', ()=>transferModal.classList.remove('show'));
        traceCloseBtn.addEventListener('click', ()=>traceModal.classList.remove('show'));
        traceCloseAction.addEventListener('click', ()=>traceModal.classList.remove('show'));
        emailTemplateClose.addEventListener('click', ()=>emailTemplateModal.classList.remove('show'));
        emailTemplateCancel.addEventListener('click', ()=>emailTemplateModal.classList.remove('show'));
        quickActionClose.addEventListener('click', ()=>quickActionModal.classList.remove('show'));
        quickActionCancel.addEventListener('click', ()=>quickActionModal.classList.remove('show'));

        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) e.target.classList.remove('show');
        });

        // 批量邮件弹窗 (原先的batchEmailBtn)
        batchEmailBtn.addEventListener('click', ()=> {
            const checked = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb => cb.value);
            if (checked.length === 0) { showToast('至少选择一条线索'); return; }
            window.batchMailIds = checked; // 存储选中ID
            emailTemplateModal.classList.add('show');
        });

        // 批量关闭
        batchCloseBtn.addEventListener('click', ()=> {
            let checked = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb => cb.value);
            if(!checked.length) return showToast('至少选择一条线索');
            checked.forEach(id => { let lead = leadsData.find(l => l.id===id); if(lead && lead.owner===currentUser) lead.status='已关闭'; });
            refreshDataAndRender(); showToast(`已关闭 ${checked.length} 条线索`);
        });

        // 快速处理按钮打开弹窗
        quickBatchBtn.addEventListener('click', ()=> {
            const checked = document.querySelectorAll('.row-checkbox:checked').length;
            if (checked === 0) { showToast('至少选择一条线索'); return; }
            quickActionModal.classList.add('show');
        });

        // 初始化
        refreshDataAndRender();
    })();
</script>
</body>
</html>
