<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>研究生 · 课程考核方式管理（功能完善）</title>
    <!-- Inter 字体 + 图标库 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #eef3f8;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .full-screen {
            width: 100%;
            padding: 1.5rem 1.8rem;
            flex: 1;
        }
        @media (max-width: 640px) {
            .full-screen { padding: 1rem 1rem; }
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,20,40,0.08);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e9eef4;
            width: 100%;
        }
        @media (max-width: 640px) {
            .card { padding: 1.5rem 1.2rem; }
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 1.5rem;
        }
        .section-title i { color: #2f6e9e; font-size: 1.4rem; }

        /* 双tab导航 */
        .tab-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #dae2ec;
            padding-bottom: 0.2rem;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.6rem 1.8rem;
            font-size: 1rem;
            font-weight: 500;
            color: #52718e;
            border-radius: 40px 40px 0 0;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .tab-btn i { font-size: 0.95rem; }
        .tab-btn.active {
            background: #e1ebf7;
            color: #1d4a75;
            font-weight: 600;
            box-shadow: inset 0 -2px 0 #1e4a6f;
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* 筛选栏 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 170px;
            flex: 1 1 160px;
        }
        .filter-item label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
        }
        .filter-input, .filter-select {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.65rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn {
            border: none;
            background: transparent;
            font-weight: 500;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .btn-primary {
            background: #1e4a6f;
            color: white;
            box-shadow: 0 4px 10px rgba(0,60,110,0.2);
        }
        .btn-primary:hover { background: #123a58; transform: translateY(-2px); }
        .btn-outline {
            background: white;
            border-color: #cbd5e1;
            color: #2c455d;
        }
        .btn-outline:hover { background: #f1f7fd; border-color: #9bb0c5; }
        .btn-sm { padding: 0.45rem 1.2rem; font-size: 0.8rem; }

        .table-wrapper {
            border-radius: 20px;
            background: #ffffff;
            border: 1px solid #e2eaf3;
            overflow-x: auto;
            margin-top: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }
        th {
            text-align: left;
            padding: 1.2rem 1rem;
            background: #eaf1f9;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1d4b6e;
            text-transform: uppercase;
        }
        td {
            padding: 1rem 1rem;
            border-bottom: 1px solid #e3eaf2;
            vertical-align: middle;
        }
        .badge-type {
            background: #e3f0fa;
            color: #11517c;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
            margin: 0.2rem 0.1rem;
            white-space: nowrap;
        }
        .action-btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .icon-btn {
            background: none; border: none; font-size: 0.8rem; padding: 0.4rem 1rem;
            border-radius: 40px; cursor: pointer; color: #2a577b; background: #f2f8ff;
            display: inline-flex; align-items: center; gap: 0.4rem; border: 1px solid transparent;
        }
        .icon-btn:hover { background: #dae9f8; }
        .delete-btn:hover { background: #ffeae9; color: #b13e3e; }

        .pagination-bar {
            display: flex; justify-content: flex-end; align-items: center;
            gap: 0.5rem; margin-top: 1.8rem; flex-wrap: wrap;
        }
        .pagination-btn {
            background: white; border: 1px solid #c9d9eb; color: #1d4a6b;
            width: 38px; height: 38px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 500; cursor: pointer; transition: 0.1s;
        }
        .pagination-btn.active { background: #1e4a6f; border-color: #1e4a6f; color: white; }
        .pagination-btn:hover:not(.active) { background: #e5f0fb; }
        .page-info { color: #466585; margin-right: 0.8rem; font-size: 0.9rem; }

        /* 弹窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,20,40,0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-card {
            background: white; border-radius: 32px; width: 90%; max-width: 750px;
            padding: 2rem 2.2rem; box-shadow: 0 40px 70px rgba(0,20,50,0.4);
            transform: scale(0.95); transition: transform 0.2s ease;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.show .modal-card { transform: scale(1); }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-header h3 { font-size: 1.6rem; font-weight: 600; color: #0c2b48; }
        .modal-close {
            background: none; border: none; font-size: 2.2rem; cursor: pointer;
            color: #8ba5c2; line-height: 1;
        }
        .modal-close:hover { color: #1e3a5f; }
        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem 1.8rem;
        }
        .full-width { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .input-group label {
            font-weight: 600; font-size: 0.75rem; color: #4e6f8c; text-transform: uppercase;
            display: flex; align-items: center; gap: 4px;
        }
        .input-field {
            background: #f8fafd; border: 1px solid #dde3ea; border-radius: 16px;
            padding: 0.75rem 1.2rem; font-size: 0.95rem; font-family: 'Inter', sans-serif;
        }
        .input-field:focus {
            outline: none; border-color: #2f6e9e;
            box-shadow: 0 0 0 3px rgba(47,110,158,0.15); background: white;
        }
        .readonly-field { background: #ecf2f9; color: #2a4e6e; font-weight: 500; }
        .modal-actions {
            display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2.2rem;
        }
        .toast-message {
            background: #1e4a6f; color: white; padding: 0.8rem 2rem;
            border-radius: 60px; font-weight: 500; box-shadow: 0 15px 30px rgba(0,40,70,0.4);
            position: fixed; bottom: 30px; right: 30px; z-index: 1100;
            opacity: 0; transform: translateY(10px); transition: 0.2s; pointer-events: none;
        }
        .toast-message.show { opacity: 1; transform: translateY(0); }
        /* 多选提示 */
        .multi-hint { font-size:0.7rem; color:#4f7092; margin-top:4px; }
    </style>
</head>
<body>
<div class="full-screen">
    <!-- 双 Tab 切换 -->
    <div class="tab-bar">
        <button class="tab-btn active" id="tabAssessmentBtn"><i class="fas fa-list-ul"></i> 考核方式库</button>
        <button class="tab-btn" id="tabCourseBtn"><i class="fas fa-chalkboard-teacher"></i> 课程考核配置</button>
    </div>

    <!-- 考核方式库 Tab -->
    <div class="tab-pane active" id="assessmentPane">
        <div class="card" style="padding-bottom: 0.5rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.2rem;">
                <div class="section-title"><i class="fas fa-tag"></i> 考核方式基础库</div>
                <button class="btn btn-primary" id="openAddTypeModalBtn"><i class="fas fa-plus"></i> 新建考核方式</button>
            </div>
            <div class="table-wrapper">
                <table id="typeTable">
                    <thead><tr><th>方式名称</th><th>状态</th><th>操作</th></tr></thead>
                    <tbody id="typeTableBody"></tbody>
                </table>
            </div>
            <div class="pagination-bar" id="typePagination"></div>
        </div>
    </div>

    <!-- 课程考核配置 Tab (功能完善版) -->
    <div class="tab-pane" id="coursePane">
        <!-- 筛选卡片 -->
        <div class="card">
            <div class="filter-bar">
                <div class="filter-item">
                    <label><i class="fas fa-calendar-alt"></i> 开课学期</label>
                    <select class="filter-select" id="filterSemester">
                        <option value="">全部学期</option>
                        <option value="2025-2026-1">2025-2026-1</option>
                        <option value="2025-2026-2">2025-2026-2</option>
                        <option value="2026-2027-1">2026-2027-1</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label><i class="fas fa-book"></i> 课程名称</label>
                    <input type="text" class="filter-input" id="filterCourseName" placeholder="模糊搜索">
                </div>
                <div class="filter-item">
                    <label><i class="fas fa-chalkboard-teacher"></i> 授课教师</label>
                    <input type="text" class="filter-input" id="filterTeacher" placeholder="教师姓名">
                </div>
                <div class="filter-item">
                    <label><i class="fas fa-tasks"></i> 考核方式</label>
                    <select class="filter-select" id="filterAssessmentType">
                        <option value="">全部</option>
                    </select>
                </div>
                <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                    <button class="btn btn-outline" id="resetCourseFilterBtn"><i class="fas fa-undo"></i> 重置</button>
                    <button class="btn btn-primary" id="openAddCourseModalBtn"><i class="fas fa-plus-circle"></i> 新增配置</button>
                </div>
            </div>
        </div>
        <!-- 配置列表卡片 (操作按钮已完全绑定) -->
        <div class="card">
            <div class="section-title"><i class="fas fa-clipboard-list"></i> 课程考核方式配置</div>
            <div class="table-wrapper">
                <table id="courseTable">
                    <thead><tr><th>学期</th><th>课程代码</th><th>课程名称</th><th>授课教师</th><th>班级</th><th>考核方式</th><th>操作</th></tr></thead>
                    <tbody id="courseTableBody"></tbody>
                </table>
            </div>
            <div class="pagination-bar" id="coursePagination"></div>
        </div>
    </div>
</div>

<!-- 考核方式库 弹窗 -->
<div class="modal-overlay" id="typeModal">
    <div class="modal-card">
        <div class="modal-header"><h3 id="typeModalTitle"><i class="fas fa-pen"></i> 考核方式</h3><button class="modal-close" id="closeTypeModalBtn">&times;</button></div>
        <form id="typeForm" onsubmit="return false;">
            <div class="form-grid">
                <div class="input-group full-width">
                    <label><i class="fas fa-tag"></i> 方式名称 *</label>
                    <input type="text" class="input-field" id="typeName" required placeholder="例如：闭卷考试">
                </div>
                <div class="input-group full-width">
                    <label>状态</label>
                    <select class="input-field" id="typeStatus">
                        <option value="启用">启用</option>
                        <option value="禁用">禁用</option>
                    </select>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="cancelTypeModalBtn"><i class="fas fa-times"></i> 取消</button>
                <button type="submit" class="btn btn-primary" id="saveTypeBtn"><i class="fas fa-save"></i> 保存</button>
            </div>
        </form>
    </div>
</div>

<!-- 课程考核配置 弹窗 -->
<div class="modal-overlay" id="courseModal">
    <div class="modal-card">
        <div class="modal-header"><h3 id="courseModalTitle"><i class="fas fa-pen"></i> 配置考核方式</h3><button class="modal-close" id="closeCourseModalBtn">&times;</button></div>
        <form id="courseForm" onsubmit="return false;">
            <div class="form-grid">
                <div class="input-group"><label>学期 *</label><select id="modalSemester" class="input-field" required><option value="2025-2026-1">2025-2026-1</option><option value="2025-2026-2">2025-2026-2</option><option value="2026-2027-1">2026-2027-1</option></select></div>
                <div class="input-group"><label>课程代码</label><input type="text" class="input-field" id="modalCourseCode" placeholder="CS5001"></div>
                <div class="input-group full-width"><label>课程名称 *</label><input type="text" class="input-field" id="modalCourseName" required placeholder="高级机器学习"></div>
                <div class="input-group"><label>授课教师</label><input type="text" class="input-field" id="modalTeacher" placeholder="张教授"></div>
                <div class="input-group"><label>班级</label><input type="text" class="input-field" id="modalClass" placeholder="2024级硕士1班"></div>
                <div class="input-group full-width"><label>考核方式 (可多选) *</label>
                    <select class="input-field" id="modalAssessmentIds" multiple size="4" required></select>
                    <div class="multi-hint"><i class="fas fa-info-circle"></i> 按住 Ctrl (Mac: Cmd) 多选</div>
                </div>
                <div class="input-group full-width"><label>考核描述/备注</label><input type="text" class="input-field" id="modalDescription" placeholder="例如：闭卷70% + 项目30%"></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="cancelCourseModalBtn"><i class="fas fa-times"></i> 取消</button>
                <button type="submit" class="btn btn-primary" id="saveCourseBtn"><i class="fas fa-save"></i> 保存配置</button>
            </div>
        </form>
    </div>
</div>

<div id="toast" class="toast-message">操作成功</div>

<script>
    (function() {
        // ---------- 通用函数 ----------
        const toast = document.getElementById('toast');
        function showToast(text) { toast.textContent = text; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1500); }
        function generateId() { return Date.now() + '-' + Math.random().toString(36).substr(2,8); }
        function escapeHtml(unsafe) { if (!unsafe) return ''; return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

        // ========= 1. 考核方式库数据 =========
        let assessmentTypes = [
            { id: 't1', name: '闭卷考试', status: '启用' },
            { id: 't2', name: '开卷考试', status: '启用' },
            { id: 't3', name: '课程论文', status: '启用' },
            { id: 't4', name: '项目答辩', status: '启用' },
            { id: 't5', name: '研究报告', status: '禁用' },
            { id: 't6', name: '实验操作', status: '启用' }
        ];

        // ========= 2. 课程考核配置数据 =========
        let courseAssessments = [
            { id: 'c1', semester: '2025-2026-1', courseCode: 'CS6101', courseName: '高级机器学习', teacher: '张教授', className: '2024级学硕', assessmentTypeIds: ['t1','t3'], description: '闭卷+论文' },
            { id: 'c2', semester: '2025-2026-1', courseCode: 'CS6102', courseName: '自然语言处理', teacher: '李研究员', className: '2024级专硕', assessmentTypeIds: ['t2','t6'], description: '开卷+实验' },
            { id: 'c3', semester: '2025-2026-2', courseCode: 'MA6003', courseName: '数值分析', teacher: '王教授', className: '2024级博士', assessmentTypeIds: ['t1'], description: '闭卷' },
            { id: 'c4', semester: '2025-2026-2', courseCode: 'CS6205', courseName: '计算机视觉', teacher: '赵老师', className: '2024级学硕', assessmentTypeIds: ['t4','t5'], description: '项目+报告' },
            { id: 'c5', semester: '2026-2027-1', courseCode: 'EE5002', courseName: '论文写作', teacher: '陈教授', className: '2025级硕士', assessmentTypeIds: ['t3'], description: '课程论文' }
        ];

        // 当前编辑ID
        let editingTypeId = null, editingCourseId = null;

        // 筛选相关 (课程配置)
        let courseFilters = { semester: '', courseName: '', teacher: '', assessmentType: '' };

        // ----- Tab 切换 -----
        const tabAssessment = document.getElementById('tabAssessmentBtn');
        const tabCourse = document.getElementById('tabCourseBtn');
        const paneAssessment = document.getElementById('assessmentPane');
        const paneCourse = document.getElementById('coursePane');
        tabAssessment.addEventListener('click', ()=>{
            tabAssessment.classList.add('active'); tabCourse.classList.remove('active');
            paneAssessment.classList.add('active'); paneCourse.classList.remove('active');
            renderTypeTable(); renderTypePagination();
        });
        tabCourse.addEventListener('click', ()=>{
            tabCourse.classList.add('active'); tabAssessment.classList.remove('active');
            paneCourse.classList.add('active'); paneAssessment.classList.remove('active');
            populateAssessmentFilterAndSelects();  // 刷新下拉框
            renderCourseTable(); renderCoursePagination();
        });

        // ----- 考核方式库渲染与操作 -----
        function renderTypeTable() {
            const tbody = document.getElementById('typeTableBody');
            let html = '';
            assessmentTypes.forEach(t => {
                html += `<tr><td><span class="badge-type" style="background:#e0f0fa;">${escapeHtml(t.name)}</span></td>
                <td>${t.status === '启用' ? '<span style="color:#1b7c47;">🟢 启用</span>' : '<span style="color:#a13d3d;">⚪ 禁用</span>'}</td>
                <td><div class="action-btns">
                    <button class="icon-btn" onclick="window.editTypeHandler('${t.id}')"><i class="fas fa-pen"></i>编辑</button>
                    <button class="icon-btn delete-btn" onclick="window.deleteTypeHandler('${t.id}')"><i class="fas fa-trash"></i>删除</button>
                </div></td></tr>`;
            });
            tbody.innerHTML = html || `<tr><td colspan="3" style="text-align:center;">暂无考核方式</td></tr>`;
        }
        function renderTypePagination() { 
            document.getElementById('typePagination').innerHTML = '<span class="page-info">共 ' + assessmentTypes.length + ' 条</span>';
        }

        window.deleteTypeHandler = (id) => {
            if (confirm('删除考核方式可能影响已有配置，确定吗？')) {
                assessmentTypes = assessmentTypes.filter(t => t.id !== id);
                // 从课程配置中移除对应的考核方式ID（避免空引用）
                courseAssessments.forEach(c => {
                    c.assessmentTypeIds = c.assessmentTypeIds.filter(tid => tid !== id);
                });
                showToast('已删除');
                renderTypeTable(); renderTypePagination();
                if (paneCourse.classList.contains('active')) { 
                    populateAssessmentFilterAndSelects(); 
                    renderCourseTable(); renderCoursePagination(); 
                }
            }
        };
        window.editTypeHandler = (id) => {
            const item = assessmentTypes.find(t => t.id === id);
            if (!item) return;
            editingTypeId = id;
            document.getElementById('typeModalTitle').innerHTML = '<i class="fas fa-edit"></i> 编辑考核方式';
            document.getElementById('typeName').value = item.name;
            document.getElementById('typeStatus').value = item.status;
            document.getElementById('typeModal').classList.add('show');
        };

        document.getElementById('openAddTypeModalBtn').addEventListener('click', ()=>{
            editingTypeId = null;
            document.getElementById('typeModalTitle').innerHTML = '<i class="fas fa-plus"></i> 新增考核方式';
            document.getElementById('typeName').value = '';
            document.getElementById('typeStatus').value = '启用';
            document.getElementById('typeModal').classList.add('show');
        });

        document.getElementById('typeForm').addEventListener('submit', (e)=>{
            e.preventDefault();
            const name = document.getElementById('typeName').value.trim();
            if (!name) { showToast('请输入方式名称'); return; }
            const status = document.getElementById('typeStatus').value;
            if (editingTypeId) {
                const idx = assessmentTypes.findIndex(t => t.id === editingTypeId);
                if (idx !== -1) { assessmentTypes[idx].name = name; assessmentTypes[idx].status = status; }
                showToast('已更新');
            } else {
                const newType = { id: generateId(), name, status };
                assessmentTypes.push(newType);
                showToast('已添加');
            }
            closeTypeModal();
            renderTypeTable(); renderTypePagination();
            if (paneCourse.classList.contains('active')) populateAssessmentFilterAndSelects();
        });

        function closeTypeModal() { document.getElementById('typeModal').classList.remove('show'); editingTypeId = null; }
        document.getElementById('closeTypeModalBtn').addEventListener('click', closeTypeModal);
        document.getElementById('cancelTypeModalBtn').addEventListener('click', closeTypeModal);

        // ----- 课程配置模块：完善操作功能 (编辑/删除全部绑定) -----

        // 填充考核方式下拉 (筛选框 + 弹窗多选)
        function populateAssessmentFilterAndSelects() {
            const filterSelect = document.getElementById('filterAssessmentType');
            const modalSelect = document.getElementById('modalAssessmentIds');
            const enabledTypes = assessmentTypes.filter(t => t.status === '启用');
            filterSelect.innerHTML = '<option value="">全部</option>' + enabledTypes.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
            modalSelect.innerHTML = enabledTypes.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
        }

        // 获取过滤后的课程配置 (无分页)
        function getFilteredCourses() {
            return courseAssessments.filter(c => {
                if (courseFilters.semester && c.semester !== courseFilters.semester) return false;
                if (courseFilters.courseName && !c.courseName.toLowerCase().includes(courseFilters.courseName.toLowerCase())) return false;
                if (courseFilters.teacher && !c.teacher.toLowerCase().includes(courseFilters.teacher.toLowerCase())) return false;
                if (courseFilters.assessmentType) {
                    if (!c.assessmentTypeIds.includes(courseFilters.assessmentType)) return false;
                }
                return true;
            });
        }

        // 分页逻辑
        let coursePage = 1;
        const pageSize = 5;
        function getPaginatedCourses() {
            const filtered = getFilteredCourses();
            const start = (coursePage-1)*pageSize;
            return filtered.slice(start, start+pageSize);
        }
        function totalCoursePages() {
            return Math.ceil(getFilteredCourses().length / pageSize);
        }

        // 渲染表格主体 (带操作按钮)
        function renderCourseTable() {
            const paginated = getPaginatedCourses();
            const tbody = document.getElementById('courseTableBody');
            let html = '';
            paginated.forEach(c => {
                const typeNames = c.assessmentTypeIds.map(id => {
                    const found = assessmentTypes.find(t => t.id === id);
                    return found ? found.name : id;
                }).join(' · ');
                html += `<tr>
                    <td>${escapeHtml(c.semester)}</td>
                    <td>${escapeHtml(c.courseCode || '—')}</td>
                    <td>${escapeHtml(c.courseName)}</td>
                    <td>${escapeHtml(c.teacher || '—')}</td>
                    <td>${escapeHtml(c.className || '—')}</td>
                    <td><span class="badge-type" style="background:#d9f0f7;">${escapeHtml(typeNames) || '未配置'}</span></td>
                    <td><div class="action-btns">
                        <button class="icon-btn" onclick="window.editCourseHandler('${c.id}')"><i class="fas fa-pen"></i>编辑</button>
                        <button class="icon-btn delete-btn" onclick="window.deleteCourseHandler('${c.id}')"><i class="fas fa-trash"></i>删除</button>
                    </div></td></tr>`;
            });
            tbody.innerHTML = html || '<tr><td colspan="7" style="text-align:center; padding:2rem;">暂无课程考核配置</td></tr>';
        }

        // 删除课程配置
        window.deleteCourseHandler = (id) => {
            if (confirm('删除该课程考核配置？')) {
                courseAssessments = courseAssessments.filter(c => c.id !== id);
                // 如果当前页没数据了，回到上一页
                if (getPaginatedCourses().length === 0 && coursePage > 1) coursePage--;
                showToast('配置已删除');
                renderCourseTable();
                renderCoursePagination();
            }
        };

        // 编辑课程配置
        window.editCourseHandler = (id) => {
            const item = courseAssessments.find(c => c.id === id);
            if (!item) return;
            editingCourseId = id;
            document.getElementById('courseModalTitle').innerHTML = '<i class="fas fa-edit"></i> 编辑配置';
            document.getElementById('modalSemester').value = item.semester;
            document.getElementById('modalCourseCode').value = item.courseCode || '';
            document.getElementById('modalCourseName').value = item.courseName;
            document.getElementById('modalTeacher').value = item.teacher || '';
            document.getElementById('modalClass').value = item.className || '';
            document.getElementById('modalDescription').value = item.description || '';
            // 设置多选下拉选中项
            const select = document.getElementById('modalAssessmentIds');
            Array.from(select.options).forEach(opt => {
                opt.selected = item.assessmentTypeIds.includes(opt.value);
            });
            document.getElementById('courseModal').classList.add('show');
        };

        // 新增配置
        document.getElementById('openAddCourseModalBtn').addEventListener('click', ()=>{
            editingCourseId = null;
            document.getElementById('courseModalTitle').innerHTML = '<i class="fas fa-plus"></i> 新增配置';
            document.getElementById('modalSemester').value = '2025-2026-1';
            document.getElementById('modalCourseCode').value = '';
            document.getElementById('modalCourseName').value = '';
            document.getElementById('modalTeacher').value = '';
            document.getElementById('modalClass').value = '';
            document.getElementById('modalDescription').value = '';
            const select = document.getElementById('modalAssessmentIds');
            Array.from(select.options).forEach(opt => opt.selected = false);
            document.getElementById('courseModal').classList.add('show');
        });

        // 保存课程配置
        document.getElementById('courseForm').addEventListener('submit', (e)=>{
            e.preventDefault();
            const semester = document.getElementById('modalSemester').value;
            const courseName = document.getElementById('modalCourseName').value.trim();
            if (!semester || !courseName) { showToast('学期和课程名称为必填'); return; }
            const selectedIds = Array.from(document.getElementById('modalAssessmentIds').selectedOptions).map(o => o.value);
            if (selectedIds.length === 0) { showToast('请至少选择一个考核方式'); return; }

            const courseData = {
                semester,
                courseCode: document.getElementById('modalCourseCode').value,
                courseName,
                teacher: document.getElementById('modalTeacher').value,
                className: document.getElementById('modalClass').value,
                assessmentTypeIds: selectedIds,
                description: document.getElementById('modalDescription').value
            };
            if (editingCourseId) {
                const idx = courseAssessments.findIndex(c => c.id === editingCourseId);
                if (idx !== -1) { courseAssessments[idx] = { ...courseAssessments[idx], ...courseData }; }
                showToast('已更新');
            } else {
                const newCourse = { id: generateId(), ...courseData };
                courseAssessments.push(newCourse);
                showToast('已添加');
                // 跳转到最后一页
                coursePage = Math.ceil(getFilteredCourses().length / pageSize);
            }
            closeCourseModal();
            renderCourseTable();
            renderCoursePagination();
        });

        function closeCourseModal() { document.getElementById('courseModal').classList.remove('show'); editingCourseId = null; }
        document.getElementById('closeCourseModalBtn').addEventListener('click', closeCourseModal);
        document.getElementById('cancelCourseModalBtn').addEventListener('click', closeCourseModal);

        // 筛选相关
        const filterSemester = document.getElementById('filterSemester');
        const filterCourseName = document.getElementById('filterCourseName');
        const filterTeacher = document.getElementById('filterTeacher');
        const filterAssessmentType = document.getElementById('filterAssessmentType');
        function applyCourseFilter() {
            courseFilters.semester = filterSemester.value;
            courseFilters.courseName = filterCourseName.value;
            courseFilters.teacher = filterTeacher.value;
            courseFilters.assessmentType = filterAssessmentType.value;
            coursePage = 1;
            renderCourseTable();
            renderCoursePagination();
        }
        filterSemester.addEventListener('change', applyCourseFilter);
        filterCourseName.addEventListener('input', applyCourseFilter);
        filterTeacher.addEventListener('input', applyCourseFilter);
        filterAssessmentType.addEventListener('change', applyCourseFilter);

        document.getElementById('resetCourseFilterBtn').addEventListener('click', ()=>{
            filterSemester.value = ''; filterCourseName.value = ''; filterTeacher.value = ''; filterAssessmentType.value = '';
            courseFilters = { semester: '', courseName: '', teacher: '', assessmentType: '' };
            coursePage = 1;
            renderCourseTable(); renderCoursePagination();
        });

        // 分页控件
        function renderCoursePagination() {
            const total = totalCoursePages();
            if (total <= 1) {
                document.getElementById('coursePagination').innerHTML = `<span class="page-info">共 ${getFilteredCourses().length} 条</span>`;
                return;
            }
            let html = `<span class="page-info">第 ${coursePage} / ${total} 页</span>`;
            html += `<button class="pagination-btn" ${coursePage<=1?'disabled':''} onclick="window.changeCoursePage(${coursePage-1})"><i class="fas fa-chevron-left"></i></button>`;
            for (let i=1; i<=total; i++) {
                html += `<button class="pagination-btn ${i===coursePage?'active':''}" onclick="window.changeCoursePage(${i})">${i}</button>`;
            }
            html += `<button class="pagination-btn" ${coursePage>=total?'disabled':''} onclick="window.changeCoursePage(${coursePage+1})"><i class="fas fa-chevron-right"></i></button>`;
            document.getElementById('coursePagination').innerHTML = html;
        }
        window.changeCoursePage = (page) => {
            const total = totalCoursePages();
            if (page < 1) page = 1;
            if (page > total) page = total;
            if (page === coursePage) return;
            coursePage = page;
            renderCourseTable();
            renderCoursePagination();
        };

        // 初始化
        renderTypeTable(); renderTypePagination();
        populateAssessmentFilterAndSelects();
        renderCourseTable(); renderCoursePagination();

        // 点击遮罩关闭
        document.getElementById('typeModal').addEventListener('click', (e) => { if(e.target === document.getElementById('typeModal')) closeTypeModal(); });
        document.getElementById('courseModal').addEventListener('click', (e) => { if(e.target === document.getElementById('courseModal')) closeCourseModal(); });
    })();
</script>
</body>
</html>
