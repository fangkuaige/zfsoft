<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>研究生班级活动管理 · 完整功能</title>
    <!-- Inter 字体 + 图标库 (与参考文件完全一致) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== 全局重置 & 字体 ===== 完全沿用参考风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #eef3f8;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 全屏容器 (移除头部导航) */
        .full-screen {
            width: 100%;
            padding: 1.5rem 1.8rem;
            flex: 1;
        }

        @media (max-width: 640px) {
            .full-screen { padding: 1rem 1rem; }
        }

        /* 卡片样式 (磨砂白/圆角/细腻阴影) */
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0, 20, 40, 0.08);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e9eef4;
            width: 100%;
        }

        @media (max-width: 640px) {
            .card { padding: 1.5rem 1.2rem; }
        }

        /* 区域标题 */
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 1.5rem;
        }

        .section-title i { color: #2f6e9e; font-size: 1.4rem; }

        /* ===== 筛选栏 ===== 四个筛选项 + 按钮 */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
            margin-bottom: 0.2rem; /* 微调 */
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 160px;
            flex: 1 1 160px;
        }

        .filter-item label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
        }

        .filter-input, .filter-select {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.65rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
            transition: all 0.1s;
        }

        .filter-input:focus {
            outline: none;
            border-color: #2f6e9e;
            box-shadow: 0 0 0 3px rgba(47, 110, 158, 0.15);
            background: #ffffff;
        }

        /* 按钮样式 (与参考文件一致) */
        .btn {
            border: none;
            background: transparent;
            font-weight: 500;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .btn-primary {
            background: #1e4a6f;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 60, 110, 0.2);
        }

        .btn-primary:hover { background: #123a58; transform: translateY(-2px); }

        .btn-outline {
            background: white;
            border-color: #cbd5e1;
            color: #2c455d;
        }

        .btn-outline:hover { background: #f1f7fd; border-color: #9bb0c5; }

        .btn-sm { padding: 0.45rem 1.2rem; font-size: 0.8rem; }

        /* ===== 表格区域 ===== (支持横向滚动) */
        .table-wrapper {
            border-radius: 20px;
            background: #ffffff;
            border: 1px solid #e2eaf3;
            overflow-x: auto;
            margin-top: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px; /* 保证五个字段可见 */
        }

        th {
            text-align: left;
            padding: 1.2rem 1rem;
            background: #eaf1f9;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1d4b6e;
            text-transform: uppercase;
        }

        td {
            padding: 1rem 1rem;
            border-bottom: 1px solid #e3eaf2;
            vertical-align: middle;
        }

        .activity-name {
            font-weight: 600;
            color: #0b2b40;
        }

        .class-badge {
            background: #e3f0fa;
            color: #11517c;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .address-text {
            background: #eef4f9;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            display: inline-block;
            color: #1f4a6f;
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 0.8rem;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            cursor: pointer;
            color: #2a577b;
            background: #f2f8ff;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid transparent;
            transition: 0.1s;
        }

        .icon-btn:hover { background: #dae9f8; }
        .delete-btn:hover { background: #ffeae9; color: #b13e3e; }

        /* ===== 分页 ===== */
        .pagination-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.8rem;
            flex-wrap: wrap;
        }

        .pagination-btn {
            background: white;
            border: 1px solid #c9d9eb;
            color: #1d4a6b;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
        }

        .pagination-btn.active {
            background: #1e4a6f;
            border-color: #1e4a6f;
            color: white;
        }

        .pagination-btn:hover:not(.active) { background: #e5f0fb; }
        .page-info {
            color: #466585;
            margin-right: 0.8rem;
            font-size: 0.9rem;
        }

        /* ===== 弹窗 (新增/编辑) ===== 完全复用参考风格 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 20, 40, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .modal-overlay.show {
            visibility: visible;
            opacity: 1;
        }

        .modal-card {
            background: white;
            border-radius: 32px;
            width: 90%;
            max-width: 600px;  /* 适应三个主要字段 */
            padding: 2rem 2.2rem;
            box-shadow: 0 40px 70px rgba(0, 20, 50, 0.4);
            transform: scale(0.95);
            transition: transform 0.2s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.show .modal-card { transform: scale(1); }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h3 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0c2b48;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 2.2rem;
            cursor: pointer;
            color: #8ba5c2;
            line-height: 1;
        }

        .modal-close:hover { color: #1e3a5f; }

        /* 表单网格 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem 1.8rem;
        }

        .full-width { grid-column: span 2; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.75rem;
            color: #4e6f8c;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .input-field {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.75rem 1.2rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
        }

        .input-field:focus {
            outline: none;
            border-color: #2f6e9e;
            box-shadow: 0 0 0 3px rgba(47, 110, 158, 0.15);
            background: white;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2.2rem;
        }

        /* Toast 通知 */
        .toast-message {
            background: #1e4a6f;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 500;
            box-shadow: 0 15px 30px rgba(0, 40, 70, 0.4);
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1100;
            opacity: 0;
            transform: translateY(10px);
            transition: 0.2s;
            pointer-events: none;
        }

        .toast-message.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
<div class="full-screen">
    <!-- 卡片：筛选栏 + 新增按钮 (完全满足查询条件: 活动名称、班级、地址) -->
    <div class="card">
        <div class="filter-bar">
            <div class="filter-item">
                <label><i class="fas fa-tag"></i> 活动名称</label>
                <input type="text" class="filter-input" id="filterActivityName" placeholder="输入活动名称" autocomplete="off">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-users"></i> 活动班级</label>
                <input type="text" class="filter-input" id="filterClass" placeholder="例如 硕士2201">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-location-dot"></i> 活动地址</label>
                <input type="text" class="filter-input" id="filterAddress" placeholder="地址关键词">
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                <button class="btn btn-outline" id="resetFilterBtn"><i class="fas fa-undo"></i> 重置</button>
                <button class="btn btn-primary" id="openAddModalBtn"><i class="fas fa-plus-circle"></i> 新增活动</button>
            </div>
        </div>
    </div>

    <!-- 班级活动列表卡片 -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-calendar-check"></i> 班级活动列表
        </div>
        <div class="table-wrapper">
            <table id="activityTable">
                <thead>
                    <tr>
                        <th>活动名称</th>
                        <th>活动班级</th>
                        <th>活动地址</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <!-- 分页组件 -->
        <div class="pagination-bar" id="paginationContainer"></div>
    </div>
</div>

<!-- 新增/编辑 活动弹窗 (字段: 活动名称, 班级, 地址, 创建时间只读) -->
<div class="modal-overlay" id="activityModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle"><i class="fas fa-pen"></i> 班级活动</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <form id="activityForm" onsubmit="return false;">
            <div class="form-grid">
                <!-- 活动名称 必填 -->
                <div class="input-group full-width">
                    <label><i class="fas fa-tag"></i> 活动名称 *</label>
                    <input type="text" class="input-field" id="modalActivityName" required placeholder="例如：春季学术沙龙">
                </div>
                <!-- 活动班级 必填 (可输入多个班级, 如用逗号分隔) -->
                <div class="input-group full-width">
                    <label><i class="fas fa-users"></i> 活动班级 *</label>
                    <input type="text" class="input-field" id="modalClass" required placeholder="硕士2201, 博士2302">
                </div>
                <!-- 活动地址 必填 -->
                <div class="input-group full-width">
                    <label><i class="fas fa-location-dot"></i> 活动地址 *</label>
                    <input type="text" class="input-field" id="modalAddress" required placeholder="逸夫楼 A302">
                </div>
                <!-- 创建时间 (只读, 由系统生成) -->
                <div class="input-group full-width">
                    <label><i class="fas fa-clock"></i> 创建时间</label>
                    <input type="text" class="input-field readonly-field" id="modalCreateTime" readonly value="自动生成">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="modalCancelBtn"><i class="fas fa-times"></i> 取消</button>
                <button type="submit" class="btn btn-primary" id="modalSaveBtn"><i class="fas fa-save"></i> 保存活动</button>
            </div>
        </form>
    </div>
</div>

<div id="toast" class="toast-message">操作成功</div>

<script>
    (function() {
        // ---------- 模拟初始数据 (研究生班级活动) ----------
        let activities = [
            { id: 'act1', activityName: '学术论文写作交流会', className: '硕士2201,博士2301', address: '图书馆报告厅', createTime: '2026-03-12 14:30' },
            { id: 'act2', activityName: '春游踏青', className: '硕士2302,硕士2303', address: '颐和园', createTime: '2026-03-11 09:20' },
            { id: 'act3', activityName: '就业经验分享会', className: '硕士2202', address: '线上腾讯会议', createTime: '2026-03-10 16:00' },
            { id: 'act4', activityName: '实验室安全培训', className: '博士2201,博士2202', address: '理化楼 203', createTime: '2026-03-09 11:15' },
            { id: 'act5', activityName: '心理健康讲座', className: '全体研究生', address: '学生活动中心', createTime: '2026-03-08 10:10' },
            { id: 'act6', activityName: '篮球友谊赛', className: '硕士2301,硕士2302', address: '西区体育馆', createTime: '2026-03-07 08:45' },
            { id: 'act7', activityName: '毕业论文进度汇报', className: '博士2101', address: '教学三楼 301', createTime: '2026-03-06 13:30' },
            { id: 'act8', activityName: '职业规划工作坊', className: '硕士2203', address: '职业发展中心', createTime: '2026-03-05 09:00' },
        ];

        // 分页配置
        const pageSize = 5;
        let currentPage = 1;

        // 筛选条件对象 (三个字段)
        let filters = {
            activityName: '',
            className: '',
            address: ''
        };

        // DOM 元素
        const tbody = document.getElementById('tableBody');
        const toast = document.getElementById('toast');
        const paginationContainer = document.getElementById('paginationContainer');
        const filterActivityName = document.getElementById('filterActivityName');
        const filterClass = document.getElementById('filterClass');
        const filterAddress = document.getElementById('filterAddress');
        const resetFilterBtn = document.getElementById('resetFilterBtn');
        const openAddModalBtn = document.getElementById('openAddModalBtn');

        // 弹窗元素
        const modal = document.getElementById('activityModal');
        const modalTitle = document.getElementById('modalTitle');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalSaveBtn = document.getElementById('modalSaveBtn');
        const modalForm = document.getElementById('activityForm');
        const modalActivityName = document.getElementById('modalActivityName');
        const modalClass = document.getElementById('modalClass');
        const modalAddress = document.getElementById('modalAddress');
        const modalCreateTime = document.getElementById('modalCreateTime');

        // 当前编辑的ID (null 表示新增)
        let editingId = null;

        // ---------- 辅助函数 ----------
        function showToast(text, duration = 2000) {
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        function generateId() {
            return 'act_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        }

        // 简单的转义 (防止XSS)
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // 格式化创建时间显示 (已有的保留，没有则生成当前时间)
        function formatCreateTime(timeStr) {
            if (timeStr && timeStr !== '自动生成') return timeStr;
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hour = String(now.getHours()).padStart(2, '0');
            const minute = String(now.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day} ${hour}:${minute}`;
        }

        // 获取当前时间字符串 (用于新增)
        function getCurrentTimeStr() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hour = String(now.getHours()).padStart(2, '0');
            const minute = String(now.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day} ${hour}:${minute}`;
        }

        // ---------- 筛选逻辑 ----------
        function getFilteredList() {
            return activities.filter(item => {
                // 活动名称模糊 (大小写不敏感)
                if (filters.activityName && !item.activityName.toLowerCase().includes(filters.activityName.toLowerCase())) return false;
                // 活动班级模糊 (多个班级时只要部分匹配就算)
                if (filters.className && !item.className.toLowerCase().includes(filters.className.toLowerCase())) return false;
                // 地址模糊
                if (filters.address && !item.address.toLowerCase().includes(filters.address.toLowerCase())) return false;
                return true;
            });
        }

        function getPaginated() {
            const filtered = getFilteredList();
            const start = (currentPage - 1) * pageSize;
            return filtered.slice(start, start + pageSize);
        }

        function totalPages() {
            return Math.ceil(getFilteredList().length / pageSize);
        }

        function goToPage(page) {
            const total = totalPages();
            if (page < 1) page = 1;
            if (total > 0 && page > total) page = total;
            if (page === currentPage) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }

        // 挂载到window供分页按钮调用
        window.pageGo = goToPage;

        // ---------- 渲染表格 ----------
        function renderTable() {
            const paginated = getPaginated();
            let html = '';
            if (paginated.length === 0) {
                html = `<tr><td colspan="5" style="text-align:center; padding:3rem; color:#8899bb;"><i class="fas fa-calendar-times" style="font-size:2rem; opacity:0.5;"></i><br>暂无班级活动记录</td></tr>`;
            } else {
                paginated.forEach(item => {
                    html += `<tr>`;
                    html += `<td class="activity-name">${escapeHtml(item.activityName)}</td>`;
                    html += `<td><span class="class-badge" title="${escapeHtml(item.className)}">${escapeHtml(item.className)}</span></td>`;
                    html += `<td><span class="address-text">${escapeHtml(item.address)}</span></td>`;
                    html += `<td>${escapeHtml(item.createTime || '—')}</td>`;
                    html += `<td><div class="action-btns">`;
                    html += `<button class="icon-btn" onclick="window.editHandler('${item.id}')"><i class="fas fa-pen"></i> 编辑</button>`;
                    html += `<button class="icon-btn delete-btn" onclick="window.deleteHandler('${item.id}')"><i class="fas fa-trash"></i> 删除</button>`;
                    html += `</div></td></tr>`;
                });
            }
            tbody.innerHTML = html;
        }

        // 渲染分页控件
        function renderPagination() {
            const total = totalPages();
            if (total <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }
            let html = `<span class="page-info"><i class="fas fa-layer-group"></i> 第 ${currentPage} / ${total} 页</span>`;
            html += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.pageGo(${currentPage-1})"><i class="fas fa-chevron-left"></i></button>`;
            for (let i = 1; i <= total; i++) {
                if (i === currentPage) {
                    html += `<span class="pagination-btn active">${i}</span>`;
                } else {
                    html += `<button class="pagination-btn" onclick="window.pageGo(${i})">${i}</button>`;
                }
            }
            html += `<button class="pagination-btn" ${currentPage === total ? 'disabled' : ''} onclick="window.pageGo(${currentPage+1})"><i class="fas fa-chevron-right"></i></button>`;
            paginationContainer.innerHTML = html;
        }

        // ---------- 删除处理 ----------
        function deleteActivity(id) {
            activities = activities.filter(a => a.id !== id);
            // 如果当前页没有数据了，跳转到前一页
            const filtered = getFilteredList();
            if (filtered.length === 0 && currentPage > 1) currentPage--;
            showToast('活动已删除');
            renderTable();
            renderPagination();
        }

        // ---------- 打开新增弹窗 ----------
        function openAddModal() {
            editingId = null;
            modalTitle.innerHTML = '<i class="fas fa-plus-circle"></i> 新增班级活动';
            modalActivityName.value = '';
            modalClass.value = '';
            modalAddress.value = '';
            modalCreateTime.value = getCurrentTimeStr();  // 自动生成当前时间，只读
            modal.classList.add('show');
        }

        // ---------- 打开编辑弹窗 ----------
        function openEditModal(id) {
            const item = activities.find(a => a.id === id);
            if (!item) return;
            editingId = id;
            modalTitle.innerHTML = '<i class="fas fa-edit"></i> 编辑活动';
            modalActivityName.value = item.activityName || '';
            modalClass.value = item.className || '';
            modalAddress.value = item.address || '';
            modalCreateTime.value = item.createTime || getCurrentTimeStr();  // 保留原创建时间
            modal.classList.add('show');
        }

        // 关闭弹窗
        function closeModal() {
            modal.classList.remove('show');
            editingId = null;
        }

        // ---------- 保存活动 (新增/更新) ----------
        function saveActivity() {
            const activityName = modalActivityName.value.trim();
            const className = modalClass.value.trim();
            const address = modalAddress.value.trim();
            const createTime = modalCreateTime.value.trim(); // 只读但可能被用户修改? 我们用原始值或保留

            if (!activityName || !className || !address) {
                showToast('请填写活动名称、班级和地址', 1500);
                return;
            }

            // 基础数据
            const data = {
                activityName,
                className,
                address,
                createTime: createTime || getCurrentTimeStr()
            };

            if (editingId) {
                // 编辑更新
                const index = activities.findIndex(a => a.id === editingId);
                if (index !== -1) {
                    activities[index] = { ...activities[index], ...data };
                }
                showToast('活动已更新');
            } else {
                // 新增
                const newItem = {
                    id: generateId(),
                    ...data,
                    createTime: data.createTime || getCurrentTimeStr()
                };
                activities.push(newItem);
                showToast('活动已添加');
                // 跳转到最后一页让用户看见新记录
                const filtered = getFilteredList();
                currentPage = Math.ceil(filtered.length / pageSize);
            }
            closeModal();
            renderTable();
            renderPagination();
        }

        // ---------- 筛选器联动 ----------
        function applyFilters() {
            filters.activityName = filterActivityName.value;
            filters.className = filterClass.value;
            filters.address = filterAddress.value;
            currentPage = 1;  // 重置到第一页
            renderTable();
            renderPagination();
        }

        function resetFilters() {
            filterActivityName.value = '';
            filterClass.value = '';
            filterAddress.value = '';
            filters = { activityName: '', className: '', address: '' };
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        // ---------- 事件绑定 ----------
        filterActivityName.addEventListener('input', applyFilters);
        filterClass.addEventListener('input', applyFilters);
        filterAddress.addEventListener('input', applyFilters);
        resetFilterBtn.addEventListener('click', resetFilters);
        openAddModalBtn.addEventListener('click', openAddModal);

        closeModalBtn.addEventListener('click', closeModal);
        modalCancelBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        modalForm.addEventListener('submit', (e) => {
            e.preventDefault();
            saveActivity();
        });

        // 将删除和编辑挂载到window
        window.deleteHandler = deleteActivity;
        window.editHandler = openEditModal;

        // 初始化渲染
        renderTable();
        renderPagination();
    })();
</script>
</body>
</html>
