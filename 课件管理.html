<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>研究生课件资源中心 · 复用/查询/上传</title>
    <!-- Inter 字体 + Font Awesome 图标库 (与参考风格一致) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* 完全复用参考风格的样式体系，并针对课件场景微调 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #eef3f8;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .full-screen {
            width: 100%;
            padding: 1.5rem 1.8rem;
            flex: 1;
        }
        @media (max-width: 640px) {
            .full-screen { padding: 1rem 1rem; }
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 15px 40px rgba(0,20,40,0.08);
            padding: 1.8rem 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e9eef4;
            width: 100%;
        }
        @media (max-width: 640px) {
            .card { padding: 1.5rem 1.2rem; }
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 1.5rem;
        }
        .section-title i { color: #2f6e9e; font-size: 1.4rem; }

        /* 筛选栏 (增加更多筛选维度) */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 160px;
            flex: 1 1 150px;
        }
        .filter-item label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #4e6f8c;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .filter-input, .filter-select {
            background: #f8fafd;
            border: 1px solid #dde3ea;
            border-radius: 16px;
            padding: 0.65rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn {
            border: none;
            background: transparent;
            font-weight: 500;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .btn-primary {
            background: #1e4a6f;
            color: white;
            box-shadow: 0 4px 10px rgba(0,60,110,0.2);
        }
        .btn-primary:hover { background: #123a58; transform: translateY(-2px); }
        .btn-outline {
            background: white;
            border-color: #cbd5e1;
            color: #2c455d;
        }
        .btn-outline:hover { background: #f1f7fd; border-color: #9bb0c5; }
        .btn-sm { padding: 0.45rem 1.2rem; font-size: 0.8rem; }

        /* 课件列表表格 */
        .table-wrapper {
            border-radius: 20px;
            background: #ffffff;
            border: 1px solid #e2eaf3;
            overflow-x: auto;
            margin-top: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;  /* 确保所有课件字段可见 */
        }
        th {
            text-align: left;
            padding: 1.2rem 1rem;
            background: #eaf1f9;
            font-weight: 600;
            font-size: 0.8rem;
            color: #1d4b6e;
            text-transform: uppercase;
        }
        td {
            padding: 1rem 1rem;
            border-bottom: 1px solid #e3eaf2;
            vertical-align: middle;
        }
        .course-title { font-weight: 600; color: #0b2b40; max-width: 200px; white-space: normal; word-break: break-word; }
        .teacher-badge {
            background: #e3f0fa;
            color: #11517c;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
        }
        .tag {
            background: #e5ecf3;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #2a4a6a;
            display: inline-block;
            margin: 2px;
            white-space: nowrap;
        }
        .action-btns { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .icon-btn {
            background: none; border: none; font-size: 0.75rem; padding: 0.4rem 0.8rem;
            border-radius: 30px; cursor: pointer; color: #2a577b; background: #f2f8ff;
            display: inline-flex; align-items: center; gap: 0.3rem; border: 1px solid transparent;
        }
        .icon-btn:hover { background: #dae9f8; }
        .reuse-btn { background: #e1f0fa; color: #0d4b6e; }
        .reuse-btn:hover { background: #c8e2f5; }

        /* 分页 */
        .pagination-bar {
            display: flex; justify-content: flex-end; align-items: center;
            gap: 0.5rem; margin-top: 1.8rem; flex-wrap: wrap;
        }
        .pagination-btn {
            background: white; border: 1px solid #c9d9eb; color: #1d4a6b;
            width: 38px; height: 38px; border-radius: 12px;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 500; cursor: pointer; transition: 0.1s;
        }
        .pagination-btn.active { background: #1e4a6f; border-color: #1e4a6f; color: white; }
        .pagination-btn:hover:not(.active) { background: #e5f0fb; }
        .page-info { color: #466585; margin-right: 0.8rem; font-size: 0.9rem; }

        /* 弹窗 (完全复用) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,20,40,0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-card {
            background: white; border-radius: 32px; width: 90%; max-width: 800px;
            padding: 2rem 2.2rem; box-shadow: 0 40px 70px rgba(0,20,50,0.4);
            transform: scale(0.95); transition: transform 0.2s ease;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.show .modal-card { transform: scale(1); }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-header h3 { font-size: 1.6rem; font-weight: 600; color: #0c2b48; }
        .modal-close {
            background: none; border: none; font-size: 2.2rem; cursor: pointer;
            color: #8ba5c2; line-height: 1;
        }
        .modal-close:hover { color: #1e3a5f; }

        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem 1.8rem;
        }
        .full-width { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .input-group label {
            font-weight: 600; font-size: 0.75rem; color: #4e6f8c; text-transform: uppercase;
            display: flex; align-items: center; gap: 4px;
        }
        .input-field {
            background: #f8fafd; border: 1px solid #dde3ea; border-radius: 16px;
            padding: 0.75rem 1.2rem; font-size: 0.95rem; font-family: 'Inter', sans-serif;
        }
        .input-field:focus {
            outline: none; border-color: #2f6e9e;
            box-shadow: 0 0 0 3px rgba(47,110,158,0.15); background: white;
        }
        .file-upload-info { font-size: 0.8rem; color: #4d7496; margin-top: 0.3rem; }
        .modal-actions {
            display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2.2rem;
        }

        /* Toast */
        .toast-message {
            background: #1e4a6f; color: white; padding: 0.8rem 2rem;
            border-radius: 60px; font-weight: 500; box-shadow: 0 15px 30px rgba(0,40,70,0.4);
            position: fixed; bottom: 30px; right: 30px; z-index: 1100;
            opacity: 0; transform: translateY(10px); transition: 0.2s; pointer-events: none;
        }
        .toast-message.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
<div class="full-screen">
    <!-- 卡片：筛选栏 + 新增课件按钮 (符合需求:查询/添加) -->
    <div class="card">
        <div class="filter-bar">
            <div class="filter-item">
                <label><i class="fas fa-chalkboard-teacher"></i> 课程名称</label>
                <input type="text" class="filter-input" id="filterCourse" placeholder="机器学习">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-user-tie"></i> 授课教师</label>
                <input type="text" class="filter-input" id="filterTeacher" placeholder="张三">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-tags"></i> 关键词</label>
                <input type="text" class="filter-input" id="filterKeyword" placeholder="课件/PPT">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-calendar"></i> 上传起始</label>
                <input type="date" class="filter-input" id="filterDateFrom">
            </div>
            <div class="filter-item">
                <label><i class="fas fa-calendar"></i> 上传结束</label>
                <input type="date" class="filter-input" id="filterDateTo">
            </div>
            <div style="display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;">
                <button class="btn btn-outline" id="resetFilterBtn"><i class="fas fa-undo"></i> 重置</button>
                <button class="btn btn-primary" id="openAddModalBtn"><i class="fas fa-plus-circle"></i> 上传课件</button>
            </div>
        </div>
        <!-- 附加高级搜索提示（可选） -->
        <div style="font-size:0.8rem; color:#4f7092; margin-top:0.5rem;"><i class="fas fa-search"></i> 支持多字段组合查询(课程/教师/关键词/日期)</div>
    </div>

    <!-- 课件列表卡片 (核心:展示复用操作) -->
    <div class="card">
        <div class="section-title">
            <i class="fas fa-folder-open"></i> 课件资源库 · 支持复用/改编/引用
        </div>
        <div class="table-wrapper">
            <table id="coursewareTable">
                <thead>
                    <tr>
                        <th>课件标题</th><th>授课教师</th><th>所属课程</th><th>关键词</th><th>适用对象</th><th>上传时间</th><th>上传者</th><th style="min-width:160px;">复用操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <!-- 分页 -->
        <div class="pagination-bar" id="paginationContainer"></div>
    </div>
</div>

<!-- 新增/编辑 课件弹窗 (完全满足添加、版本、字段) -->
<div class="modal-overlay" id="coursewareModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle"><i class="fas fa-upload"></i> 上传新课件</h3>
            <button class="modal-close" id="closeModalBtn">&times;</button>
        </div>
        <form id="coursewareForm" onsubmit="return false;">
            <div class="form-grid">
                <!-- 课件标题 * -->
                <div class="input-group full-width">
                    <label><i class="fas fa-heading"></i> 课件标题 *</label>
                    <input type="text" class="input-field" id="modalTitleInput" required placeholder="例如：第三章 神经网络基础">
                </div>
                <!-- 授课教师 + 所属课程 -->
                <div class="input-group">
                    <label><i class="fas fa-user-tie"></i> 授课教师 *</label>
                    <input type="text" class="input-field" id="modalTeacher" required placeholder="张教授">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-book"></i> 所属课程 *</label>
                    <input type="text" class="input-field" id="modalCourse" required placeholder="高级机器学习">
                </div>
                <!-- 关键词 + 适用对象 -->
                <div class="input-group full-width">
                    <label><i class="fas fa-tags"></i> 关键词 (空格分隔) *</label>
                    <input type="text" class="input-field" id="modalKeywords" required placeholder="神经网络 反向传播 PPT">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-users"></i> 适用对象</label>
                    <select class="input-field" id="modalAudience">
                        <option value="研一">研一</option>
                        <option value="研二" selected>研二</option>
                        <option value="研三">研三</option>
                        <option value="博士生">博士生</option>
                        <option value="全部">全部</option>
                    </select>
                </div>
                <!-- 上传文件模拟 -->
                <div class="input-group full-width">
                    <label><i class="fas fa-file"></i> 课件文件 * (PDF/PPT/DOC/MP4/ZIP) &lt;1GB</label>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <input type="text" class="input-field" id="modalFilePlaceholder" readonly value="点击下方按钮模拟上传" style="background:#ecf2f9;">
                        <button type="button" class="btn btn-outline btn-sm" id="simulateFileBtn"><i class="fas fa-cloud-upload-alt"></i> 模拟</button>
                    </div>
                    <div class="file-upload-info" id="fileHint">未选择文件 (演示: 点击模拟即生成虚拟文件名)</div>
                </div>
                <!-- 版本信息 (隐藏/折叠简化, 但展示版本号输入) -->
                <div class="input-group">
                    <label><i class="fas fa-code-branch"></i> 版本 (选填)</label>
                    <input type="text" class="input-field" id="modalVersion" placeholder="v1.0, v2.1">
                </div>
                <div class="input-group">
                    <label><i class="fas fa-calendar"></i> 上传时间</label>
                    <input type="datetime-local" class="input-field" id="modalUploadedAt">
                </div>
                <!-- 上传者 (只读) -->
                <div class="input-group">
                    <label>上传者</label>
                    <input type="text" class="input-field readonly-field" id="modalUploadedBy" readonly value="current_teacher@lab">
                </div>
                <!-- 衍生/复用标识：复制自哪个课件 (只读展示) 体现复用关联 -->
                <div class="input-group full-width" id="derivedFromGroup" style="display: none;">
                    <label><i class="fas fa-code-branch"></i> 衍生自</label>
                    <input type="text" class="input-field readonly-field" id="modalDerivedFrom" readonly value="">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" id="modalCancelBtn"><i class="fas fa-times"></i> 取消</button>
                <button type="submit" class="btn btn-primary" id="modalSaveBtn"><i class="fas fa-save"></i> 保存课件</button>
            </div>
        </form>
    </div>
</div>

<!-- 复用弹窗 (引用/复制/改编) 轻量提示 -->
<div class="modal-overlay" id="reuseModal" style="--blur:5px;">
    <div class="modal-card" style="max-width: 450px;">
        <div class="modal-header">
            <h3><i class="fas fa-copy"></i> 复用课件</h3>
            <button class="modal-close" id="closeReuseModalBtn">&times;</button>
        </div>
        <div style="padding: 0.5rem 0;">
            <p style="margin-bottom: 1rem;" id="reuseCourseTitle">《课件名》</p>

                <button class="btn btn-outline" id="reuseQuoteBtn" style="justify-content: flex-start;"><i class="fas fa-quote-right"></i> 直接引用 (添加到我的课程资料)</button>
                <button class="btn btn-outline" id="reuseCopyBtn" style="justify-content: flex-start;"><i class="fas fa-pen"></i> 复制并改编 (生成新课件)</button>
                <button class="btn btn-outline" id="reuseVersionBtn" style="justify-content: flex-start;"><i class="fas fa-history"></i> 上传新版本 (基于此更新)</button>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-primary" id="cancelReuseBtn">取消</button>
        </div>
    </div>
</div>

<div id="toast" class="toast-message">操作成功</div>

        const reuseModal = document.getElementById('reuseModal');
        const closeReuseModalBtn = document.getElementById('closeReuseModalBtn');
        const cancelReuseBtn = document.getElementById('cancelReuseBtn');
        const reuseQuoteBtn = document.getElementById('reuseQuoteBtn');
        const reuseCopyBtn = document.getElementById('reuseCopyBtn');
        const reuseVersionBtn = document.getElementById('reuseVersionBtn');
        const reuseCourseTitle = document.getElementById('reuseCourseTitle');

        // 当前编辑ID / 复用源
        let editingId = null;
        let reuseSourceId = null;   // 用于复制/版本/引用

        // 辅助函数
        function showToast(text, duration = 2000) {
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }
        function generateId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 8); }
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
        function formatDate(datetimeStr) {
            if (!datetimeStr) return '—';
            const d = new Date(datetimeStr);
            if (isNaN(d.getTime())) return datetimeStr;
            return d.toLocaleString('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}).replace(/\//g,'-');
        }

        // 筛选逻辑
        function filterList() {
            return allCourseware.filter(item => {
                if (filters.course && !item.course.toLowerCase().includes(filters.course.toLowerCase())) return false;
                if (filters.teacher && !item.teacher.toLowerCase().includes(filters.teacher.toLowerCase())) return false;
                if (filters.keyword) {
                    const kws = filters.keyword.toLowerCase();
                    const matches = (item.keywords && item.keywords.toLowerCase().includes(kws)) || item.title.toLowerCase().includes(kws);
                    if (!matches) return false;
                }
                if (filters.dateFrom) {
                    const itemDate = item.uploadedAt ? item.uploadedAt.slice(0,10) : '';
                    if (itemDate < filters.dateFrom) return false;
                }
                if (filters.dateTo) {
                    const itemDate = item.uploadedAt ? item.uploadedAt.slice(0,10) : '';
                    if (itemDate > filters.dateTo) return false;
                }
                return true;
            });
        }
        function getFiltered() { return filterList(); }
        function getPaginated() {
            const filtered = getFiltered();
            const start = (currentPage - 1) * pageSize;
            return filtered.slice(start, start + pageSize);
        }
        function totalPages() { return Math.ceil(getFiltered().length / pageSize); }
        function goToPage(page) {
            const total = totalPages();
            if (page < 1) page = 1;
            if (total > 0 && page > total) page = total;
            if (page === currentPage) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }
        window.pageGo = goToPage;

        // 渲染分页
        function renderPagination() {
            const total = totalPages();
            if (total <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }
            let html = `<span class="page-info"><i class="fas fa-layer-group"></i> 第 ${currentPage} / ${total} 页</span>`;
            html += `<button class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.pageGo(${currentPage-1})"><i class="fas fa-chevron-left"></i></button>`;
            for (let i = 1; i <= total; i++) {
                if (i === currentPage) html += `<span class="pagination-btn active">${i}</span>`;
                else html += `<button class="pagination-btn" onclick="window.pageGo(${i})">${i}</button>`;
            }
            html += `<button class="pagination-btn" ${currentPage === total ? 'disabled' : ''} onclick="window.pageGo(${currentPage+1})"><i class="fas fa-chevron-right"></i></button>`;
            paginationContainer.innerHTML = html;
        }

        // 删除课件
        function deleteCourseware(id) {
            allCourseware = allCourseware.filter(c => c.id !== id);
            const filtered = getFiltered();
            if (filtered.length === 0 && currentPage > 1) currentPage--;
            showToast('课件已移除');
            renderTable();
            renderPagination();
        }

        // 打开新增弹窗
        function openAddModal(deriveFromId = null) {
            editingId = null;
            modalTitle.innerHTML = '<i class="fas fa-plus-circle"></i> 上传新课件';
            modalTitleInput.value = '';
            modalTeacher.value = '';
            modalCourse.value = '';
            modalKeywords.value = '';
            modalAudience.value = '研二';
            modalVersion.value = 'v1.0';
            const now = new Date();
            const tzOffset = now.getTimezoneOffset() * 60000;
            const localISOTime = new Date(now - tzOffset).toISOString().slice(0,16);
            modalUploadedAt.value = localISOTime;
            modalUploadedBy.value = '当前教师';
            modalFilePlaceholder.value = '(模拟上传占位)';
            fileHint.innerText = '未选择文件 (点击模拟选择)';
            if (deriveFromId) {
                const original = allCourseware.find(c => c.id === deriveFromId);
                if (original) {
                    // 预填部分信息，实现改编快速录入
                    modalTitleInput.value = original.title + ' (改编)';
                    modalTeacher.value = original.teacher;
                    modalCourse.value = original.course;
                    modalKeywords.value = original.keywords;
                    modalAudience.value = original.audience;
                    modalVersion.value = 'v1.0';
                    derivedFromGroup.style.display = 'flex';
                    modalDerivedFrom.value = original.title + ' (ID:'+ original.id + ')';
                }
            } else {
                derivedFromGroup.style.display = 'none';
                modalDerivedFrom.value = '';
            }
            modal.classList.add('show');
        }

        // 打开编辑 (略，可复用同逻辑)
        function openEditModal(id) {
            const item = allCourseware.find(c => c.id === id);
            if (!item) return;
            editingId = id;
            modalTitle.innerHTML = '<i class="fas fa-edit"></i> 编辑课件';
            modalTitleInput.value = item.title;
            modalTeacher.value = item.teacher;
            modalCourse.value = item.course;
            modalKeywords.value = item.keywords;
            modalAudience.value = item.audience;
            modalVersion.value = item.version || '';
            let upAt = item.uploadedAt;
            if (upAt && upAt.length === 16) modalUploadedAt.value = upAt;
            else {
                const d = new Date(upAt);
                if (!isNaN(d.getTime())) {
                    const tzOffset = d.getTimezoneOffset() * 60000;
                    const local = new Date(d - tzOffset).toISOString().slice(0,16);
                    modalUploadedAt.value = local;
                } else modalUploadedAt.value = '';
            }
            modalUploadedBy.value = item.uploadedBy || '教务';
            modalFilePlaceholder.value = item.fileName || '(已上传文件)';
            fileHint.innerText = '当前文件: ' + (item.fileName || '未知');
            derivedFromGroup.style.display = item.derivedFrom ? 'flex' : 'none';
            modalDerivedFrom.value = item.derivedFrom ? ('衍生自ID:'+ item.derivedFrom) : '';
            modal.classList.add('show');
        }

        function closeModal() {
            modal.classList.remove('show');
            editingId = null;
        }

        // 模拟文件按钮
        simulateFileBtn.addEventListener('click', ()=>{
            modalFilePlaceholder.value = '模拟_课件_'+Math.floor(Math.random()*1000)+'.pptx';
            fileHint.innerText = '已选择: '+modalFilePlaceholder.value;
        });

        // 保存课件
        function saveCourseware() {
            const title = modalTitleInput.value.trim();
            const teacher = modalTeacher.value.trim();
            const course = modalCourse.value.trim();
            const keywords = modalKeywords.value.trim();
            if (!title || !teacher || !course || !keywords) {
                showToast('标题、教师、课程、关键词为必填项', 1500);
                return;
            }
            const audience = modalAudience.value;
            const version = modalVersion.value.trim() || 'v1.0';
            const uploadedAt = modalUploadedAt.value || new Date().toISOString().slice(0,16);
            const uploadedBy = modalUploadedBy.value.trim() || 'current_user';
            const fileName = modalFilePlaceholder.value.includes('模拟') ? modalFilePlaceholder.value : '课件文件.pptx';

            const data = {
                title, teacher, course, keywords, audience,
                uploadedAt, uploadedBy, fileName, version,
                derivedFrom: modalDerivedFrom.value ? '衍生' : null
            };

            if (editingId) {
                const index = allCourseware.findIndex(c => c.id === editingId);
                if (index !== -1) { allCourseware[index] = { ...allCourseware[index], ...data }; }
                showToast('课件已更新');
            } else {
                const newId = generateId();
                allCourseware.push({ id: newId, ...data, derivedFrom: modalDerivedFrom.value ? '衍生源' : null });
                showToast('新课件已添加');
                const filtered = getFiltered();
                currentPage = Math.ceil(filtered.length / pageSize);
            }
            closeModal();
            renderTable();
            renderPagination();
        }

        // 渲染表格
        function renderTable() {
            const paginated = getPaginated();
            let html = '';
            if (paginated.length === 0) {
                html = `<tr><td colspan="8" style="text-align:center; padding:3rem; color:#8899bb;"><i class="fas fa-box-open" style="font-size:2rem; opacity:0.5;"></i><br>暂无课件，请上传或重置筛选</td></tr>`;
            } else {
                paginated.forEach(item => {
                    html += `<tr>`;
                    html += `<td class="course-title">${escapeHtml(item.title)}</td>`;
                    html += `<td><span class="teacher-badge">${escapeHtml(item.teacher)}</span></td>`;
                    html += `<td>${escapeHtml(item.course)}</td>`;
                    html += `<td><div>${(item.keywords || '').split(' ').map(k => `<span class="tag">${escapeHtml(k)}</span>`).join(' ')}</div></td>`;
                    html += `<td>${escapeHtml(item.audience || '—')}</td>`;
                    html += `<td>${formatDate(item.uploadedAt)}</td>`;
                    html += `<td>${escapeHtml(item.uploadedBy || '—')}</td>`;
                    html += `<td><div class="action-btns">`;
                    html += `<button class="icon-btn" onclick="window.editHandler('${item.id}')"><i class="fas fa-pen"></i> 编辑</button>`;
                    html += `<button class="icon-btn reuse-btn" onclick="window.openReuseModal('${item.id}')"><i class="fas fa-copy"></i> 复用</button>`;
                    html += `<button class="icon-btn delete-btn" onclick="window.deleteHandler('${item.id}')"><i class="fas fa-trash"></i> 删除</button>`;
                    html += `</div></td></tr>`;
                });
            }
            tbody.innerHTML = html;
        }

        // 复用弹窗逻辑
        window.openReuseModal = function(id) {
            const item = allCourseware.find(c => c.id === id);
            if (!item) return;
            reuseSourceId = id;
            reuseCourseTitle.innerText = `《${item.title}》 (${item.teacher} 主讲)`;
            reuseModal.classList.add('show');
        };
        function closeReuseModal() {
            reuseModal.classList.remove('show');
            reuseSourceId = null;
        }

        // 直接引用 (模拟添加到我的课程)
        reuseQuoteBtn.addEventListener('click', ()=>{
            if (!reuseSourceId) return;
            showToast('已引用课件到「我的课程资料」', 2000);
            closeReuseModal();
        });
        // 复制并改编
        reuseCopyBtn.addEventListener('click', ()=>{
            if (!reuseSourceId) return;
            closeReuseModal();
            openAddModal(reuseSourceId);  // 打开新增并预填改编信息
        });
        // 上传新版本
        reuseVersionBtn.addEventListener('click', ()=>{
            if (!reuseSourceId) return;
            const original = allCourseware.find(c => c.id === reuseSourceId);
            if (original) {
                closeReuseModal();
                // 直接打开新增，填充相同信息，版本+1
                openAddModal(null);
                modalTitleInput.value = original.title + ' (新版本)';
                modalTeacher.value = original.teacher;
                modalCourse.value = original.course;
                modalKeywords.value = original.keywords;
                modalAudience.value = original.audience;
                let ver = original.version || 'v1.0';
                let num = parseFloat(ver.replace('v','')) || 1.0;
                modalVersion.value = 'v' + (num+0.1).toFixed(1);
                derivedFromGroup.style.display = 'flex';
                modalDerivedFrom.value = original.title + ' (版本更新)';
            }
        });

        // 筛选
        function applyFilters() {
            filters.course = filterCourse.value;
            filters.teacher = filterTeacher.value;
            filters.keyword = filterKeyword.value;
            filters.dateFrom = filterDateFrom.value;
            filters.dateTo = filterDateTo.value;
            currentPage = 1;
            renderTable();
            renderPagination();
        }
        function resetFilters() {
            filterCourse.value = ''; filterTeacher.value = ''; filterKeyword.value = ''; filterDateFrom.value = ''; filterDateTo.value = '';
            filters = { course: '', teacher: '', keyword: '', dateFrom: '', dateTo: '' };
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        // 挂载全局方法
        window.deleteHandler = deleteCourseware;
        window.editHandler = openEditModal;

        // 事件
        filterCourse.addEventListener('input', applyFilters);
        filterTeacher.addEventListener('input', applyFilters);
        filterKeyword.addEventListener('input', applyFilters);
        filterDateFrom.addEventListener('change', applyFilters);
        filterDateTo.addEventListener('change', applyFilters);
        resetFilterBtn.addEventListener('click', resetFilters);
        openAddModalBtn.addEventListener('click', ()=>openAddModal(null));

        closeModalBtn.addEventListener('click', closeModal);
        modalCancelBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        modalForm.addEventListener('submit', (e) => { e.preventDefault(); saveCourseware(); });

        // 复用弹窗关闭
        closeReuseModalBtn.addEventListener('click', closeReuseModal);
        cancelReuseBtn.addEventListener('click', closeReuseModal);
        reuseModal.addEventListener('click', (e) => { if (e.target === reuseModal) closeReuseModal(); });

        // 初始化
        renderTable();
        renderPagination();
    })();
</script>
</body>
</html>
